name: Fix Herri Pilota J2 analog movement

on:
  push:
    paths:
      - 'PATCH_J2_NOW'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch J2 remote movement and contact feel
        run: |
          if [ ! -f PATCH_J2_NOW ]; then
            echo "Marker already removed; nothing to do."
            exit 0
          fi
          python .github/scripts/patch_j2.py
          python .github/scripts/patch_j2_v3.py
          rm -f PATCH_J2_NOW
          git config user.name "EUSKARAZ GAMES Bot"
          git config user.email "actions@github.com"
          git add public/index.html PATCH_J2_NOW
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Improve Herri Pilota online J2 contact feel"
            git push
          fi
