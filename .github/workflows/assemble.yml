name: Import EUSKARAZ GAMES project

on:
  push:
    paths:
      - 'EUSKARAZ_GAMES_V29_1_GITHUB_CLOUDFLARE_IPHONE.zip'

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        run: |
          unzip -o EUSKARAZ_GAMES_V29_1_GITHUB_CLOUDFLARE_IPHONE.zip -d .
          rm -f EUSKARAZ_GAMES_V29_1_GITHUB_CLOUDFLARE_IPHONE.zip ACCESS_OK.txt
          rm -f .github/workflows/assemble.yml
          git config user.name "EUSKARAZ GAMES Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Upload EUSKARAZ GAMES V29.1 Cloudflare WebSocket project"
          git push
