// ---------------------------------------------------------------- utils
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(1234);
const R = (a, b) => a + (b - a) * rng();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const FOG = new THREE.Color('#e9e2d3');

scene.add(sun.target);

// ---------------------------------------------------------------- loading
const texLoader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function loadTex(url, opts = {}) {
  return new Promise((res) => texLoader.load(url, (t) => {
    t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    t.anisotropy = Math.min(8, maxAniso);
    if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    if (opts.repeatX) { t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping; }
    res(t);
  }, undefined, () => { console.warn('missing', url); res(null); }));
}
const loadJSON = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const gltfLoader = new GLTFLoader();
const loadGLB = (url) => new Promise((res) => gltfLoader.load(url, res, undefined, () => { console.warn('missing', url); res(null); }));

const blank = new THREE.DataTexture(new Uint8Array([128, 128, 128, 255]), 1, 1); blank.needsUpdate = true;

// ---------------------------------------------------------------- shared uniforms
const U = {
  uTime: { value: 0 },
  uField: { value: blank },
  uFieldRect: { value: new THREE.Vector4(0, 0, 1, 1) },
  uWash: { value: blank },
  uGlobalBloom: { value: 0 },
  uFogColor: { value: FOG.clone() },
  uFogNear: { value: 16 },
  uFogFar: { value: 160 },
  uG0: { value: new THREE.Color('#40200f') },
  uG1: { value: new THREE.Color('#cf6d2a') },
  uG2: { value: new THREE.Color('#ffd27c') },
};

const SPRITE_VS = /* glsl */`
varying vec2 vUv; varying vec3 vWorld; varying float vDepth;
void main(){
  vUv = uv;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  vec4 mv = viewMatrix * wp;
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;

const COMMON_FS = /* glsl */`
uniform float uTime; uniform sampler2D uField; uniform vec4 uFieldRect; uniform sampler2D uWash; uniform float uGlobalBloom;
uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
uniform vec3 uG0; uniform vec3 uG1; uniform vec3 uG2;
float fieldAt(vec2 p){
  vec2 uv = (p - uFieldRect.xy) * uFieldRect.zw;
  float inside = step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0);
  return max(texture2D(uField, clamp(uv, 0.001, 0.999)).r * inside, uGlobalBloom);
}
float washMask(vec2 p, float f, out float edge){
  float n1 = texture2D(uWash, p * 0.027 + vec2(0.11, 0.31)).g;
  float n2 = texture2D(uWash, p * 0.093 + vec2(0.57, 0.23)).r;
  float n = 0.62 * n1 + 0.38 * n2;
  float thr = 0.10 + 0.62 * n;
  float t = smoothstep(thr - 0.04, thr + 0.04, f);
  edge = 1.0 - abs(t * 2.0 - 1.0);
  return t;
}
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
`;

const SPRITE_FS = /* glsl */`
uniform sampler2D map; uniform vec4 uRect; uniform vec3 uTint; uniform float uOpacity; uniform float uFogMul;
uniform float uMode; uniform float uWashAmt; uniform float uDissolve; uniform float uReveal; uniform vec4 uEnds; uniform float uWet; uniform float uHaze;
varying vec2 vUv; varying vec3 vWorld; varying float vDepth;
void main(){
  vec2 uv = uRect.xy + vUv * uRect.zw;
  vec4 tex = texture2D(map, uv);
  if (vUv.y < -0.001) {            // deep fill under terrain strips
    float n = texture2D(uWash, vWorld.xy * 0.07).g;
    tex = vec4(vec3(0.0085, 0.0102, 0.0175) * (0.8 + 0.5 * n), 1.0);
  }
  float a = tex.a * uOpacity;
  if (uEnds.z > 0.0) {             // jagged fade at the ends of a terrain strip
    float n = texture2D(uWash, vWorld.xy * vec2(0.35, 0.21)).g;
    float d = min(vWorld.x - uEnds.x, uEnds.y - vWorld.x);
    a *= smoothstep(0.0, uEnds.z, d + (n - 0.5) * uEnds.w);
  }
  if (uDissolve > 0.0) {           // rust crumbling into petals
    float n = texture2D(uWash, vUv * 0.7 + vec2(0.21, 0.6)).g * 0.7 + texture2D(uWash, vUv * 2.3).r * 0.3;
    float cut = uDissolve * 1.2 - 0.1;
    if (n < cut) discard;
    float ember = smoothstep(cut + 0.08, cut, n);
    tex.rgb = mix(tex.rgb, vec3(1.0, 0.62, 0.22) * 1.8, ember);
  }
  if (uReveal < 0.999) {           // growth from the base
    float n = texture2D(uWash, vUv * 0.9 + vec2(0.3, 0.1)).g;
    float h = vUv.y + (n - 0.5) * 0.18;
    float lim = uReveal * 1.2 - 0.1;
    if (h > lim) discard;
    tex.rgb = mix(tex.rgb, vec3(1.0, 0.85, 0.45) * 1.4, smoothstep(lim - 0.06, lim, h));
  }
  if (a < 0.004) discard;
  vec3 col = tex.rgb * uTint;
  if (uMode > 0.5 && uMode < 2.5) {
    float f = fieldAt(vWorld.xy);
    float Lc = pow(clamp(lum(col), 0.0, 1.0), 0.4545);
    if (uMode > 1.5) f += (Lc - 0.42) * 0.4 * smoothstep(0.02, 0.3, f) * (1.0 - smoothstep(0.85, 1.0, f));   // colour soaks into the light stone tops first
    float edge; float t = washMask(vWorld.xy + vec2(vWorld.z * 0.21, 0.0), f, edge);
    if (t > 0.001) {
      vec3 w = texture2D(uWash, vWorld.xy * 0.034 + vec2(vWorld.z * 0.05, 0.0)).rgb;
      w = mix(w, vec3(0.86, 0.42, 0.12), 0.22);
      vec3 painted;
      if (uMode < 1.5) {
        painted = col * mix(vec3(1.0), w * 1.45, 0.92);
        painted *= 1.0 - edge * 0.25;
      } else {
        float L = pow(clamp(lum(col), 0.0, 1.0), 0.4545);
        vec3 g = mix(uG0, uG1, smoothstep(0.06, 0.48, L));
        g = mix(g, uG2, smoothstep(0.46, 0.92, L));
        g *= mix(vec3(1.0), w * 1.35, 0.28);
        painted = g * (1.0 - edge * 0.3);
        t *= 0.3 + 0.7 * smoothstep(0.25, 0.8, vUv.y);
      }
      col = mix(col, painted, t * uWashAmt);
    }
  }
  col *= 1.0 - uWet * 0.25;
  float fog = clamp(smoothstep(uFogNear, uFogFar, vDepth) * uFogMul + uHaze, 0.0, 1.0);
  col = mix(col, uFogColor, fog);
  gl_FragColor = vec4(col, a);
  #include <colorspace_fragment>
}`;

function spriteMat(map, o = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      ...U,
      map: { value: map || blank },
      uRect: { value: o.rect || new THREE.Vector4(0, 0, 1, 1) },
      uTint: { value: new THREE.Color(o.tint ?? 0xffffff) },
      uOpacity: { value: o.opacity ?? 1 },
      uFogMul: { value: o.fog ?? 1 },
      uMode: { value: o.mode ?? 0 },
      uWashAmt: { value: o.wash ?? 1 },
      uDissolve: { value: 0 },
      uReveal: { value: o.reveal ?? 1 },
      uEnds: { value: o.ends || new THREE.Vector4(0, 0, 0, 0) },
      uWet: { value: 0 },
      uHaze: { value: o.haze ?? 0 },
    },
    vertexShader: SPRITE_VS,
    fragmentShader: COMMON_FS + SPRITE_FS,
    transparent: true,
    depthWrite: false,
    depthTest: o.depthTest ?? true,
    blending: o.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  if (o.tintLinear) m.uniforms.uTint.value.setRGB(o.tintLinear[0], o.tintLinear[1], o.tintLinear[2], THREE.LinearSRGBColorSpace);
  return m;
}

// plane anchored at bottom-centre
function quad(w, h, anchor = 'bottom') {
  const g = new THREE.PlaneGeometry(w, h);
  if (anchor === 'bottom') g.translate(0, h / 2, 0);
  if (anchor === 'top') g.translate(0, -h / 2, 0);
  return g;
}
function atlasRect(json, i) {
  const s = json.sprites[i]; const [x, y, w, h] = s.rect; const [W, H] = json.size;
  return { rect: new THREE.Vector4(x / W, 1 - (y + h) / H, w / W, h / H), w, h, aspect: w / h };
}
function addSprite(tex, o) {
  // o: x,y,z,h (height in world) or w, flip, rect/aspect, mat opts
  const aspect = o.aspect ?? (tex && tex.image ? tex.image.width / tex.image.height : 1);
  const h = o.h ?? o.w / aspect; const w = o.w ?? o.h * aspect;
  const mesh = new THREE.Mesh(quad(w, h, o.anchor || 'bottom'), spriteMat(tex, o));
  mesh.position.set(o.x || 0, o.y || 0, o.z || 0);
  if (o.flip) mesh.scale.x = -1;
  if (o.rot) mesh.rotation.z = o.rot;
  mesh.renderOrder = o.order ?? 0;
  mesh.frustumCulled = o.cull ?? true;
  (o.parent || scene).add(mesh);
  mesh.userData.w = w; mesh.userData.h = h;
  return mesh;
}

// ---------------------------------------------------------------- bloom field (where colour has returned)
class BloomField {
  constructor() {
    this.x0 = -40; this.y0 = -10; this.ppu = 8; this.w = 272; this.h = 40;
    this.W = this.w * this.ppu; this.H = this.h * this.ppu;
    const mk = () => { const c = document.createElement('canvas'); c.width = this.W; c.height = this.H; return c; };
    this.acc = mk(); this.out = mk();
    this.actx = this.acc.getContext('2d'); this.octx = this.out.getContext('2d');
    this.actx.fillStyle = '#000'; this.actx.fillRect(0, 0, this.W, this.H);
    this.tex = new THREE.CanvasTexture(this.out);
    this.tex.colorSpace = THREE.NoColorSpace; this.tex.generateMipmaps = false;
    this.tex.minFilter = THREE.LinearFilter; this.tex.magFilter = THREE.LinearFilter;
    this.dyn = []; this.dirty = true;
    U.uField.value = this.tex;
    U.uFieldRect.value.set(this.x0, this.y0, 1 / this.w, 1 / this.h);
  }
  _draw(ctx, x, y, r, s, sx = 1, sy = 1) {
    const px = (x - this.x0) * this.ppu, py = this.H - (y - this.y0) * this.ppu, pr = Math.max(1, r * this.ppu);
    ctx.setTransform(sx, 0, 0, sy, px * (1 - sx), py * (1 - sy));
    const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
    g.addColorStop(0, `rgba(255,255,255,${s})`);
    g.addColorStop(0.5, `rgba(255,255,255,${s * 0.8})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g; ctx.fillRect(px - pr, py - pr, pr * 2, pr * 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  splat(x, y, r, s = 0.35, grow = 0.5, sx = 1, sy = 1) { this.dyn.push({ x, y, r, s, t: 0, dur: grow, sx, sy }); }
  source(x, y, r, dur, s = 1, sx = 1, sy = 1) { this.dyn.push({ x, y, r, s, t: 0, dur, sx, sy }); }
  sample(x, y) {
    // cpu-side approximate value (for flower spawning decisions)
    const px = Math.floor((x - this.x0) * this.ppu), py = Math.floor(this.H - (y - this.y0) * this.ppu);
    if (px < 0 || py < 0 || px >= this.W || py >= this.H) return 0;
    return this.actx.getImageData(px, py, 1, 1).data[0] / 255;
  }
  update(dt) {
    if (!this.dyn.length && !this.dirty) return;
    const keep = [];
    for (const d of this.dyn) {
      d.t += dt;
      if (d.t >= d.dur) this._draw(this.actx, d.x, d.y, d.r, d.s, d.sx, d.sy); else keep.push(d);
    }
    this.dyn = keep;
    this.octx.globalCompositeOperation = 'copy';
    this.octx.drawImage(this.acc, 0, 0);
    for (const d of this.dyn) this._draw(this.octx, d.x, d.y, d.r * easeOut(d.t / d.dur), d.s, d.sx, d.sy);
    this.tex.needsUpdate = true;
    this.dirty = false;
  }
}

const pieces = [];        // {id, pts, oneWay, enabled}
function pieceY(p, x) {
  const pts = p.pts;
  if (x < pts[0][0] || x > pts[pts.length - 1][0]) return null;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    if (x >= x0 && x <= x1) return x1 === x0 ? Math.max(y0, y1) : y0 + (y1 - y0) * (x - x0) / (x1 - x0);

}
// highest support at or below feet+tolerance
function groundAt(x, feetY, tol = STEP) {
  let best = null;
  for (const p of pieces) {
    if (!p.enabled) continue;
    const y = pieceY(p, x);
    if (y === null) continue;
    if (y <= feetY + tol && (best === null || y > best.y)) best = { y, p };

  return best;
}

    if (g && (best === null || g.y > best.y + 1e-4)) best = g;

}

  if (x < LEVEL.walls[0] || x > LEVEL.walls[1]) return true;
  for (const p of pieces) {
    if (!p.enabled || p.oneWay) continue;
    const y = pieceY(p, x);

  }
  return false;
}

  let best = null;
  for (const p of pieces) { if (p.oneWay) continue; const y = pieceY(p, x); if (y !== null && (best === null || y > best)) best = y; }
  return best ?? 0;
}

    r.canModel.rotation.set(0, Math.PI / 2, tilt);

    const side = new THREE.Vector3(1, 0, 0).applyQuaternion(r.root.quaternion);
    const down = new THREE.Vector3(0, -1, 0);

}

  const mesh = new THREE.Mesh(g, spriteMat(T.ground, { mode: o.mode ?? 2, tint: o.tint, fog: o.fog ?? 1, haze: o.haze ?? 0, ends: o.noEnds ? undefined : ends, wash: o.wash ?? 1 }));
  mesh.renderOrder = o.order ?? -20; mesh.frustumCulled = false;

function buildTerrain() {
  for (const d of LEVEL.pieces) pieces.push({ id: d.id, pts: d.pts, enabled: true, oneWay: false });
  // back rubble layer, visible through gaps and under the bridge
  buildStrip([[-40, -1.1], [215, -1.1]], { z: -3.2, tint: 0x9a9fa6, order: -40, uOff: 0.37, noEnds: true, vScale: 0.9, haze: 0.18 });
  for (const d of LEVEL.pieces) {
    const p = d.pts;
    const [xl, yl] = p[0], [xr, yr] = p[p.length - 1];
    const nl = LEVEL.pieces.find((q) => q !== d && q.pts[q.pts.length - 1][0] >= xl - 0.6 && q.pts[q.pts.length - 1][0] <= xl + 0.6);
    const nr = LEVEL.pieces.find((q) => q !== d && q.pts[0][0] >= xr - 0.6 && q.pts[0][0] <= xr + 0.6);
    const underL = nl && nl.pts[nl.pts.length - 1][1] > yl + 0.1, underR = nr && nr.pts[0][1] > yr + 0.1;
    const yAvg = p.reduce((acc, q) => acc + q[1], 0) / p.length;
    buildStrip(p, { z: -0.45 - (5 - yAvg) * 0.004, order: -30 + yAvg, uOff: (p[0][0] * 0.013) % 1,
      extL: underL ? 1.4 : 0.45, extR: underR ? 1.4 : 0.45, fadeL: !underL, fadeR: !underR });
  }
}

function buildBridge() {
  // the stone bridge sprite spans the river of rubble between the 'rise' and the 'court'
  const x0 = 33.4, x1 = 51.6;
  const deckY = 2.1;
  if (T.bridge && J.bridgeMeta) {
    const m = J.bridgeMeta; // measured from the sprite: deck profile + gap in normalised coords
    const w = x1 - x0; const h = w / m.aspect;
    const yBase = deckY - (1 - m.deckTopV) * h - 0.0; // place so that the deck top hits deckY
    const mesh = addSprite(T.bridge, { x: (x0 + x1) / 2, y: deckY + (m.feetOffset ?? 0) - m.deckV * h, z: -0.5, w, aspect: m.aspect, mode: 2, order: -19, cull: false, tint: 0xe6e0d6, haze: 0.14 });
    const toWorld = (u, v) => [x0 + u * w, mesh.position.y + v * h];
    const L = m.left.map(([u, v]) => toWorld(u, v)); const Rr = m.right.map(([u, v]) => toWorld(u, v));
    pieces.push({ id: 'bridgeL', pts: L, enabled: true }); pieces.push({ id: 'bridgeR', pts: Rr, enabled: true });
    bridgeInfo = { gapL: L[L.length - 1], gapR: Rr[0], mesh };
  } else {
    const L = [[33.6, 1.45], [37, 1.95], [41.4, 2.1]]; const Rr = [[45.6, 2.1], [49.2, 1.9], [51.4, 1.45]];
    pieces.push({ id: 'bridgeL', pts: L, enabled: true }); pieces.push({ id: 'bridgeR', pts: Rr, enabled: true });
    buildStrip(L, { z: -0.45, order: -19 }); buildStrip(Rr, { z: -0.45, order: -19 });
    bridgeInfo = { gapL: L[L.length - 1], gapR: Rr[0] };
  }
  // the vine bridge, grown from the rust shrub at the broken edge
  const [gx0, gy0] = bridgeInfo.gapL, [gx1, gy1] = bridgeInfo.gapR;
  const span = gx1 - gx0 + 1.6; const cx = (gx0 + gx1) / 2;
  const vb = J.vineMeta; // measured top profile of the vine sprite
  const vw = span / ((vb.walkU1 - vb.walkU0)); const vh = vw / vb.aspect;
  const yTopAtEnds = Math.min(gy0, gy1);
  const mesh = addSprite(T.vineBridge, { x: cx, y: 0, z: -0.25, w: vw, aspect: vb.aspect, order: 11, reveal: 0, fog: 1 });
  // place so that the walk line at the ends meets the deck
  mesh.position.y = yTopAtEnds - (1 - vb.endV) * vh + 0.06;
  mesh.visible = false;
  const pts = vb.profile.map(([u, v]) => [cx + (u - 0.5) * vw, mesh.position.y + (1 - v) * vh - 0.08]);
  const piece = { id: 'vines', pts, enabled: false, oneWay: true, safe: true };
  pieces.push(piece);
  vineBridge = { mesh, piece, t: 0 };
  LEVEL.nodes[2].x = gx0 - 1.0;
}

function buildStalk() {
  const n = LEVEL.nodes.find((d) => d.kind === 'stalk');
  const sx = n.x + 0.75, base = 0.4;
  const m = J.stalkMeta; const H = 4.45; const W = H * m.aspect;

// ---------------------------------------------------------------- post-processing
let composer, gradePass, bloomPass;
function setupPost() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.32, 0.55, 0.86);
  composer.addPass(bloomPass);
  gradePass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uPaper: { value: T.paper || blank }, uHasPaper: { value: T.paper ? 1 : 0 }, uAspect: { value: innerWidth / innerHeight },
      uFade: { value: 0 }, uFadeCol: { value: fade.color }, uTime: U.uTime, uWarm: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform sampler2D uPaper; uniform float uHasPaper; uniform float uAspect; uniform float uFade; uniform vec3 uFadeCol; uniform float uWarm;
      varying vec2 vUv;
      void main(){
        vec4 c = texture2D(tDiffuse, vUv);
        if (uHasPaper > 0.5) {
          vec3 p = texture2D(uPaper, vUv * vec2(uAspect, 1.0) * 1.35).rgb;
          float pl = dot(p, vec3(0.333));
          c.rgb *= 1.0 + (pl - 0.75) * 0.7;
        }
        vec2 d = (vUv - 0.5) * vec2(uAspect, 1.0);
        float vig = smoothstep(1.25, 0.35, length(d));
        c.rgb *= mix(0.78, 1.0, vig);
        c.rgb = mix(c.rgb, c.rgb * vec3(1.03, 0.99, 0.93), 0.5 + 0.5 * uWarm);
        c.rgb = mix(c.rgb, uFadeCol, uFade);
        gl_FragColor = c;
      }`,
  });
  composer.addPass(gradePass);
  composer.addPass(new OutputPass());
}

  rng = mulberry32(20261012);
  const sky = buildSky();
  // background city layers (fal-painted facades), from far to near
  buildLayer({ x0: -70, x1: 290, z: -78, zJit: 4, y: -16, yJit: 3, hMin: 44, hMax: 62, gapP: 0.35, gapMin: 2, gapMax: 10, fog: 1.0, haze: 0.62, wash: 0.5, order: -90, tint: 0xf4f1ec });
  buildLayer({ x0: -40, x1: 250, z: -34, zJit: 2, y: -8, yJit: 2, hMin: 21, hMax: 29, gapP: 0.3, gapMin: 1, gapMax: 6, fog: 1.0, haze: 0.42, wash: 0.8, order: -80, tint: 0xf2efea });
  buildLayer({ x0: -22, x1: 228, z: -9.5, zJit: 1.2, y: -3.5, yJit: 1.2, hMin: 11.0, hMax: 15.0, gapP: 0.5, gapMin: 1.5, gapMax: 6, fog: 1, haze: 0.2, wash: 1, order: -70, tint: 0xffffff });
  const rays = buildGodRays();

  // eye glow, attached to the face
  const eye = addSprite(T.fx, { ...atlasRect(J.fx, J.fx.sprites.findIndex((s) => s.cell[0] === 3 && s.cell[1] === 2)), h: 0.16, anchor: 'center', additive: true, tint: 0x7ff6ff, fog: 0, order: 46 });

  LEVEL.nodes.forEach((d, i) => nodes.push(new RustNode(d, i)));
  buildPumps();

  player = new Player();

  player.face = DBG.face;

  else if (DBG.nodes) { for (let i = 0; i < DBG.nodes; i++) nodes[i].bloomNow(true); }
  hud.init(); hud.update();
  setupPost();

  // ---------------------------------------------------------------- loop
  const clock = new THREE.Clock();
  function step(dt) {
    U.uTime.value += dt;
    const t = U.uTime.value;
    pressed.forEach(() => {});
    player.update(dt);
    pressed.clear();
    for (const n of nodes) n.update(dt);
    // grown structures
    if (vineBridge && vineBridge.mesh.visible) { vineBridge.t += dt; vineBridge.mesh.material.uniforms.uReveal.value = clamp(vineBridge.t / 2.2, 0, 1); }
    if (stalk && stalk.mesh.visible) { stalk.t += dt; stalk.mesh.material.uniforms.uReveal.value = easeOut(clamp(stalk.t / 2.6, 0, 1)); }
    for (const d of decor) {
      if (d.kind === 'hang') {
        const node = nodes.find((n) => n.def === d.node);
        if (node && node.state !== 'rust') { d.mesh.visible = true; d.t += dt; d.mesh.material.uniforms.uReveal.value = clamp((d.t - 0.6) / 2.5, 0, 1); d.mesh.rotation.z = Math.sin(t * 0.8 + d.mesh.position.x) * 0.03; }
      }
    }
    // pumps: refill
    for (const p of pumps) {
      const near = Math.abs(player.x - p.x) < 1.1 && Math.abs(player.y - p.y) < 0.8;
      if (near) {
        if (player.water < 100) {
          player.water = Math.min(100, player.water + 55 * dt);
          p.drip += dt * 30;
          while (p.drip > 1) { p.drip -= 1; fxN.spawn({ cell: pick(['2,0', '2,1']), x: p.x + 0.3 + R(-0.03, 0.03), y: p.y + 1.15, z: -0.3, vx: 0.05, vy: -0.5, g: 9, life: 0.4, size: R(0.05, 0.09), col: [0.95, 0.97, 1.1] }); }
          if (!p.active) { AudioSys.play('pump', 1.0); p.active = 1; }
        }
        setCheckpoint(p.x, p.y); player.lastSafe = { x: p.x + 0.8, y: p.y };
      } else p.active = 0;
      if (p.obj) p.obj.children[0] && (p.obj.children[0].rotation.z = Math.sin(t * 0.7 + p.x) * 0.0);
    }
    hud.water(player.water);
    if (started && !player.hasPoured && player.pouring > 0.5) { player.hasPoured = true; hud.setHint(null); }
    if (started && player.water < 1 && K.pour()) hud.flash('the can is empty · find a pump');
    hud.tick(dt);
    // eye + shadow
    if (robot.bones.headfront) {
      const hp = robot.bones.headfront.getWorldPosition(new THREE.Vector3());
      robot.eye.position.set(hp.x, hp.y, hp.z + 0.05);
      robot.eye.material.uniforms.uOpacity.value = 0.4 + 0.15 * Math.sin(t * 2.2);
    }
    const sg = groundAt(player.x, player.y + 0.1, 0.2);
    if (sg) { robot.shadow.position.set(player.x, sg.y + 0.02, -0.05); const hgt = player.y - sg.y; robot.shadow.material.uniforms.uOpacity.value = 0.35 * clamp(1 - hgt / 2.5, 0, 1); robot.shadow.scale.setScalar(1 - clamp(hgt / 4, 0, 0.5)); }
    // finale
    if (finale > 0) {
      finale += dt;
      U.uGlobalBloom.value = smooth(clamp((finale - 1.0) / 7.0, 0, 1)) * 0.95;
      if (Math.random() < dt * 30) { const fx = camera.position.x + R(-14, 14); const g = groundAt(fx, 8, 10); if (g) flowers.add(fx, g.y, R(-0.5, 0.4), R(0.6, 1.1), 0, 1.0); }
      if (Math.random() < dt * 20) petalBurst(camera.position.x + R(-10, 10), cam.y + R(-1, 4), 2, 1.5);
      if (finale > 9 && !ended && !player.endShown) { player.endShown = true; ended = true; document.getElementById('end').classList.add('on'); hud.el.classList.remove('on'); }
    }
    const warm = Math.max(bloomedCount / 8 * 0.45, U.uGlobalBloom.value);
    sky.material.uniforms.uWarm.value = damp(sky.material.uniforms.uWarm.value, warm, 0.5, dt);
    for (const m of rays) m.material.uniforms.uOpacity.value = m.userData.base * (0.75 + 0.25 * Math.sin(t * 0.4 + m.userData.ph)) * (1 + warm * 0.8);
    updateMotes(dt);
    fxN.update(dt); fxA.update(dt);
    field.update(dt);
    if (!started) { // title: gentle drift
      cam.x = damp(cam.x, player.x + 1.5 + Math.sin(t * 0.1) * 0.6, 1, dt);
    }
    updateCamera(dt);
    // sky follows the camera (very far layer)
    const vh = 2 * 600 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    sky.scale.set(vh * camera.aspect * 1.25, vh * 1.25, 1);
    sky.position.set(camera.position.x, camera.position.y + vh * 0.12, camera.position.z - 600);
    sky.material.uniforms.uScroll.value = camera.position.x * 0.0009;
    sun.position.set(camera.position.x - 6, 9, 7); sun.target.position.set(camera.position.x, 0, 0);
    // fade
    fade.v = damp(fade.v, fade.to, 6, dt);
    if (fade.cb && fade.v > 0.97) { const cb = fade.cb; fade.cb = null; cb(); }
    gradePass.uniforms.uFade.value = fade.v; gradePass.uniforms.uWarm.value = warm;
  }
  function frame() {
    const dt = Math.min(clock.getDelta(), 1 / 30);
    if (DBG.speed) { for (let i = 0; i < DBG.speed; i++) step(1 / 30); } else step(dt);
    if (composer && !DBG.nopost) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  ready = true;
  L.style.display = 'none';
  document.getElementById('press').style.display = 'block';
  if (DBG.autostart) onStartKey();
  { const t0 = performance.now(); for (let i = 0; i < DBG.sim * 30; i++) step(1 / 30); if (DBG.sim) console.log('sim ms', Math.round(performance.now() - t0)); }
  frame();
  window.__game = { player, nodes, field, flowers, pieces, cam, U, robot, LEVEL, step, keys, pressed,
    tp(x) { player.x = x; player.y = groundHeightNear(x); player.vx = 0; player.vy = 0; player.lastSafe = { x, y: player.y }; cam.x = x + 1.5; cam.y = player.y + 1.55; return x; },
    run(sec, hold = [], tap = []) { for (const k of hold) keys.add(k); for (const k of tap) pressed.add(k); for (let i = 0; i < sec * 30; i++) step(1 / 30); for (const k of hold) keys.delete(k); return { x: +player.x.toFixed(2), y: +player.y.toFixed(2), w: Math.round(player.water), g: player.onGround, b: bloomedCount }; } };
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setSize(innerWidth, innerHeight); gradePass.uniforms.uAspect.value = innerWidth / innerHeight; }
});

init().catch((e) => { console.error(e); document.getElementById('loading').textContent = 'error: ' + e.message; });
</script>
<script src="../brand/gamepad.js"></script>
</body>
