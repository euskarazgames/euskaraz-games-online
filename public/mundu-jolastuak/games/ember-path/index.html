<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- utils
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const toward = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry(20261012);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length) % arr.length];

const Q = new URLSearchParams(location.search);
// headless captures (CLI --screenshot, test runners) freeze virtual time: show overlays without CSS fades
if (/HeadlessChrome/.test(navigator.userAgent)) document.documentElement.classList.add('nofade');
const DBG = {
  x: Q.has('x') ? parseFloat(Q.get('x')) : null,
  auto: Q.has('auto'),
  warm: Q.has('w') ? parseFloat(Q.get('w')) : null,
  play: Q.has('play') || Q.has('auto'),
  reveal: Q.has('reveal'),
  mute: Q.has('mute'),
  finale: Q.has('finale'),
};

// ---------------------------------------------------------------- level design
const LV = {
  xMin: -40, xMax: 440, start: 4.5,
  zone: 178,                 // green spring -> autumn
  greatX: 380,               // the Great Tree
  gaps: [[46, 48], [124, 126], [152, 153.8], [201, 203], [230, 232], [291, 293], [322, 324]],
  ash: [[96, 118], [242, 268]],
  brambles: [78, 216, 310],
  lanterns: [2.6, 90, 171, 275, 346],
  boulders: [[60, 1.0], [139, 1.1], [186, 0.95], [257, 1.0], [300, 1.0], [334, 1.1]],
  logs: [[30, 1.0], [110, 0.9], [164, 1.0], [222, 1.0], [316, 0.95]],
  motes: [[12, 1.3], [21, 1.7], [36, 1.4], [47, 2.5], [69, 1.5], [84, 1.6], [100, 1.5], [106, 2.1], [113, 1.4], [125, 2.6], [146, 1.6], [152.9, 2.5],
    [161, 1.5], [194, 1.5], [202, 2.6], [209, 1.4], [221, 1.7], [231, 2.6], [247, 1.5], [253, 2.1], [264, 1.9], [283, 1.5], [292, 2.6], [313, 1.5],
    [323, 2.6], [356, 1.5], [364, 2.2], [371, 1.5]],
};
const WALK = 3.3, RUN = 5.7, ACC = 22, AIR_ACC = 12, GRAV = 24, JUMP_V = 9.6, COYOTE = 0.12, JBUF = 0.15, MAX_FALL = 24, GIRL_H = 1.12;

function rawH(x) { return 0.9 * Math.sin(x * 0.041 + 0.6) + 0.5 * Math.sin(x * 0.103 + 1.9) + 0.22 * Math.sin(x * 0.27 + 0.3); }
const H_END = rawH(LV.greatX - 22);
function baseH(x) { return lerp(rawH(x), H_END, sstep(LV.greatX - 22, LV.greatX - 10, x)); }
function inGap(x) { for (const g of LV.gaps) if (x > g[0] && x < g[1]) return true; return false; }
function inAsh(x, pad = 0) { for (const a of LV.ash) if (x > a[0] - pad && x < a[1] + pad) return true; return false; }
function nearGap(x, pad) { for (const g of LV.gaps) if (x > g[0] - pad && x < g[1] + pad) return true; return false; }
function topY(x, z) {
  const h = baseH(x), az = Math.abs(z);
  // small mounds near the path, fading out in depth; far ground slowly sinks into the mist
  const bump = (0.18 * Math.sin(x * 0.37 + z * 0.41) + 0.1 * Math.sin(x * 0.83 - z * 0.29 + 1.3)) * sstep(2.0, 4.0, az) * (1 - sstep(8, 16, -z));
  const back = z < -3 ? -(-3 - z) * 0.022 : 0;
  const front = z > 1.8 ? -(z - 1.8) * 0.22 : 0;
  return h + bump * 0.7 + back + front;
}

// ---------------------------------------------------------------- renderer / scene
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a39a8e');
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 700);
camera.position.set(LV.start, 3, 15);

// reveal field: how much each x of the path has been redrawn by the ember
const FIELD_N = 2048, FIELD_RES = (LV.xMax - LV.xMin) / (FIELD_N - 1);
const fieldVal = new Float32Array(FIELD_N), fieldTgt = new Float32Array(FIELD_N), fieldBytes = new Uint8Array(FIELD_N);
const fieldTex = new THREE.DataTexture(fieldBytes, FIELD_N, 1, THREE.RedFormat, THREE.UnsignedByteType);
fieldTex.magFilter = fieldTex.minFilter = THREE.LinearFilter; fieldTex.unpackAlignment = 1; fieldTex.needsUpdate = true;
// ravine mask (1 inside ravines, soft falloff around their edges) used to darken the path edges
const gapBytes = new Uint8Array(FIELD_N);
for (let i = 0; i < FIELD_N; i++) {
  const x = LV.xMin + i * FIELD_RES; let v = 0;
  for (const [g0, g1] of LV.gaps) { const d = x < g0 ? g0 - x : x > g1 ? x - g1 : 0; v = Math.max(v, 1 - sstep(0, 1.1, d)); }
  gapBytes[i] = Math.round(v * 255);
}
const gapTex = new THREE.DataTexture(gapBytes, FIELD_N, 1, THREE.RedFormat, THREE.UnsignedByteType);
gapTex.magFilter = gapTex.minFilter = THREE.LinearFilter; gapTex.unpackAlignment = 1; gapTex.needsUpdate = true;
function paintField(x, radius, strength = 1) {
  const i0 = Math.max(0, Math.floor((x - radius - LV.xMin) / FIELD_RES)), i1 = Math.min(FIELD_N - 1, Math.ceil((x + radius - LV.xMin) / FIELD_RES));
  for (let i = i0; i <= i1; i++) { const xi = LV.xMin + i * FIELD_RES; const v = strength * sstep(1, 0.45, Math.abs(xi - x) / radius); if (v > fieldTgt[i]) fieldTgt[i] = v; }
}
function fieldAt(x) { return fieldVal[clamp(Math.round((x - LV.xMin) / FIELD_RES), 0, FIELD_N - 1)]; }
function updateField(dt) {
  let dirty = false;
  for (let i = 0; i < FIELD_N; i++) { const t = fieldTgt[i], v = fieldVal[i]; if (v < t) { fieldVal[i] = Math.min(t, v + dt * 0.75); fieldBytes[i] = Math.round(fieldVal[i] * 255); dirty = true; } }
  if (dirty) fieldTex.needsUpdate = true;
}

// shared uniforms (same objects referenced by every custom material)
const U = {
  uTime: { value: 0 }, uField: { value: fieldTex }, uFieldRange: { value: new THREE.Vector2(LV.xMin, LV.xMax) },
  uCam: { value: new THREE.Vector3() }, uEmber: { value: new THREE.Vector3() }, uEmberPow: { value: 1 },
  uFogBurnt: { value: new THREE.Color('#a59c90') }, uFogGreen: { value: new THREE.Color('#ece2c8') }, uFogAutumn: { value: new THREE.Color('#f2d2a4') },
  uZoneX: { value: LV.zone }, uCharDark: { value: new THREE.Vector3(0.19, 0.17, 0.155) }, uCharLight: { value: new THREE.Vector3(0.66, 0.62, 0.565) },
  uFinale: { value: 0 }, uSun: { value: new THREE.Vector3(0.55, 0.75, 0.38).normalize() },
};

const COMMON = /* glsl */`
uniform float uTime; uniform sampler2D uField; uniform vec2 uFieldRange; uniform vec3 uCam; uniform vec3 uEmber; uniform float uEmberPow;
uniform vec3 uFogBurnt; uniform vec3 uFogGreen; uniform vec3 uFogAutumn; uniform float uZoneX; uniform vec3 uCharDark; uniform vec3 uCharLight; uniform float uFinale;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p){ float v = 0.0; float a = 0.5; for (int i = 0; i < 4; i++){ v += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.3); a *= 0.5; } return v; }
float fieldAt(float x){ float u = (x - uFieldRange.x) / (uFieldRange.y - uFieldRange.x); return texture2D(uField, vec2(clamp(u, 0.0, 1.0), 0.5)).r; }
float pathX(vec3 w){ float D = uCam.z; return uCam.x + (w.x - uCam.x) * D / max(D - w.z, 0.01); }
vec3 toLin(vec3 c){ return pow(max(c, vec3(0.0)), vec3(2.2)); }
vec3 toSrgb(vec3 c){ return pow(max(c, vec3(0.0)), vec3(1.0 / 2.2)); }
vec3 charcoal(vec3 lin, vec2 wp){
  vec3 s = toSrgb(lin);
  float L = dot(s, vec3(0.299, 0.587, 0.114));
  vec3 c = mix(uCharDark, uCharLight, smoothstep(0.04, 0.95, L));
  c *= 0.9 + 0.2 * fbm(wp * vec2(6.0, 1.4));
  return toLin(c);
}
vec3 fogColorAt(vec3 w){ float px = pathX(w); float f = max(fieldAt(px), uFinale); float z = smoothstep(uZoneX - 12.0, uZoneX + 12.0, px);
  return mix(uFogBurnt, mix(uFogGreen, uFogAutumn, z), f); }
`;

const SPRITE_VS = /* glsl */`
uniform float uTime; uniform float uSway; uniform float uPhase;
varying vec2 vUv; varying vec3 vW; varying float vDepth;
void main(){
  vUv = uv;
  vec3 p = position;
  float k = uv.y * uv.y;
  p.x += (sin(uTime * 0.7 + uPhase) * 0.65 + sin(uTime * 1.73 + uPhase * 2.1) * 0.3) * uSway * k;
  vec4 w = modelMatrix * vec4(p, 1.0);
  vW = w.xyz;
  vec4 mv = viewMatrix * w;
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;
const SPRITE_FS = /* glsl */`
uniform sampler2D map;
uniform float uReveal; uniform vec2 uOrigin; uniform float uSpan; uniform float uRim;
uniform float uFogNear; uniform float uFogFar; uniform float uFogMax;
uniform float uDark; uniform float uGlow; uniform float uOpacity; uniform vec3 uTint; uniform vec4 uHole;
varying vec2 vUv; varying vec3 vW; varying float vDepth;
void main(){
  vec4 t = texture2D(map, vUv);
  float a = t.a * uOpacity;
  // x-ray bubble: a big foreground silhouette opens softly around the girl when she walks behind it
  if (uHole.w > 0.0) a *= 1.0 - uHole.w * (1.0 - smoothstep(uHole.z * 0.5, uHole.z, length((gl_FragCoord.xy - uHole.xy) * vec2(1.0, 0.82))));
  if (a < 0.012) discard;
  vec3 base = t.rgb * uTint;
  vec3 col = base;
  float m = 1.0; float rim = 0.0;
  float rv = max(uReveal, uFinale);
  if (rv < 0.999) {
    float n = fbm(vW.xy * 0.42 + 3.7);
    float d = distance(vW.xy, uOrigin) / uSpan;
    float front = rv * 1.5 - d - (n - 0.5) * 0.6;
    m = smoothstep(0.0, 0.07, front);
    rim = (1.0 - smoothstep(0.0, 0.07, abs(front - 0.03))) * step(0.002, rv) * (1.0 - smoothstep(0.6, 1.0, rv));
    col = mix(charcoal(base, vW.xy), base, m);
  }
  col = mix(col, vec3(0.010, 0.011, 0.010) + base * 0.035, uDark);
  float ed = length(vW - uEmber);
  float el = exp(-ed * ed * 0.07) * uEmberPow;
  col += col * vec3(1.0, 0.55, 0.22) * el * (1.0 - uDark * 0.6);
  col += vec3(1.0, 0.78, 0.36) * uGlow * m;
  col += vec3(1.0, 0.55, 0.22) * rim * uRim * 0.55 * a;
  float f = smoothstep(uFogNear, uFogFar, vDepth) * uFogMax;
  f += (1.0 - smoothstep(-0.5, 5.5, vW.y - uCam.y + 2.0)) * 0.18 * smoothstep(uFogNear, uFogFar * 1.4, vDepth);
  col = mix(col, fogColorAt(vW), clamp(f, 0.0, 1.0) * (1.0 - uDark * 0.6));
  gl_FragColor = vec4(col, a);
}`;

function spriteMat(tex, o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      ...U,
      map: { value: tex }, uReveal: { value: o.reveal ?? 0 }, uOrigin: { value: new THREE.Vector2() }, uSpan: { value: o.span ?? 10 },
      uRim: { value: o.rim ?? 1 }, uFogNear: { value: o.fogNear ?? 13 }, uFogFar: { value: o.fogFar ?? 75 }, uFogMax: { value: o.fogMax ?? 0.86 },
      uDark: { value: o.dark ?? 0 }, uGlow: { value: 0 }, uOpacity: { value: 1 }, uHole: { value: new THREE.Vector4(0, 0, 1, 0) }, uSway: { value: o.sway ?? 0 }, uPhase: { value: rand() * 6.28 },
      uTint: { value: o.tint ?? new THREE.Color(1, 1, 1) },
    },
    vertexShader: SPRITE_VS, fragmentShader: COMMON + SPRITE_FS,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
}
const planeGeo = {};
function basePlane(seg = 6) { if (!planeGeo[seg]) { const g = new THREE.PlaneGeometry(1, 1, 1, seg); g.translate(0, 0.5, 0); planeGeo[seg] = g; } return planeGeo[seg]; }
const sprites = [];   // culling registry
function makeSprite(tex, h, o = {}) {
  const asp = tex && tex.image ? tex.image.width / tex.image.height : 1;
  const mat = spriteMat(tex, { span: h * 1.05, ...o });
  const mesh = new THREE.Mesh(basePlane(o.seg ?? 6), mat);
  mesh.scale.set(h * asp * (o.flip ? -1 : 1), h, 1);
  mesh.frustumCulled = false;
  mesh.userData.hw = h * asp * 0.5;
  if (o.renderOrder !== undefined) mesh.renderOrder = o.renderOrder;
  sprites.push(mesh);
  scene.add(mesh);
  return mesh;
}

// ---------------------------------------------------------------- post-processing
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
composer.addPass(new RenderPass(scene, camera));
const sanitize = new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); if (any(isnan(c)) || any(isinf(c))) c = vec4(0.0, 0.0, 0.0, 1.0); gl_FragColor = vec4(min(c.rgb, vec3(48.0)), 1.0); }`,
});
composer.addPass(sanitize);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.7, 0.93);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uPaper: { value: null }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uCold: { value: 0 }, uFlash: { value: 0 }, uFade: { value: 0 }, uVig: { value: 0.34 }, uWarm: { value: 0 }, uHasPaper: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform sampler2D uPaper; uniform vec2 uRes; uniform float uCold, uFlash, uFade, uVig, uWarm, uHasPaper; varying vec2 vUv;
    void main(){

      const px = cx + (t.x - cx) * D / (D - t.z);

      if (Math.abs(px - ember.pos.x) < R - pen) revealTree(t, cx + (ember.pos.x - cx) * (D - t.z) / D, t.by + t.h * 0.15);
    }
    for (const p of plants) if (!p.revealed && !p.dead && Math.abs(p.x - ember.pos.x) < R * 0.62 + 0.4) revealPlant(p);
    for (const p of props) if (!p.revealed && p.kind !== 'lantern' && Math.abs(p.x - ember.pos.x) < R * 0.7 + 0.5) revealProp(p);
  }
  for (const t of trees) if (t.revealed && t.rv < 1) { t.rv = Math.min(1, t.rv + dt / t.dur); t.mesh.material.uniforms.uReveal.value = 1 - Math.pow(1 - t.rv, 2.2); }
  if (greatTree && greatTree.revealed && greatTree.rv < 1) { greatTree.rv = Math.min(1, greatTree.rv + dt / greatTree.dur); greatTree.mesh.material.uniforms.uReveal.value = greatTree.rv; }
  for (const p of plants) {
    if (p.revealed && p.rv < 1) { p.rv = Math.min(1, p.rv + dt / 0.8); p.mesh.material.uniforms.uReveal.value = p.rv; }
    if (p.glow > 0.001) { p.glow *= Math.exp(-dt * 1.6); p.mesh.material.uniforms.uGlow.value = p.glow; }
  }
  for (const p of props) if (p.revealed && p.rv < 1) { p.rv = Math.min(1, p.rv + dt / 1.3); p.rec.uReveal.value = p.rv; }
  for (const b of brambles) if (b.burnT >= 0) {
    b.burnT += dt; b.rv = Math.min(1, b.burnT / 0.9);
    for (const m of b.parts) {
      m.material.uniforms.uReveal.value = b.rv;
      const k = sstep(0.9, 2.0, b.burnT);
      m.scale.y = m.userData.sy0 === undefined ? (m.userData.sy0 = m.scale.y) : m.userData.sy0 * (1 - 0.92 * k);
      m.material.uniforms.uOpacity.value = 1 - sstep(1.4, 2.2, b.burnT);
    }
  }
  updateField(dt);
}

function updateWorld(dt) {
  // motes
  for (const m of motes) {
    if (m.taken) continue;
    const y = m.y + Math.sin(G.T * 1.7 + m.ph) * 0.12;
    m.core.position.set(m.x, y, m.z); m.halo.position.set(m.x, y, m.z);
    const s = 0.36 + 0.06 * Math.sin(G.T * 5 + m.ph);
    m.core.scale.setScalar(s); m.halo.scale.setScalar(1.4 + 0.2 * Math.sin(G.T * 3 + m.ph));
    if (G.state === 'play') {
      const d1 = Math.hypot(m.x - pl.x, y - (pl.y + 0.65)), d2 = Math.hypot(m.x - ember.pos.x, y - ember.pos.y);
      if (d1 < 0.85 || d2 < 0.6) collectMote(m);
    }
    if (sparkFX && rand() < dt * 3 && Math.abs(m.x - cam.x) < 20) sparkFX.spawn({ x: m.x + rr(-0.15, 0.15), y: y + rr(-0.15, 0.15), z: m.z, vy: rr(0.1, 0.4), life: rr(0.6, 1), size: rr(0.04, 0.08), color: [1.6, 1.1, 0.45] });
  }
  // lanterns
  for (const L of lanterns) {
    L.litT = Math.min(1, L.litT + dt * 1.5);
    const on = L.lit ? L.litT : 0, fl = 0.9 + 0.1 * Math.sin(G.T * 13 + L.x) * Math.sin(G.T * 5.1 + L.x);
    L.flame.material.opacity = on * fl; L.halo.material.opacity = 0.5 * on * fl;
    L.flame.scale.setScalar(0.55 * fl); L.halo.scale.setScalar(2.6 * fl);
    if (L.p && L.lit && !L.p.revealed) revealProp(L.p);
  }
  // light shafts brighter in restored areas
  for (const s of shafts) s.m.material.uniforms.uI.value = 0.05 + 0.12 * Math.max(fieldAt(s.x), U.uFinale.value);
  // ash fall
  if (leafFX && ashTiles.length && G.ashAmt > 0.05) {
    const n = dt * 40 * G.ashAmt;
    for (let i = 0; i < n + (rand() < n % 1 ? 1 : 0); i++) leafFX.spawn({ x: cam.x + rr(-12, 14), y: cam.y + rr(7, 9), z: rr(-4, 3), vx: rr(-2.2, -1.2), vy: rr(-1.2, -0.6), life: rr(4, 6), size: rr(0.1, 0.2), tile: pick(ashTiles), drag: 0.2, flut: 0.6, vr: rr(-1.5, 1.5), color: [0.85, 0.82, 0.8], alpha: 0.9 });
  }
  // gentle ambient leaves in restored zones
  if (leafFX && rand() < dt * 1.4) {
    const x = cam.x + rr(-10, 12), restored = fieldAt(x) > 0.6 || U.uFinale.value > 0.5;
    const tiles = x > LV.zone ? leafTilesA : leafTilesG;
    if (restored && tiles.length) leafFX.spawn({ x, y: cam.y + rr(6, 8), z: rr(-3, 2), vx: rr(-0.5, 0.3), vy: rr(-0.6, -0.3), life: rr(6, 9), size: rr(0.2, 0.32), tile: pick(tiles), drag: 0.6, flut: 1.2, vr: rr(-2, 2) });
  }
  // dust in the light
  if (sparkFX && rand() < dt * 6) sparkFX.spawn({ x: cam.x + rr(-9, 9), y: cam.y + rr(0.5, 6), z: rr(-3, 4), vx: rr(-0.1, 0.1), vy: rr(-0.05, 0.08), life: rr(3, 5), size: rr(0.025, 0.05), color: [0.6, 0.5, 0.35], alpha: 0.5, drag: 0.1 });
  // flare shockwave visuals
  if (G.flareR > 0) {
    G.flareR += dt * 20;
    if (G.flareR > 13) G.flareR = 0;
  }
  if (flareRing) {
    flareRing.visible = G.flareR > 0;
    if (flareRing.visible) {
      const k = G.flareR / 13;
      flareRing.position.set(G.flareX, ember.pos.y, 0.4);
      flareRing.material.uniforms.uR.value = k; flareRing.material.uniforms.uA.value = Math.pow(1 - k, 1.5) * 0.9;
    }
  }
  G.flash = Math.max(0, G.flash - dt * 2.2);
}

function updateCamera(dt) {
  const fin = (G.state === 'finale' || G.state === 'end') ? sstep(0, 5, G.finaleT) : 0;
  const glade = sstep(LV.greatX - 18, LV.greatX - 5, pl.x);
  let tx = pl.x + pl.face * 1.4 + pl.vx * 0.22;
  tx = lerp(tx, LV.greatX - 1, Math.max(glade * 0.55, fin * 0.8));
  const gref = Math.max(baseH(pl.x), Math.min(pl.y, baseH(pl.x) + 2.4));
  cam.x = damp(cam.x, tx, 2.4, dt);
  cam.y = damp(cam.y, gref, 2.0, dt);
  cam.d = damp(cam.d, 15 + glade * 3.5 + fin * 10, 1.4, dt);
  cam.lift = damp(cam.lift, glade * 2.2 + fin * 6.5, 1.4, dt);
  const shake = G.flash * 0.06;
  camera.position.set(cam.x + Math.sin(G.T * 0.13) * 0.6 + (rand() - 0.5) * shake, cam.y + 1.6 + cam.lift * 0.55 + Math.sin(G.T * 0.21) * 0.08 + (rand() - 0.5) * shake, cam.d + Math.sin(G.T * 0.09) * 0.35);
  camera.lookAt(cam.x, cam.y + 3.25 + cam.lift, 0);
  U.uCam.value.copy(camera.position);
  // cull sprites far from the view
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  for (const m of sprites) {
    const half = (camera.position.z - m.position.z) * tanH + Math.abs(m.userData.hw) + 2;
    m.visible = Math.abs(m.position.x - camera.position.x) < half && (m.material.uniforms.uOpacity.value > 0.003);
  }
  if (A.backdropMesh) A.backdropMesh.position.y = cam.y + 37 + cam.lift * 0.8;
  // foreground trees open a soft bubble around the girl (only visible where a tree actually covers her)
  if (fgTreeMeshes.length) {
    camera.updateMatrixWorld(); renderer.getDrawingBufferSize(_buf);
    _v1.set(pl.x, pl.y, 0).project(camera); _v2.set(pl.x, pl.y + GIRL_H, 0).project(camera);
    const hx = (_v1.x * 0.5 + 0.5) * _buf.x, hy0 = (_v1.y * 0.5 + 0.5) * _buf.y, hy1 = (_v2.y * 0.5 + 0.5) * _buf.y;
    const r = Math.max(8, (hy1 - hy0) * 1.25), on = G.state === 'play' || G.state === 'dying' || G.state === 'respawning' ? 0.82 : 0;
    G.holeK = damp(G.holeK || 0, on, 4, dt);
    for (const m of fgTreeMeshes) m.material.uniforms.uHole.value.set(hx, (hy0 + hy1) * 0.5, r, G.holeK);
  }
}

function updateUI(dt) {
  G.hudT -= dt;
  $('hud').classList.toggle('show', (G.state === 'play' && G.hudT > 0) || G.state === 'finale');
  $('hudCount').textContent = `${G.revealed} / ${G.total}`;
  const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x * 0.5 + 0.5) * innerWidth, (-v.y * 0.5 + 0.5) * innerHeight]; };
  let showE = false, ex = 0, ey = 0;
  if (G.state === 'play') {
    for (const b of brambles) if (b.solid && b.x - pl.x < 6 && b.x - pl.x > -1 && G.hintBramble) { [ex, ey] = proj(b.x, baseH(b.x) + 3.1, 0); showE = true; }
    if (greatTree && !greatTree.revealed && pl.x > LV.greatX - 14) { [ex, ey] = proj(pl.x, pl.y + 2.5, 0); showE = true; }
  }
  const he = $('hintE'); he.classList.toggle('show', showE); if (showE) { he.style.left = ex + 'px'; he.style.top = ey + 'px'; }
  let showJ = false, jx = 0, jy = 0;
  if (G.state === 'play' && G.hintJump) { const g = LV.gaps[0]; if (g[0] - pl.x < 5 && g[0] - pl.x > -0.5) { [jx, jy] = proj((g[0] + g[1]) / 2, baseH(g[0]) + 2.2, 0); showJ = true; } if (pl.x > g[1] + 1) G.hintJump = false; }
  const hj = $('hintJ'); hj.classList.toggle('show', showJ); if (showJ) { hj.style.left = jx + 'px'; hj.style.top = jy + 'px'; }
  if (G.state === 'play' && brambles.length && !brambles[0].solid) G.hintBramble = false;
}

function updatePost(dt) {
  const low = G.state === 'play' ? sstep(0.25, 0.04, ember.W) : 0;
  let cold = Math.max(low * 0.7, G.ashAmt * 0.35);
  let fade = 0;
  if (G.state === 'dying') {
    cold = Math.max(cold, G.deathKind === 'cold' ? sstep(0, 1.6, G.deathT) : 0);
    fade = G.deathKind === 'cold' ? sstep(1.8, 2.6, G.deathT) : sstep(0.0, 0.6, G.deathT);
    const tEnd = G.deathKind === 'cold' ? 2.7 : 0.75;
    if (G.deathT > tEnd && !G.respawned) { G.respawned = true; respawn(); G.state = 'respawning'; G.deathT = 0; }
  }
  if (G.state === 'respawning') { fade = 1 - sstep(0.1, 0.9, G.deathT); if (G.deathT > 0.9) { G.state = 'play'; G.respawned = false; } }
  grade.uniforms.uCold.value = damp(grade.uniforms.uCold.value, cold, 4, dt);
  grade.uniforms.uFade.value = fade;
  grade.uniforms.uFlash.value = G.flash;
  grade.uniforms.uWarm.value = U.uFinale.value;
  bloom.strength = 0.55 + G.flash * 0.6 + U.uFinale.value * 0.25;
}

// ---------------------------------------------------------------- adaptive resolution
// keeps the game fluid on weak or software GPUs: during play only, it lowers the internal resolution when frames are slow
const RES = { pr: Math.min(window.devicePixelRatio, 1.5), min: 0.5, ft: [], acc: 0 };
function adaptRes(frameMs) {
  if (G.state !== 'play') { RES.ft.length = 0; RES.acc = 0; return; }
  RES.ft.push(frameMs); RES.acc += frameMs;
  if (RES.ft.length < 45 && !(RES.ft.length >= 6 && RES.acc > 1500)) return;
  const s = RES.ft.sort((a, b) => a - b), med = s[s.length >> 1]; RES.ft.length = 0; RES.acc = 0;
  if (med > 40 && RES.pr > RES.min + 0.01) { RES.pr = Math.max(RES.min, RES.pr * 0.72); renderer.setPixelRatio(RES.pr); composer.setPixelRatio(RES.pr); onResize(); }
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const frameMs = now - last;
  const dt = Math.min(0.05, Math.max(0.001, frameMs / 1000)); last = now;
  G.T += dt; U.uTime.value = G.T;
  if (G.state === 'loading') return;
  adaptRes(frameMs);
  if (G.state === 'play') G.playTime += dt;
  if (G.state === 'dying' || G.state === 'respawning') G.deathT += dt;
  G.flareCD -= dt;
  if (G.state === 'finale') {
    G.finaleT += dt;
    U.uFinale.value = sstep(0.8, 5.5, G.finaleT);
    if (leafFX && rand() < dt * 30) { const tiles = leafTilesA.concat(leafTilesG); if (tiles.length) leafFX.spawn({ x: cam.x + rr(-16, 16), y: cam.y + rr(9, 13), z: rr(-6, 3), vx: rr(-1, 0.4), vy: rr(-1, -0.4), life: rr(6, 9), size: rr(0.22, 0.4), tile: pick(tiles), drag: 0.5, flut: 1.4, vr: rr(-2, 2) }); }
    if (G.finaleT > 8.5) showEnd();
  }
  if (G.state === 'end') G.finaleT += dt;
  updatePlayer(dt);
  updateEmber(dt);
  updateCamera(dt);
  updateReveal(dt);
  updateWorld(dt);
  if (mixer) mixer.update(dt);
  if (anim.name === 'kneel' && anim.cur && anim.cur.time > 1.0) anim.cur.paused = true;
  if (shadowBlob) {
    const gy = supportAt(pl.x, pl.y + 0.05);
    const hgt = pl.y - (gy > -1e9 ? gy : pl.y - 5);
    shadowBlob.position.set(pl.x, (gy > -1e9 ? gy : -50) + 0.03, 0.05);
    shadowBlob.material.uniforms.uA.value = 0.32 * (1 - sstep(0, 2.5, hgt));
  }
  if (sparkFX) { sparkFX.mat.uniforms.uScale.value = pointScale(); sparkFX.update(dt); }
  if (leafFX) { leafFX.mat.uniforms.uScale.value = pointScale(); leafFX.update(dt); }
  updateUI(dt);
  updatePost(dt);
  audioUpdate(dt);
  composer.render(dt);
}

function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  grade.uniforms.uRes.value.set(w, h);
}
addEventListener('resize', onResize);

// ---------------------------------------------------------------- init
async function init() {
  MAN = await fetch('assets/manifest.json').then(r => r.json());
  const tag = (arr, flag) => arr.map((t, i) => { t.userData.birch = (flag || [])[i] || false; return t; });
  const [treesGreen, treesAutumn, great, backdrop, gm, ga, gs, fgPlants, fgRocks, fgTrees, fgHang, sprouts, bushesGreen, bushesAutumn, bramble, spark, leaves, ash, paper] = await Promise.all([
    loadAll(MAN.trees.green), loadAll(MAN.trees.autumn), loadTex(MAN.great), loadTex(MAN.backdrop, { repeat: true }),
    loadTex(MAN.ground?.moss, { repeat: true }), loadTex(MAN.ground?.autumn, { repeat: true }), loadTex(MAN.ground?.side, { repeat: true }),
    loadAll(MAN.fgPlants), loadAll(MAN.fgRocks), loadAll(MAN.fgTrees), loadAll(MAN.fgHang), loadAll(MAN.sprouts), loadAll(MAN.bushesGreen), loadAll(MAN.bushesAutumn),
    loadAll(MAN.bramble), loadTex(MAN.spark), loadAll(MAN.leaves), loadAll(MAN.ash), loadTex(MAN.paper, { repeat: true }),
  ]);
  const [girlG, lantern, boulder, log, ...clips] = await Promise.all([
    loadGLB(MAN.models.girl), loadGLB(MAN.models.lantern), loadGLB(MAN.models.boulder), loadGLB(MAN.models.log),
    ...Object.values(MAN.anims).map(f => loadGLB(f)),
  ]);
  A = { treesGreen: tag(treesGreen, MAN.trees.greenBirch), treesAutumn: tag(treesAutumn, MAN.trees.autumnBirch), great, backdrop, groundMoss: gm, groundAutumn: ga, groundSide: gs,
    fgPlants, fgRocks, fgTrees, fgHang, sprouts, bushesGreen, bushesAutumn, bramble, spark: spark || solidTex('#ffffff'), leaves, ash, paper, lantern, boulder, log };
  if (MAN.title) $('titleImg').src = 'assets/' + MAN.title; else $('titleImg').replaceWith(Object.assign(document.createElement('div'), { className: 'fallback', textContent: 'Ember Path' }));
  if (MAN.icon) $('hudIcon').src = 'assets/' + MAN.icon; else $('hudIcon').remove();
  if (paper) { grade.uniforms.uPaper.value = paper; grade.uniforms.uHasPaper.value = 1; }

  scene.add(new THREE.HemisphereLight(0xfff0d8, 0x4a3c30, 1.7));
  const sun = new THREE.DirectionalLight(0xffe2b4, 2.2); sun.position.set(6, 10, 6); scene.add(sun);

  buildBackdrop(); buildGround(); buildTrees(); buildProps(); buildPlants(); buildForeground(); buildShafts(); buildMotes(); buildBrambles();
  buildGirl(girlG);
  const names = Object.keys(MAN.anims);
  clips.forEach((g, i) => { if (g && g.animations[0] && mixer) { const c = prepClip(g.animations[0], names[i]); const a = mixer.clipAction(c); if (['jump', 'flare', 'kneel', 'joy'].includes(names[i])) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; } anim.acts[names[i]] = a; } });
  playAnim('idle', 0);
  buildEmber();
  // particles: sparks (additive) + leaves/ash atlas
  sparkFX = new FX(1600, A.spark, 1, true, 1.6);
  const leafImgs = leaves.map(t => t.image), ashImgs = ash.map(t => t.image);
  if (leafImgs.length || ashImgs.length) {
    const atlas = buildAtlas(leafImgs.concat(ashImgs).slice(0, 36));
    leafFX = new FX(900, atlas, 6, false, 1.2);
    const nl = Math.min(leafImgs.length, 36);
    for (let i = 0; i < nl; i++) ((MAN.leafAutumn || []).includes(i) ? leafTilesA : leafTilesG).push(i);
    if (!leafTilesA.length) leafTilesA = leafTilesG.slice(); if (!leafTilesG.length) leafTilesG = leafTilesA.slice();
    for (let i = 0; i < ashImgs.length && nl + i < 36; i++) ashTiles.push(nl + i);
  }
  // start position (debug)
  if (DBG.x !== null) { pl.x = DBG.x; cam.x = DBG.x; const L = lanterns.filter(l => l.x <= DBG.x).pop(); if (L) G.checkpoint = L.x; }
  pl.y = baseH(pl.x); cam.y = pl.y;
  ember.pos.set(pl.x - 0.6, pl.y + 0.8, 0.3);
  if (DBG.warm !== null) ember.W = DBG.warm;
  if (DBG.reveal) { for (let i = 0; i < FIELD_N; i++) fieldTgt[i] = fieldVal[i] = 1; fieldBytes.fill(255); fieldTex.needsUpdate = true; for (const t of trees) if (!t.dead) { t.revealed = true; t.rv = 1; t.mesh.material.uniforms.uReveal.value = 1; } for (const p of plants) { p.revealed = true; p.rv = 1; p.mesh.material.uniforms.uReveal.value = 1; } for (const p of props) { p.revealed = true; p.rv = 1; p.rec.uReveal.value = 1; } }
  onResize();
  updateCamera(0.016); camera.updateMatrixWorld();
  // warm up shaders
  renderer.compile(scene, camera);
  $('load').classList.add('hide');
  G.state = 'title';
  if (DBG.play) startGame(); else $('title').classList.remove('hide');
  if (DBG.finale) { pl.x = LV.greatX - 6; cam.x = pl.x; pl.y = baseH(pl.x); ember.W = 1; }
  window.__game = { G, pl, ember, trees, LV, lanterns, brambles, motes, tryFlare, U, girl, girlRoot, camera, scene, THREE, props, plants, AU, anim, RES };
}
requestAnimationFrame(loop);
init().catch(e => { console.error(e); $('load').querySelector('.bar').style.background = '#a33'; });
</script>
<script src="../brand/gamepad.js"></script>
