let NV = 0, NX = 0, NY = 0;
function hsh(x, y) {

function dprof(p, c) {               // dune cross-section: kicker windward flank, crisp (slightly rounded) crest, slip face

  n = vnoise(vec2(x/120.0 + 7.7, s/150.0 + 7.7));
  float A2 = 3.4*n.x, A2x = 3.4*n.y/120.0, A2s = 3.4*n.z/150.0;
  h += A2*P2.x; hx += A2x*P2.x + A2*P2.y*u2x; hs += A2s*P2.x + A2*P2.y*u2s;
  float u3 = (-0.6*x + 0.8*s)/27.0 + 0.6*(w1.x-0.5);
  float u3x = -0.6/27.0 + 0.6*w1x, u3s = 0.8/27.0 + 0.6*w1s;
  vec2 P3 = dprof(fract(u3), 0.58);
  n = vnoise(vec2(x/90.0 - 13.1, s/90.0 + 2.9));
  float A3 = 1.9*n.x, A3x = 1.9*n.y/90.0, A3s = 1.9*n.z/90.0;
  float f3 = clamp(fine * 2.0, 0.0, 1.0);
  h += A3*P3.x; hx += f3*(A3x*P3.x + A3*P3.y*u3x); hs += f3*(A3s*P3.x + A3*P3.y*u3s);
  n = vnoise(vec2(x/11.0 + 3.3, s/11.0 - 7.9));
  h += 0.35*(n.x-0.5); hx += fine*0.35*n.y/11.0; hs += fine*0.35*n.z/11.0;
  return vec3(h, hx, -hs);
}
float terrainHs(vec2 xz){
  float x = xz.x, s = -xz.y;
  float h = 24.0*(vnoise(vec2(x/430.0, s/430.0)).x - 0.5);
  h += 8.0*(vnoise(vec2(x/170.0 + 17.3, s/170.0 + 41.1)).x - 0.5);
  float w1 = vnoise(vec2(x/190.0 + 5.2, s/300.0 + 1.7)).x;
  float w2 = vnoise(vec2(x/80.0 - 3.1, s/110.0 + 9.4)).x;
  float phi = s/LAM + 1.8*(w1-0.5) + 0.7*(w2-0.5);
  float p = fract(phi);
  float P = dprof(p, CREST).x;
  float Psm = 0.5 + 0.5*cos(TAU*(p - CREST));
  float kk = smoothstep(0.25, 0.65, vnoise(vec2(x/240.0 + 11.7, s/330.0 - 6.3)).x);
  float na = vnoise(vec2(x/170.0 - 21.4, s/240.0 + 3.3)).x;
  float A = 11.0*(1.0 + 0.5*clamp(s/8000.0, 0.0, 1.0))*(0.15 + 0.85*na*na);
  h += A*(Psm + (P - Psm)*kk);
  float u2 = (0.52*x + 0.854*s)/38.0 + 0.9*(w2-0.5);
  h += 3.4*vnoise(vec2(x/120.0 + 7.7, s/150.0 + 7.7)).x * dprof(fract(u2), 0.6).x;
  return h;
}
`;

/* ------------------------------------------------------------- sky (GLSL) */
const SKY_GLSL = /* glsl */`
uniform sampler2D uSky;
uniform sampler2D uSkyDusk;
uniform float uDusk;
uniform vec3 uSkyP;          // x: horizontal span (rad), y: vertical span above horizon (rad), z: horizon v (from top)
vec2 skyUV(vec3 d){
  float az = atan(d.x, -d.z);
  float el = asin(clamp(d.y, -1.0, 1.0));
  float u = 0.5 + az / uSkyP.x;
  u = 1.0 - abs(1.0 - mod(u, 2.0));
  float vt = uSkyP.z * (1.0 - el / uSkyP.y);
  vt = clamp(vt, 0.002, 0.998);
  return vec2(u, 1.0 - vt);
}
vec3 skySample(vec3 d){
  vec2 uv = skyUV(d);
  return mix(texture2D(uSky, uv).rgb, texture2D(uSkyDusk, uv).rgb, uDusk);
}
vec3 hazeColor(vec3 dir){
  vec3 d = normalize(vec3(dir.x, 0.0, dir.z));
  d = normalize(vec3(d.x, 0.035, d.z));
  vec2 uv = skyUV(d);
  return mix(textureLod(uSky, uv, 4.0).rgb, textureLod(uSkyDusk, uv, 4.0).rgb, uDusk);
}
`;

function makeTerrainGeometry() {
  const NF = LOW ? 180 : 300, NB = LOW ? 36 : 60, NS = LOW ? 120 : 200;
  const RF = 2900, RB = 420, RS = 2500;
  const warp = (t, R) => R * (0.06 * t + 0.94 * t * t * t);
  const zs = [], xs = [];
  for (let j = NF; j >= 1; j--) zs.push(-warp(j / NF, RF));
  zs.push(0);
  for (let j = 1; j <= NB; j++) zs.push(warp(j / NB, RB));
  for (let i = NS; i >= 1; i--) xs.push(-warp(i / NS, RS));
  xs.push(0);
  for (let i = 1; i <= NS; i++) xs.push(warp(i / NS, RS));
  const W = xs.length, H = zs.length;
  const pos = new Float32Array(W * H * 3);
  let k = 0;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { pos[k++] = xs[i]; pos[k++] = 0; pos[k++] = zs[j]; }
  const idx = new Uint32Array((W - 1) * (H - 1) * 6);
  let m = 0;
  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {
    const a = j * W + i, b = a + 1, c = a + W, d = c + 1;
    idx[m++] = a; idx[m++] = c; idx[m++] = b; idx[m++] = b; idx[m++] = c; idx[m++] = d;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);
  return { geo: g, snapX: warp(1 / NS, RS), snapZ: warp(1 / NF, RF) };
}
const TERR = makeTerrainGeometry();
const terrainMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`
    uniform vec3 uSunDir;
    uniform float uShadowFar;
    varying vec3 vWorld;
    varying float vShadow;
    ${TERRAIN_GLSL}
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      wp.y = terrainHD(wp.xz).x;
      vWorld = wp.xyz;
      float dc = length(wp.xz - cameraPosition.xz);
      float sh = 1.0;
      if (dc < uShadowFar) {
        vec3 P = wp.xyz + vec3(0.0, 0.45, 0.0);
        float t = 2.6, res = 1.0;
        for (int i = 0; i < ${LOW ? 16 : 22}; i++) {
          vec3 q = P + uSunDir * t;
          float d = q.y - terrainHs(q.xz);
          res = min(res, 7.0 * d / t);
          if (res < 0.0) break;
          t *= ${LOW ? '1.42' : '1.3'};
        }
        sh = smoothstep(0.0, 1.0, res);
        sh = mix(sh, 1.0, smoothstep(uShadowFar * 0.75, uShadowFar, dc));
      }
      vShadow = sh;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uSunDir, uSunCol, uLit, uShade, uMid;
    uniform float uFogDen, uRippleOn, uROn, uTime, uSunUp;
    uniform sampler2D uRipple, uRDepth, uPDepth;
    uniform mat4 uRMat, uPMat;
    varying vec3 vWorld;
    varying float vShadow;
    ${TERRAIN_GLSL}
    ${SKY_GLSL}
    const vec2 PD[12] = vec2[12](vec2(-0.326,-0.406), vec2(-0.840,-0.074), vec2(-0.696,0.457), vec2(-0.203,0.621),
      vec2(0.962,-0.195), vec2(0.473,-0.480), vec2(0.519,0.767), vec2(0.185,-0.893), vec2(0.507,0.064),
      vec2(0.896,0.412), vec2(-0.322,-0.933), vec2(-0.792,-0.598));
    float shadowMap(sampler2D tex, mat4 M, vec3 wp, float radius, float bias){
      vec4 sc = M * vec4(wp, 1.0);
      vec3 c = sc.xyz / sc.w * 0.5 + 0.5;
      if (c.x <= 0.0 || c.x >= 1.0 || c.y <= 0.0 || c.y >= 1.0 || c.z >= 1.0) return 1.0;
      float s = 0.0;
      for (int i = 0; i < 12; i++) {
        float d = texture2D(tex, c.xy + PD[i] * radius).r;
        s += (c.z - bias > d) ? 0.0 : 1.0;
      }
      s /= 12.0;
      vec2 e = min(c.xy, 1.0 - c.xy);
      return mix(1.0, s, smoothstep(0.0, 0.06, min(e.x, e.y)));
    }
    float riderShadow(vec3 wp){
      if (uROn < 0.5) return 1.0;
      return min(shadowMap(uRDepth, uRMat, wp, 1.6 / 2048.0, 0.0015), shadowMap(uPDepth, uPMat, wp, 1.4 / 2048.0, 0.0010));
    }
    void main(){
      vec3 V = cameraPosition - vWorld; float dist = length(V); V /= dist;
      vec3 T = terrainHDl(vWorld.xz, 1.0 - smoothstep(120.0, 520.0, dist));
      vec3 N = normalize(vec3(-T.y, 1.0, -T.z));
      float slope = length(T.yz);
      float NdL = dot(N, uSunDir);
      float sh = vShadow * riderShadow(vWorld);
      float direct = smoothstep(-0.035, 0.30, NdL) * sh;
      // wind ripples (fal texture used as a height map): a light-dependent band layered on the dune shading
      float rip = uRippleOn * (1.0 - smoothstep(0.5, 0.95, slope)) * (1.0 - smoothstep(14.0, 190.0, dist));
      if (rip > 0.002) {
        vec2 ruv = vec2(vWorld.x * 0.1 + 0.22 * sin(vWorld.z * 0.031), vWorld.z * 0.19 + 0.3 * sin(vWorld.x * 0.023));
        float e = 0.0035;
        float h0 = texture2D(uRipple, ruv).r;
        float hx = texture2D(uRipple, ruv + vec2(e, 0.0)).r;
        float hz = texture2D(uRipple, ruv + vec2(0.0, e)).r;
        vec2 g = vec2(hx - h0, hz - h0) / e;
        vec3 N1 = normalize(N + vec3(-g.x * 0.1, 0.0, -g.y * 0.19) * 0.032);
        float dl = dot(N1, uSunDir) - NdL;
        float near = smoothstep(3.0, 16.0, dist);       // softer right under the camera
        direct = clamp(direct + clamp(dl * 1.7, -0.2, 0.26) * rip * mix(0.2, 1.0, sh) * uSunUp * mix(0.55, 1.0, near), 0.0, 1.0);
      }
      float facing = clamp(NdL, 0.0, 1.0);
      vec3 lit = uLit * (0.80 + 0.55 * facing);
      vec3 col = mix(uShade * (0.92 + 0.22 * clamp(N.y, 0.0, 1.0)), lit, direct);
      float band = direct * (1.0 - smoothstep(0.02, 0.32, NdL));
      col = mix(col, uMid, band * 0.38);
      // back-lit sheen when looking toward the low sun
      float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 5.0);
      float toward = pow(clamp(dot(-V, uSunDir), 0.0, 1.0), 3.0);
      col += uSunCol * fres * toward * 0.45 * direct * (1.0 - smoothstep(250.0, 900.0, dist));
      // aerial haze, coloured by the sky in that direction
      vec3 hz = hazeColor(-V);
      float f = 1.0 - exp(-pow(dist * uFogDen, 1.35));
      f = max(f, smoothstep(2200.0, 2850.0, dist));
      col = mix(col, hz, f);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const terrainMesh = new THREE.Mesh(TERR.geo, terrainMat);
terrainMesh.frustumCulled = false;
scene.add(terrainMesh);

/* shared fog injection for standard materials: same sky-coloured haze as the terrain */
function patchMaterial(mat, opts = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uSky: U.uSky, uSkyDusk: U.uSkyDusk, uDusk: U.uDusk, uSkyP: U.uSkyP, uFogDen: U.uFogDen,
      uSunDir: U.uSunDir, uSunCol: U.uSunCol, uSunVis: opts.sunVis || { value: 1 }, uRim: { value: opts.rim || 0 },
      uRimPow: { value: opts.rimPow || 2.5 }, uSat: { value: opts.sat || 1 }, uLift: { value: opts.lift || 1 },
      uMapLodMax: { value: opts.mapLodMax ?? 99 },
      uFill: opts.fill || { value: new THREE.Color(0, 0, 0) } });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vec4 wpp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wpp = instanceMatrix * wpp;
        #endif
        vWPos = (modelMatrix * wpp).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        uniform float uFogDen; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uSunVis; uniform float uRim; uniform vec3 uFill;
        uniform float uRimPow; uniform float uSat; uniform float uLift; uniform float uMapLodMax;
        ${SKY_GLSL}`)
      .replace('#include <map_fragment>', `
        #ifdef USE_MAP
          vec4 sampledDiffuseColor;
          if (uMapLodMax < 15.0) {
            // the Meshy atlas is packed edge to edge: coarse mips bleed white seams into the hoodie, so cap the mip level
            vec2 tsz = vec2(textureSize(map, 0));
            vec2 ddx = dFdx(vMapUv * tsz), ddy = dFdy(vMapUv * tsz);
            float lod = 0.5 * log2(max(max(dot(ddx, ddx), dot(ddy, ddy)), 1e-8));
            sampledDiffuseColor = textureLod(map, vMapUv, clamp(lod, 0.0, uMapLodMax));
          } else {
            sampledDiffuseColor = texture2D(map, vMapUv);
          }
          diffuseColor *= sampledDiffuseColor;
        #endif
        // optional albedo grade (identity for everything but the rider and board)
        diffuseColor.rgb = pow(max(diffuseColor.rgb, vec3(0.0)), vec3(uLift));
        diffuseColor.rgb = max(mix(vec3(dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722))), diffuseColor.rgb, uSat), 0.0);`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        reflectedLight.directDiffuse *= uSunVis; reflectedLight.directSpecular *= uSunVis;`)
      .replace('#include <opaque_fragment>', `
        {
          vec3 Vw = normalize(cameraPosition - vWPos);
          vec3 Nw = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
          float rimF = pow(1.0 - clamp(dot(Nw, Vw), 0.0, 1.0), uRimPow) * pow(clamp(dot(-Vw, uSunDir) * 0.5 + 0.5, 0.0, 1.0), 2.0);
          outgoingLight += uSunCol * rimF * uRim * uSunVis;
          outgoingLight += diffuseColor.rgb * uFill * (0.6 + 0.4 * Nw.y + 0.5 * max(Nw.y, 0.0) * max(Nw.y, 0.0));
          float dd = length(cameraPosition - vWPos);
          float ff = 1.0 - exp(-pow(dd * uFogDen, 1.35));
          outgoingLight = mix(outgoingLight, hazeColor(vWPos - cameraPosition), ff);
        }
        #include <opaque_fragment>`);
  };
  mat.customProgramCacheKey = () => 'dune-' + (opts.rim ? 'r' : 'n');
  return mat;
}

function setupRider(gltf) {
  const model = gltf.scene;

  if (P.grabTime > 0.35) names.push('GRAB');

  const isTrick = names.length > 0;

    if (bonus > 0) GAME.daylight = Math.min(DAY_MAX, GAME.daylight + bonus);
    if (isTrick) popup(names.join(' + ') + (GAME.mult > 1 ? '  x' + GAME.mult : ''), 'big');
    if (perfect && P.airTime > 0.5) popup('PERFECT LANDING', 'gold');

const AUDIO = { ctx: null, buf: {}, master: null, loops: {}, muted: false, ready: false };
const AUDIO_FILES = { music: 'assets/audio/music.mp3', wind: 'assets/audio/wind.mp3', carve: 'assets/audio/carve.mp3',
  jump: 'assets/audio/jump.mp3', land: 'assets/audio/land.mp3', crash: 'assets/audio/crash.mp3', chime: 'assets/audio/chime.mp3', trick: 'assets/audio/trick.mp3' };
async function initAudio() {

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.ctx = ctx;
    AUDIO.master = ctx.createGain(); AUDIO.master.gain.value = 0.9; AUDIO.master.connect(ctx.destination);
    await Promise.all(Object.entries(AUDIO_FILES).map(async ([k, url]) => {
      try { const r = await fetch(url); if (!r.ok) return; const ab = await r.arrayBuffer(); AUDIO.buf[k] = await ctx.decodeAudioData(ab); } catch (e) { /* optional */ }

      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(g); g.connect(AUDIO.master); src.start();

/* -------------------------------------------------------------- camera */
const CAM = { yaw: 0, pos: new THREE.Vector3(), look: new THREE.Vector3(), off: new THREE.Vector3(), ry: 0, fov: 56, init: false, orbit: 0 };

function updateCamera(dt, t) {

    const ox = o.x - tx, oz = o.z - tz;

    const u = clamp((ox * sx + oz * sz) / sl2, 0, 1);
    if (u <= 0.02 || u >= 0.98) continue;
    const ex = tx + sx * u - o.x, ez = tz + sz * u - o.z;

    const ct = 1.7 - P.crashT;
    const k = 1 - smoothstep(0.9, 1.5, ct);
    _ea.set(ct * P.crashSpinX * k, -P.heading + ct * P.crashSpinZ * 0.4 * k, Math.sin(ct * 7) * 0.5 * k, 'YXZ');
    target = _qa.setFromEuler(_ea);
  }
  if (GAME.snapBoard) { P.boardQ.copy(target); GAME.snapBoard = false; }
  P.boardQ.slerp(target, 1 - Math.exp(-dt * (P.grounded ? 16 : 22)));
  boardGroup.quaternion.copy(P.boardQ);
  riderGroup.rotation.y = P.stance > 0 ? -Math.PI / 2 : Math.PI / 2;
  // pose weights
  const charge = P.charging ? 0.35 + 0.65 * P.charge : 0;
  const tuckT = P.grounded && P.crashT <= 0 ? Math.max(input.tuck ? 1 : 0, charge) : 0;
  P.tuckW = damp(P.tuckW, tuckT, 10, dt);
  P.airW = damp(P.airW, !P.grounded ? 1 : 0, 9, dt);
  P.grabW = damp(P.grabW, !P.grounded && input.jumpHeld && P.airTime > 0.12 ? 1 : 0, 9, dt);
  P.crashW = damp(P.crashW, P.crashT > 0.25 ? 1 : 0, 10, dt);
  P.standW = damp(P.standW, GAME.state === 'title' || (GAME.state === 'over' && P.speed < 2.5) ? 1 : 0, 3, dt);
  const w = { tuck: P.tuckW, air: P.airW * (1 - P.grabW), grab: P.grabW, crash: P.crashW, stand: P.standW };
  const lean = P.grounded ? -P.lean * P.stance : 0;
  applyPose(w, t, lean);
  anchorFeet();
  // sun visibility for the rider (dune shadows)
  const sv = terrainShadow(P.x, P.y + 1.0, P.z, sunDir);
  P.sunVis = damp(P.sunVis, sv, 8, dt);
  riderSunVis.value = 0.18 + 0.82 * P.sunVis;
}

/* -------------------------------------------------------------- effects */
let emitAcc = 0;
function updateEffects(dt) {
  const fx = Math.sin(P.heading), fz = -Math.cos(P.heading);
  const sp = P.grounded ? P.speed : 0;
  if (P.grounded && sp > 4) {
    // the video's rooster tail: a dense rope of orange puffs that starts small at the tail and billows out behind
    const rate = (26 + sp * 3.0) * (1 + Math.abs(input.steer) * 1.3 + (input.tuck ? 0.4 : 0)) * (P.crashT > 0 ? 1.4 : 1);
    emitAcc += rate * dt;
    const tailX = P.x - fx * 0.55, tailZ = P.z - fz * 0.55;
    const rx = Math.cos(P.heading), rz = Math.sin(P.heading);
    const side = input.steer;
    while (emitAcc > 1) {
      emitAcc -= 1;
      const lat = (Math.random() - 0.5) * 0.4 - side * 0.35;
      const up = 0.35 + Math.random() * 1.1 + Math.abs(side) * 1.3;
      const back = -sp * (0.06 + Math.random() * 0.14);
      emit(tailX + rx * lat, P.y + 0.1, tailZ + rz * lat,
        fx * back - rx * side * (1.5 + Math.random() * 2.5) + (Math.random() - 0.5) * 0.9,
        up, fz * back - rz * side * (1.5 + Math.random() * 2.5) + (Math.random() - 0.5) * 0.9,
        0.24 + Math.random() * 0.2, 0.85 + Math.random() * 0.9 + sp * 0.03, 0.9 + Math.random() * 0.9, 0.5 + Math.min(0.2, sp * 0.006), P.sunVis);
    }
    trailPush(P.x, P.z, Math.cos(P.heading), Math.sin(P.heading), false);
  } else emitAcc = 0;
  // fine sand grains whipping past at high speed
  if (sp > 22 && Math.random() < dt * (sp - 20) * 1.2) {
    const a = Math.random() * TAU, r = 1.5 + Math.random() * 4;
    emit(P.x + Math.cos(a) * r + fx * 6, P.y + 0.3 + Math.random() * 2.2, P.z + Math.sin(a) * r + fz * 6,
      -fx * sp * 0.9, 0.2, -fz * sp * 0.9, 0.08, 0.16, 0.45, 0.5, P.sunVis, 1);
  }
  // golden motes drifting inside the next sun gates (readable from far away)
  for (const a of ARCH.list) {
    if (a.passed || a.missed) continue;
    const d = a.s - (-P.z);
    if (d < -5 || d > 700) continue;
    if (Math.random() < dt * 14) {
      const u = (Math.random() - 0.5) * ARCH.width * 0.22;
      const cs = Math.cos(a.g.rotation.y), sn = Math.sin(a.g.rotation.y);
      emit(a.x + u * cs, a.y + 2 + Math.random() * ARCH.height * 0.7, a.z - u * sn,
        (Math.random() - 0.5) * 0.6, 0.4 + Math.random() * 0.8, (Math.random() - 0.5) * 0.6, 0.5, 1.6, 2.5, 0.9, 1, 2);
    }
  }
  // wind-blown sand off nearby crests
  if (Math.random() < dt * 9) {
    const a = (Math.random() - 0.5) * 1.6 + CAM.yaw;
    const r = 28 + Math.random() * 70;
    const x = P.x + Math.sin(a) * r, z = P.z - Math.cos(a) * r;
    const y = terrain(x, z);
    if (Math.hypot(TGX, TGZ) > 0.25) {
      const sv = terrainShadow(x, y + 0.5, z, sunDir);
      for (let k = 0; k < 3; k++) emit(x + Math.random(), y + 0.2, z + Math.random(), WIND_X * 2, 0.3 + Math.random() * 0.5, WIND_Z * 2,
        0.45, 1.1 + Math.random() * 1.1, 2.0 + Math.random(), 0.07, sv, 1);
    }
  }
}

/* ------------------------------------------------------------- daylight */
const _cA = new THREE.Color(), _cB = new THREE.Color();
function updateDaylight(dt) {
  if (GAME.state === 'ride') GAME.daylight = Math.max(0, GAME.daylight - dt);
  let day = GAME.daylight;
  let elevDeg = lerp(0.4, 16.5, clamp(day / DAY_MAX, 0, 1));
  if (GAME.state === 'sunset' || GAME.state === 'over') { GAME.sunsetT += dt; elevDeg = 0.4 - Math.min(GAME.sunsetT, 6) * 0.9; }
  setSun(elevDeg * D2R);
  U.uSunUp.value = smoothstep(-0.5, 7, elevDeg);
  const dusk = GAME.state === 'over' || GAME.state === 'sunset' ? clamp(0.85 + GAME.sunsetT * 0.05, 0, 1) : 1 - smoothstep(0, 30, day);
  U.uDusk.value = damp(U.uDusk.value, dusk * 0.9, 1.5, dt);
  const k = U.uDusk.value;
  const lowSun = clamp(elevDeg / 16, -0.2, 1);
  U.uLit.value.copy(PAL.day.lit).lerp(PAL.dusk.lit, k);
  U.uShade.value.copy(PAL.day.shade).lerp(PAL.dusk.shade, k);
  U.uMid.value.copy(PAL.day.mid).lerp(PAL.dusk.mid, k);
  U.uSunCol.value.copy(PAL.day.sun).lerp(PAL.dusk.sun, k);
  pMat.uniforms.uDust.value.copy(PAL.day.dust).lerp(PAL.dusk.dust, k);
  sunLight.color.copy(PAL.day.light).lerp(PAL.dusk.light, k);
  sunLight.intensity = lerp(1.0, 2.5, smoothstep(-0.05, 0.5, lowSun));
  hemi.color.copy(PAL.day.hemiSky).lerp(PAL.dusk.hemiSky, k);
  hemi.groundColor.copy(PAL.day.hemiGround).lerp(PAL.dusk.hemiGround, k);
  hemi.intensity = lerp(1.05, 0.75, k);
  gradePass.uniforms.uDusk.value = k;
  sunLight.position.copy(boardGroup.position).addScaledVector(sunDir, 60);
  sunLight.target.position.copy(boardGroup.position);
  if (sunSprite) {
    sunSprite.position.copy(camera.position).addScaledVector(sunDir, 3200);
    GAME.sunFade = damp(GAME.sunFade, GAME.state === 'title' ? 0 : 1, 2.5, dt);   // the logo carries its own sun on the title screen
    sunSprite.material.opacity = smoothstep(-2.5, 0.2, elevDeg) * GAME.sunFade;
    sunSprite.material.color.setRGB(lerp(0.82, 1.4, k), lerp(0.74, 0.66, k), lerp(0.58, 0.4, k));   // creamy disc like the video, orange at dusk
  }
}

/* -------------------------------------------------------------- arches */
function updateArches() {
  if (!ARCH.proto) return;
  const s = -P.z;
  while (ARCH.nextS < s + 1300) spawnArch();
  for (const a of ARCH.list) {
    if (a.passed || a.missed) continue;
    if (P.lastS < a.s && s >= a.s) {
      const local = (P.x - a.x) * Math.cos(a.g.rotation.y) - (P.z - a.z) * Math.sin(a.g.rotation.y);
      if (Math.abs(local) < ARCH.width * 0.125 && P.y < a.y + ARCH.height * 0.8) {
        a.passed = true;
        STATS.gates++;
        if (GAME.state === 'ride') {
          GAME.daylight = Math.min(DAY_MAX, GAME.daylight + 14);
          GAME.score += 500 * GAME.mult; GAME.arches++;
          popup('SUN GATE  +14s', 'gold');
          popup('+' + (500 * GAME.mult).toLocaleString('en-US'), 'small');
          GAME.flash = 0.35;
        }
        archFX(a);
        sfx('chime', 1.1);
      } else a.missed = true;
    }
  }
  for (let i = ARCH.list.length - 1; i >= 0; i--) {
    const a = ARCH.list[i];
    if (a.s < s - 350) { scene.remove(a.g); ARCH.list.splice(i, 1); }
  }
  // arches are colliders at their legs
  P.lastS = s;
}
function archCollide() {
  if (P.crashT > 0 || P.invuln > 0) return;
  for (const a of ARCH.list) {
    const dz = P.z - a.z;
    if (Math.abs(dz) > 5) continue;
    const local = (P.x - a.x) * Math.cos(a.g.rotation.y) - dz * Math.sin(a.g.rotation.y);
    const leg = Math.abs(local);
    if (leg > ARCH.width * 0.14 && leg < ARCH.width * 0.47 && P.y < a.y + ARCH.height * 0.55) { crash('wipeout', 'arch'); P.speed = 3; return; }
  }
}

/* ------------------------------------------------------------ game flow */
function startRide() {
  resetPlayer();
  GAME.state = 'ride'; GAME.score = 0; shownScore = 0; GAME.mult = 1; GAME.daylight = DAY_START; GAME.dist = 0; GAME.tricks = 0; GAME.arches = 0;
  GAME.sunsetT = 0; GAME.startS = -P.z;
  HUD.title.classList.add('hidden'); HUD.over.classList.add('hidden');
  showHUD(true);
  P.speed = 11;
  CAM.init = false;
  popsEl.innerHTML = '';
  popup('RIDE!', 'gold');
  clearTimeout(GAME.hintT);
  GAME.hintT = setTimeout(() => { if (GAME.state === 'ride' && !GAME.arches) popup('Ride through SUN GATES to keep the sun up', 'small'); }, 2600);
}
function toTitle() {
  resetPlayer();
  P.speed = 0;
  GAME.state = 'title'; GAME.daylight = DAY_START; GAME.sunsetT = 0;
  HUD.title.classList.remove('hidden'); HUD.over.classList.add('hidden');
  showHUD(false);
}
function onStartKey() {
  if (GAME.state === 'title') { startRide(); return true; }
  if (GAME.state === 'over' && GAME.overT > 1.2) { startRide(); return true; }
  return false;
}
function endRun() {
  GAME.state = 'sunset'; GAME.sunsetT = 0;
  popup('THE SUN HAS SET', 'gold');
}
function showOver() {
  GAME.state = 'over'; GAME.overT = 0;
  const newBest = GAME.score > GAME.best;
  if (newBest) { GAME.best = GAME.score; try { localStorage.setItem('duneSurferBest', String(GAME.best)); } catch (e) { /* private mode */ } }
  el('finalScore').textContent = GAME.score.toLocaleString('en-US');
  el('finalSub').textContent = `${Math.floor(GAME.dist).toLocaleString('en-US')} m · ${GAME.tricks} tricks · ${GAME.arches} sun gates · ${newBest ? 'new best!' : 'best ' + GAME.best.toLocaleString('en-US')}`;
  HUD.over.classList.remove('hidden');
  showHUD(false);
  HUD.marker.classList.add('hidden');
}

/* ------------------------------------------------------------ shadows */
function renderDepth(cam, rt, center, back) {
  cam.position.copy(center).addScaledVector(sunDir, back);
  cam.lookAt(center);
  cam.updateMatrixWorld();
  cam.updateProjectionMatrix();
  renderer.setRenderTarget(rt);
  renderer.clear(true, true, false);
  renderer.render(scene, cam);
}
const _sc = new THREE.Vector3();
function renderShadowPass() {
  const prevOverride = scene.overrideMaterial;
  scene.overrideMaterial = depthMat;
  const oldBg = renderer.getClearColor(new THREE.Color()); const oldA = renderer.getClearAlpha();
  renderer.setClearColor(0xffffff, 1);
  const c = boardGroup.position;
  renderDepth(shadowCam, shadowRT, _sc.copy(c).setY(c.y + 0.8), 120);
  U.uRMat.value.multiplyMatrices(shadowCam.projectionMatrix, shadowCam.matrixWorldInverse);
  // wide map centred a little ahead of the surfer (where the camera looks)
  _sc.set(c.x + Math.sin(CAM.yaw) * 22, c.y, c.z - Math.cos(CAM.yaw) * 22);
  _sc.x = Math.round(_sc.x / 2) * 2; _sc.z = Math.round(_sc.z / 2) * 2;
  renderDepth(propShadowCam, propShadowRT, _sc, 200);
  U.uPMat.value.multiplyMatrices(propShadowCam.projectionMatrix, propShadowCam.matrixWorldInverse);
  renderer.setRenderTarget(null);
  renderer.setClearColor(oldBg, oldA);
  scene.overrideMaterial = prevOverride;
  U.uROn.value = 1;
}

/* --------------------------------------------------------------- loop */
let acc = 0;
const FPS = { n: 0, t0: performance.now(), fps: 0 };
window.__fps = FPS;
function frame() {
  FPS.n++; const nowMs = performance.now(); if (nowMs - FPS.t0 > 1000) { FPS.fps = FPS.n * 1000 / (nowMs - FPS.t0); FPS.n = 0; FPS.t0 = nowMs; }
  const dtRaw = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  U.uTime.value = t;
  gradePass.uniforms.uTime.value = t;
  if (GAME.state === 'title') {
    // hero shot: the surfer waits on the crest, facing the low sun
    input.steer = 0; input.tuck = false; input.jumpHeld = false;
    P.speed = 0; P.grounded = true; P.y = terrain(P.x, P.z);
    jumpReleasedEdge = false; jumpPressedEdge = false;
    updateRiderVisual(dtRaw, t);
    titleCamera(dtRaw, t);
    updateDaylight(dtRaw);
    const cx = Math.floor(camera.position.x / PROPS.CH), cz = Math.floor(camera.position.z / PROPS.CH);
    if (cx !== PROPS.lastCX || cz !== PROPS.lastCZ || PROPS.dirty) { rebuildProps(camera.position.x, camera.position.z); PROPS.lastCX = cx; PROPS.lastCZ = cz; PROPS.dirty = false; }
    updateEffects(dtRaw);
    updateParticles(dtRaw);
    updateTrail();
    updateSash(dtRaw, _vel.set(0, 0, 0));
    updateAudio(dtRaw);
  } else if (GAME.state === 'ride' || GAME.state === 'sunset' || GAME.state === 'over') {
    if (GAME.state === 'ride' && !DEMO) readInput(); else botInput();
    if (GAME.state === 'sunset' || GAME.state === 'over') { input.steer *= 0.3; input.tuck = false; input.jumpHeld = false; input.up = input.down = false; }
    // physics at fixed 120 Hz
    acc += dtRaw;
    const h = 1 / 120;
    let steps = 0;
    while (acc >= h && steps < 12) {
      stepPhysics(h);
      jumpReleasedEdge = false; jumpPressedEdge = false;
      acc -= h; steps++;
    }
    if (GAME.state === 'sunset' || GAME.state === 'over') { P.speed = Math.max(0, P.speed - dtRaw * 6); }
    if (GAME.state === 'ride' || GAME.state === 'sunset') GAME.dist = Math.max(GAME.dist, -P.z - GAME.startS);
    if (GAME.multT > 0) { GAME.multT -= dtRaw; if (GAME.multT <= 0) GAME.mult = 1; }
    if (GAME.state === 'ride' && GAME.daylight <= 0) endRun();
    if (GAME.state === 'sunset' && GAME.sunsetT > 2.6) showOver();
    if (GAME.state === 'over') GAME.overT += dtRaw;
    updateArches();
    archCollide();
    const cx = Math.floor(camera.position.x / PROPS.CH), cz = Math.floor(camera.position.z / PROPS.CH);
    if (cx !== PROPS.lastCX || cz !== PROPS.lastCZ || PROPS.dirty) { rebuildProps(camera.position.x, camera.position.z); PROPS.lastCX = cx; PROPS.lastCZ = cz; PROPS.dirty = false; }
    refreshPropShadows();
    updateRiderVisual(dtRaw, t);
    updateCamera(dtRaw, t);
    updateDaylight(dtRaw);
    updateEffects(dtRaw);
    updateParticles(dtRaw);
    updateTrail();
    _vel.set(P.grounded ? Math.sin(P.heading) * P.speed : P.vx, P.grounded ? 0 : P.vy, P.grounded ? -Math.cos(P.heading) * P.speed : P.vz);
    updateSash(dtRaw, _vel);
    updateHUD(dtRaw);
    updateAudio(dtRaw);
    GAME.shake = Math.max(0, GAME.shake - dtRaw * 2.2);
    GAME.flash = Math.max(0, GAME.flash - dtRaw * 1.5);
    gradePass.uniforms.uFlash.value = GAME.flash * 0.35;
  }
  // adaptive resolution: keep the frame rate up on modest GPUs
  if (FPS.fps > 0 && t > 4) {
    const pr = renderer.getPixelRatio();
    if (FPS.fps < 42 && pr > 0.75 && t - (GAME.prT || 0) > 3) { renderer.setPixelRatio(Math.max(0.75, pr - 0.25)); onResize(); GAME.prT = t; }
  }
  // terrain grid follows the camera (snapped to its own spacing)
  terrainMesh.position.set(Math.round(camera.position.x / TERR.snapX) * TERR.snapX, 0, Math.round(camera.position.z / TERR.snapZ) * TERR.snapZ);
  sky.position.copy(camera.position);
  renderShadowPass();
  composer.render();
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- resize */
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  bloom.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', onResize);

/* ----------------------------------------------------------- terrain test */
function terrainParityTest() {
  const N = 48;
  const rt = new THREE.WebGLRenderTarget(N, N, { type: THREE.FloatType, format: THREE.RGBAFormat });
  const mat = new THREE.ShaderMaterial({
    uniforms: { uO: { value: new THREE.Vector2(-1234.5, -5678.25) }, uS: { value: 13.37 } },
    vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: TERRAIN_GLSL + `
      uniform vec2 uO; uniform float uS;
      void main(){ vec2 ij = floor(gl_FragCoord.xy); vec2 xz = uO + ij * uS; vec3 t = terrainHD(xz); gl_FragColor = vec4(t, terrainHs(xz)); }`,
  });
  const sc = new THREE.Scene(); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
  const oc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  renderer.setRenderTarget(rt); renderer.render(sc, oc); renderer.setRenderTarget(null);
  const buf = new Float32Array(N * N * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, N, N, buf);
  let mh = 0, mg = 0, ms = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = -1234.5 + i * 13.37, z = -5678.25 + j * 13.37;
    const h = terrain(x, z), k = (j * N + i) * 4;
    mh = Math.max(mh, Math.abs(h - buf[k]));
    mg = Math.max(mg, Math.abs(TGX - buf[k + 1]), Math.abs(TGZ - buf[k + 2]));
    ms = Math.max(ms, Math.abs(terrainHs(x, z) - buf[k + 3]));
  }
  console.log('TERRAIN_PARITY maxHeightErr=' + mh.toExponential(2) + ' maxGradErr=' + mg.toExponential(2) + ' maxShadowFieldErr=' + ms.toExponential(2));
  window.__parity = { mh, mg, ms };
}

/* ------------------------------------------------------------------ boot */
async function boot() {
  if (matchMedia('(pointer: coarse)').matches) {          // phones / tablets
    el('startTxt').textContent = 'TAP TO RIDE';
    el('againTxt').textContent = 'TAP TO RIDE AGAIN';
  }
  if (TEST === 'terrain') { terrainParityTest(); }
  const [skyDay, skyFallback, skyDusk, sunTex, dustTex, ripImg, grassTex, rider, board, cactus, rocks, hoodoo, archG] = await Promise.all([
    loadTex('assets/sky_day.jpg'), loadTex('assets/sky_panorama.jpg'), loadTex('assets/sky_dusk.jpg'), loadTex('assets/sun.png'),
    loadTex('assets/dust_sheet.png').then((t) => t ? Object.assign(t, { isAtlas: true }) : loadTex('assets/dust.png')),
    loadTex('assets/sand_ripples.png', false), loadTex('assets/grass.png'),
    loadGLB('assets/rider_rigged.glb'), loadGLB('assets/board.glb'), loadGLB('assets/cactus.glb'), loadGLB('assets/rocks.glb'),
    loadGLB('assets/hoodoo.glb'), loadGLB('assets/arch.glb'),
  ]);
  const skyT = skyDay || skyFallback;
  for (const tx of [skyT, skyDusk]) if (tx) { tx.wrapS = THREE.ClampToEdgeWrapping; tx.anisotropy = 4; }
  U.uSky.value = skyT;
  U.uSkyDusk.value = skyDusk || skyT;
  if (!skyDay && skyFallback) { /* the fallback panorama has the sun painted in: keep the sun where it is drawn */ }
  if (sunTex) {
    sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false, color: new THREE.Color(0.82, 0.74, 0.58) }));
    sunSprite.scale.setScalar(2 * 3200 * Math.tan(18 * D2R));   // disc ~13 deg wide like the source video
    sunSprite.renderOrder = -5;
    scene.add(sunSprite);
  }
  if (dustTex) { pMat.uniforms.uTex.value = dustTex; pMat.uniforms.uAtlas.value = dustTex.isAtlas ? 1 : 0; }
  if (ripImg) {
    ripImg.wrapS = ripImg.wrapT = THREE.RepeatWrapping;
    ripImg.anisotropy = 8;
    U.uRipple.value = ripImg; U.uRippleOn.value = 1;
  }
  if (rider) setupRider(rider);
  if (board) setupBoard(board);
  initSash();
  PROPS.types.cactus = prepProp(cactus, 3.6, { rim: 0.7 });
  PROPS.types.rock = prepProp(rocks, 2.4, { sink: 0.12 });
  PROPS.types.hoodoo = prepProp(hoodoo, 42, { sink: 0.06 });
  if (grassTex) makeGrassType(grassTex);
  makeInstanced('cactus', 420); makeInstanced('rock', 300); makeInstanced('hoodoo', 40); makeInstanced('grass', 1600);
  if (archG) { ARCH.proto = prepProp(archG, ARCH.height, { sink: 0.03, stretchX: 1.4, rim: 0.4 }); if (ARCH.proto) ARCH.width = ARCH.proto.footprint[0]; }
  const logoFail = () => { el('logo').style.display = 'none'; el('logoText').style.display = 'block'; };
  el('logo').onerror = logoFail;
  if (el('logo').complete && el('logo').naturalWidth === 0) logoFail();
  document.getElementById('loading').classList.add('hidden');
  if (DEMO) { startRide(); GAME.daylight = +(params.get('day') || 60); }
  else toTitle();
  GAME.snapBoard = true;
  frame();
}
boot();
</script>
