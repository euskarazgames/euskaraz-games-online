<script type="module">
window.EGPad.getState=()=>{try{return state}catch{return "loading"}};

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';

// =====================================================================
//  Utilities
// =====================================================================
const V2 = THREE.Vector2, V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const wrapPi = (a) => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const dampAngle = (a, b, k, dt) => a + wrapPi(b - a) * (1 - Math.exp(-k * dt));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(17);
const R = (a = 0, b = 1) => a + rng() * (b - a);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const elastic = (t) => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;

// =====================================================================
//  Renderer / scene / post
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
const FOG = new THREE.Color(0xc6e4f7);
scene.background = FOG.clone();
scene.fog = new THREE.Fog(FOG, 62, 175);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 420);
window.EGMobileView(renderer,camera);

camera.position.set(0, 16, 28);

const hemi = new THREE.HemisphereLight(0xe8f5ff, 0x9cc4e4, 0.78);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.4);
const SUN_DIR = new V3(0.42, 1.0, -0.30).normalize();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 1, far: 150 });
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// soft ambient occlusion: the clay-toy contact shading of the source video
const gtao = new GTAOPass(scene, camera, Math.round(innerWidth * DPR / 2), Math.round(innerHeight * DPR / 2));
gtao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1.4, thickness: 1.5, scale: 1.0, samples: 12, distanceFallOff: 1.0 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
gtao.blendIntensity = 0.7;
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new V2(innerWidth, innerHeight), 0.18, 0.55, 0.92);
composer.addPass(bloom);
const tiltH = new ShaderPass(HorizontalTiltShiftShader);
const tiltV = new ShaderPass(VerticalTiltShiftShader);
composer.addPass(tiltH); composer.addPass(tiltV);
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.55 }, uSat: { value: 1.14 }, uLift: { value: new THREE.Color(0.006, 0.01, 0.02) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig; uniform float uSat; uniform vec3 uLift; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); float l = dot(c.rgb, vec3(0.2126,0.7152,0.0722));
      c.rgb = mix(vec3(l), c.rgb, uSat) + uLift; vec2 d = vUv - 0.5; d.x *= 1.25; c.rgb *= 1.0 - dot(d,d) * uVig; gl_FragColor = c; }`
};
const grade = new ShaderPass(GradeShader);
composer.addPass(grade);
composer.addPass(new OutputPass());
function setTilt() {
  tiltH.uniforms.h.value = 2.6 / innerWidth; tiltV.uniforms.v.value = 2.6 / innerHeight;
  tiltH.uniforms.r.value = 0.5; tiltV.uniforms.r.value = 0.5;
}
setTilt();

function onResize() {
  camera.fov = innerWidth < innerHeight ? 54 : 40; // portrait screens get a wider view
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  gtao.setSize(Math.round(innerWidth * DPR / 2), Math.round(innerHeight * DPR / 2));
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  setTilt();
  if (fx) fx.mat.uniforms.uScale.value = innerHeight * DPR / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', onResize);

// =====================================================================
//  Asset loading (every visual asset below was generated with fal)
// =====================================================================
const MODEL_FILES = {
  shepherd: 'shepherd', crook: 'crook', sheep: 'sheep', cloud: 'cloud', pine: 'pine', treeY: 'tree_yellow',
  bush: 'bush', rock: 'rock', fence: 'fence', house: 'house', stump: 'stump', wheat: 'wheat', sprout: 'sprout',
  flowerY: 'flower_yellow', flowerW: 'flower_white', tuft: 'grass_tuft'
};
const TEX_FILES = {
  sky: ['tex/sky.jpg', true], streaks: ['tex/streaks.jpg', false], grass: ['tex/grass.jpg', true], soil: ['tex/soil.jpg', true],
  soilWet: ['tex/soil_wet.jpg', true], fx: ['fx/fx_atlas.jpg', true], rainbow: ['fx/rainbow.jpg', true], pano: ['tex/sky_pano.jpg', true]
};
const SOUND_FILES = {
  music: 'music.mp3', wind: 'wind.mp3', rain: 'rain.mp3', baa: 'baa.mp3', poof: 'poof.mp3', swish: 'swish.mp3',
  chime: 'chime.mp3', thunder: 'thunder.mp3', pop: 'pop.mp3', whistle: 'whistle.mp3', step: 'step.mp3'
};
const M = {}, T = {}, S = {};
const gltfLoader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
let AC = null, master = null, musicGain = null, sfxGain = null;
try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); musicGain = AC.createGain(); musicGain.gain.value = 0.42; musicGain.connect(master); sfxGain = AC.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(master); } catch (e) { AC = null; }

async function loadAll() {
  const jobs = [];
  for (const [k, f] of Object.entries(MODEL_FILES)) jobs.push(gltfLoader.loadAsync(`assets/models/${f}.glb`).then(g => { M[k] = g; }).catch(e => console.warn('model missing', f)));
  for (const [k, [f, srgb]] of Object.entries(TEX_FILES)) jobs.push(texLoader.loadAsync(`assets/${f}`).then(t => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    // ground textures tile with mirroring so their edges always match
    t.wrapS = t.wrapT = ['sky', 'streaks', 'grass', 'soil', 'soilWet'].includes(k) ? THREE.MirroredRepeatWrapping : THREE.ClampToEdgeWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); T[k] = t;
  }).catch(e => console.warn('texture missing', f)));
  if (AC) for (const [k, f] of Object.entries(SOUND_FILES)) jobs.push(fetch(`assets/audio/${f}`).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(b => AC.decodeAudioData(b)).then(buf => { S[k] = buf; }).catch(e => console.warn('sound missing', f)));
  let done = 0; const bar = document.querySelector('#bar > i');
  jobs.forEach(p => p.finally(() => { done++; bar.style.width = (100 * done / jobs.length).toFixed(0) + '%'; }));
  await Promise.all(jobs);
}

// ----- model preparation: bake transforms, normalize, fix materials -----
function prepModel(gltf, { height, width, length, rotY = 0, rough = 0.82, color = null, emissive = null, emissiveIntensity = 0 } = {}) {
  if (!gltf) return null;
  const root = gltf.scene; root.updateMatrixWorld(true);
  const parts = [];
  root.traverse(o => { if (o.isMesh) { const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld); parts.push({ geometry: g, material: o.material }); } });
  const rot = new THREE.Matrix4().makeRotationY(rotY);
  const box = new THREE.Box3();
  parts.forEach(p => { p.geometry.applyMatrix4(rot); p.geometry.computeBoundingBox(); box.union(p.geometry.boundingBox); });
  const size = box.getSize(new V3());
  const s = height ? height / size.y : width ? width / Math.max(size.x, size.z) : length ? length / size.z : 1;
  const m = new THREE.Matrix4().makeScale(s, s, s).multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
  parts.forEach(p => {
    p.geometry.applyMatrix4(m); p.geometry.computeBoundingBox(); p.geometry.computeBoundingSphere();
    const mat = p.material = p.material.clone();
    mat.metalness = 0; mat.roughness = rough; mat.envMapIntensity = 0.55;
    if (color) mat.color.copy(color);
    if (emissive) { mat.emissive = new THREE.Color(emissive); mat.emissiveIntensity = emissiveIntensity; }
    if (mat.map) mat.map.anisotropy = 8;
  });
  return { parts, size: size.multiplyScalar(s) };
}
function instantiate(model, { cast = true, receive = true } = {}) {
  const g = new THREE.Group();
  if (!model) return g;
  model.parts.forEach(p => { const mesh = new THREE.Mesh(p.geometry, p.material); mesh.castShadow = cast; mesh.receiveShadow = receive; g.add(mesh); });
  return g;
}
function makeInstanced(model, mats, { cast = true, receive = true, material = null, colors = false } = {}) {
  const g = new THREE.Group(); g.userData.meshes = [];
  if (!model || !mats.length) return g;
  model.parts.forEach(p => {
    const im = new THREE.InstancedMesh(p.geometry, material || p.material, mats.length);
    mats.forEach((m, i) => im.setMatrixAt(i, m));
    if (colors) { const c = new THREE.Color(1, 1, 1); for (let i = 0; i < mats.length; i++) im.setColorAt(i, c); }
    im.castShadow = cast; im.receiveShadow = receive; im.frustumCulled = true; im.computeBoundingSphere(); im.boundingSphere.radius += 1.5;
    g.add(im); g.userData.meshes.push(im);
  });
  return g;
}

// wind sway for flora (instanced or not)
const U = { time: { value: 0 }, player: { value: new THREE.Vector3(0, -100, 0) } };
function addSway(mat, amount, stiffY = 1) {
  const m = mat.clone();
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time; sh.uniforms.uSway = { value: amount }; sh.uniforms.uPlayer = U.player;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uSway; uniform vec3 uPlayer;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 swOrigin = vec4(0.0, 0.0, 0.0, 1.0);
        #ifdef USE_INSTANCING
          swOrigin = instanceMatrix * swOrigin;
        #endif
        swOrigin = modelMatrix * swOrigin;
        float swH = max(transformed.y, 0.0) * ${stiffY.toFixed(3)};
        float swP = uTime * 1.6 + swOrigin.x * 0.31 + swOrigin.z * 0.23;
        transformed.x += (sin(swP) + 0.35 * sin(swP * 2.3 + 1.7)) * swH * swH * uSway;
        transformed.z += cos(swP * 0.83) * swH * swH * uSway * 0.6;
        // bend away from the shepherd when he walks through
        vec2 swD = swOrigin.xz - uPlayer.xz; float swL = length(swD);
        float swPush = smoothstep(1.25, 0.15, swL) * swH;
        if (swPush > 0.0) {
          mat3 swM = mat3(modelMatrix);
          #ifdef USE_INSTANCING
            swM = swM * mat3(instanceMatrix);
          #endif
          vec3 swW = vec3(swD.x, 0.0, swD.y) / max(swL, 0.001) * swPush * 0.55;
          transformed += transpose(swM) * swW / max(dot(swM[0], swM[0]), 1e-4);
          transformed.y -= swPush * 0.18 * swH;
        }`);
  };
  return m;
}

// =====================================================================
//  Procedural skinning (the GLBs are static meshes: we rig them in code)
// =====================================================================
function buildRig(model, boneDefs, weightFn) {
  const p = model.parts[0];
  const geo = p.geometry.clone();
  const pos = geo.attributes.position, n = pos.count;
  const si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) {
    const ws = weightFn(pos.getX(i), pos.getY(i), pos.getZ(i)).filter(w => w[1] > 1e-4).sort((a, b) => b[1] - a[1]).slice(0, 4);
    let tot = 0; ws.forEach(w => tot += w[1]);
    ws.forEach((w, k) => { si[i * 4 + k] = w[0]; sw[i * 4 + k] = w[1] / tot; });
  }
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
  return { geometry: geo, material: p.material, boneDefs };
}
function instantiateRig(rig) {
  const bones = rig.boneDefs.map(d => { const b = new THREE.Bone(); b.name = d.name; return b; });
  rig.boneDefs.forEach((d, i) => {
    if (d.parent >= 0) { const pp = rig.boneDefs[d.parent].pos; bones[d.parent].add(bones[i]); bones[i].position.set(d.pos[0] - pp[0], d.pos[1] - pp[1], d.pos[2] - pp[2]); }
    else bones[i].position.set(...d.pos);
  });
  const mesh = new THREE.SkinnedMesh(rig.geometry, rig.material);
  mesh.add(bones[0]); mesh.updateMatrixWorld(true);
  mesh.bind(new THREE.Skeleton(bones));
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  const b = {}; bones.forEach(x => b[x.name] = x);
  rig.boneDefs.forEach((d, i) => { bones[i].userData.rest = bones[i].position.clone(); });
  return { mesh, b };
}

// =====================================================================
//  World definition
// =====================================================================
const WORLD = { minX: -48, maxX: 48, minZ: -94, maxZ: 22 };
const ISLAND_H = 0.34, BEVEL = 0.24;
const FIELD_DEFS = [
  { x: 15, z: -17, w: 11, d: 10, need: 2 },
  { x: -16, z: -36, w: 12, d: 11, need: 3 },
  { x: 22, z: -48, w: 13, d: 12, need: 5 },
  { x: 0, z: -70, w: 17, d: 15, need: 8 },

      uniforms: { map: { value: T.rainbow }, opacity: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform sampler2D map; uniform float opacity; varying vec2 vUv; void main(){ vec3 c = texture2D(map, vUv).rgb; float a = clamp(max(c.r, max(c.g, c.b)) * 1.25, 0.0, 1.0); gl_FragColor = vec4(c * 1.15 * opacity, a * opacity); }',
      transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor, side: THREE.DoubleSide
    });
    mat.opacity = 0;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.5625), mat); const w = Math.max(f.w, f.d) * 1.25;
    m.scale.set(w, w, 1); m.position.set(f.x, w * 0.5625 * 0.5 - 0.6, f.z - f.d * 0.15); m.renderOrder = 4; scene.add(m);
    f.rainbow = { m, t: 0 };
  }
  // the rain cloud bursts back into its sheep (+ one new lamb, a gift of the watered field)
  const n = h.n + (game.done < fields.length ? 1 : 0);
  herd.splice(herd.indexOf(h), 1); h.dispose();
  fx.burst(h.pos.x, h.y, h.pos.z, 30, { cell: 1, s0: 1.0, s1: 2.4, sp0: 2, sp1: 6, up0: -1, up1: 2, l0: 0.8, l1: 1.4, r: 2, a0: 0.9 });
  sfx('poof', { vol: 1.5, rate: 0.8 });
  for (let i = 0; i < n; i++) {
    const lamb = i >= h.n;
    const a = i / n * Math.PI * 2 + rand(-0.2, 0.2);
    const tx = f.x + Math.cos(a) * (f.w / 2 + 1.6), tz = f.z + Math.sin(a) * (f.d / 2 + 1.6);
    const s = new Herdling(1, h.pos.x, h.pos.z, { scale: lamb ? 0.68 : 1, lock: 1.5 });
    s.state = 'hop'; s.hopT = -i * 0.08; s.hopDur = 1.0 + rand(0, 0.25); s.hopFrom = new V3(h.pos.x + rand(-1, 1), h.y, h.pos.z + rand(-1, 1)); s.hopTo = new V3(tx, 0, tz);
    s.agit = 0; herd.push(s);
  }
  updateHud();
  if (game.done >= fields.length) setTimeout(win, 2600);
}

// =====================================================================
//  HUD, input, camera
// =====================================================================
const game = { done: 0 };
function buildHud() { ui.hud.innerHTML = fields.map((f, i) => `<div class="f" id="hf${i}"></div>`).join(''); }
function updateHud() { fields.forEach((f, i) => { const el = document.getElementById('hf' + i); if (el) el.classList.toggle('done', f.done); }); }

addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (state === 'title' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter')) startGame();
  else if (state === 'win' && e.code === 'Enter') location.reload();
  if (e.code === 'KeyM' && master) master.gain.value = master.gain.value > 0 ? 0 : 1;
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
canvas.addEventListener('pointerdown', () => { if (state === 'title') startGame(); else if (state === 'win') location.reload(); });
ui.title.addEventListener('pointerdown', () => { if (state === 'title') startGame(); });

// touch: virtual stick (left half) + buttons
const touch = { x: 0, z: 0, id: null, ox: 0, oy: 0, swing: false, whistle: false };
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) {
  const tl = document.getElementById('touch'), stick = document.getElementById('stick');
  tl.style.display = 'block';
  document.querySelector('#title .start').textContent = "Tap the screen to play"; document.querySelector('#title .keys').style.display = 'none';
  document.querySelector('#win .start').textContent = "Tap the screen to play again";
  tl.addEventListener('pointerdown', () => { if (state === 'win') location.reload(); });
  tl.addEventListener('pointerdown', (e) => {
    if (state === 'title') { startGame(); return; }
    if (e.target.id === 'tSwing') { touch.swing = true; return; }
    if (e.target.id === 'tWhistle') { touch.whistle = true; return; }
    if (e.clientX < innerWidth * 0.6 && touch.id === null) { touch.id = e.pointerId; touch.ox = e.clientX; touch.oy = e.clientY; stick.style.display = 'block'; stick.style.left = (e.clientX - 55) + 'px'; stick.style.top = (e.clientY - 55) + 'px'; }
  });
  tl.addEventListener('pointermove', (e) => { if (e.pointerId !== touch.id) return; let dx = e.clientX - touch.ox, dy = e.clientY - touch.oy; const l = Math.hypot(dx, dy), mx = 50; if (l > mx) { dx *= mx / l; dy *= mx / l; } touch.x = dx / mx; touch.z = dy / mx; stick.firstChild.style.transform = `translate(${dx}px,${dy}px)`; });
  const end = (e) => { if (e.pointerId !== touch.id) return; touch.id = null; touch.x = touch.z = 0; stick.style.display = 'none'; };
  tl.addEventListener('pointerup', end); tl.addEventListener('pointercancel', end);
}
function readInput() {
  let x = 0, z = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  x += touch.x; z += touch.z;
  // gamepad
  const gp = navigator.getGamepads ? [...window.EGPad.gamepads()].find(g => g) : null;
  let gSwing = false, gWhistle = false, gRun = false;
  if (gp) { const ax = gp.axes[0] || 0, az = gp.axes[1] || 0; if (Math.hypot(ax, az) > 0.18) { x += ax; z += az; } gSwing = gp.buttons[0]?.pressed; gWhistle = gp.buttons[2]?.pressed || gp.buttons[3]?.pressed; gRun = gp.buttons[7]?.pressed || gp.buttons[5]?.pressed; }
  x=window.EGPad.axis(x);z=window.EGPad.axis(z,"y");
  const l = Math.hypot(x, z); if (l > 1) { x /= l; z /= l; }
  const swing = keys.has('Space') || touch.swing || gSwing, whistle = keys.has('KeyE') || touch.whistle || gWhistle;
  touch.swing = touch.whistle = false;
  return { x, z, run: keys.has('ShiftLeft') || keys.has('ShiftRight') || gRun, swing, whistle };
}

let camShake = 0, camFocus = null;
const cam = { target: new V3(0, 0, 0), pos: new V3(0, 14, 24), zoom: 1 };
function updateCamera(dt) {
  if (state === 'title' || state === 'loading') {
    const a = gameTime * 0.06;
    const tgt = new V3(Math.sin(a * 0.7) * 3, 0.5, -10 + Math.sin(a) * 6);
    cam.target.lerp(tgt, 1 - Math.exp(-2 * dt));
    const p = new V3(tgt.x + Math.sin(a) * 30, 15 + Math.sin(a * 1.3) * 2, tgt.z + Math.cos(a) * 30);
    cam.pos.lerp(p, 1 - Math.exp(-1.5 * dt));
  } else if (state === 'win') {
    const a = (gameTime - endT) * 0.08;
    const tgt = new V3(5, 0, -40);
    cam.target.lerp(tgt, 1 - Math.exp(-0.8 * dt));
    cam.pos.lerp(new V3(tgt.x + Math.sin(a) * 52, 44, tgt.z + Math.cos(a) * 52), 1 - Math.exp(-0.6 * dt));
  } else {
    const spd = Math.hypot(player.vel.x, player.vel.z);
    let zoom = 0.8 + 0.14 * sstep(4, 8, spd), tgt = new V3(player.pos.x + player.vel.x * 0.32, player.y + 0.5, player.pos.z + player.vel.z * 0.32 - 1.0);
    for (const h of herd) if (h.n >= 3 && h.state === 'free' && h.pos.distanceTo(player.pos) < 12) zoom = Math.max(zoom, 0.98 + h.n * 0.02);
    if (rains.length) { const f = rains[0].field; if (Math.hypot(f.x - player.pos.x, f.z - player.pos.z) < 26) { tgt.lerp(new V3(f.x, 1.6, f.z + 0.6), 0.75); zoom = 1.0 + Math.max(f.w, f.d) * 0.022; } } // frame the whole field with the cloud above it
    else if (camFocus && camFocus.t > 0) { camFocus.t -= dt; if (Math.hypot(camFocus.x - player.pos.x, camFocus.z - player.pos.z) < 26) { tgt.lerp(new V3(camFocus.x, 1.5, camFocus.z - 2), 0.45 * Math.min(1, camFocus.t)); zoom = Math.max(zoom, 1 + 0.3 * Math.min(1, camFocus.t)); } }
    cam.zoom = damp(cam.zoom, zoom, 1.5, dt);
    cam.target.lerp(tgt, 1 - Math.exp(-4.5 * dt));
    const off = new V3(0, 9.8, 11.6).multiplyScalar(cam.zoom); // ~40 deg high third-person view, as in the video
    cam.pos.lerp(cam.target.clone().add(off), 1 - Math.exp(-5 * dt));
  }
  camera.position.copy(cam.pos);
  if (camShake > 0) { camShake = Math.max(0, camShake - dt * 0.8); camera.position.x += (Math.random() - 0.5) * camShake; camera.position.y += (Math.random() - 0.5) * camShake; }
  camera.lookAt(cam.target);
  // sun + shadow camera follow the view
  const focus = state === 'win' ? new V3(5, 0, -40) : cam.target;
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(SUN_DIR, 70);
  const sc = sun.shadow.camera, ext = state === 'win' ? 72 : state === 'title' ? 44 : 36;
  if (sc.right !== ext) { sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.updateProjectionMatrix(); }
}

function updateDecoClouds(dt) {
  const pScreen = player ? player.obj.position.clone().setY(player.y + 0.8).project(camera) : new V3(0, 0, 0);
  for (const c of decoClouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > WORLD.maxX + 25) c.position.x = WORLD.minX - 25;
    c.position.y += Math.sin(gameTime * 0.4 + c.userData.speed * 10) * 0.002;
    // fade a cloud when it hides the shepherd or the action
    let want = 1;
    if (state === 'play') {
      const sp = c.position.clone().project(camera), dist = c.position.distanceTo(camera.position);
      const pd = player.obj.position.distanceTo(camera.position);
      const ds = Math.hypot((sp.x - pScreen.x) * camera.aspect, sp.y - pScreen.y);
      if (dist < pd && ds < 0.55 + c.scale.x * 0.05) want = 0.12;
      if (dist < 17) want = Math.min(want, 0.15 + 0.85 * sstep(9, 17, dist));
    }
    c.userData.fade = damp(c.userData.fade, want, 4, dt);
    c.userData.mat.opacity = c.userData.fade; c.userData.mat.depthWrite = c.userData.fade > 0.95;
    c.visible = c.userData.fade > 0.02;
  }
}

function updateArrow() {
  if (state !== 'play') { ui.arrow.classList.add('hidden'); return; }
  // point to the nearest dry field when it is off-screen
  let best = null, bd = 1e9;
  for (const f of fields) if (!f.done) { const d = Math.hypot(f.x - player.pos.x, f.z - player.pos.z); if (d < bd) { bd = d; best = f; } }
  if (!best) { ui.arrow.classList.add('hidden'); return; }
  const p = new V3(best.x, 0.5, best.z).project(camera);
  const on = Math.abs(p.x) < 0.92 && Math.abs(p.y) < 0.9 && p.z < 1;
  if (on) { ui.arrow.classList.add('hidden'); return; }
  let x = p.x, y = p.y; if (p.z > 1) { x = -x; y = -y; }
  const l = Math.max(Math.abs(x) / 0.88, Math.abs(y) / 0.84); x /= l; y /= l;
  ui.arrow.style.left = ((x + 1) / 2 * innerWidth) + 'px'; ui.arrow.style.top = ((1 - y) / 2 * innerHeight) + 'px';
  ui.arrow.style.transform = `rotate(${Math.atan2(-y, x) * 180 / Math.PI - 90}deg)`;
  ui.arrow.classList.remove('hidden');
}

// =====================================================================
//  Game flow
// =====================================================================
function spawnFlock() {
  // the flock starts spread over the home meadow: it has to be gathered first
  const start = [[-6.0, -0.5], [6.4, -2.6], [-2.8, 7.6], [5.2, 6.4], [0.6, -4.6]];
  for (const [x, z] of start) herd.push(new Herdling(1, x, z));
}
function startGame() {
  if (state !== 'title') return;
  state = 'play'; startT = gameTime; keys.clear();
  ui.title.classList.add('hidden'); ui.hud.classList.remove('hidden'); ui.hint.classList.remove('hidden');
  setTimeout(() => ui.hint.classList.add('hidden'), 11000);
  startAudio(); canvas.focus();
  sfx('pop', { vol: 0.5 });
}
function win() {
  state = 'win'; endT = gameTime;
  const s = Math.round(gameTime - startT); document.getElementById('wintime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  ui.hud.classList.add('hidden'); ui.win.classList.remove('hidden'); ui.arrow.classList.add('hidden');
  sfx('chime', { vol: 0.9, rate: 1.12 });
  for (const f of fields) if (f.rainbow) { f.rainbow.t = 0; f.rainbow.hold = true; }
}

// =====================================================================
//  Main loop
// =====================================================================
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  try { step(); } catch (e) { if (!window.__err) { window.__err = String(e && e.stack || e); console.error(e); } }
}
function step() {
  const dt = Math.min(clock.getDelta(), 1 / 25);
  gameTime += dt; U.time.value = gameTime;
  if (player) U.player.value.set(player.pos.x, player.y, player.pos.z);
  if (state === 'play' || state === 'win' || state === 'title') {
    const input = state === 'play' ? readInput() : { x: 0, z: 0, run: false, swing: false, whistle: false };
    if (player) player.update(dt, input);
    for (const h of [...herd]) if (herd.includes(h)) h.update(dt);
    herdPairs(dt);
    // fields: who hovers over them, rain triggers
    for (const f of fields) {
      let best = 0, bestH = null;
      if (!f.done && !f.raining) {
        for (const h of herd) if (h.state === 'free' && f.inside(h.pos.x, h.pos.z, 0.6)) { if (h.n > best) { best = h.n; bestH = h; } }
        if (bestH && best >= f.need && bestH.n > 1) startRain(f, bestH);
        else if (bestH && best >= f.need && f.need === 1) startRain(f, bestH);
      }
      // a cloud that is too small only drizzles: the puffs above the field show how many sheep are missing
      if (!f.done && !f.raining && bestH && bestH.n >= 2 && best < f.need && Math.random() < dt * 22) {
        const a = Math.random() * 6.28, rr = Math.sqrt(Math.random()) * bestH.r * 0.8, x = bestH.pos.x + Math.cos(a) * rr, z = bestH.pos.z + Math.sin(a) * rr;
        fx.spawn({ x, y: bestH.y - bestH.r * 0.3, z, vy: -9, life: 1.5, s0: 0.3, s1: 0.3, a0: 0.7, a1: 0.7, cell: 0, floor: groundAt(x, z), tint: [0.85, 0.92, 1] });
      }
      if (f.done && Math.random() < dt * 0.9) {
        const seed = Math.random() * 10, tint = [[1, 0.78, 0.86], [1, 0.95, 0.6], [1, 1, 1], [0.8, 0.9, 1]][Math.floor(Math.random() * 4)];
        fx.spawn({ x: f.x + rand(-f.w / 2, f.w / 2), y: f.isl.h + 0.6, z: f.z + rand(-f.d / 2, f.d / 2), life: 7, s0: 0.38, s1: 0.38, a0: 1, a1: 0, cell: 3, tint,
          fn: (p) => { p.vx = Math.cos(p.t * 1.3 + seed) * 1.1; p.vz = Math.sin(p.t * 1.1 + seed * 2) * 1.1; p.vy = Math.sin(p.t * 3 + seed) * 0.5 + (p.y < 0.9 ? 0.6 : 0); const fl = 0.55 + 0.45 * Math.abs(Math.sin(p.t * 19 + seed)); p.s0 = p.s1 = 0.38 * fl; p.rot = Math.sin(p.t * 2 + seed) * 0.5; } });
      }
      const lit = f.raining ? f.need : f.done ? f.need : Math.min(f.need, best);
      if (lit > f.litShown) { f.pulse = 1; sfx('pop', { vol: 0.25, rate: 1.2 + lit * 0.08 }); }
      f.litShown = lit; f.pulse = Math.max(0, f.pulse - dt * 2.5);
      f.update(dt);
      if (f.rainbow) {
        const rb = f.rainbow; rb.t += dt;
        const a = rb.hold ? sstep(0, 2, rb.t) * 0.9 : sstep(0, 1.5, rb.t) * (1 - sstep(5, 8, rb.t)) * 0.9;
        rb.m.material.uniforms.opacity.value = a; rb.m.quaternion.copy(camera.quaternion);
        if (!rb.hold && rb.t > 8) { scene.remove(rb.m); f.rainbow = null; }
      }
    }
    updateRains(dt);
    // idle bleats
    if (state === 'play' && Math.random() < dt * 0.25) { const s = herd.filter(h => h.n === 1 && h.state === 'free'); if (s.length) { const h = s[Math.floor(Math.random() * s.length)]; if (h.pos.distanceTo(player.pos) < 16) h.baa(1); } }
  }
  if (indicators) indicators.update(gameTime, dt);
  fx && fx.update(dt);
  updateDecoClouds(dt);
  updateCamera(dt);
  updateArrow();
  composer.render();
}

// =====================================================================
//  Boot
// =====================================================================
async function boot() {
  await loadAll();
  // shared models
  sheepModel = prepModel(M.sheep, { length: SHEEP_LEN, rough: 0.95, color: new THREE.Color(1.22, 1.2, 1.2), emissive: 0xe6eef8, emissiveIntensity: 0.16 });
  cloudModel = prepModel(M.cloud, { width: 2, rough: 1.0, color: new THREE.Color(1.28, 1.28, 1.3), emissive: 0xdce9f6, emissiveIntensity: 0.3 });
  if (cloudModel) cloudModel.parts.forEach(p => { p.geometry.translate(0, -cloudModel.size.y / 2, 0); });
  const shep = prepModel(M.shepherd, { height: SHEP_H, rotY: -Math.PI / 2, rough: 0.8, color: new THREE.Color(0.8, 0.74, 0.72) }); // chestnut hair like the video
  crookModel = prepModel(M.crook, { height: 2.05, rough: 0.7, color: new THREE.Color(0.45, 0.42, 0.36) }); // darker walnut brown, as in the video
  wheatModel = prepModel(M.wheat, { height: 0.95, rough: 0.88, color: new THREE.Color(1.42, 1.26, 0.98) });
  if (wheatModel) wheatMat = addSway(wheatModel.parts[0].material, 0.075, 1.0);
  sproutModel = prepModel(M.sprout, { height: 1, rough: 0.8 });
  // the flower GLBs face +X: turn them so their corolla faces +Z (toward the camera before instance tilt)
  flowerModels = [prepModel(M.flowerY, { height: 1, rough: 0.8, rotY: -Math.PI / 2, color: new THREE.Color(1.15, 1.12, 1.05) }), prepModel(M.flowerW, { height: 1, rough: 0.8, rotY: -Math.PI / 2, color: new THREE.Color(1.15, 1.15, 1.15) })];
  fx = new FX(T.fx || null);
  if (sheepModel) sheepRig = rigSheep(sheepModel);
  if (shep) shepRig = rigShepherd(shep);
  buildWorld();
  indicators = new Indicators();
  buildHud();
  player = new Player();
  spawnFlock();
  onResize();
  ui.loading.classList.add('hidden');
  ui.title.classList.remove('hidden');
  state = 'title';
  // read-only handle used by the automated play-test harness (_tools/cdp.mjs, _tools/bot.js)
  window.__cs = { herd, fields, player, rains, keys, get t() { return gameTime; }, get state() { return state; }, startGame, mergeHerdlings, startRain, scene, camera, renderer };
}
boot().catch(e => { console.error(e); });
requestAnimationFrame(frame);
</script>
