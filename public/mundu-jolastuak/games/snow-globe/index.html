    uniforms: { uGlow: { value: 0 }, uTime: { value: 0 }, uStrength: { value: strength } },
    vertexShader: `varying vec3 vWN; varying vec3 vWP;
      void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWP = wp.xyz; vWN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `uniform float uGlow; uniform float uTime; uniform float uStrength; varying vec3 vWN; varying vec3 vWP;
      void main(){
        vec3 N = normalize(vWN); vec3 V = normalize(cameraPosition - vWP);
        ${side === THREE.BackSide ? 'N = -N;' : ''}
        float ndv = clamp(abs(dot(N, V)), 0.0, 1.0);
        float fres = pow(1.0 - ndv, 2.6);
        vec3 L = normalize(vec3(0.55, 0.75, 0.6));
        float spec = pow(max(dot(reflect(-L, N), V), 0.0), 60.0);
        vec3 H2 = normalize(vec3(-0.55, 0.62, 0.55));
        float d2 = dot(N, H2);
        float band = smoothstep(0.80, 0.90, d2) * (1.0 - smoothstep(0.93, 0.985, d2));
        float low = smoothstep(0.70, 0.95, dot(N, normalize(vec3(0.2, -0.85, 0.5))));
        vec3 col = mix(vec3(0.80, 0.90, 0.97), vec3(1.0), clamp(fres * 0.7 + spec * 0.6 + band, 0.0, 1.0));
        float a = (0.035 + fres * 0.62 + spec * 0.45 + band * 0.55 + low * 0.10) * uStrength;
        col += vec3(1.0, 0.86, 0.6) * uGlow * (0.35 + fres * 1.2);

    transparent: true, depthWrite: false, side, fog: false,
  });
}

  const geo = new THREE.SphereGeometry(r, 64, 40);
  const back = new THREE.Mesh(geo, glassMaterial(THREE.BackSide, strength * 0.55)); back.renderOrder = 70;
  const front = new THREE.Mesh(geo, glassMaterial(THREE.FrontSide, strength)); front.renderOrder = 90;

// ============================================================ snow (world), points shader
function makeSnow(count, box, sizeMin, sizeMax, speed, zMin, zMax) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), seed = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = Math.random() * box.x; pos[i * 3 + 1] = Math.random() * box.y; pos[i * 3 + 2] = zMin + Math.random() * (zMax - zMin);
    seed[i * 4] = Math.random(); seed[i * 4 + 1] = Math.random(); seed[i * 4 + 2] = Math.random(); seed[i * 4 + 3] = Math.floor(Math.random() * 9);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seed, 4));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uCenter: { value: new THREE.Vector2() }, uBox: { value: new THREE.Vector2(box.x, box.y) },
      uAtlas: { value: A.flakes }, uScale: { value: 400 }, uSize: { value: new THREE.Vector2(sizeMin, sizeMax) }, uSpeed: { value: speed },
      uFall: { value: 1 } },
    vertexShader: `attribute vec4 seed; uniform float uTime; uniform vec2 uCenter; uniform vec2 uBox; uniform float uScale; uniform vec2 uSize; uniform float uSpeed; uniform float uFall;
      varying float vTile; varying float vA; varying float vRot;
      void main(){
        vec3 p = position;
        float sp = uSpeed * mix(0.55, 1.35, seed.x);
        p.y -= uTime * sp * uFall;
        p.x += uTime * 0.22 + sin(uTime * (0.4 + seed.y * 0.5) + seed.z * 31.0) * (0.4 + seed.x * 0.8);
        vec2 c = uCenter - uBox * 0.5;
        p.xy = c + mod(p.xy - c, uBox);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        float depth = -mv.z;
        gl_PointSize = mix(uSize.x, uSize.y, seed.z) * uScale / depth;
        vec2 e = abs((p.xy - uCenter) / (uBox * 0.5));
        vA = smoothstep(3.0, 9.0, depth) * (1.0 - smoothstep(0.82, 1.0, max(e.x, e.y))) * mix(0.55, 1.0, seed.y);
        vTile = seed.w; vRot = seed.x * 6.283 + uTime * (seed.y - 0.5) * 1.5;
      }`,
    fragmentShader: `uniform sampler2D uAtlas; varying float vTile; varying float vA; varying float vRot;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float s = sin(vRot), c = cos(vRot);
        uv = vec2(c * uv.x - s * uv.y, s * uv.x + c * uv.y) * 1.25 + 0.5;
        if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) discard;
        vec2 cell = vec2(mod(vTile, 3.0), 2.0 - floor(vTile / 3.0));
        vec4 t = texture2D(uAtlas, (cell + uv) / 3.0);
        float a = t.a * vA;
        if (a < 0.01) discard;
        gl_FragColor = vec4(t.rgb * vec3(1.0, 0.99, 0.97), a);
      }`,
    transparent: true, depthWrite: false, fog: false,
  });

  pts.frustumCulled = false;
  pts.renderOrder = 80;
  scene.add(pts);
  return pts;
}

// snow inside a glass sphere (globe)
function makeGlobeSnow(r, count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), seed = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() * 2 - 1) * r; pos[i * 3 + 1] = Math.random() * 2 * r; pos[i * 3 + 2] = (Math.random() * 2 - 1) * r;
    seed[i * 4] = Math.random(); seed[i * 4 + 1] = Math.random(); seed[i * 4 + 2] = Math.random(); seed[i * 4 + 3] = Math.floor(Math.random() * 9);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seed, 4));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uR: { value: r }, uAtlas: { value: A.flakes }, uScale: { value: 400 }, uSwirl: { value: 0 }, uGlow: { value: 0 }, uUp: { value: new THREE.Vector2(0, 1) } },
    vertexShader: `attribute vec4 seed; uniform float uTime; uniform float uR; uniform float uScale; uniform float uSwirl; uniform vec2 uUp;
      varying float vTile; varying float vA; varying float vRot;
      void main(){
        vec3 p = position;
        float sp = mix(0.25, 0.6, seed.x) * (1.0 + uSwirl * 2.0);
        // fall along world -y (uUp is the world up seen in the globe's local frame)

        vec2 dir = uUp;
        vec2 side = vec2(dir.y, -dir.x);
        float sw = sin(uTime * (0.5 + seed.y) + seed.z * 20.0) * 0.25 * uR * (0.4 + uSwirl);
        vec3 q = vec3(side * (p.x + sw) + dir * fall, p.z);
        float ang = uSwirl * uTime * (0.6 + seed.x);
        q.xz = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * q.xz;
        float l = length(q);
        vA = 1.0 - smoothstep(uR * 0.80, uR * 0.92, l);
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = mix(0.10, 0.22, seed.z) * uScale / -mv.z;
        vTile = seed.w; vRot = seed.x * 6.283 + uTime * (seed.y - 0.5);
      }`,
    fragmentShader: `uniform sampler2D uAtlas; uniform float uGlow; varying float vTile; varying float vA; varying float vRot;
      void main(){
        vec2 uv = gl_PointCoord - 0.5; float s = sin(vRot), c = cos(vRot);
        uv = vec2(c * uv.x - s * uv.y, s * uv.x + c * uv.y) * 1.25 + 0.5;
        if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) discard;
        vec2 cell = vec2(mod(vTile, 3.0), 2.0 - floor(vTile / 3.0));
        vec4 t = texture2D(uAtlas, (cell + uv) / 3.0);
        float a = t.a * vA;
        if (a < 0.01) discard;
        gl_FragColor = vec4(t.rgb + vec3(1.0, 0.85, 0.55) * uGlow, a);
      }`,
    transparent: true, depthWrite: false, fog: false,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false; pts.renderOrder = 85;
  return pts;
}

const puffs = [];

let puffI = 0;
function puff(x, y, n = 6, spread = 1, a = 0.7, upx = 0, upy = 1) {
  for (let i = 0; i < n; i++) {
    const p = puffs[puffI++ % puffs.length];
    const ang = Math.random() * Math.PI * 2;
    p.m.position.set(x + Math.cos(ang) * 0.25 * spread, y + Math.sin(ang) * 0.12 * spread, 0.3 + Math.random() * 0.4);
    const sp = (0.6 + Math.random() * 1.2) * spread;
    p.vx = Math.cos(ang) * sp + upx * 0.6; p.vy = Math.abs(Math.sin(ang)) * sp * 0.4 + upy * 0.6;
    p.life = 0; p.max = 0.7 + Math.random() * 0.6; p.s0 = (0.35 + Math.random() * 0.3) * spread; p.s1 = p.s0 * (2.2 + Math.random());

function updatePuffs(dt) {

    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;

let sparkI = 0;
function sparkle(x, y, n = 14, speed = 3, size = 0.35, life = 1.0, z = 0.6) {

function updateSparks(dt) {

const AUDIO = { ctx: null, master: null, music: null, musicGain: null, buf: {}, started: false };
const SOUNDS = { music: 'assets/music.mp3', flip: 'assets/sfx_flip.mp3', land: 'assets/sfx_land.mp3', chime: 'assets/sfx_chime.mp3', glass: 'assets/sfx_glass.mp3', step: 'assets/sfx_step.mp3', end: 'assets/sfx_end.mp3' };

  for (const [k, url] of Object.entries(SOUNDS)) {
    fetch(url).then((r) => (r.ok ? r.arrayBuffer() : Promise.reject())).then((b) => AUDIO.ctx.decodeAudioData(b)).then((buf) => {
      AUDIO.buf[k] = buf; if (k === 'music') startMusic();

}

  const g = AUDIO.ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.55, AUDIO.ctx.currentTime + 4);

  const g = c.createGain(); g.gain.value = vol; s.connect(g).connect(AUDIO.master); s.start();

  x: 0, y: 0, vx: 0, vy: 0, ux: 0, uy: 1, mode: 'air', vt: 0, facing: 1, gnx: 0, gny: 1,
  glass: null, glassCd: 0, coyote: 0, airT: 0, flipping: false, flipBuf: 0, jumpBuf: 0,
  safe: null, safeT: 0, stepT: 0, frozen: false,

function updateFlakes(dt, t) {

  const B = LEVEL.bounds;
  let tx, ty, dist = CAM_D;
  if (cam.override) { tx = cam.override.x; ty = cam.override.y; dist = cam.override.d; }
  else {
    const upx = Math.cos(girl.visAng), upy = Math.sin(girl.visAng);
    const rx = upy, ry = -upx;
    cam.look = damp(cam.look, pl.facing * 2.0, 1.4, dt);
    tx = pl.x + upx * 1.8 + rx * cam.look; ty = pl.y + upy * 1.8 + ry * cam.look;
    ty = lerp(ty, 6.6, Q.has('camd') ? 0 : 0.6); // lean toward the middle of the valley so the other side of the world stays in view
    tx = clamp(tx, B.camMinX, B.camMaxX); ty = clamp(ty, B.camMinY, B.camMaxY);
    if (pl.flipping) dist = CAM_D + 5;
  }
  cam.facingSign = pl.facing * (Math.sin(cam.ang) >= 0 ? 1 : -1);
  const k = cam.override ? (cam.override.k || 1.6) : 3.2;
  cam.x = damp(cam.x, tx, k, dt); cam.y = damp(cam.y, ty, k, dt);
  cam.dist = damp(cam.dist, dist, 1.2, dt);
  if (roll.active) {
    roll.t += dt;
    const e = ease2(clamp(roll.t / roll.dur, 0, 1));
    cam.ang = roll.from + roll.delta * e;
    if (roll.t >= roll.dur) roll.active = false;
  } else if (!cam.lockAng) {
    const target = cam.angTarget !== undefined ? cam.angTarget : Math.atan2(pl.uy, pl.ux);
    cam.ang += wrapA(target - cam.ang) * (1 - Math.exp(-dt * (pl.mode === 'glass' ? 4.5 : 2.6)));
  }
  const upx = Math.cos(cam.ang), upy = Math.sin(cam.ang), crx = upy, cry = -upx;
  const vel = state === 'play' ? (pl.mode === 'air' ? (pl.vx * crx + pl.vy * cry) : pl.vt * Math.sign(crx * pl.uy - cry * pl.ux || 1)) : 0;

  const sx = Math.sin(t * 0.19) * 0.7 + cam.lean, sy = 1.1 + Math.sin(t * 0.13) * 0.45;
  camera.position.set(cam.x + crx * sx + upx * sy, cam.y + cry * sx + upy * sy, cam.dist);
  camera.up.set(upx, upy, 0);
  camera.lookAt(cam.x, cam.y, 0);
  // parallax layers follow the camera a little (sky most)

}

// ============================================================ post-processing
let composer = null, gradePass = null;
function setupPost() {
  if (NOPOST) return;
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.5, 0.93);
  composer.addPass(bloom);
  gradePass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, tPaper: { value: A.paper }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uTime: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform sampler2D tPaper; uniform vec2 uRes; uniform float uTime; varying vec2 vUv;
      void main(){
        vec4 c = texture2D(tDiffuse, vUv);
        vec2 p = vUv - 0.5; p.x *= uRes.x / uRes.y;
        float vig = smoothstep(1.15, 0.28, length(p * vec2(0.85, 1.0)));
        c.rgb *= mix(0.70, 1.0, vig);
        vec3 paper = texture2D(tPaper, vUv * uRes / 900.0).rgb;
        c.rgb *= mix(vec3(1.0), paper / 0.86, 0.22);
        float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
        c.rgb += vec3(-0.012, -0.002, 0.018) * (1.0 - l) + vec3(0.02, 0.012, -0.012) * l;
        gl_FragColor = c;
      }`,
  });
  composer.addPass(gradePass);
  composer.addPass(new OutputPass());
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setSize(innerWidth, innerHeight); gradePass.uniforms.uRes.value.set(innerWidth, innerHeight); }
});

// ============================================================ UI helpers
let hintTimer = 0;
const hintSeen = { flip: false };
function showHint(text, ms = 5000) {
  const h = $('hint'); h.textContent = text; h.style.opacity = 1;
  clearTimeout(hintTimer); hintTimer = setTimeout(() => (h.style.opacity = 0), ms);
}
function fadeTo(v) { $('fade').style.opacity = v; }
const edge = $('edge');
const tmpV = new THREE.Vector3();
function updateEdge(t) {
  let target = null;
  if (state === 'play') {
    if (collected === FLAKES.length) target = globe.center;
    else {
      let best = 1e9;
      for (const f of FLAKES) if (!f.got) { const d = Math.hypot(f.x - pl.x, f.y - pl.y); if (d < best) { best = d; target = f.g.position; } }
    }
  }
  if (!target) { edge.style.opacity = 0; return; }
  tmpV.copy(target).project(camera);
  const onScreen = Math.abs(tmpV.x) < 0.92 && Math.abs(tmpV.y) < 0.9 && tmpV.z < 1;
  if (onScreen) { edge.style.opacity = 0; return; }
  let x = tmpV.x, y = tmpV.y; if (tmpV.z > 1) { x = -x; y = -y; }
  const m = Math.max(Math.abs(x) / 0.94, Math.abs(y) / 0.9); x /= m; y /= m;
  edge.style.left = ((x * 0.5 + 0.5) * innerWidth) + 'px';
  edge.style.top = ((-y * 0.5 + 0.5) * innerHeight) + 'px';
  edge.style.opacity = 0.72 + Math.sin(t * 3) * 0.22;
}

// ============================================================ game states
let state = 'load', stateT = 0, playT = 0;
const intro = { started: false };
function placeGirlInGlobe() {
  pl.x = globe.inside.x; pl.y = globe.inside.y; pl.ux = 0; pl.uy = 1; pl.vx = pl.vy = 0; pl.vt = 0;
  pl.mode = 'ground'; pl.flipping = false; pl.facing = -1; pl.frozen = true;
  girl.visAng = Math.PI / 2; girl.root.position.z = 0;
  cam.ang = Math.PI / 2;
}
function titleFraming() {
  cam.override = { x: globe.center.x - 2.2, y: globe.center.y + 1.3, d: 32, k: 2 };
}
function toTitle() {
  state = 'title'; stateT = 0; stateWall = performance.now();
  for (const f of FLAKES) { f.got = false; f.home = false; f.g.visible = true; f.core.scale.set(1.1, 1.1, 1); f.halo.scale.set(2.6, 2.6, 1); }
  collected = 0;
  for (const im of $('hud').children) im.classList.remove('got');
  placeGirlInGlobe(); girl.forceAnim = 'idle'; girl.faceCam = true;
  titleFraming();
  const o = cam.override; cam.x = o.x; cam.y = o.y; cam.dist = o.d; cam.ang = Math.PI / 2; cam.angTarget = Math.PI / 2;
  globe.glow = 0;
  $('title').style.opacity = 1; $('hud').style.opacity = 0; $('end').style.opacity = 0;
  globe.snow.material.uniforms.uSwirl.value = 0;
  globe.snow.material.uniforms.uGlow.value = 0;
}
function startIntro() {
  state = 'intro'; stateT = 0; intro.left = false; intro.puffed = false;
  flips = 0; playT = 0; pl.safe = null; pl.glass = null; pl.glassCd = 0;
  $('title').style.opacity = 0;
  cam.lockAng = true;
  roll.active = false;
}
function updateIntro(dt) {
  const t = stateT;
  // the whole world slowly turns upside down
  const k = ease2(clamp((t - 0.6) / 4.2, 0, 1));
  cam.ang = Math.PI / 2 + Math.PI * k;
  cam.override = { x: lerp(globe.center.x - 2.2, globe.center.x - 1, ease(clamp(t / 5, 0, 1))), y: lerp(globe.center.y + 1.3, globe.center.y + 5.0, ease(clamp(t / 5, 0, 1))), d: lerp(32, CAM_D, ease(clamp((t - 0.5) / 4.5, 0, 1))), k: 2.5 };
  globe.snow.material.uniforms.uSwirl.value = Math.sin(Math.PI * clamp(t / 5.5, 0, 1)) * 1.2;
  if (t > 1.2) girl.faceCam = false;
  // she slips out through the glass and falls toward the overhang, which is now the floor
  if (!intro.left && t > 2.9) {
    intro.left = true;
    girl.forceAnim = null;
    pl.frozen = false; pl.mode = 'air'; pl.ux = 0; pl.uy = -1; pl.flipping = true; pl.vx = -0.35; pl.vy = 1.2; pl.facing = 1;
    pl.glassCd = 99;
    girl.visAng = cam.ang; girl.followCam = true;
  }
  if (intro.left && !intro.puffed && pl.y > globe.center.y + globe.r - 0.4) {
    intro.puffed = true; puff(pl.x, pl.y + 0.6, 10, 1.3, 0.8, 0, 1); sparkle(pl.x, pl.y + 0.6, 10, 2.5, 0.3, 0.9); sfx('glass', 0.6, 1.1);
  }
  if (intro.left && pl.mode === 'ground') {
    girl.followCam = false;
    state = 'play'; stateT = 0; cam.override = null; cam.lockAng = false; cam.angTarget = undefined; pl.glassCd = 0;
    roll.active = true; roll.from = cam.ang; roll.delta = wrapA(-Math.PI / 2 - cam.ang); roll.t = 0; roll.dur = 0.9;
    $('hud').style.opacity = 1;
    setTimeout(() => { if (!hintSeen.flip) showHint('←  →  walk   ·   space  turns the world', 7000); }, 900);
  }
}
let ending = null;
function startEnding() {
  state = 'ending'; stateT = 0; pl.frozen = true;
  ending = { from: { x: pl.x, y: pl.y }, ang: cam.ang, angDelta: wrapA(Math.PI / 2 - cam.ang) };
  if (Math.abs(ending.angDelta) < 0.01) ending.angDelta = 0;
  girl.forceAnim = 'swim';
  sfx('end', 0.8, 1);
  $('hint').style.opacity = 0;
}
function updateEnding(dt) {
  const t = stateT;
  roll.active = false; cam.lockAng = true;
  cam.ang = ending.ang + ending.angDelta * ease2(clamp(t / 4.5, 0, 1));
  // flakes fly home into the globe
  FLAKES.forEach((f, i) => {
    if (!f.got || f.home) return;
    const delay = 0.3 + i * 0.22;
    if (t > delay) {
      const p = f.g.position; const k = 1 - Math.exp(-dt * 3.2);
      p.x += (globe.center.x - p.x) * k; p.y += (globe.center.y - p.y) * k;
      if (Math.hypot(p.x - globe.center.x, p.y - globe.center.y) < 0.4) { f.home = true; f.g.visible = false; sparkle(globe.center.x, globe.center.y, 10, 3, 0.35, 1.0, -0.4); sfx('chime', 0.4, 1.5 + i * 0.12); }
    }
  });
  // she floats back into her globe
  const k = ease2(clamp((t - 0.6) / 3.4, 0, 1));
  const cx = lerp(ending.from.x, globe.inside.x, k), cy = lerp(ending.from.y, globe.inside.y, k) + Math.sin(Math.PI * k) * 2.2;
  pl.x = cx; pl.y = cy; pl.mode = 'air'; pl.flipping = true;
  pl.ux = Math.cos(cam.ang); pl.uy = Math.sin(cam.ang);
  girl.visAng = cam.ang;
  if (t > 4.1 && !ending.landed) { ending.landed = true; pl.mode = 'ground'; pl.ux = 0; pl.uy = 1; pl.vt = 0; girl.forceAnim = 'wave'; girl.faceCam = true; puff(pl.x, pl.y, 6, 0.8, 0.6); }
  globe.snow.material.uniforms.uSwirl.value = Math.max(0, 1.4 - t * 0.2);
  globe.snow.material.uniforms.uGlow.value = Math.max(0, 0.6 - Math.abs(t - 3) * 0.2);
  cam.override = { x: lerp(ending.from.x, globe.center.x - 2.2, ease(clamp(t / 5, 0, 1))), y: lerp(ending.from.y, globe.center.y + 1.3, ease(clamp(t / 5, 0, 1))), d: lerp(CAM_D, 30, ease(clamp((t - 2) / 4, 0, 1))), k: 2.2 };
  if (t > 6.5 && state === 'ending') {
    state = 'end'; stateT = 0; stateWall = performance.now();
    const secs = Math.round(playT);
    $('endstats').textContent = `${collected} / ${FLAKES.length} snowflakes  ·  ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}  ·  the world turned ${flips} times`;
    $('end').style.opacity = 1; $('hud').style.opacity = 0;
  }
}
let respawning = false;
function respawn() {
  if (respawning) return; respawning = true;
  fadeTo(1);
  setTimeout(() => {
    const s = pl.safe || { x: LEVEL.start.x, y: 13, ux: 0, uy: -1, gnx: 0, gny: -1, facing: 1 };
    pl.x = s.x; pl.y = s.y; pl.ux = s.ux; pl.uy = s.uy; pl.gnx = s.gnx; pl.gny = s.gny; pl.facing = s.facing;
    pl.vx = pl.vy = 0; pl.vt = 0; pl.mode = 'ground'; pl.flipping = false; pl.glass = null; pl.airT = 0;
    roll.active = false; cam.ang = Math.atan2(pl.uy, pl.ux); girl.visAng = cam.ang;
    cam.x = pl.x; cam.y = pl.y;
    fadeTo(0); respawning = false;
  }, 650);
}
let stateWall = performance.now();
function onAnyKey(e) {
  const since = (performance.now() - stateWall) / 1000;
  if (state === 'title' && since > 0.6) { startIntro(); return; }
  if (state === 'end' && since > 1.5) { fadeTo(1); setTimeout(() => { toTitle(); fadeTo(0); }, 700); state = 'restarting'; return; }
  if (state === 'play') {
    if (['Space', 'KeyE', 'KeyX', 'Enter', 'KeyS', 'ArrowDown', 'Pad'].includes(e.code)) pl.flipBuf = 0.16;
    if (['ArrowUp', 'KeyW', 'KeyZ'].includes(e.code)) pl.jumpBuf = 0.12;
    if (e.code === 'KeyR') respawn();
  }
}

// ============================================================ debug overview
function buildDebug() {
  const pos = [];
  for (const s of SEGS) pos.push(s.ax, s.ay, 0.9, s.bx, s.by, 0.9);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xff1144, fog: false, depthTest: false, transparent: true }));
  lines.renderOrder = 999; scene.add(lines);
  // flip trajectories from walkable surfaces (green = lands somewhere, orange = flies into the sky)
  const tp = [], tc = [];
  for (const s of SEGS) {
    const L = Math.hypot(s.bx - s.ax, s.by - s.ay);
    if (Math.abs(s.ony) < 0.75) continue;
    const dirY = Math.sign(s.ony);
    const n = Math.max(1, Math.floor(L / 2.0));
    for (let i = 0; i <= n; i++) {
      const x = s.ax + (s.bx - s.ax) * i / n, y = s.ay + (s.by - s.ay) * i / n;
      if (raycast(x, y + dirY * 0.05, 0, dirY, 1.0)) continue; // something right above: not a standing spot
      const d = predictFall(x, y + dirY * 0.4, 0, dirY);
      const ok = d < 40; const len = ok ? d : 5;
      tp.push(x, y + dirY * 0.4, 0.8, x, y + dirY * (0.4 + len), 0.8);
      const c = ok ? [0.15, 0.85, 0.35] : [1, 0.55, 0];
      tc.push(...c, ...c);
    }
  }
  const tg = new THREE.BufferGeometry(); tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3)); tg.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3));
  const tl = new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, fog: false, depthTest: false }));
  tl.renderOrder = 998; scene.add(tl);
  // flakes markers & bubbles
  for (const f of FLAKES) {
    const x = f.x, y = f.y;
    const c = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.9, 24), new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true, depthTest: false, fog: false }));
    c.position.set(x, y, 1); c.renderOrder = 1000; scene.add(c);
  }
  for (const b of LEVEL.bubbles) {
    const c = new THREE.Mesh(new THREE.RingGeometry(b.r - 0.06, b.r + 0.06, 48), new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, depthTest: false, fog: false }));
    c.position.set(b.x, b.y, 1); c.renderOrder = 1000; scene.add(c);
  }
}

// ============================================================ main
const clock = new THREE.Clock();
let FPS = 0, fpsN = 0, fpsT0 = performance.now();
let acc = 0, T = 0;
const snowLayers = [];
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20);
  T += dt; stateT += dt;
  fpsN++; if (performance.now() - fpsT0 > 1000) { FPS = fpsN; fpsN = 0; fpsT0 = performance.now(); }
  pollPad();
  if (state === 'play') playT += dt;
  // fixed-step physics
  if (state === 'play' || state === 'intro') {
    acc += dt;
    while (acc >= 1 / 120) { stepPlayer(1 / 120); acc -= 1 / 120; }
    const B = LEVEL.bounds;
    if (state === 'play' && (pl.x < B.minX || pl.x > B.maxX || pl.y < B.minY || pl.y > B.maxY || (pl.mode === 'air' && pl.airT > 3.6))) respawn();
    if (state === 'play' && collected === FLAKES.length) {
      const bx = pl.x + pl.ux * 0.6, by = pl.y + pl.uy * 0.6;
      const near = Math.hypot(bx - globe.center.x, by - globe.center.y) < globe.r + 1.0 || (Math.abs(bx - globe.center.x) < globe.r * 0.95 && by > LEVEL.globe.base - 1.5 && by < globe.center.y + globe.r + 1);
      if (near) startEnding();
    }
  }
  pressed.clear();
  if (state === 'intro') updateIntro(dt);
  if (state === 'ending') updateEnding(dt);
  updateGirl(dt);
  updateFlakes(dt, T);
  updatePuffs(dt); updateSparks(dt);
  updateCamera(dt, T);
  camera.updateMatrixWorld();
  // uniforms
  const scale = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  for (const s of snowLayers) { s.material.uniforms.uTime.value = T; s.material.uniforms.uCenter.value.set(cam.x, cam.y); s.material.uniforms.uScale.value = scale; }
  for (const b of BUBBLES) { b.snow.material.uniforms.uTime.value = T; b.snow.material.uniforms.uScale.value = scale; }
  globe.snow.material.uniforms.uTime.value = T; globe.snow.material.uniforms.uScale.value = scale;
  shaftMat.uniforms.uTime.value = T;
  const want = collected === FLAKES.length && state === 'play' ? 1 : 0;
  globe.glow = damp(globe.glow, want * (0.75 + Math.sin(T * 2.2) * 0.25), 2, dt);
  for (const m of globe.glass.userData.mats) m.uniforms.uGlow.value = globe.glow;
  globe.beam.material.uniforms.uTime.value = T; globe.beam.material.uniforms.uAlpha.value = globe.glow * 0.5;
  // foreground silhouettes stay discreet while the camera frames the globe (title / intro / ending)
  fgAlpha = damp(fgAlpha, state === 'play' ? 0.9 : 0.0, 1.2, dt);
  for (const g of fgLayers) g.children.forEach((m) => { m.material.opacity = fgAlpha; m.visible = fgAlpha > 0.01; });
  if (gradePass) gradePass.uniforms.uTime.value = T;
  updateEdge(T);
  if (composer) composer.render(dt); else renderer.render(scene, camera);
}

async function main() {
  try { await loadAll(); } catch (e) { $('err').textContent = 'Loading failed: ' + e.message + '\n(serve this folder over http)'; return; }
  $('loader').style.opacity = 0;
  buildBackground();
  LEVEL.pieces.forEach((p, i) => buildPiece(p, i));
  for (const pn of LEVEL.pines) {
    const t = A[pn.k], asp = t.image.width / t.image.height;
    const m = spriteMesh(t, pn.h * asp, pn.h, { renderOrder: 8, fx: pn.fx });
    m.position.set(pn.x, pn.base + pn.h / 2 - 0.25, pn.z); world.add(m);
  }
  buildShafts();
  setupGlobe();
  setupBubbles();
  setupFlakes();
  initPuffs(); initSparks();
  snowLayers.push(makeSnow(900, { x: 120, y: 80 }, 0.10, 0.26, 1.15, -40, -6));
  snowLayers.push(makeSnow(420, { x: 70, y: 50 }, 0.14, 0.30, 1.35, -6, 4));
  snowLayers.push(makeSnow(90, { x: 50, y: 36 }, 0.35, 0.6, 1.6, 6, 16));
  setupGirl();
  setupPost();
  window.__G = { pl, cam, roll, LEVEL, SEGS, FLAKES, BUBBLES, globe, get state() { return state; }, set state(v) { state = v; }, get fps() { return FPS; }, get T() { return T; }, get stateT() { return stateT; }, get collected() { return collected; }, collect, startEnding, respawn, raycast,
    tp(x, y, inv) { pl.x = x; pl.y = y; pl.ux = 0; pl.uy = inv ? -1 : 1; pl.vx = pl.vy = 0; pl.vt = 0; pl.mode = 'air'; pl.flipping = false; pl.glass = null; roll.active = false; cam.ang = Math.atan2(pl.uy, pl.ux); girl.visAng = cam.ang; cam.x = x; cam.y = y; } };
  if (OVERVIEW) {
    for (const L of layers) L.g.visible = false;
    if (!Q.has('nodebug')) buildDebug();
    const B = LEVEL.bounds; const ov = (Q.get('ov') || '').split(',').map(Number);
    const w = ov[2] || (B.maxX - B.minX + 12), h = w * innerHeight / innerWidth;
    const oc = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 2000);
    oc.position.set(ov[0] || 0, isNaN(ov[1]) ? 8 : ov[1], 100); oc.lookAt(ov[0] || 0, isNaN(ov[1]) ? 8 : ov[1], 0);
    placeGirlInGlobe(); updateGirl(0);
    renderer.render(scene, oc);
    document.title = 'ready';
    return;
  }
  if (DEBUG) buildDebug();
  toTitle();
  if (SKIP) {
    startIntro(); stateT = 99;
    state = 'play'; cam.override = null; cam.lockAng = false; cam.angTarget = undefined;
    const at = (Q.get('at') || '').split(',').map(Number);
    pl.frozen = false; girl.forceAnim = null; girl.faceCam = false;
    pl.x = at[0] || LEVEL.start.x; pl.y = at[1] !== undefined && !isNaN(at[1]) ? at[1] : 1;
    pl.uy = at[2] === -1 ? -1 : 1; pl.ux = 0; pl.mode = 'air'; pl.flipping = false;
    cam.ang = Math.atan2(pl.uy, pl.ux); girl.visAng = cam.ang; cam.x = pl.x; cam.y = pl.y;
    $('hud').style.opacity = 1;
  }
  frame();
  setTimeout(() => (document.title = 'ready'), 50);
}
main();
