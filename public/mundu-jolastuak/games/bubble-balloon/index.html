<script type="module">
window.EGPad.getState=()=>{try{return Game.state}catch{return "loading"}};

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// =====================================================================================
// utils
// =====================================================================================
const Q = new URLSearchParams(location.search);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(+(Q.get('seed') || 1012));
const rr = (a, b) => a + (b - a) * rand();
const $ = id => document.getElementById(id);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// =====================================================================================
// world layout (forward = -Z, s = -z = distance along the course)
// =====================================================================================
const COURSE = 1180;                 // finish line distance (just before the lighthouse)
const R = 1.3;                       // bubble radius
const LIGHT = { x: -24, s: 1218 };   // lighthouse on the headland
// warm sun from the sea side (left) and ahead, like the source video: sunlit left-facing slopes and
// gables, softer camera-facing slopes, cool shaded fronts, shadows falling right toward the camera
const SUN_DIR = V3(-0.62, 0.7, -0.35).normalize();

// ------------------------------------------------------------------ aerial perspective
// Replaces three's linear fog with height-attenuated exponential haze that glows warm toward the
// sun and stays cool-pale away from it (the video's warm, milky distance). Used by every material
// that has fog enabled (standard materials and the sea shader).
const HAZE_SUN = new THREE.Color(1.0, 0.86, 0.62);   // linear, multiplied by fogColor brightness
const g3 = v => `vec3(${(v.isColor ? [v.r, v.g, v.b] : [v.x, v.y, v.z]).map(c => c.toFixed(4)).join(', ')})`;
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
  varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vFogWorld = cameraPosition + (vec4(mvPosition.xyz, 0.0) * viewMatrix).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
  uniform vec3 fogColor; varying vec3 vFogWorld;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear; uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  {
    vec3 fd = vFogWorld - cameraPosition; float fdist = length(fd); vec3 fdir = fd / max(fdist, 1e-3);
    const float HK = 0.0135;                       // haze thins out with altitude (the hill stays green)
    float h0 = max(cameraPosition.y, -5.0), dh = vFogWorld.y - h0;
    float hf = abs(dh) > 0.05 ? (exp(-HK * h0) - exp(-HK * (h0 + dh))) / (HK * dh) : exp(-HK * h0);
    #ifdef FOG_EXP2
      float fogFactor = 1.0 - exp(-fogDensity * max(fdist - 6.0, 0.0) * hf);
      #ifdef SEA_HAZE
        fogFactor *= SEA_HAZE;
      #endif
    #else
      float fogFactor = smoothstep(fogNear, fogFar, fdist);
    #endif
    float sunAmt = max(dot(fdir, ${g3(SUN_DIR)}), 0.0);
    vec3 fc = mix(fogColor, fogColor * ${g3(HAZE_SUN)} * 1.25, pow(sunAmt, 6.0) * 0.8);
    fc = mix(fc * vec3(0.96, 1.0, 1.05), fc, smoothstep(-0.25, 0.05, fdir.y));
    gl_FragColor.rgb = mix(gl_FragColor.rgb, fc, fogFactor);
  }
#endif`;
function coastX(s) {
  return -47 + 6 * Math.sin(s * 0.0062) + 3 * Math.sin(s * 0.019 + 1.3)
    - 42 * smooth(1120, 1215, s) * (1 - smooth(1250, 1340, s));
}
function hillY(x, s) {
  const a = (x - 150) / 400, b = (s - 1800) / 430;
  return 175 * Math.exp(-(a * a + b * b)) + 70 * smooth(110, 700, x) + 40 * smooth(1300, 2600, s) * smooth(-200, 300, x);
}
function groundY(x, s) {
  const dc = x - coastX(s);
  if (dc < 0) return -1.5 + dc * 0.12;
  let y;
  if (dc < 10) y = 0.15 + dc * 0.19; else y = 2.05;
  y += hillY(x, s) * smooth(6, 30, dc);
  const lx = x - LIGHT.x, ls = s - LIGHT.s;
  y += 7.5 * Math.exp(-(lx * lx + ls * ls) / 700) * smooth(0, 6, dc);
  return y;
}

// =====================================================================================
// renderer / scene / camera / post
// =====================================================================================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, Q.has('lowres') ? 1 : 1.5);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight, false);
// tone mapping is done by the final "look" pass below (the scene is rendered linear HDR)
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color(0xdbe1dc);   // milky pale sea haze of the video
scene.fog = new THREE.FogExp2(FOG_COL.getHex(), 0.001);
scene.background = FOG_COL.clone();

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.3, 6000);
window.EGMobileView(renderer,camera);

camera.position.set(0, 20, 12);

const rt = new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
// soft, wide "pro-mist" bloom: sunlit plaster, clouds and the bubble rim breathe into the air
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.25, 0.9, 0.55);
composer.addPass(bloom);
// final look pass, tuned frame by frame against the source video: a light Kuwahara "paint" filter
// (flat brushy patches, no CG crispness), exposure + ACES filmic curve, grade (milky lifted blacks,
// cool shadows, warm highlights, pastel highlight saturation), soft vignette, film grain and a hair of
// lateral chromatic aberration toward the frame edges
const LookShader = {
  uniforms: {
    tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uTime: { value: 0 },
    uExposure: { value: +(Q.get('exp') || 0.75) }, uSat: { value: +(Q.get('sat') || 1.08) },
    uContrast: { value: 1.08 }, uLift: { value: 0.015 }, uGamma: { value: 0.97 },
    uShadowTint: { value: new THREE.Vector3(-0.012, 0.0, 0.03) }, uHighTint: { value: new THREE.Vector3(0.03, 0.012, -0.03) },
    uHueShift: { value: -0.01 }, uVig: { value: 0.2 }, uGrain: { value: 0.035 }, uCA: { value: 0.004 },
    uPaint: { value: 0.8 }, uPaintR: { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime;
    uniform float uExposure, uSat, uContrast, uLift, uGamma, uHueShift, uVig, uGrain, uCA, uPaint, uPaintR;
    uniform vec3 uShadowTint, uHighTint;
    varying vec2 vUv;
    // ACES filmic (fitted curve with the RRT+ODT matrices, same as three.js)
    vec3 aces(vec3 c){
      const mat3 inM = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
      const mat3 outM = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
      c = inM * (c / 0.6); vec3 a = c * (c + 0.0245786) - 0.000090537; vec3 b = c * (0.983729 * c + 0.4329510) + 0.238081;
      return clamp(outM * (a / b), 0.0, 1.0);
    }
    vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    vec3 rgb2hsv(vec3 c){ vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0); vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
      vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r)); float d = q.x - min(q.w, q.y); float e = 1.0e-10;
      return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x); }
    vec3 hsv2rgb(vec3 c){ vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }
    // 5x5 Kuwahara: keeps the quadrant with the least variance -> flat painted patches, crisp edges
    vec3 kuwahara(vec2 uv){
      vec2 px = uPaintR / uRes; vec3 c[25]; float l[25];
      for (int j = 0; j < 5; j++) for (int i = 0; i < 5; i++) {
        vec3 t = texture2D(tDiffuse, uv + vec2(float(i - 2), float(j - 2)) * px).rgb;
        c[j * 5 + i] = t; float y = dot(t, vec3(0.2126, 0.7152, 0.0722)); l[j * 5 + i] = y / (1.0 + y);
      }
      vec3 best = c[12]; float bv = 1e9;
      for (int q = 0; q < 4; q++) {
        int ox = (q == 1 || q == 3) ? 2 : 0, oy = (q >= 2) ? 2 : 0;
        vec3 m = vec3(0.0); float s1 = 0.0, s2 = 0.0;
        for (int j = 0; j < 3; j++) for (int i = 0; i < 3; i++) { int k = (oy + j) * 5 + ox + i; m += c[k]; s1 += l[k]; s2 += l[k] * l[k]; }
        float v = s2 / 9.0 - (s1 / 9.0) * (s1 / 9.0);
        if (v < bv) { bv = v; best = m / 9.0; }
      }
      return best;
    }
    float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
    void main(){
      vec2 d = vUv - 0.5;
      // lateral chromatic aberration, only toward the frame edges
      vec2 ca = d * dot(d, d) * uCA;
      vec3 hdr = vec3(texture2D(tDiffuse, vUv + ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - ca).b);
      if (uPaint > 0.0) hdr = mix(hdr, kuwahara(vUv), uPaint);

    this.music = this.ctx.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
    this.amb = this.ctx.createGain(); this.amb.gain.value = 0; this.amb.connect(this.master);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.85; this.sfx.connect(this.master);
  },
  async load(key, url) {
    try {
      const r = await fetch(url); if (!r.ok) throw new Error(url);

    } catch (e) { console.warn('audio missing', url); }

    }
  },
  unlock() {
    this.init();

  },

const SKY_GLSL = `
uniform sampler2D uSky; uniform vec3 uHaze;
vec3 skyColor(vec3 d){
  float az = atan(d.x, -d.z);
  float u = az / 3.14159265 + 0.5;
  u = 1.0 - abs(mod(u, 2.0) - 1.0);
  float el = asin(clamp(d.y, -1.0, 1.0));
  float v = clamp(0.25 + el / 0.55, 0.003, 0.997);   // big cumulus low over the horizon, blue above (video)
  vec3 c = texture2D(uSky, vec2(u, v)).rgb;
  c = mix(uHaze, c, smoothstep(-0.02, 0.05, el));
  return c;
}`;

// per-material albedo grade (saturation + tint applied to the texture), to bring the generated
// textures onto the video's restrained palette without touching the source images
function gradeMap(m, sat, mul, key) {
  const prev = m.onBeforeCompile;
  m.onBeforeCompile = (sh, r) => {
    if (prev) prev(sh, r);
    sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
      { float gmL = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
        diffuseColor.rgb = mix(vec3(gmL), diffuseColor.rgb, ${sat.toFixed(3)}) * vec3(${mul.map(v => v.toFixed(3)).join(', ')}); }`);
  };
  m.customProgramCacheKey = () => 'gm-' + key;
  return m;
}

// =====================================================================================
// geometry builder (flat-shaded, vertex colors)
// =====================================================================================
class Geo {
  constructor() { this.p = []; this.n = []; this.u = []; this.c = []; }
  tri(a, b, c, ua, ub, uc, col) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    for (const [P, U] of [[a, ua], [b, ub], [c, uc]]) {
      this.p.push(P[0], P[1], P[2]); this.n.push(nx, ny, nz); this.u.push(U[0], U[1]); this.c.push(col[0], col[1], col[2]);
    }
  }
  // quad a b c d (any winding); want = desired outward normal (array) – winding is fixed automatically
  quad(a, b, c, d, ua, ub, uc, ud, col, want) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (want && nx * want[0] + ny * want[1] + nz * want[2] < 0) { this.tri(a, c, b, ua, uc, ub, col); this.tri(a, d, c, ua, ud, uc, col); }
    else { this.tri(a, b, c, ua, ub, uc, col); this.tri(a, c, d, ua, uc, ud, col); }
  }
  triW(a, b, c, ua, ub, uc, col, want) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (want && nx * want[0] + ny * want[1] + nz * want[2] < 0) this.tri(a, c, b, ua, uc, ub, col); else this.tri(a, b, c, ua, ub, uc, col);
  }
  // axis aligned box (world); uvScale in meters per texture repeat
  box(cx, y0, cz, sx, sy, sz, col, uvs = 3, bottom = false, uvOff = 0) {
    const x0 = cx - sx / 2, x1 = cx + sx / 2, z0 = cz - sz / 2, z1 = cz + sz / 2, y1 = y0 + sy;
    const U = (a, b) => [a / uvs + uvOff, b / uvs];

    this.quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], U(-z1, y0), U(-z0, y0), U(-z0, y1), U(-z1, y1), col, [1, 0, 0]);
    this.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], U(z0, y0), U(z1, y0), U(z1, y1), U(z0, y1), col, [-1, 0, 0]);
    this.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], U(x0, -z1), U(x1, -z1), U(x1, -z0), U(x0, -z0), col, [0, 1, 0]);

  }
  build() {
    const g = new THREE.BufferGeometry();

    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere(); g.computeBoundingBox();

  }
}

const houses = [], chimneys = [], antennas = [], dormerBoxes = [], towers = [], treeSpots = [], wires = [];
const WALL_TINTS = [[1, 1, 1], [1.0, 0.97, 0.92], [0.98, 0.95, 0.9], [1.0, 0.95, 0.89], [0.95, 0.95, 0.94], [1.0, 0.98, 0.94]];
const ROOF_TINTS = [[1.02, 1.0, 0.98], [1.0, 0.94, 0.88], [1.05, 1.03, 0.97], [0.95, 0.88, 0.82], [1.0, 0.97, 0.92], [0.9, 0.84, 0.78]];
function T(h, lx, y, lz) { return h.axis === 0 ? [h.x + lx, y, h.z + lz] : [h.x + lz, y, h.z - lx]; }
function roofYLocal(h, lz) { return h.ye + h.rise * (1 - Math.abs(lz) / h.hd); }

function addHouse(cx, s, wx, wz, floors, axis) {
  const cz = -s;
  const W = axis === 0 ? wx : wz, D = axis === 0 ? wz : wx;
  const gy = [groundY(cx - wx / 2, s - wz / 2), groundY(cx + wx / 2, s - wz / 2), groundY(cx - wx / 2, s + wz / 2), groundY(cx + wx / 2, s + wz / 2)];
  const y0 = Math.min(...gy) - 0.8, yc = groundY(cx, s);

  const rise = hd * rr(0.55, 0.82);
  const h = {
    x: cx, z: cz, s, axis, W, D, hw, hd, y0, ye, rise, top: ye + rise, yc,
    wall: WALL_TINTS[Math.floor(rand() * WALL_TINTS.length)], roof: ROOF_TINTS[Math.floor(rand() * ROOF_TINTS.length)],
    variant: rand() < 0.5 ? 0 : 1, dormers: [], chims: [],
    minX: cx - wx / 2 - 0.6, maxX: cx + wx / 2 + 0.6, minZ: cz - wz / 2 - 0.6, maxZ: cz + wz / 2 + 0.6,
  };
  houses.push(h);
  const progress = clamp(s / COURSE, 0, 1);
  // chimneys
  const nCh = rand() < 0.82 ? (rand() < 0.38 ? 2 : 1) : 0;
  for (let k = 0; k < nCh; k++) {
    const cw = rr(0.75, 1.05), cd = rr(0.65, 0.95);
    const lx = nCh === 2 ? (k === 0 ? -1 : 1) * rr(hw * 0.35, hw * 0.75) : rr(-hw * 0.7, hw * 0.7);
    const lz = rr(-hd * 0.45, hd * 0.45);

    const top = Math.max(low + 1.3, h.top + rr(0.35, 1.5));
    const p = T(h, lx, 0, lz);
    const sxw = axis === 0 ? cw : cd, szw = axis === 0 ? cd : cw;
    const ch = { x: p[0], z: p[2], sx: sxw, sz: szw, y0: low - 0.4, y1: top, smoke: rand() < 0.1 + 0.06 * progress, house: h, pots: 1 + (rand() < 0.4 ? 1 : 0) };
    chimneys.push(ch); h.chims.push(ch);
    const inLane = p[0] > -45 && p[0] < 70;
    if (s > 60 && rand() < (inLane ? 0.05 + 0.13 * progress : 0.1)) {
      const hgt = rr(1.8, 2.7), bars = rand() < 0.5 ? 2 : 3, along = rand() < 0.5 ? 0 : 1;
      const an = { x: p[0] + rr(-0.15, 0.15), z: p[2] + rr(-0.15, 0.15), y0: top + 0.1, y1: top + hgt, bars, along, chim: ch };

  for (const side of [1, -1]) {
    if (side === -1 && rand() < 0.5) continue;
    for (let k = 0; k < nd; k++) {
      const dx = nd === 1 ? rr(-hw * 0.3, hw * 0.3) : (k === 0 ? -1 : 1) * hw * rr(0.35, 0.5);
      if (h.chims.some(c => Math.abs((axis === 0 ? c.x - h.x : -(c.z - h.z)) - dx) < 1.6)) continue;

      h.dormers.push({ dx, side, zf, dw, yb, top, zt, zb });

    }
  }
  return h;
}

function genVillage() {
  let s = -70;
  while (s < 1170) {
    const depth = rr(8.5, 12), street = rr(3.8, 6.2);
    const oldTown = smooth(300, 700, s);
    let x = coastX(s + depth / 2) + rr(11.5, 14);
    while (x < 175) {
      const w = rr(6.5, 11.5);
      if (rand() < 0.06 && x > -20) { treeSpots.push({ x: x + w / 2, s: s + depth / 2, sc: rr(0.9, 1.25) }); x += w * 0.7; continue; }
      const floors = 2 + (rand() < 0.45 ? 1 : 0) + (rand() < 0.35 * oldTown ? 1 : 0);
      const axis = rand() < 0.64 ? 0 : 1;
      const lxx = x + w / 2 - LIGHT.x, lss = s + depth / 2 - LIGHT.s;
      if (lxx * lxx + lss * lss < 52 * 52) { x += w + rr(0, 2); continue; }
      addHouse(x + w / 2, s + depth / 2 + rr(-0.6, 0.6), w, depth + rr(-1.5, 0.3), floors, axis);
      const gap = rand() < 0.28 ? rr(2.4, 5.5) : rr(0, 0.25);
      if (gap > 3.2 && rand() < 0.45) treeSpots.push({ x: x + w + gap / 2, s: s + depth / 2 + rr(-2, 2), sc: rr(0.65, 0.95) });
      x += w + gap;
    }
    if (rand() < 0.5) treeSpots.push({ x: coastX(s) + rr(5, 8), s: s + rr(0, depth), sc: rr(0.7, 1.0) });
    s += depth + street;
  }
  // hillside village beyond the finish (scenery)
  for (let k = 0; k < 260; k++) {
    const s2 = rr(1160, 1900), x2 = rr(-20, 360);
    const dc = x2 - coastX(s2); if (dc < 18) continue;
    const lx = x2 - LIGHT.x, ls = s2 - LIGHT.s; if (lx * lx + ls * ls < 80 * 80) continue;
    const w = rr(6.5, 10.5), d = rr(8, 11);
    const gys = [groundY(x2 - w / 2, s2 - d / 2), groundY(x2 + w / 2, s2 - d / 2), groundY(x2 - w / 2, s2 + d / 2), groundY(x2 + w / 2, s2 + d / 2)];
    if (Math.max(...gys) - Math.min(...gys) > 3.2) continue;
    if (houses.some(h => Math.abs(h.x - x2) < (h.W + w) / 2 + 1 && Math.abs(h.s - s2) < (h.D + d) / 2 + 1)) continue;
    addHouse(x2, s2, w, d, 2 + (rand() < 0.4 ? 1 : 0), rand() < 0.6 ? 0 : 1);
    if (rand() < 0.5) treeSpots.push({ x: x2 + rr(-9, 9), s: s2 + rr(6, 10), sc: rr(0.8, 1.3) });
  }
  // bell towers (landmarks)
  for (const t of [{ s: 455, x: 22 }, { s: 905, x: -6 }]) {
    // remove houses overlapping the tower plaza

  for (const a of antennas) { a.kind = 'ant'; gridAdd(a, a.x - 1.2, a.x + 1.2, a.z - 1.2, a.z + 1.2); }

function makeSky() {
  const g = new THREE.SphereGeometry(3800, 48, 24);
  const m = new THREE.ShaderMaterial({
    uniforms: { uSky: { value: A.tex.sky }, uHaze: { value: FOG_COL }, uBoost: { value: 1.38 } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * p; gl_Position.z = gl_Position.w * 0.99999; }`,
    // a little more cerulean in the zenith, whiter clouds, and the same warm sun glow as the haze
    fragmentShader: `${SKY_GLSL} varying vec3 vDir; uniform float uBoost; void main(){
      vec3 d = normalize(vDir); vec3 c = skyColor(d);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, 1.0 + 0.3 * smoothstep(0.0, 0.25, d.y));

  const g = new THREE.PlaneGeometry(9000, 9000, 1, 1); g.rotateX(-Math.PI / 2);

      uTime: { value: 0 }, uWater: { value: A.tex.water }, uSun: { value: SUN_DIR }, uSky: { value: A.tex.sky }, uHaze: { value: FOG_COL },
      uDeep: { value: new THREE.Color(0x15659a) }, uShallow: { value: new THREE.Color(0x3fb8c2) }, uFoam: { value: new THREE.Color(0xf4fbfb) },

// updrafts from smoking chimneys
function updraft(dt) {

    const dx = P.pos.x - c.x, dz = P.pos.z - c.z, d = Math.hypot(dx, dz);
    const h = P.pos.y - c.y1;
    if (d < 3.4 && h > -1 && h < 18) lift = Math.max(lift, (1 - d / 3.4) * (1 - h / 18));

  if (lift > 0) { P.vel.y += 13 * lift * dt; P.updraftT = 0.3; }

}

function updatePlayer(dt) {
  const st = Game.state;

  let steer = Input.steer, lean = Input.lean, puff = Input.puff;

    const want = dock.sub(P.pos).multiplyScalar(0.9);

// simple pilot for the title screen + automated tests
function autopilot() {
  const s = -P.pos.z, fwd = Math.max(4, -P.vel.z);
  let tgt = null, best = 1e9;
  for (const p of pearls) {
    if (!p.alive) continue;
    const ds = p.s - s; if (ds < 0.8 || ds > 55) continue;
    const dx = Math.abs(p.x - P.pos.x), dyy = p.y - P.pos.y, t = ds / fwd;
    if (dx > 8.5 * t + 1.5) continue;
    if (dyy < -(1.5 + 6 * t) || dyy > 2 + 7 * t) continue;
    const cost = ds + dx * 0.6 + Math.abs(dyy) * 0.4;
    if (cost < best) { best = cost; tgt = p; }
  }
  const tx = tgt ? tgt.x : pathX(s + 25);
  const steer = clamp((tx - P.pos.x) * 0.38 - P.vel.x * 0.12, -1, 1);
  // obstacles right in front of the bubble
  let clear = -1e9;
  for (const look of [2.5, 5, 8]) clear = Math.max(clear, topAt(P.pos.x + P.vel.x * look / fwd, P.pos.z - look, R * 0.8) + R + 0.35);

  let lean = 0.1, puff = false;
  if ((dy > 0.6 && P.vel.y < 1.2) || (P.pos.y < clear && P.vel.y < 3)) puff = true;
  if (dy < -0.7 && P.pos.y > clear + 0.6) lean = clamp(-dy * 0.4, 0.25, 1);

}

function collectPearls(dt) {
  if (!pearlMesh) return;
  const t = Game.t;
  const M = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = V3(), pp = V3();
  const pz = P.pos.z;
  for (const p of pearls) {
    const i = p.idx;
    if (!p.alive) { M.makeScale(0, 0, 0); pearlMesh.setMatrixAt(i, M); pearlHaloA[i] = 0; continue; }
    const bob = Math.sin(t * 2.2 + i * 1.7) * 0.18;
    pp.set(p.x, p.y + bob, p.z);
    pearlHaloPos[i * 3] = p.x; pearlHaloPos[i * 3 + 1] = p.y + bob; pearlHaloPos[i * 3 + 2] = p.z;
    pearlHaloA[i] = 0.55 + 0.25 * Math.sin(t * 3.0 + i * 2.3);
    const s = 1 + 0.06 * Math.sin(t * 3.1 + i);
    sc.set(s, s, s); M.compose(pp, q, sc); pearlMesh.setMatrixAt(i, M);
    if (Game.state !== 'play' && Game.state !== 'title') continue;
    if (Math.abs(p.z - pz) > 4) continue;
    if (pp.distanceTo(P.pos) < R + 0.7) {
      p.alive = false;
      onPearl(p, pp);
    }
  }
  pearlMesh.instanceMatrix.needsUpdate = true;
  pearlHalo.geometry.attributes.position.needsUpdate = true; pearlHalo.geometry.attributes.aA.needsUpdate = true;
  // glints on nearby pearls
  for (const p of pearls) {
    if (!p.alive || p.z > pz + 10 || p.z < pz - 120) continue;
    if (rand() < dt * 1.6) fxGlow.spawn({ p: V3(p.x + rr(-0.25, 0.25), p.y + rr(-0.1, 0.35), p.z + 0.2), v: V3(0, 0, 0), life: rr(0.35, 0.7), a: 1, s0: rr(0.9, 1.5), s1: 0.2, rot: rr(0, 6), vr: rr(-1, 1), c: [1, 0.96, 0.85], fadeIn: 0.25, fadeOut: 0.4 });
  }
}
function onPearl(p, pos) {
  const isTitle = Game.state === 'title';
  burstSparkles(pos, 12, [1, 0.95, 0.82], 4, 0.8);
  if (isTitle) return;
  P.spark++; P.film = Math.min(1, P.film + 0.045);
  const c = p.chain;
  c.got++;
  // chain = consecutive pearls of the same ribbon
  if (P.chain !== c) { P.chain = c; P.chainN = 0; }
  P.chainN++;
  const note = [0, 2, 4, 5, 7, 9, 11, 12][Math.min(P.chainN - 1, 7)];
  Audio.play('collect', { vol: 0.6, rate: Math.pow(2, note / 12), pan: clamp((pos.x - camera.position.x) * 0.08, -0.6, 0.6) });
  if (c.got === c.n && !c.done) {
    c.done = true;
    P.score += 50;
    if (addFlockGull(Math.random() < 0.5 ? -1 : 1)) {
      Audio.play('gull', { vol: 0.65, rate: 1 });
      toast('assets/img/icon_gull.webp', '+1');
    }
  }
  updateHud();
}

const camState = { init: false, pos: V3(), look: V3(), roll: 0, shake: 0 };
function updateCamera(dt) {
  const st = Game.state;

  if (st === 'finish' || (st === 'end' && Game.lastWin)) {
    const a = Game.t * 0.16 + 0.35;
    const center = P.pos.clone().lerp(V3(LIGHT.x, LIGHT.top - 4, -LIGHT.s), 0.45);
    want = center.clone().add(V3(Math.sin(a) * 30, 7, Math.cos(a) * 30));
    look = center;
  } else if (st === 'end' || P.fall) {

  } else {
    const vx = P.vel.x;
    want = P.pos.clone().add(V3(-vx * 0.16, 2.9 - P.lean * 0.5, 6.3 + P.lean * 0.9));
    look = P.pos.clone().add(V3(vx * 0.1, -0.55, -7.5));
  }
  if (!camState.init) { camState.pos.copy(want); camState.look.copy(look); camState.init = true; }
  camState.pos.x = damp(camState.pos.x, want.x, 3.2, dt);
  camState.pos.y = damp(camState.pos.y, want.y, 2.6, dt);
  camState.pos.z = damp(camState.pos.z, want.z, 4.5, dt);
  camState.look.lerp(look, 1 - Math.exp(-6 * dt));
  // never sink into a roof behind the bubble
  const floorY = topAt(camState.pos.x, camState.pos.z, 0.8) + 1.1;
  if (camState.pos.y < floorY) camState.pos.y = damp(camState.pos.y, floorY, 12, dt);
  camera.position.copy(camState.pos);
  P.hitShake = Math.max(0, P.hitShake - dt * 1.8);

// =====================================================================================
// main loop
// =====================================================================================
const clock = new THREE.Clock();
let simMode = false;
function step(dt) {
  Game.t += dt; Game.stateT += dt;
  pollInput();
  const st = Game.state;
  if (st === 'title') {
    if (Input.start || Input.puff) { startRun(); consumeEdges(); }
  } else if (st === 'play') {
    if (Input.pause || (Input.start && Game.stateT > 0.3)) { setState('pause'); consumeEdges(); return; }
  } else if (st === 'pause') {
    if (Input.pause || Input.start || Input.puff) { setState('play'); consumeEdges(); }
    consumeEdges(); return;
  } else if (st === 'end') {
    if ((Input.start || Input.puff) && Game.stateT > 0.8) { startRun(); consumeEdges(); }
  }
  if (st === 'title' && P.pos.z < -COURSE + 40) resetRun(true);
  if (st === 'play' || st === 'title' || st === 'finish') {
    if (!P.fall) updatePlayer(dt);
    P.time += dt;
  }
  if (st === 'play' && P.alive) {
    const prog = clamp(-P.pos.z / COURSE, 0, 1);
    P.film -= dt * (0.008 + 0.007 * prog);
    if (P.film <= 0 && P.alive) { doPop(); }
    else if (-P.pos.z >= COURSE) { setState('finish'); Audio.play('win', { vol: 0.9 }); burstSparkles(P.pos.clone(), 40, [1, 0.9, 0.7], 7, 1.2); for (let i = 0; i < 3; i++) addFlockGull(i % 2 ? 1 : -1); }
    updateHud();
  }
  if (st === 'finish' && Game.stateT > 6.5) endRun(true);
  if (P.fall) {
    // the child drifts down like a feather and lands softly on the roof below
    const f = P.fall; f.t += dt;
    f.v.y = Math.max(f.v.y - 6 * dt, -3.2); f.v.x *= Math.exp(-1.5 * dt); f.v.z *= Math.exp(-1.5 * dt);
    const wp = P.pos.clone().add(childPivot.position);
    const floor = topAt(wp.x, wp.z, 0.3) + 0.35;
    if (wp.y + f.v.y * dt > floor) childPivot.position.addScaledVector(f.v, dt);
    else { f.v.set(0, 0, 0); f.landed = true; }
    childPivot.rotation.x = damp(childPivot.rotation.x, f.landed ? 0 : 0.5, 3, dt);
    childPivot.rotation.z = Math.sin(f.t * 3) * (f.landed ? 0 : 0.25);
    if (f.t > 2.2 && Game.state === 'play') endRun(false);
  }
  collectPearls(dt);
  updateSmoke(dt);
  updateGulls(dt, Game.t);
  // bubble visuals
  const sqG = bubbleGroup.userData.squash;
  bubbleGroup.position.copy(P.pos);
  const n = P.sqN; const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), n);
  sqG.quaternion.copy(q);
  const sq = P.sq; sqG.scale.set(1 - sq * 0.5, 1 + sq, 1 - sq * 0.5);
  if (!P.fall) {
    childPivot.rotation.set(0, 0, 0);
    childPivot.rotation.z = damp(childPivot.rotation.z, -P.steer * 0.42, 6, dt);
    childPivot.rotation.x = -P.lean * 0.22 + Math.sin(Game.t * 1.6) * 0.04 + clamp(P.vel.y * 0.025, -0.15, 0.15);
    childPivot.rotation.y = -0.42 - P.steer * 0.3;
    childPivot.position.set(0, Math.sin(Game.t * 2.0) * 0.06, 0);
  }
  const film = clamp(P.film, 0, 1);
  for (const m of [bubbleFront, bubbleBack]) {
    const u = m.material.uniforms; u.uTime.value = Game.t; u.uThin.value = (1 - film) * 0.9; u.uWob.value = 0.025 + (1 - film) * 0.05 + Math.abs(P.sq) * 0.2;
    u.uOpacity.value = P.inv > 0 && Game.state === 'play' ? 0.6 + 0.4 * Math.sin(Game.t * 30) : 1;
  }
  if (pearlMesh) pearlMesh.material.uniforms.uTime.value = Game.t;
  sea.material.uniforms.uTime.value = Game.t;
  if (lightBeam) lightBeam.rotation.y = Game.t * 0.6;
  for (const b of boats) { const u = b.userData; b.position.y = u.base.y + Math.sin(Game.t * 1.1 + u.ph) * 0.25; b.rotation.z = Math.sin(Game.t * 0.9 + u.ph) * 0.05; b.rotation.x = Math.sin(Game.t * 0.7 + u.ph * 2) * 0.03; b.position.z = u.base.z - Math.sin(Game.t * 0.02 * u.sp + u.ph) * 30; }
  fxGlow.update(dt); fxSmoke.update(dt);
  updateCamera(dt);
  // sun + shadow follow
  const c = P.pos;
  sun.target.position.set(c.x, c.y - 6, c.z - 22);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 200);
  sun.target.updateMatrixWorld();
  skyMesh.position.copy(camera.position);
  LU.uTime.value = Game.t;
  consumeEdges();
}
function doPop() {
  P.film = 0; P.alive = false;
  bubbleGroup.userData.squash.visible = false;
  popFx(); Audio.play('pop', { vol: 1 }); flash(0.35);
  P.fall = { t: 0, v: V3(P.vel.x * 0.3, 1.5, P.vel.z * 0.2) };
  P.vel.set(0, 0, 0);
  for (const g of gulls) if (g.mode === 'flock') { g.mode = 'leave'; g.life = 0; g.vel.set(rr(-8, 8), 6, -8); }
}
function frame() {
  requestAnimationFrame(frame);
  if (simMode) return;
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (Game.state === 'loading') return;
  step(dt);
  composer.render();
}

// =====================================================================================
// boot
// =====================================================================================
async function boot() {
  const jobs = [];
  for (const [k, u] of Object.entries(IMG)) jobs.push(loadTex(k, u));
  for (const [k, u] of Object.entries(GLB)) jobs.push(loadGlb(k, u));
  for (const [k, u] of Object.entries(SND)) jobs.push(Audio.load(k, u));
  await Promise.all(jobs);
  genVillage();
  genWires();
  makeSky(); makeSea(); makeLand(); makeFar();
  makeTrees();
  makeLighthouse();
  makeVillageMeshes(); makeBoats();
  buildColliders();
  genPearls(); makePearls();
  fxSmoke = new Particles(700, A.tex.smoke, 1);
  fxGlow = new Particles(900, A.tex.spark, 0);
  makePlayer(); makeGullProto(); spawnAmbientGulls();
  // image based lighting from the sky
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); const sk = skyMesh.clone(); sk.material = skyMesh.material; envScene.add(sk);
  skyMesh.material.uniforms.uBoost.value = 1.0;     // light the scene with the plain sky, show the brighter one
  scene.environment = pm.fromScene(envScene, 0.02, 1, 5000).texture;
  skyMesh.material.uniforms.uBoost.value = 1.38;
  resetRun(true);
  onResize();
  composer.render();
  setState('title');
  $('loading').classList.add('hidden');
  if (Q.has('play')) startRun();
  window.__bb = {
    Game, P, pearls, chains, houses, chimneys, antennas, gulls, scene, camera, renderer,
    start: startRun, setAuto(v) { Game.auto = v; },
    teleport(s, x = null, y = null) { P.pos.z = -s; if (x !== null) P.pos.x = x; P.pos.y = y !== null ? y : topAt(P.pos.x, P.pos.z, R) + R + 2; camState.init = false; },
    sim(seconds, fps = 60) { simMode = true; const dt = 1 / fps; for (let i = 0; i < seconds * fps; i++) step(dt); composer.render(); },
    resume() { simMode = false; clock.getDelta(); },
    render() { composer.render(); },
    stats() { return { state: Game.state, s: -P.pos.z, y: P.pos.y, film: P.film, spark: P.spark, gulls: flockCount(), pearls: pearls.length, houses: houses.length, chimneys: chimneys.length, antennas: antennas.length, tris: renderer.info.render.triangles, calls: renderer.info.render.calls }; },
    press(k) { if (k === 'start') Input.start = true; if (k === 'puff') Input.puff = true; },
  };
}
boot().catch(e => { console.error(e); $('loading').innerHTML = '<div style="font-weight:800;font-size:22px;color:#fff">Could not load the game assets.</div>'; });
requestAnimationFrame(frame);
</script>
</body>
