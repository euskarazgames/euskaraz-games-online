<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =====================================================================
   STAINED GLASS — a tiny cloaked figure crosses a vast cathedral;
   only the coloured light thrown by the windows holds her weight.
   Every image, texture and model comes from fal (see README.md).
   ===================================================================== */

const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
const errBox = document.getElementById('err');
function showErr(e) { console.error(e); if (DEBUG) errBox.textContent += String(e && e.stack || e) + '\n'; }
window.addEventListener('error', (e) => showErr(e.error || e.message));

/* ---------------------------------------------------------------------
   World constants (derived from the fal-generated wall panoramas:
   240 px per metre, 1264 px per bay, floor line at row 2582)
   --------------------------------------------------------------------- */
const PXM = 240;
const BAY_W = 1264 / PXM;          // 5.267 m
const WALL_H = 2582 / PXM;         // 10.758 m
const WALL_Z = -10;
const SUN_DX = 0.10, SUN_K = 0.45; // light travels (dx, -k, 1) per metre of depth
const SUN_DIR = new THREE.Vector3(SUN_DX, -SUN_K, 1).normalize();
const LANE_SHIFT = SUN_DX * (0 - WALL_Z);          // pools sit 1 m right of their window
const WIN_HALF = 272 / PXM;                        // glass half width (1.133 m)

const ROW = { A: 0, B: 1, C: 2, D: 3 };
const FIRST_BAY = -4;
const BAYS = [
  'C1', 'C2', 'C3', 'C4',             // -4..-1  (west end, walled up)
  'A0', 'A1', 'A2', 'A3', 'A4',       //  0..4   prologue
  'C2',                               //  5      the first long shadow (glide)
  'B0',                               //  6
  'B1', 'B2', 'B3', 'B4', 'A0',       //  7..11  the clouds
  'A1',                               //  12
  'C3', 'C4', 'C0', 'C1',             //  13..16 the lanterns
  'A2',                               //  17
  'B3', 'C2', 'A3', 'B1', 'B4',       //  18..22 the choir
  'D0', 'D1', 'D2', 'D3', 'D4',       //  23..27 the rose
  'C0', 'C1', 'C2', 'C3'              //  28..31 (east end)
];
const NB = BAYS.length;
const BAYS_X0 = FIRST_BAY * BAY_W;
const bayCenter = (i) => (i + 0.5) * BAY_W;               // i = world bay index
const poolCenter = (i) => bayCenter(i) + LANE_SHIFT;
const bayInfo = BAYS.map((s) => {
  const row = ROW[s[0]], slot = +s[1];
  const lit = s[0] === 'C' ? 0 : 1;
  return { row, slot, lit, key: s };
});

// window colours (for notes, petals and the cloak glow) — sampled from the gobo atlas at load
const NOTE_SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];   // pentatonic

// sections
// two cloud zones: the clouds (bays 7-11) and a faster sky over the choir (bays 20-22)
const CLOUDS = [
  { x0: 7 * BAY_W, x1: 12 * BAY_W, speed: 2.3, spacing: 19.0, half: 4.0, soft: 0.9, strength: 0.94 },
  { x0: 20 * BAY_W, x1: 23 * BAY_W, speed: 3.0, spacing: 15.0, half: 3.2, soft: 0.8, strength: 0.94 },
];
const ROSE = { cx: bayCenter(25) + (3170 - 3168) / PXM, cy: (2582 - 1350) / PXM, r: 975 / PXM };
const GOAL_X = ROSE.cx + LANE_SHIFT;

// lanterns swinging over the dark bays 13..16
const LANTERNS = [];
{
  const start = poolCenter(12) + WIN_HALF + 2.45;
  for (let i = 0; i < 4; i++) LANTERNS.push({ px: start + 6.0 * i, py: 9.6, len: 6.1, amp: 0.335, w: (Math.PI * 2) / 4.3, ph: i % 2 ? Math.PI : 0, cone: 0.44 });
}

// solid platforms lit by the windows (stone only holds her when the light is on it)
const PLATFORMS = [];
// checkpoints (static pools)
const CHECKPOINTS = [0, 4, 6, 12, 17, 20, 23].map((i) => ({ bay: i, x: poolCenter(i) }));

/* ---------------------------------------------------------------------
   Shared GLSL: the nave light (windows projected by the sun + lanterns)
   --------------------------------------------------------------------- */
const NAVE_UNIFORMS = {
  uGobo: { value: null },
  uBays: { value: bayInfo.map((b) => new THREE.Vector4(b.row, b.slot, b.lit, 0)) },
  uNave: { value: new THREE.Vector4(BAYS_X0, BAY_W, WALL_H, WALL_Z) },
  uSun: { value: new THREE.Vector3(SUN_DX, SUN_K, 0) },
  uCloud: { value: CLOUDS.map((c) => new THREE.Vector4(c.x0, c.x1, c.speed, c.spacing)) },
  uCloudP: { value: CLOUDS.map((c) => new THREE.Vector4(c.half, c.soft, c.strength, 0)) },
  uLantP: { value: [0, 1, 2, 3].map(() => new THREE.Vector4()) },
  uLantA: { value: [0, 1, 2, 3].map(() => new THREE.Vector4(0, -1, 0, 0.9)) },
  uRose: { value: new THREE.Vector4() },
  uBoost: { value: 1 },
  uRoseBoost: { value: 1 },
};

const NAVE_GLSL = /* glsl */`
#define NB ${NB}
uniform sampler2D uGobo;
uniform vec4 uBays[NB];
uniform vec4 uNave;
uniform vec3 uSun;
uniform vec4 uCloud[2];
uniform vec4 uCloudP[2];
uniform vec4 uLantP[4];
uniform vec4 uLantA[4];
uniform vec4 uRose;
uniform float uBoost;
uniform float uRoseBoost;

float naveCloud(float wx) {
  float r = 1.0;
  for (int i = 0; i < 2; i++) {
    vec4 C = uCloud[i]; vec4 P = uCloudP[i];
    if (wx < C.x || wx > C.y) continue;
    float u = wx - C.z * P.w;
    float d = abs(mod(u, C.w) - 0.5 * C.w);
    float sh = 1.0 - smoothstep(P.x - P.y, P.x + P.y, d);
    float edge = smoothstep(C.x, C.x + 1.5, wx) * (1.0 - smoothstep(C.y - 1.5, C.y, wx));
    r = min(r, 1.0 - P.z * sh * edge);
  }
  return r;
}

vec4 naveWindow(vec3 p, float lod) {
  float s = p.z - uNave.w;
  if (s <= 0.0) return vec4(0.0);
  float qx = p.x - uSun.x * s;
  float qy = p.y + uSun.y * s;
  float fv = qy / uNave.z;
  if (fv <= 0.0 || fv >= 1.0) return vec4(0.0);
  float bf = (qx - uNave.x) / uNave.y;
  float bi = floor(bf);
  if (bi < 0.0 || bi > float(NB - 1)) return vec4(0.0);
  vec4 info = uBays[int(bi)];
  if (info.z <= 0.0) return vec4(0.0);
  vec2 uv = vec2((info.y + (bf - bi)) * 0.2, 1.0 - (info.x + 1.0 - fv) * 0.25);
  vec4 g = textureLod(uGobo, uv, lod);
  float k = info.z * naveCloud(qx) * uBoost * (info.x > 2.5 ? uRoseBoost : 1.0) * smoothstep(7.0, 3.0, p.z);
  return vec4(g.rgb * k, g.a * k);
}

vec3 naveLantern(vec3 p) {
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 4; i++) {
    vec4 L = uLantP[i];
    if (L.w <= 0.0) continue;
    vec3 v = p - L.xyz;
    float d = length(v);
    vec3 dir = v / max(d, 1e-3);
    vec4 A = uLantA[i];
    float c = dot(dir, A.xyz);
    if (c <= A.w) continue;
    vec3 t1 = normalize(cross(A.xyz, vec3(0.0, 0.0, 1.0)));
    vec3 t2 = cross(t1, A.xyz);
    float tanC = sqrt(max(1.0 - A.w * A.w, 1e-4)) / A.w;
    vec2 l = vec2(dot(dir, t1), dot(dir, t2)) / (c * tanC);
    float r = length(l);
    vec3 g = textureLod(uGobo, uRose.xy + l * uRose.zw, 0.0).rgb;
    float edge = 1.0 - smoothstep(0.84, 1.0, r);
    acc += (g * 1.15 + 0.08) * edge * L.w / (1.0 + 0.035 * d * d);
  }
  return acc;
}
`;

/* Patch a MeshStandardMaterial so the sun (directional light #0) is filtered
   through the stained glass, and lanterns add their coloured spots. */
const RIM_DEFAULT = { value: new THREE.Color(1.0, 0.86, 0.66) };
function patchNave(mat, opts = {}) {
  const rim = opts.rim || 0;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, NAVE_UNIFORMS);
    sh.uniforms.uRim = { value: rim };
    sh.uniforms.uRimCol = opts.rimCol || RIM_DEFAULT;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vNaveW;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 naveWP = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          naveWP = instanceMatrix * naveWP;
        #endif
        vNaveW = (modelMatrix * naveWP).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vNaveW;\nuniform float uRim;\nuniform vec3 uRimCol;\n' + NAVE_GLSL)
      .replace('#include <lights_fragment_begin>', THREE.ShaderChunk.lights_fragment_begin.replace(
        'getDirectionalLightInfo( directionalLight, directLight );',
        'getDirectionalLightInfo( directionalLight, directLight );\n\t\tdirectLight.color *= naveWindow( vNaveW, 0.0 ).rgb;'))
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          vec3 lc = naveLantern(vNaveW);
          reflectedLight.directDiffuse += lc * BRDF_Lambert( material.diffuseColor ) * 2.2;
          if (uRim > 0.0) {
            // 'normal' is already flipped for back faces (double-sided cloak), so the inside stays dark
            float fr = pow(1.0 - saturate(dot(normal, normalize(vViewPosition))), 3.0);
            reflectedLight.directDiffuse += uRimCol * fr * uRim;
          }
        }`);
  };
  mat.customProgramCacheKey = () => 'nave' + (rim > 0 ? 'r' : '');
  return mat;
}

/* ---------------------------------------------------------------------
   Renderer / scene / camera
   --------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color(0x2c2a25);
scene.background = new THREE.Color(0x120f0c);
scene.fog = new THREE.Fog(FOG_COL, 18, 80);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4, 3.1, 12.5);

const hemi = new THREE.HemisphereLight(0xc8c2b4, 0x2c2924, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0da, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ---------------------------------------------------------------------
   Loading
   --------------------------------------------------------------------- */
const manager = new THREE.LoadingManager();
const barEl = document.querySelector('#bar i');
manager.onProgress = (_u, done, total) => { barEl.style.width = Math.round((done / total) * 100) + '%'; };
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
const loadTex = (url, srgb = true) => new Promise((res, rej) => texLoader.load(url, (t) => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, rej));
const loadGLB = (url) => new Promise((res) => gltfLoader.load(url, res, undefined, (e) => { console.warn('missing', url, e); res(null); }));
const loadImg = (url) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });

const A = 'assets/';
const [texWallA, texWallB, texWallC, texWallD, texGobo, texFloor, imgSolid, glbHero,
  glbPillar, glbChand, glbLantern, glbPew, glbCandle, glbTomb, texSprites, texVault] = await Promise.all([
  loadTex(A + 'wall_A.jpg'), loadTex(A + 'wall_B.jpg'), loadTex(A + 'wall_C.jpg'), loadTex(A + 'wall_D.jpg'),
  loadTex(A + 'gobo_atlas.webp'), loadTex(A + 'floor.jpg'), loadImg(A + 'solid_atlas.png'),
  loadGLB(A + 'models/heroine.glb'),
  loadGLB(A + 'models/pillar.glb'), loadGLB(A + 'models/chandelier.glb'), loadGLB(A + 'models/lantern.glb'),
  loadGLB(A + 'models/pew.glb'), loadGLB(A + 'models/candelabra.glb'), loadGLB(A + 'models/tomb.glb'),
  loadTex(A + 'sprites.png').catch(() => null), loadTex(A + 'vault.jpg').catch(() => null),
]);

texGobo.generateMipmaps = true;
texGobo.minFilter = THREE.LinearMipmapLinearFilter;
texGobo.anisotropy = 4;
NAVE_UNIFORMS.uGobo.value = texGobo;
{
  // rose window centre in the gobo atlas (row D, slots 1..3)
  const u = (2 + ((3170 - (3168 - 632)) / 1264)) / 5;
  const v = 1 - (3 + 1350 / 2582) / 4;
  const ru = (ROSE.r * PXM / 1264) / 5 * 0.98, rv = (ROSE.r * PXM / 2582) / 4 * 0.98;
  NAVE_UNIFORMS.uRose.value.set(u, v, ru, rv);
}

/* CPU copy of the solidity atlas (5 slots x 4 rows of 158x323) */
const SOL_W = 158, SOL_H = 323;
const solid = (() => {
  const cv = document.createElement('canvas'); cv.width = imgSolid.width; cv.height = imgSolid.height;
  const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(imgSolid, 0, 0);
  const d = cx.getImageData(0, 0, cv.width, cv.height).data;
  const a = new Uint8Array(cv.width * cv.height);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4];
  return { a, w: cv.width, h: cv.height };
})();
function solidAt(row, slot, fu, fv) {
  const x = Math.min(SOL_W - 1, Math.max(0, Math.floor(fu * SOL_W))) + slot * SOL_W;
  const y = Math.min(SOL_H - 1, Math.max(0, Math.floor((1 - fv) * SOL_H))) + row * SOL_H;
  return solid.a[y * solid.w + x] / 255;
}

/* window colours: average glass colour of every bay (for notes / petals / glow) */
const bayColor = (() => {
  const cv = document.createElement('canvas'); cv.width = 50; cv.height = 32;
  const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(texGobo.image, 0, 0, 50, 32);
  const d = cx.getImageData(0, 0, 50, 32).data;
  return bayInfo.map((b) => {
    if (!b.lit) return new THREE.Color(1, 0.9, 0.7);
    let r = 0, g = 0, bl = 0, n = 0;
    for (let y = b.row * 8 + 1; y < b.row * 8 + 7; y++) for (let x = b.slot * 10 + 2; x < b.slot * 10 + 8; x++) {
      const k = (y * 50 + x) * 4; const a = d[k + 3] / 255; if (a < 0.3) continue;
      r += d[k] / a; g += d[k + 1] / a; bl += d[k + 2] / a; n++;
    }
    if (!n) return new THREE.Color(1, 0.9, 0.7);
    const c = new THREE.Color(r / n / 255, g / n / 255, bl / n / 255);
    const hsl = {}; c.getHSL(hsl); c.setHSL(hsl.h, Math.min(1, hsl.s * 1.25 + 0.1), 0.62);
    return c;
  });
})();

/* ---------------------------------------------------------------------
   Light model on the CPU (must match the GLSL)
   --------------------------------------------------------------------- */
const game = { t: 0 };
function cloudShade(wx, t) {
  let r = 1;
  for (const CLOUD of CLOUDS) {
  if (wx < CLOUD.x0 || wx > CLOUD.x1) continue;
  const u = wx - CLOUD.speed * t;
  const d = Math.abs(((u % CLOUD.spacing) + CLOUD.spacing) % CLOUD.spacing - 0.5 * CLOUD.spacing);
  const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const sh = 1 - ss(CLOUD.half - CLOUD.soft, CLOUD.half + CLOUD.soft, d);
  const edge = ss(CLOUD.x0, CLOUD.x0 + 1.5, wx) * (1 - ss(CLOUD.x1 - 1.5, CLOUD.x1, wx));
  r = Math.min(r, 1 - CLOUD.strength * sh * edge);
  }
  return r;
}
function windowLight(x, y, z, t) {
  const s = z - WALL_Z; if (s <= 0) return 0;
  const qx = x - SUN_DX * s, qy = y + SUN_K * s;
  const fv = qy / WALL_H; if (fv <= 0 || fv >= 1) return 0;
  const bf = (qx - BAYS_X0) / BAY_W; const bi = Math.floor(bf);
  if (bi < 0 || bi >= NB) return 0;
  const b = bayInfo[bi]; if (!b.lit) return 0;
  return solidAt(b.row, b.slot, bf - bi, fv) * cloudShade(qx, t);
}
function windowBayAt(x, y, z) {
  const s = z - WALL_Z; const qx = x - SUN_DX * s;
  return Math.floor((qx - BAYS_X0) / BAY_W);
}
const lanternState = LANTERNS.map(() => ({ pos: new THREE.Vector3(), axis: new THREE.Vector3(), ang: 0 }));
function updateLanterns(t) {
  LANTERNS.forEach((L, i) => {
    const a = L.amp * Math.sin(L.w * t + L.ph);
    const st = lanternState[i];

const audio = { ctx: null, buffers: {}, music: null, master: null, muted: false, glideGain: null };
async function initAudio() {

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.ctx = ctx; audio.master = ctx.createGain(); audio.master.gain.value = 0.9; audio.master.connect(ctx.destination);
    const names = ['music', 'chime', 'jump', 'land', 'sink', 'glide', 'pickup', 'finale'];
    await Promise.all(names.map(async (n) => {
      try { const r = await fetch(A + 'audio/' + n + '.mp3'); if (!r.ok) return; audio.buffers[n] = await ctx.decodeAudioData(await r.arrayBuffer()); } catch (e) { /* optional */ }
    }));
    if (audio.buffers.music) {
      const src = ctx.createBufferSource(); src.buffer = audio.buffers.music; src.loop = true;
      const g = ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.42, ctx.currentTime + 4);
      src.connect(g).connect(audio.master); src.start(); audio.music = g;

const keys = new Set();
const input = { left: false, right: false, jump: false, jumpPressed: false };
const KEY_L = ['ArrowLeft', 'KeyA', 'KeyQ'], KEY_R = ['ArrowRight', 'KeyD'], KEY_J = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyK'];
addEventListener('keydown', (e) => {
  if (KEY_J.includes(e.code) || KEY_L.includes(e.code) || KEY_R.includes(e.code)) e.preventDefault();
  if (!keys.has(e.code) && KEY_J.includes(e.code)) input.jumpPressed = true;
  keys.add(e.code);
  if (e.code === 'KeyM') { audio.muted = !audio.muted; if (audio.master) audio.master.gain.value = audio.muted ? 0 : 0.9; }
  if (e.code === 'KeyR' && game.mode === 'play') kill(true);
  onAnyKey(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('pointerdown', () => onAnyKey('Pointer'));
function pollInput() {
  let l = KEY_L.some((k) => keys.has(k)), r = KEY_R.some((k) => keys.has(k)), j = KEY_J.some((k) => keys.has(k));
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    const ax = p.axes[0] || 0;
    if (ax < -0.35 || p.buttons[14]?.pressed) l = true;
    if (ax > 0.35 || p.buttons[15]?.pressed) r = true;
    const jb = p.buttons[0]?.pressed || p.buttons[1]?.pressed;
    if (jb && !input._padJ) { input.jumpPressed = true; onAnyKey('Pad'); }
    input._padJ = jb; if (jb) j = true;
  }
  input.left = l; input.right = r; input.jump = j;
}

/* physics constants */

/* ---------------------------------------------------------------------
   Autopilot: predicts jumps with the real physics + light functions.
   Used by the ?auto demo mode (she walks the nave by herself) and for tests.
   --------------------------------------------------------------------- */
const SIM_DT = 1 / 60;
function simulateJump(x0, y0, vx0, t0, release) {
  let x = x0, y = y0, vx = vx0, vy = JUMP_V, t = t0, glide = GLIDE_TIME, hold = true;

    if (!hold && vy > 0) vy *= Math.pow(0.02, SIM_DT);
    if (hold && vy < 0 && glide > 0 && y > 0.15) { glide -= SIM_DT; vy = Math.max(vy - GLIDE_G * SIM_DT, -GLIDE_VMAX); }
    else vy -= G * SIM_DT;
    const py = y; x += vx * SIM_DT; y += vy * SIM_DT;
    if (vy <= 0) {
      for (const sfc of surfacesBelow(py, y)) if (supportOK(sfc, x, t)) return { ok: true, x, y: sfc.y, t, sfc };
      if (y < -0.02) return { ok: false };
    }
  }
  return { ok: false };
}

  const h = hero; input.left = false;
  if (h.dead) { input.right = false; input.jump = false; bot.plan = null; return; }
  if (!h.ground) { input.jump = bot.plan ? t < bot.holdUntil : false; input.right = true; return; }
  bot.plan = null; input.jump = false;
  // safe to keep running? (lit now and a little later just ahead)
  const ahead = h.x + 0.3 + Math.max(0, h.vx) * 0.08;
  const safeAhead = supportOK(h.ground, ahead, t) && supportOK(h.ground, ahead, t + 0.25);
  const safeHere = supportOK(h.ground, h.x, t + 0.35);

  let best = null;

    for (const rel of [0.12, 0.25, 0.4, 0.7, 1.0, 1.4, 2.4]) {
      const r = simulateJump(h.x, h.y, h.vx, t, rel);
      if (!r.ok || r.x < h.x + 0.6) continue;

/* ---------------------------------------------------------------------
   Camera
   --------------------------------------------------------------------- */
const camState = { x: hero.x, y: 3.1, look: new THREE.Vector3(), lead: 0, fov: 40 };
function updateCamera(dt, t) {
  let tx, ty, tz, lx, ly, lz, fov = 40;

    tx = hero.x + 5.5 + Math.sin(t * 0.07) * 4.5; ty = 3.4; tz = 13.5; lx = tx; ly = 3.2; lz = -6;
  } else if (game.mode === 'end') {

/* ---------------------------------------------------------------------
   Main loop
   --------------------------------------------------------------------- */
const clock = new THREE.Clock();

function tick() {

  // world time-dependent light

  updateLanterns(t);

  const near = lanternState.map((s, i) => ({ s, i, d: Math.abs(s.pos.x - camera.position.x) })).sort((a, b) => a.d - b.d).slice(0, 4);
  for (let k = 0; k < 4; k++) {

      NAVE_UNIFORMS.uLantA.value[k].set(n.s.axis.x, n.s.axis.y, n.s.axis.z, Math.cos(LANTERNS[n.i].cone));

        if (dx * dx + dy * dy < 0.55) {

          sfx('pickup', { gain: 0.45, rate: 1 + (game.petals % 5) * 0.06 });

      if (!game.hintShown.glide && hero.x > poolCenter(4) - 1.5) { game.hintShown.glide = true; hint('hold jump to glide across the shadow'); }
      if (!game.hintShown.cloud && hero.x > poolCenter(6) - 1.0) { game.hintShown.cloud = true; hint('clouds pass over the windows… wait for the light'); }
      if (!game.hintShown.lant && hero.x > poolCenter(12) - 1.0) { game.hintShown.lant = true; hint('follow the swinging lanterns'); }

      if (hero.ground && hero.ground.kind === 'floor' && hero.x > GOAL_X - 2.6 && hero.x < GOAL_X + 3.5 && windowLight(hero.x, 0, 0, t) > LIT) startFinale();
