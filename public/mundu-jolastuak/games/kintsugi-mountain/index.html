<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- options
const Q = new URLSearchParams(location.search);
const OPT = {
  auto: Q.has('auto') || Q.has('bot'), bot: Q.has('bot'), view: Q.get('view'),
  x: Q.has('x') ? parseFloat(Q.get('x')) : null, fast: Q.has('fast') ? (parseFloat(Q.get('fast')) || 3) : 1,
  leaves: Q.has('leaves') ? parseInt(Q.get('leaves')) : 0, nopost: Q.has('nopost'), zoom: Q.has('zoom') ? parseFloat(Q.get('zoom')) : 1,
};

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
let seed = 1337;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();

// ---------------------------------------------------------------- renderer / scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0xd9d9dc, 1);
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const FOV = 30, CAM_DIST = 19;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.5, 1200);
camera.position.set(0, 4, CAM_DIST);

const U = { time: { value: 0 } };
const HAZE = new THREE.Color('#d9d9dc');
const GLOW_LAYER = 1;

// ---------------------------------------------------------------- shaders
const NOISE_GLSL = `
float hash12(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1.,0.)), f.x), mix(hash12(i+vec2(0.,1.)), hash12(i+vec2(1.,1.)), f.x), f.y); }`;

const PAINT_VS = `
uniform float uTime; uniform float uSway; uniform vec4 uUvRect; uniform float uFlip;
varying vec2 vUv; varying vec2 vLocal;
void main(){
  vLocal = uv;
  vec2 u = uv; if (uFlip > 0.5) u.x = 1.0 - u.x;
  vUv = uUvRect.xy + u * uUvRect.zw;
  vec3 p = position;
  if (uSway != 0.0) {
    vec4 wp = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    float h = uv.y * uv.y;
    p.x += (sin(uTime * 0.9 + wp.x * 0.37) * 0.7 + sin(uTime * 2.1 + wp.x * 1.3) * 0.3) * uSway * h;
    p.y += sin(uTime * 1.3 + wp.x) * uSway * 0.15 * h;
  }
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const PAINT_FS = `
uniform sampler2D map; uniform vec3 uHaze; uniform float uHazeAmt; uniform float uDark; uniform vec3 uTint;
uniform float uOpacity; uniform vec4 uEdge; uniform float uGlowMode; uniform float uLum; uniform float uBias;
varying vec2 vUv; varying vec2 vLocal;
void main(){
  vec4 c = texture2D(map, vUv, uBias);
  float a = c.a * uOpacity;
  if (uEdge.x > 0.0) a *= smoothstep(0.0, uEdge.x, vLocal.x);
  if (uEdge.y > 0.0) a *= smoothstep(0.0, uEdge.y, 1.0 - vLocal.x);
  if (uEdge.z > 0.0) a *= smoothstep(0.0, uEdge.z, vLocal.y);
  if (uEdge.w > 0.0) a *= smoothstep(0.0, uEdge.w, 1.0 - vLocal.y);
  if (a < 0.003) discard;
  if (uGlowMode > 1.5) { gl_FragColor = vec4(0.0, 0.0, 0.0, a); return; }           // glow occluder
  if (uGlowMode > 0.5) { gl_FragColor = vec4(c.rgb * uTint * a * uLum, 1.0); return; } // additive glow
  vec3 col = c.rgb * uTint;
  col = mix(col, vec3(0.018, 0.018, 0.022), uDark);
  col = mix(col, uHaze, uHazeAmt);
  gl_FragColor = vec4(col, a);
}`;

const RIDGE_FS = `
uniform sampler2D baseMap; uniform sampler2D goldMap; uniform sampler2D revealMap;
uniform vec3 uHaze; uniform float uHazeAmt; uniform float uErodeL; uniform float uErodeR; uniform float uGlowMode;
uniform float uGoldLift; uniform float uTime;
varying vec2 vUv; varying vec2 vLocal;
${NOISE_GLSL}
void main(){
  vec4 b = texture2D(baseMap, vUv);
  vec4 g = texture2D(goldMap, vUv);
  float r = texture2D(revealMap, vUv).r;
  float n = vnoise(vUv * vec2(260.0, 146.0));
  float rev = smoothstep(0.06, 0.5, r + (n - 0.5) * 0.16);
  float spark = smoothstep(0.02, 0.2, r) * (1.0 - smoothstep(0.3, 0.85, r));
  float shimmer = 0.85 + 0.15 * sin(uTime * 1.7 + vUv.x * 40.0 + vUv.y * 23.0);
  float ga = g.a * rev;
  float e = 1.0;
  float lowW = 0.03 + 0.16 * pow(1.0 - vUv.y, 2.5);          // eroded sides dissolve wider toward the bottom
  if (uErodeL > 0.0) e *= smoothstep(0.0, lowW, vUv.x - 0.004 + (vnoise(vec2(vUv.y * 38.0, 3.0)) - 0.5) * 0.028);
  if (uErodeR > 0.0) e *= smoothstep(0.0, lowW, 1.0 - vUv.x - 0.004 + (vnoise(vec2(vUv.y * 38.0, 7.0)) - 0.5) * 0.028);
  e *= smoothstep(0.0, 0.11, vUv.y + (vnoise(vec2(vUv.x * 30.0, 11.0)) - 0.5) * 0.03);   // bottom edge melts into the body / mist
  if (uGlowMode > 0.5) {
    gl_FragColor = vec4(g.rgb * ga * e * (0.42 * shimmer + 2.4 * spark + uGoldLift), 1.0);
    return;
  }
  vec3 col = mix(vec3(0.0095, 0.0098, 0.0125), b.rgb, smoothstep(0.0, 0.09, vUv.y));
  vec3 gold = g.rgb * (1.05 + 0.7 * spark) + vec3(1.0, 0.86, 0.55) * spark * 0.55;
  col = mix(col, gold, ga);
  float a = max(b.a, ga) * e;
  if (a < 0.003) discard;
  col = mix(col, uHaze, uHazeAmt);
  gl_FragColor = vec4(col, a);
}`;

const CHUNK_FS = `
uniform sampler2D baseMap; uniform sampler2D goldMap; uniform sampler2D labelMap;
uniform float uPiece; uniform float uReveal; uniform float uDark; uniform float uGlowMode; uniform float uOpacity;
uniform vec3 uHaze; uniform float uHazeAmt;
varying vec2 vUv; varying vec2 vLocal;
${NOISE_GLSL}
void main(){
  float lab = texture2D(labelMap, vUv).r * 255.0 / 16.0;
  if (abs(lab - uPiece) > 0.5) discard;
  vec4 b = texture2D(baseMap, vUv);
  vec4 g = texture2D(goldMap, vUv);
  float n = vnoise(vUv * vec2(320.0, 180.0));
  float front = uReveal * 1.3 - (vLocal.x * 0.55 + (1.0 - vLocal.y) * 0.3 + n * 0.25);
  float rev = smoothstep(0.0, 0.07, front);
  float spark = smoothstep(0.0, 0.04, front) * (1.0 - smoothstep(0.05, 0.3, front));
  float ga = g.a * rev;
  if (uGlowMode > 0.5) { gl_FragColor = vec4(g.rgb * ga * (0.45 + 2.6 * spark) * uOpacity, 1.0); return; }
  vec3 col = mix(b.rgb, vec3(0.02), uDark);
  col = mix(col, g.rgb * (1.05 + spark) + vec3(1.0, 0.86, 0.55) * spark * 0.6, ga);
  float a = max(b.a, ga) * uOpacity;
  if (a < 0.003) discard;
  col = mix(col, uHaze, uHazeAmt);
  gl_FragColor = vec4(col, a);
}`;

const BASE_FS = `
uniform vec3 uTop; uniform vec3 uBot; uniform float uErodeL; uniform float uErodeR; uniform float uGlowMode;
varying vec2 vUv; varying vec2 vLocal;
${NOISE_GLSL}
void main(){
  float e = 1.0;
  if (uErodeL > 0.0) e *= smoothstep(0.0, 0.03, vLocal.x - 0.004 + (vnoise(vec2(vLocal.y * 90.0, 3.0)) - 0.5) * 0.028);
  if (uErodeR > 0.0) e *= smoothstep(0.0, 0.03, 1.0 - vLocal.x - 0.004 + (vnoise(vec2(vLocal.y * 90.0, 7.0)) - 0.5) * 0.028);
  if (e < 0.01) discard;
  if (uGlowMode > 1.5) { gl_FragColor = vec4(0.0, 0.0, 0.0, e); return; }
  gl_FragColor = vec4(mix(uBot, uTop, smoothstep(0.6, 1.0, vLocal.y)), e);
}`;

const PART_VS = `
attribute vec4 aData; attribute vec3 aTint;
uniform float uScale;
varying float vRot; varying float vFrame; varying float vAlpha; varying vec3 vTint;
void main(){
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = aData.x * uScale / max(0.1, -mv.z);
  vRot = aData.y; vFrame = aData.z; vAlpha = aData.w; vTint = aTint;
}`;
const PART_FS = `
uniform sampler2D map; uniform float uCols; uniform float uGlowMode; uniform float uLum;
varying float vRot; varying float vFrame; varying float vAlpha; varying vec3 vTint;
void main(){
  vec2 p = gl_PointCoord - 0.5;
  float c = cos(vRot), s = sin(vRot);
  p = mat2(c, -s, s, c) * p * 1.35 + 0.5;
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) discard;
  vec4 t;
  if (vFrame < -0.5) {                     // procedural soft glow mote
    float d = length(p - 0.5) * 2.0;
    t = vec4(1.0, 0.9, 0.7, smoothstep(1.0, 0.0, d) * smoothstep(1.0, 0.3, d));
  } else {
    float fx = mod(vFrame, uCols), fy = floor(vFrame / uCols);
    vec2 uv = (vec2(fx, uCols - 1.0 - fy) + vec2(p.x, 1.0 - p.y)) / uCols;
    t = texture2D(map, uv);
  }
  float a = t.a * vAlpha;
  if (a < 0.004) discard;
  if (uGlowMode > 0.5) { gl_FragColor = vec4(t.rgb * vTint * a * uLum, 1.0); return; }
  gl_FragColor = vec4(t.rgb * vTint, a);
}`;

const COMPOSE = {
  uniforms: {
    tDiffuse: { value: null }, tBloom: { value: null }, uBloom: { value: 1.0 }, uTime: { value: 0 },
    uFade: { value: 0 }, uFadeColor: { value: new THREE.Color('#efede8') }, uVignette: { value: 0.22 },
    uRes: { value: new THREE.Vector2(1, 1) }, uWarm: { value: 0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
  uniform sampler2D tDiffuse; uniform sampler2D tBloom; uniform float uBloom; uniform float uTime;
  uniform float uFade; uniform vec3 uFadeColor; uniform float uVignette; uniform vec2 uRes; uniform float uWarm;
  varying vec2 vUv;
  ${NOISE_GLSL}
  void main(){
    vec3 base = texture2D(tDiffuse, vUv).rgb;
    vec3 bl = texture2D(tBloom, vUv).rgb;
    vec3 c = base + bl * uBloom;
    float m = max(c.r, max(c.g, c.b));
    if (m > 0.9) { float k = 0.9 + 0.1 * (1.0 - exp(-(m - 0.9) / 0.1)); vec3 h = c * (k / m); c = mix(h, vec3(k), smoothstep(1.6, 5.0, m) * 0.55); }
    // rice-paper grain + fibres
    vec2 px = vUv * uRes;
    float grain = vnoise(px * 0.9) * 0.5 + vnoise(px * 0.23 + 7.0) * 0.35 + vnoise(vec2(px.x * 0.012, px.y * 0.21)) * 0.15;
    c *= 0.965 + grain * 0.06;
    c = mix(c, c * c * (3.0 - 2.0 * c), 0.22);   // gentle S-curve: deeper ink, brighter paper
    // gentle warm wash from gold
    c += vec3(0.05, 0.035, 0.0) * uWarm * (1.0 - vUv.y * 0.5);
    vec2 d = vUv - 0.5;
    float v = smoothstep(0.95, 0.25, length(d * vec2(1.0, 1.25)));
    c *= mix(1.0 - uVignette, 1.0, v);
    c = mix(c, uFadeColor, uFade);
    gl_FragColor = vec4(c, 1.0);
  }`,
};

// ---------------------------------------------------------------- loading
const texLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();
function loadTex(url, { srgb = true, mip = true, nearest = false } = {}) {
  return new Promise((res) => texLoader.load(url, (t) => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = MAX_ANISO;
    if (nearest) { t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; }
    else if (!mip) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
    res(t);
  }, undefined, () => { console.warn('missing texture', url); res(null); }));
}
const loadJSON = (url) => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
const loadGLB = (url) => new Promise((res) => gltfLoader.load(url, res, undefined, () => { console.warn('missing glb', url); res(null); }));

// ---------------------------------------------------------------- level
const SEG_W = 16, SEG_H = 16 * 1536 / 2752;
const FOOT_SINK = 0.1, STEP_UP = 0.42;
const MASK_W = 688, MASK_H = 384;
const LEVEL = {
  segs: [
    { key: 'seg1', x: 0, y: 0, erodeL: 1, erodeR: 1 },
    { key: 'seg2', x: 23, y: 3.42, erodeL: 0, erodeR: 1 },
    { key: 'seg3', x: 40.4, y: 7.55, erodeL: 1, erodeR: 1 },
    { key: 'seg4', x: 62.4, y: 11.62, erodeL: 1, erodeR: 1 },
    { key: 'seg5', x: 83.8, y: 16.15, erodeL: 1, erodeR: 0 },
  ],
  bridges: [{ x0: 15.75, x1: 23.35, top: 7.32 }, { x0: 56.15, x1: 62.7, top: 14.12 }],
  stones: [{ x: 78.8, top: 19.55, piece: 2, s: 0.34 }, { x: 80.4, top: 20.2, piece: 4, s: 0.34 }, { x: 82.0, top: 20.85, piece: 3, s: 0.34 }],
  lanterns: [2.6, 37.6, 50.2, 76.4],
  altar: 93.6,
  start: 1.0,
  pickups: [
    [4.6, 1.15], [6.9, 1.9], [9.4, 1.2], [11.6, 2.1], [13.6, 1.2], [15.0, 1.5],
    [27.6, 1.35], [31.0, 1.35], [34.4, 1.35], [36.3, 1.6],
    [39.7, 1.2, 12.9],
    [44.8, 1.25], [47.5, 2.0], [52.4, 1.25], [54.6, 1.7],
    [65.2, 1.25], [68.6, 1.9], [71.6, 1.25], [74.2, 1.7],
    [85.8, 1.3], [88.2, 1.5],
  ],
};

// ---------------------------------------------------------------- generic painted sprites
const quadGeo = new THREE.PlaneGeometry(1, 1);
const swayGeo = new THREE.PlaneGeometry(1, 1, 1, 12);
function paintMat(tex, o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: tex }, uHaze: { value: HAZE }, uHazeAmt: { value: o.haze || 0 }, uDark: { value: o.dark || 0 },
      uTint: { value: new THREE.Color(o.tint ?? 0xffffff) }, uOpacity: { value: o.opacity ?? 1 }, uTime: U.time,
      uSway: { value: o.sway || 0 }, uEdge: { value: new THREE.Vector4(...(o.edge || (o.edgeFade ? [o.edgeFade, o.edgeFade, o.edgeFade * 0.6, o.edgeFade * 0.6] : [0, 0, 0, 0]))) }, uUvRect: { value: o.uvRect || new THREE.Vector4(0, 0, 1, 1) },
      uFlip: { value: o.flip ? 1 : 0 }, uGlowMode: { value: o.glowMode || 0 }, uLum: { value: o.lum ?? 1 }, uBias: { value: o.bias ?? (o.z > 2.5 ? 1.6 : 0) },
    },
    vertexShader: PAINT_VS, fragmentShader: PAINT_FS, transparent: true, depthWrite: false,
    blending: o.glowMode === 1 ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
}
// add a painted sprite; (x,y) = bottom-centre unless anchor === 'center'
function addSprite(tex, o) {
  if (!tex) return null;
  const asp = tex.image.width / tex.image.height * (o.uvAspect || 1);
  const w = o.w ?? o.h * asp, h = o.h ?? o.w / asp;
  const mat = paintMat(tex, o);
  const m = new THREE.Mesh(o.sway ? swayGeo : quadGeo, mat);
  m.scale.set(w, h, 1);
  m.position.set(o.x, o.anchor === 'center' ? o.y : o.y + h / 2, o.z || 0);
  if (o.rot) m.rotation.z = o.rot;
  m.frustumCulled = true;
  (o.parent || scene).add(m);
  if (o.occludeGlow) {                      // black twin in the glow pass so gold does not bleed through

const heap = new Heap();

// ---------------------------------------------------------------- ridge segment
class Segment {
  constructor(def, base, gold, profile) {
    Object.assign(this, def);

      if (isNaN(x)) return NaN;

    this.revealTex.minFilter = this.revealTex.magFilter = THREE.LinearFilter; this.revealTex.generateMipmaps = false;
    this.revealTex.needsUpdate = true;

      uHazeAmt: { value: 0 }, uErodeL: { value: def.erodeL || 0 }, uErodeR: { value: def.erodeR || 0 }, uGlowMode: { value: glow },
      uGoldLift: { value: 0 }, uTime: U.time,
    });
    this.mat = new THREE.ShaderMaterial({ uniforms: uni(0), vertexShader: PAINT_VS.replace('uniform float uTime; uniform float uSway; uniform vec4 uUvRect; uniform float uFlip;', 'uniform float uTime; const float uSway = 0.0; const vec4 uUvRect = vec4(0.,0.,1.,1.); const float uFlip = 0.0;'), fragmentShader: RIDGE_FS, transparent: true, depthWrite: false });
    this.glowMat = new THREE.ShaderMaterial({ uniforms: uni(1), vertexShader: this.mat.vertexShader, fragmentShader: RIDGE_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    this.mesh = new THREE.Mesh(geo, this.mat);
    this.mesh.position.set(this.x + SEG_W / 2, this.y + SEG_H / 2, 0);
    scene.add(this.mesh);
    const gm = new THREE.Mesh(geo, this.glowMat); gm.layers.set(GLOW_LAYER); this.mesh.add(gm);

// ---------------------------------------------------------------- bridge chunks / stepping stones
class Chunk {
  constructor(B, piece, place) {
    this.B = B; this.piece = piece;
    const W = B.pieces.w, H = B.pieces.h, p = piece;
    this.s = place.s;
    this.wWorld = (p.x1 - p.x0) / W * SEG_W * this.s;
    this.hWorld = (p.y1 - p.y0) / H * SEG_H * this.s;
    this.px = place.px; this.py = place.py;                       // bottom-left when placed
    this.rect = new THREE.Vector4(p.x0 / W, 1 - p.y1 / H, (p.x1 - p.x0) / W, (p.y1 - p.y0) / H);
    const uni = (glow) => ({
      baseMap: { value: B.base }, goldMap: { value: B.gold }, labelMap: { value: B.label }, uPiece: { value: p.id },
      uReveal: { value: 0 }, uDark: { value: 0.18 }, uGlowMode: { value: glow }, uOpacity: { value: 1 }, uHaze: { value: HAZE }, uHazeAmt: { value: 0 },
    });

    this.glowMat = new THREE.ShaderMaterial({ uniforms: u1, vertexShader: vs, fragmentShader: CHUNK_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    this.mesh = new THREE.Mesh(quadGeo, this.mat);
    this.mesh.scale.set(this.wWorld, this.hWorld, 1);
    scene.add(this.mesh);
    const g = new THREE.Mesh(quadGeo, this.glowMat); g.layers.set(GLOW_LAYER); this.mesh.add(g);
    // broken pose: sunk into the chasm, tilted

    this.socket = null;
  }
  get placed() { return this.state === 'placed'; }
  topAt(x) {
    if (!this.placed) return null;

// ---------------------------------------------------------------- particles (gold leaf, motes, mist dust)
class Particles {
  constructor(max, tex, cols, { glow = 0, glowLum = 1.0, z = 0 } = {}) {
    this.max = max; this.cols = cols;
    this.pos = new Float32Array(max * 3); this.data = new Float32Array(max * 4); this.tint = new Float32Array(max * 3).fill(1);
    this.vel = new Float32Array(max * 3); this.life = new Float32Array(max); this.age = new Float32Array(max);
    this.size = new Float32Array(max); this.spin = new Float32Array(max); this.kind = new Uint8Array(max); this.ph = new Float32Array(max);
    this.alive = 0; this.next = 0;

    this.aData = new THREE.BufferAttribute(this.data, 4).setUsage(THREE.DynamicDrawUsage);

    geo.setAttribute('position', this.aPos); geo.setAttribute('aData', this.aData); geo.setAttribute('aTint', this.aTint);

  }
  spawn(x, y, z, o) {
    const i = this.next; this.next = (this.next + 1) % this.max;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = o.vx || 0; this.vel[i * 3 + 1] = o.vy || 0; this.vel[i * 3 + 2] = o.vz || 0;
    this.life[i] = o.life || 2; this.age[i] = 0; this.size[i] = o.size || 0.15; this.spin[i] = o.spin || 0;

// ---------------------------------------------------------------- audio
const Sfx = {
  ctx: null, buf: {}, master: null, music: null, muted: false, ready: false,
  files: { chime: 'chime.mp3', pickup: 'pickup.mp3', mend: 'mend.mp3', bell: 'bell.mp3', jump: 'jump.mp3', land: 'land.mp3', stone: 'stone.mp3', gong: 'gong.mp3', wind: 'wind.mp3', music: 'music.mp3', whoosh: 'whoosh.mp3', empty: 'empty.mp3' },
  async init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
    await Promise.all(Object.entries(this.files).map(async ([k, f]) => {
      try { const r = await fetch('assets/audio/' + f); if (!r.ok) return; this.buf[k] = await this.ctx.decodeAudioData(await r.arrayBuffer()); } catch (e) { }
    }));
    this.ready = true;
  },
  play(name, { vol = 1, rate = 1, delay = 0 } = {}) {
    if (!this.ctx || !this.buf[name]) return null;
    const s = this.ctx.createBufferSource(); s.buffer = this.buf[name]; s.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = vol; s.connect(g); g.connect(this.master);
    s.start(this.ctx.currentTime + delay); return { s, g };
  },
  loop(name, vol, fade = 3) {
    if (!this.ctx || !this.buf[name]) return null;
    const s = this.ctx.createBufferSource(); s.buffer = this.buf[name]; s.loop = true;
    const g = this.ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + fade);
    s.connect(g); g.connect(this.master); s.start(); return { s, g };
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.1); },
};
const PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2];

// ---------------------------------------------------------------- input
const keys = new Set();

const isRight = () => keys.has('ArrowRight') || keys.has('KeyD') || touch.right;

// ---------------------------------------------------------------- world queries
function groundAt(x, yRef) {
  let best = -Infinity;
  for (const s of segs) {
    if (x < s.x - 0.3 || x > s.x + SEG_W + 0.3) continue;
    for (const dx of [-0.13, 0, 0.13]) {
      const h = s.heightAt(x + dx);
      if (h !== null && h <= yRef + STEP_UP && h > best) best = h;
    }
  }
  for (const c of chunks) {
    if (!c.placed) continue;
    for (const dx of [-0.1, 0, 0.1]) {
      const h = c.topAt(x + dx);
      if (h !== null && h <= yRef + STEP_UP && h > best) best = h;
    }
  }
  return best;
}
function wallAt(x, y) {
  for (const s of segs) {
    const h = s.heightAt(x);
    if (h !== null && h > y + STEP_UP && s.y < y + 0.9) return true;
  }
  for (const c of chunks) {
    const h = c.topAt(x);
    if (h !== null && h > y + STEP_UP && c.py < y + 0.9) return true;
  }
  return false;
}
function segAt(x) { return segs.find(s => x >= s.x && x <= s.x + SEG_W && s.heightAt(x) !== null); }

}
class Monk {
  constructor() {

    this.coyote = 0; this.stepAcc = 0; this.foot = 0; this.mending = false; this.landT = 0; this.airT = 0;

  setModel(gltf) {
    const model = gltf.scene;
    model.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);
    const h = box.max.y - box.min.y;
    const s = this.height / h;
    const wrap = new THREE.Group();
    model.scale.multiplyScalar(s);
    model.position.set(-(box.min.x + box.max.x) / 2 * s, -box.min.y * s, -(box.min.z + box.max.z) / 2 * s);

    this.root.add(wrap); this.wrap = wrap; this.model = model;
    const toAdd = [];
    model.traverse((o) => {
      if (o.isBone && /neck/i.test(o.name) && !this.neck) this.neck = o;
      if (o.isBone && o.name === 'LeftFoot') this.lf = o;
      if (o.isBone && o.name === 'RightFoot') this.rf = o;
      if (o.isMesh) {
        const old = o.material;

    const clips = { idle: byName.idle, walk: byName.walk || byName.walkb, jump: byName.jump, kneel: byName.kneel, bow: byName.bow, idle3: byName.idle3 };
    this.mixer = new THREE.AnimationMixer(model);

      let pick = m1;
      if (m2 && m2.speed > m1.speed * 1.4) { pick = m2; this.actions.walk = this.mixer.clipAction(byName.walkb); for (const t of byName.walkb.tracks) if (/^Hips\.position$/.test(t.name)) { const v = t.values, x0 = v[0], z0 = v[2]; for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; } } }

// ---------------------------------------------------------------- procedural scarf (verlet ribbon)
class Scarf {
  constructor(n = 14, seg = 0.068) {
    this.n = n; this.seg = seg;
    this.p = Array.from({ length: n }, (_, i) => new THREE.Vector3(-i * seg, 0.6, 0.25));
    const geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(n * 2 * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    const idx = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    geo.setIndex(idx);
    this.geo = geo;
    this.mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x3b2318, side: THREE.DoubleSide }));
    this.mesh.frustumCulled = false; scene.add(this.mesh);
    this.droop = 1.0;
  }
  reset(a) { for (let i = 0; i < this.n; i++) this.p[i].set(a.x - i * this.seg, a.y, a.z); }
  // spring-follow a travelling-wave target shape: hangs when idle, streams behind when walking
  update(dt, anchor, speed, facing, time, air) {
    if (dt <= 0) return;
    const want = lerp(1.2, 0.18, clamp(speed / 2.4, 0, 1)) + (air ? -0.25 : 0) + Math.sin(time * 0.7) * 0.08;
    this.droop = damp(this.droop, want, 3, dt);
    let tx = anchor.x, ty = anchor.y;
    this.p[0].copy(anchor);
    for (let i = 1; i < this.n; i++) {
      const k = i / (this.n - 1);
      const wave = Math.sin(time * (4.5 + speed) - i * 0.62) * (0.16 + 0.32 * k) * (0.5 + 0.5 * clamp(speed, 0, 1.5));
      const ang = this.droop + wave;
      tx -= facing * Math.cos(ang) * this.seg; ty -= Math.sin(ang) * this.seg;
      const p = this.p[i];
      const rate = 1 - Math.exp(-lerp(26, 7, k) * dt);
      p.x += (tx - p.x) * rate; p.y += (ty - p.y) * rate; p.z = anchor.z - 0.015 - i * 0.004;
    }
    for (let it = 0; it < 2; it++) for (let i = 1; i < this.n; i++) {
      const a = this.p[i - 1], b = this.p[i];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-5;
      const c = (d - this.seg) / d;
      b.x -= dx * c; b.y -= dy * c;
    }
    for (let i = 0; i < this.n; i++) {
      const a = this.p[Math.max(0, i - 1)], b = this.p[Math.min(this.n - 1, i + 1)];
      let ux = b.x - a.x, uy = b.y - a.y; const l = Math.hypot(ux, uy) || 1;
      ux /= l; uy /= l;
      const w = lerp(0.1, 0.04, i / (this.n - 1));
      const p = this.p[i];
      this.pos.set([p.x - uy * w * 0.5, p.y + ux * w * 0.5, p.z, p.x + uy * w * 0.5, p.y - ux * w * 0.5, p.z], i * 6);
    }
    this.geo.attributes.position.needsUpdate = true;
  }
}

  constructor(tex) {

    this.mesh = addSprite(tex, { x: 0, y: 0, z: 0.55, h: 0.58, uvAspect: 0.25, anchor: 'center', uvRect: this.rect, glow: 0.35, tint: 0xfff6e0 });

    scene.add(this.light);
    this.orbit = [];
  }
  update(dt, time, monk) {
    const tx = monk.x + monk.facing * 0.42, ty = monk.y + 1.28 + Math.sin(time * 2.2) * 0.07;
    const ax = (tx - this.x) * 26 - this.vx * 7.5, ay = (ty - this.y) * 26 - this.vy * 7.5;
    this.vx += ax * dt; this.vy += ay * dt; this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.shake > 0) { this.shake -= dt; }
    const sh = this.shake > 0 ? Math.sin(time * 60) * 0.05 * this.shake : 0;
    const speed = Math.hypot(this.vx, this.vy);
    this.ft += dt * (7 + speed * 3);
    this.frame = Math.floor(this.ft) % 4;
    this.rect.x = this.frame * 0.25;
    if (this.mesh) {
      this.mesh.position.set(this.x + sh, this.y, 0.55);
      this.mesh.scale.x = Math.abs(this.mesh.scale.x) * (monk.facing >= 0 ? 1 : -1);
      this.mesh.rotation.z = clamp(this.vy * 0.06, -0.3, 0.3) * monk.facing;
    }
    this.light.position.set(this.x, this.y, 1.0);
    this.halo.position.set(this.x, this.y - 0.05, 0.5);
    this.halo.userData.set(0.2 + Game.carried * 0.02 + Math.sin(time * 3) * 0.03);
    this.light.intensity = 0.55 + Game.carried * 0.04 + Math.sin(time * 3) * 0.05;
  }
}

    for (const st of LEVEL.stones) {

    [44.8, -0.6, 'pine2', 2.6], [50.2, 0.65, 'pine3', 1.25], [54.4, -0.7, 'pine4', 2.7], [67.5, -0.6, 'pine1', 3.4], [73.2, 0.7, 'pine3', 1.35], [88.0, -0.6, 'pine2', 2.8], [97.5, -0.6, 'pine1', 3.6]];
  for (const [x, z, k, h] of ridgePines) {

    if (g > -Infinity) addSprite(tex[k], { x, y: g - 0.15, z, h, sway: 0.05, haze: z < 0 ? 0.04 : 0 });

  // --- foreground ink silhouettes (closest parallax layer)

  const fgList = [[14, -4.2, 7, 'fg2', 7.5], [24, -1.8, 6.5, 'fg1', 8], [37, 2.6, 7.5, 'fg4', 4.2], [47, 3.4, 6.2, 'fg3', 9], [60, 6.8, 7, 'fg2', 8], [71, 9.6, 6.5, 'fg1', 8.5], [86, 13.5, 7, 'fg3', 9.5], [99, 16.4, 6.5, 'fg4', 4.6]];
  for (const [x, y, z, k, w] of fgList) fgSprites.push(addSprite(tex[k], { x, y, z, w, dark: 0.55, sway: k === 'fg3' || k === 'fg4' ? 0.06 : 0, occludeGlow: true, edge: k === 'fg3' ? [0.32, 0, 0, 0] : [0, 0, 0.2, 0] }));
  for (let i = 0; i < 8; i++) { const m = addSprite(tex[mistK[i % 3]], { x: -6 + i * 14 + rr(-2, 2), y: -1.5 + i * 2.6, z: 3.2, w: rr(10, 16), opacity: 0.26, edgeFade: 0.15, anchor: 'center' }); m.userData.drift = rr(0.4, 0.8); fgSprites.push(m); }
  // overhanging black pine branches drifting past close to the lens, as in the source video

  // --- lanterns, with small cracked cairns beside them

  for (const [x, k, h, z] of [[1.7, 'cairn1', 0.62, -0.5], [38.6, 'cairn2', 0.7, -0.5], [49.3, 'cairn1', 0.55, -0.55], [77.3, 'cairn2', 0.62, -0.5], [90.6, 'cairn1', 0.6, -0.5], [96.6, 'cairn2', 0.75, -0.5]]) {

  }
  // stone pedestal for the summit bowl
  { const g = groundAt(LEVEL.altar, 99); addSprite(tex.pedestal, { x: LEVEL.altar, y: g - 0.1, z: -0.15, h: 0.62 }); }
  // --- summit altar with the broken bowl

  // --- pickups: floating gold leaves

  // --- particles

// ---------------------------------------------------------------- continuous dark mountain body under the painted ridge
function buildBody() {
  const xs = [], ys = [];
  const topAt = (x) => {
    for (const s of segs) if (x >= s.x + (s.erodeL ? 1.6 : -0.2) && x <= s.x + SEG_W - (s.erodeR ? 1.6 : -0.2)) return s.y + 0.9;
    const L = segs.filter(s => s.x + SEG_W / 2 < x).pop(), R = segs.find(s => s.x + SEG_W / 2 > x);
    if (!L) return segs[0].y + 0.9 - (segs[0].x - x) * 0.05;
    if (!R) return L.y + 0.9;
    // ravines: rock walls slope steeply down from both inset edges into deep mist (a V-shaped valley)
    const le = L.x + SEG_W - (L.erodeR ? 1.6 : -0.2), re = R.x + (R.erodeL ? 1.6 : -0.2);
    return Math.max(Math.min(L.y, R.y) - 16, Math.max(L.y + 0.9 - (x - le) * 2.4, R.y + 0.9 - (re - x) * 2.4));
  };
  for (let x = -40; x <= 140; x += 0.25) { xs.push(x); ys.push(topAt(x)); }
  const sm = ys.map((_, i) => { let a = 0, n = 0; for (let k = -3; k <= 3; k++) { const v = ys[i + k]; if (v !== undefined) { a += v; n++; } } return a / n; });
  const pos = [], idx = [], dep = [];
  for (let i = 0; i < xs.length; i++) {
    const jag = Math.sin(xs[i] * 3.1) * 0.08 + Math.sin(xs[i] * 7.7) * 0.05;
    pos.push(xs[i], sm[i] + jag, 0, xs[i], sm[i] - 60, 0);
    dep.push(0, 60);
    if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('aDepth', new THREE.Float32BufferAttribute(dep, 1)); g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: { uTop: { value: new THREE.Color('#18191d') }, uMist: { value: HAZE } },
    vertexShader: `attribute float aDepth; varying float vD; varying vec2 vW; void main(){ vD = aDepth; vW = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 uTop; uniform vec3 uMist; varying float vD; varying vec2 vW;
      ${NOISE_GLSL}
      void main(){
        float w = sin(vW.x * 0.21) * 1.2 + sin(vW.x * 0.07 + 1.3) * 1.0;
        float k = smoothstep(2.5, 12.0, vD + w);
        gl_FragColor = vec4(mix(uTop, uMist, k * k * (3.0 - 2.0 * k)), 1.0);
      }`,
  }));
  m.position.z = -0.4; m.frustumCulled = false; scene.add(m);
  Game.bodyTop = topAt;
}

// ---------------------------------------------------------------- lanterns & altar (GLB from fal image-to-3D)
function prepProp(gltf, height) {
  const m = gltf.scene.clone(true);
  m.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m);
  const s = height / (box.max.y - box.min.y);
  m.scale.setScalar(s);
  m.position.set(-(box.min.x + box.max.x) / 2 * s, -box.min.y * s, -(box.min.z + box.max.z) / 2 * s);
  m.traverse((o) => {
    if (o.isMesh) {
      const old = o.material;
      o.material = new THREE.MeshToonMaterial({ map: old.map || null, color: old.map ? 0xffffff : (old.color || 0x888888), gradientMap: TOON });
      o.material.userData.emissiveTarget = 0;
    }
  });
  const g = new THREE.Group(); g.add(m); return g;
}
function makeLantern(gltf, x) {
  const y = groundAt(x, 99);
  const g = gltf ? prepProp(gltf, 1.25) : (() => {
    const gg = new THREE.Group();
    const mat = new THREE.MeshToonMaterial({ color: 0x6d6d70, gradientMap: TOON });
    const parts = [[0.18, 0.5, 0.18, 0.25], [0.5, 0.08, 0.5, 0.54], [0.34, 0.3, 0.34, 0.73], [0.6, 0.1, 0.6, 0.93], [0.1, 0.14, 0.1, 1.05]];
    for (const [w, h, d, py] of parts) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); b.position.y = py; gg.add(b); }
    return gg;
  })();
  g.position.set(x, y - 0.05, -0.35);
  g.rotation.y = 0.5;
  scene.add(g);
  const light = new THREE.PointLight(0xffc35a, 0, 6, 1.5); light.position.set(x, y + 0.75, 0.4); scene.add(light);
  const halo = makeGlow(x, y + 0.82, -0.1, 1.5, 0xffb648, 0, 0.18);
  const mats = []; g.traverse(o => { if (o.isMesh) mats.push(o.material); });
  return { x, y, g, light, halo, mats, lit: false, t: 0 };
}
function makeAltar(broken, whole, x) {
  const y = groundAt(x, 99);
  const grp = new THREE.Group(); grp.position.set(x, y + 0.47, 0.05); scene.add(grp);
  const mk = (gl, h, col) => gl ? prepProp(gl, h) : (() => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshToonMaterial({ color: col, gradientMap: TOON, side: THREE.DoubleSide })); m.rotation.x = Math.PI; m.position.y = 0.3; const g = new THREE.Group(); g.add(m); return g; })();
  const b = mk(broken, 0.6, 0x3a3634); grp.add(b);
  const w = mk(whole, 0.6, 0x2c2a29); w.visible = false; grp.add(w);
  w.traverse(o => { if (o.isMesh && o.material.map) { o.material.emissiveMap = o.material.map; o.material.emissive = new THREE.Color(1.0, 0.78, 0.4); o.material.emissiveIntensity = 0; o.material.needsUpdate = true; } });
  b.rotation.y = w.rotation.y = -0.5;
  const light = new THREE.PointLight(0xffc35a, 0, 9, 1.4); light.position.set(x, y + 1.3, 0.8); scene.add(light);
  const halo = makeGlow(x, y + 1.0, -0.3, 2.8, 0xffbe55, 0, 0.16);
  return { x, y, grp, broken: b, whole: w, light, halo, lift: 0 };
}

// ---------------------------------------------------------------- camera
const camState = { x: 0, y: 0, z: CAM_DIST, lx: 0, ly: 0, shake: 0 };
const _dir = new THREE.Vector3();
function updateCamera(dt, time) {
  let tx, ty, tz = CAM_DIST;
  if (OPT.view === 'overview') { tx = 50; ty = 12; tz = 150; }
  else if (Game.state === 'finale' || Game.state === 'end') {
    const k = smooth(clamp((Game.finaleT - 1.4) / 8.0, 0, 1));
    tx = lerp(monk.x + 0.8, 72, k); ty = lerp(monk.y + 1.3, 21.0, k); tz = lerp(CAM_DIST * 0.8, 46, k);
  } else if (Game.state === 'title' || Game.state === 'loading') {
    tx = monk.x + 3.2; ty = monk.y + 2.2; tz = CAM_DIST * 1.08;
  } else {
    tx = monk.x + monk.facing * 2.0 * OPT.zoom + monk.vx * 0.25; ty = monk.y + 1.05 * OPT.zoom; tz = CAM_DIST * OPT.zoom;
    if (Game.state === 'respawn' || (!monk.onGround && monk.vy < -6)) ty = Math.max(ty, (Game.lastGroundY ?? ty) - 1.5);
  }
  const k = Game.state === 'finale' ? 1.6 : 2.4;
  camState.x = damp(camState.x, tx, k, dt); camState.y = damp(camState.y, ty, k * 0.8, dt); camState.z = damp(camState.z, tz, 1.6, dt);
  const swx = Math.sin(time * 0.11) * 1.1 + Math.sin(time * 0.043) * 0.6, swy = Math.sin(time * 0.083) * 0.45;
  const sh = camState.shake > 0 ? camState.shake : 0; camState.shake = Math.max(0, camState.shake - dt * 2);
  camera.position.set(camState.x + swx + (rnd() - 0.5) * sh * 0.1, camState.y + 1.1 + swy + (rnd() - 0.5) * sh * 0.1, camState.z);
  camera.lookAt(camState.x + swx * 0.35, camState.y + swy * 0.2, 0);
  camera.rotateZ(-0.05);
  if (SKY) {   // sky plate at infinity: locked to the view so it always covers the frame
    const d = 600, hh = 2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * d * 1.2;
    camera.updateMatrixWorld(); camera.getWorldDirection(_dir);
    SKY.position.copy(camera.position).addScaledVector(_dir, d);
    SKY.quaternion.copy(camera.quaternion);
    SKY.scale.set(hh * camera.aspect, hh, 1);
  }
}

// ---------------------------------------------------------------- gameplay
const _v = new THREE.Vector3();
function footstep(bone) {
  let fx = monk.x + monk.facing * 0.08; const fy = monk.y;
  if (bone) { bone.getWorldPosition(_v); fx = _v.x; }
  monk.foot ^= 1;
  for (let i = 0; i < 3; i++) leaves.spawn(fx + rr(-0.12, 0.12), fy + 0.05, rr(0.1, 0.5), { vx: rr(-0.6, 0.6) - monk.vx * 0.12, vy: rr(0.8, 1.9), life: rr(1.2, 2.2), size: rr(0.08, 0.14), spin: rr(-6, 6), kind: 0 });
  const s = segAt(fx);
  if (s) s.spread(fx, fy, 78, 120, Game.t);
  Sfx.play('chime', { vol: 0.32, rate: PENTA[Math.floor(rnd() * PENTA.length)] * 0.5 });
}
function collect(p) {

  p.fly = { t: 0, x: p.x, y: p.y };
  for (let i = 0; i < 14; i++) leaves.spawn(p.x, p.y, 0.5, { vx: rr(-1.6, 1.6), vy: rr(-0.6, 2.2), life: rr(0.8, 1.6), size: rr(0.06, 0.12), spin: rr(-8, 8), kind: 2 });

}
function lightLantern(L) {

  const s = segAt(L.x); if (s) s.spread(L.x, L.y, 430, 240, Game.t);
  for (let i = 0; i < 40; i++) leaves.spawn(L.x + rr(-0.3, 0.3), L.y + rr(0.3, 1.0), 0.2, { vx: rr(-2, 2), vy: rr(0.5, 3.2), life: rr(1.5, 3), size: rr(0.08, 0.16), spin: rr(-6, 6), kind: 0 });
  Sfx.play('bell', { vol: 0.42 });
}
let flyingLeaf = null;
function mendUpdate(dt, holding) {
  let active = null;
  for (const t of targets) {
    if (t.done) continue;
    if (monk.x >= t.x0 && monk.x <= t.x1 && monk.onGround) { active = t; break; }
  }
  Game.activeTarget = active;
  monk.mending = false;
  const needs = active && (active.type === 'altar' ? (active.paid || 0) < 4 : active.chunks.some(c => c.state === 'broken' && !c.claimed));
  if (needs && Game.carried === 0 && !flyingLeaf) {
    Game.giftT = (Game.giftT || 0) + dt;
    if (Game.giftT > 3.2) { Game.giftT = 0; giftLeaf(); }
  } else Game.giftT = 0;
  if (!active || !holding) return;
  monk.mending = true;
  if (active.type === 'altar') {
    if ((active.paid || 0) < 4) {
      if (flyingLeaf) return;
      if (Game.carried <= 0) { if (Game.emptyPulse <= 0) { Game.emptyPulse = 1.2; bird.shake = 0.6; Sfx.play('empty', { vol: 0.6 }); } return; }
      Game.carried--; active.paid = (active.paid || 0) + 1;
      flyingLeaf = { t: 0, from: new THREE.Vector3(bird.x, bird.y, 0.5), altar: true };
      Sfx.play('mend', { vol: 0.3, rate: 0.8 + 0.1 * active.paid });
      return;
    }
    active.progress = Math.min(1, active.progress + dt / 2.0);
    if (rnd() < dt * 30) sparks_to(altar.x + rr(-0.2, 0.2), altar.y + 0.8);
    if (active.progress >= 1) { active.done = true; startFinale(); }
    return;
  }
  const next = active.chunks.find(c => c.state === 'broken' && !c.claimed);
  if (!next) { if (active.chunks.every(c => c.placed)) completeTarget(active); return; }
  if (flyingLeaf) return;
  if (Game.carried <= 0) {
    if (Game.emptyPulse <= 0) { Game.emptyPulse = 1.2; bird.shake = 0.6; Sfx.play('empty', { vol: 0.6 }); }
    return;
  }
  Game.carried--; next.claimed = true;
  flyingLeaf = { t: 0, from: new THREE.Vector3(bird.x, bird.y, 0.5), c: next };
  Sfx.play('mend', { vol: 0.28, rate: 0.9 + 0.08 * active.chunks.indexOf(next) });
}
function giftLeaf() {
  const f = [4, 13, 14][Math.floor(rnd() * 3)];
  const x = camera.position.x - 11, y = monk.y + 3.5;
  const m = addSprite(Game.leafTex, { x, y, z: 0.5, w: 0.5, h: 0.5, anchor: 'center', uvRect: new THREE.Vector4((f % 4) * 0.25, (3 - Math.floor(f / 4)) * 0.25, 0.25, 0.25), glow: 0.5 });
  pickups.push({ x, y, mesh: m, taken: true, ph: rnd() * 6.28, fly: { t: 0, x, y }, gift: true });
}
function sparks_to(x, y) {
  leaves.spawn(monk.x + monk.facing * 0.2 + rr(-0.1, 0.1), monk.y + 0.6, 0.5, { vx: (x - monk.x) * 0.9 + rr(-0.3, 0.3), vy: (y - monk.y) * 0.6 + rr(0.6, 1.6), life: rr(0.7, 1.2), size: rr(0.05, 0.1), spin: rr(-8, 8), kind: 2 });
}
function completeTarget(t) {
  t.done = true;
  Sfx.play('bell', { vol: 0.38, rate: 1.12 });
  camState.shake = 0.4;
  for (const c of t.chunks) for (let i = 0; i < 8; i++) leaves.spawn(c.px + c.wWorld * rnd(), c.py + c.hWorld, 0.3, { vx: rr(-0.8, 0.8), vy: rr(0.6, 2), life: rr(1.2, 2.2), size: rr(0.08, 0.15), spin: rr(-6, 6), kind: 0 });
}
function startFinale() {
  Game.state = 'finale'; Game.finaleT = 0;
  let crack = 0, healed = 0;
  for (const s of segs) { crack += s.crackTotal; for (let i = 0; i < s.crack.length; i++) if (s.crack[i] && s.arrival[i] < 1e8) healed++; }
  Game.stepsHealed = Math.round(100 * healed / Math.max(1, crack));
  monk.play('bow', 0.4);
  Sfx.play('gong', { vol: 0.8 });
  if (Game.music) Game.music.g.gain.setTargetAtTime(0.75, Sfx.ctx.currentTime, 2);
  camState.shake = 0.6;
}
function respawn() {
  Game.state = 'respawn'; Game.respawnT = 0;
  Sfx.play('whoosh', { vol: 0.8 });
}

// ---------------------------------------------------------------- per-step physics
const P = { speed: 2.7, accel: 16, airAccel: 9, grav: 25, jumpV: 9.3, maxFall: 17 };
function fixedUpdate(h) {
  if (Game.state !== 'play') { monk.vx = damp(monk.vx, 0, 10, h); }
  const pad = Game._pad;
  let dir = 0;
  if (Game.state === 'play') {
    dir = (isRight() ? 1 : 0) - (isLeft() ? 1 : 0);
    if (pad && pad.x) dir = pad.x;
  }
  const holding = Game.state === 'play' && (isMend() || (pad && pad.mend));
  if (holding && monk.onGround && Game.activeTarget) dir = 0;
  const acc = monk.onGround ? P.accel : P.airAccel;
  monk.vx = damp(monk.vx, dir * P.speed, acc * 0.5, h);
  if (dir) monk.facing = dir;
  // horizontal move with walls
  let nx = monk.x + monk.vx * h;
  if (nx < 0.35) { nx = 0.35; monk.vx = 0; }
  const front = nx + Math.sign(monk.vx || monk.facing) * 0.18;
  if (Math.abs(monk.vx) > 1e-4 && wallAt(front, monk.y)) monk.vx = 0;
  else monk.x = nx;
  // jump
  if (jumpQueued > 0 && (monk.onGround || monk.coyote > 0) && Game.state === 'play') {
    monk.vy = P.jumpV; monk.onGround = false; monk.coyote = 0; jumpQueued = 0;
    Sfx.play('jump', { vol: 0.2, rate: rr(0.95, 1.1) });
    for (let i = 0; i < 5; i++) leaves.spawn(monk.x, monk.y + 0.05, 0.4, { vx: rr(-0.8, 0.8), vy: rr(0.2, 1.0), life: rr(0.8, 1.4), size: rr(0.07, 0.12), spin: rr(-6, 6), kind: 0 });
  }
  jumpQueued = Math.max(0, jumpQueued - h);
  // gravity & ground
  const wasGround = monk.onGround;
  if (!monk.onGround) { monk.vy = Math.max(-P.maxFall, monk.vy - P.grav * h); monk.y += monk.vy * h; }
  const g = groundAt(monk.x, monk.y);
  if (monk.vy <= 0 && monk.y <= g + 0.001) {
    if (!wasGround && monk.airT > 0.12) { monk.landT = 0.18; Sfx.play('land', { vol: 2.2 }); footstep(); }
    monk.y = g; monk.vy = 0; monk.onGround = true; monk.coyote = 0.1; monk.airT = 0; Game.lastGroundY = g;
  } else if (wasGround && monk.y - g < 0.38 && monk.vy <= 0) {
    monk.y = g;   // stick to slopes going down
  } else if (monk.onGround) {
    monk.onGround = false; monk.coyote = 0.1; monk.vy = 0;
  }
  if (!monk.onGround) { monk.coyote = Math.max(0, monk.coyote - h); monk.airT += h; }
  // footsteps
  if (!monk.contacts && monk.onGround && Math.abs(monk.vx) > 0.6 && Game.state === 'play') {
    monk.stepAcc += Math.abs(monk.vx) * h;
    if (monk.stepAcc > 0.44) { monk.stepAcc = 0; footstep(); }
  }
  // fall into a chasm
  if (Game.state === 'play') {
    const near = segs.filter(s => Math.abs(s.x + SEG_W / 2 - monk.x) < 18);
    const floor = Math.min(...near.map(s => s.y)) - 1.2;
    if (monk.y < floor) respawn();
  }
}

// ---------------------------------------------------------------- frame update
const hintEl = document.getElementById('hint');
function update(dt, time) {
  Game.t = time;
  U.time.value = time;
  Game._pad = pollPad();
  if (Game.state === 'play') Game.playT += dt;
  Game.emptyPulse = Math.max(0, Game.emptyPulse - dt);

  // pickups
  for (const p of pickups) {
    if (!p.taken) {
      const bob = Math.sin(time * 1.6 + p.ph) * 0.12;
      p.mesh.position.set(p.x, p.y + bob, 0.45);
      p.mesh.scale.x = 0.52 * Math.cos(time * 1.3 + p.ph);
      p.mesh.rotation.z = Math.sin(time * 0.9 + p.ph) * 0.25;
      if (Game.state === 'play' && Math.abs(monk.x - p.x) < 0.55 && Math.abs(monk.y + 0.55 - (p.y + bob)) < 0.8) collect(p);
      if (rnd() < dt * 1.5) motes.spawn(p.x + rr(-0.3, 0.3), p.y + rr(-0.3, 0.3), 0.5, { vx: rr(-0.1, 0.1), vy: rr(0.1, 0.4), life: rr(1, 2), size: rr(0.04, 0.07), kind: 2, spin: rr(-3, 3) });
    } else if (p.fly) {
      p.fly.t += dt * (p.gift ? 0.45 : 1.6);
      const k = smooth(Math.min(1, p.fly.t));
      const tx = bird.x, ty = bird.y;
      p.mesh.position.set(lerp(p.fly.x, tx, k), lerp(p.fly.y, ty, k) + Math.sin(k * Math.PI) * 0.8, 0.5);
      p.mesh.scale.setScalar(0.52 * (1 - k * 0.7));
      if (p.fly.t >= 1) { p.fly = null; p.mesh.visible = false; Game.carried++; Sfx.play('chime', { vol: 0.5, rate: 2 }); }
    }
  }
  // leaf flying from the bird into a broken stone
  if (flyingLeaf) {
    const f = flyingLeaf; f.t += dt * (f.altar ? 2.2 : 1.5);
    const c = f.c, k = smooth(Math.min(1, f.t));
    const tx = c ? c.px + c.wWorld / 2 : altar.x, ty = c ? c.py + c.hWorld * 0.6 + c.broken.dy * 0.2 : altar.y + 0.8;
    const x = lerp(f.from.x, tx, k), y = lerp(f.from.y, ty, k) + Math.sin(k * Math.PI) * 1.2;
    leaves.spawn(x, y, 0.5, { vx: rr(-0.3, 0.3), vy: rr(-0.2, 0.3), life: 0.6, size: rr(0.08, 0.13), kind: 2, spin: rr(-8, 8) });
    if (f.t >= 1) {
      flyingLeaf = null;
      if (c) { c.state = 'rising'; c.t = 0; camState.shake = 0.15; Sfx.play('stone', { vol: 0.3 }); }
      else { Sfx.play('chime', { vol: 0.55, rate: 1.5 }); for (let i = 0; i < 12; i++) leaves.spawn(altar.x, altar.y + 0.8, 0.4, { vx: rr(-1, 1), vy: rr(0.3, 1.6), life: rr(0.6, 1.2), size: rr(0.05, 0.1), kind: 2, spin: rr(-8, 8) }); }
    }
  }
  for (const c of chunks) c.update(dt, time);
  for (const t of targets) if (!t.done && t.chunks && t.chunks.every(c => c.placed)) completeTarget(t);
  for (const s of segs) s.update(time, dt);

  // lanterns
  for (const L of lanterns) {
    if (!L.lit && Game.state === 'play' && Math.abs(monk.x - L.x) < 0.9) lightLantern(L);
    if (L.lit) {
      L.t = Math.min(1, L.t + dt * 0.8);
      L.light.intensity = 3.2 * smooth(L.t) * (0.9 + 0.1 * Math.sin(time * 7 + L.x));
      L.halo.userData.set(smooth(L.t) * (0.85 + 0.15 * Math.sin(time * 5 + L.x)));
      for (const m of L.mats) if (m.emissive) { m.emissive.setRGB(1.0, 0.72, 0.32); m.emissiveIntensity = 0.16 * smooth(L.t); }

  // finale
  if (Game.state === 'finale' || Game.state === 'end') {

    const ft = Game.finaleT;
    if (altar) {
      altar.broken.visible = ft < 0.35; altar.whole.visible = ft >= 0.35;
      altar.lift = smooth(clamp((ft - 0.4) / 2.2, 0, 1));
      altar.whole.position.y = altar.lift * 0.75;
      altar.whole.rotation.y += dt * 0.6;
      altar.whole.traverse(o => { if (o.isMesh && o.material.emissiveMap) o.material.emissiveIntensity = 0.9 * altar.lift + 0.15 * Math.sin(time * 3); });
      altar.light.intensity = 6 * altar.lift;
      altar.halo.position.y = altar.y + 0.8 + altar.lift * 0.75;
      altar.halo.userData.set(altar.lift * (0.6 + 0.1 * Math.sin(time * 4)));
    }
    if (ft > 0.35 && !Game.waveStarted) {
      Game.waveStarted = true;
      for (const s of segs) s.healAll(altar.x, altar.y, Game.t + 0.8, 7.5);
      for (const c of chunks) if (!c.placed) { c.state = 'rising'; c.t = 0; }
      for (let i = 0; i < 80; i++) leaves.spawn(altar.x + rr(-0.4, 0.4), altar.y + rr(0.6, 1.6), 0.4, { vx: rr(-3, 3), vy: rr(0.5, 4), life: rr(2, 4), size: rr(0.08, 0.18), spin: rr(-6, 6), kind: 0 });
    }
    composePass.uniforms.uWarm.value = damp(composePass.uniforms.uWarm.value, 1, 0.5, dt);
    const fgk = 1 - smooth(clamp((ft - 1.2) / 3.0, 0, 1));
    for (const m of fgSprites) { m.material.uniforms.uOpacity.value = m.userData.op0 * fgk; m.visible = fgk > 0.01; }
    for (const s of segs) s.glowMat.uniforms.uGoldLift.value = 0.25 * smooth(clamp((ft - 3) / 4, 0, 1));

  }

    Game.respawnT += dt;

    Game.fade = t < 0.6 ? smooth(t / 0.6) : 1 - smooth(clamp((t - 0.9) / 0.7, 0, 1));
    if (t >= 0.6 && !Game.respawned) {
      Game.respawned = true;
      monk.x = Game.checkpoint.x; monk.y = groundAt(monk.x, 99); monk.vx = monk.vy = 0;
      bird.x = monk.x; bird.y = monk.y + 1.3; camState.x = monk.x + 2; camState.y = monk.y + 1.5;
      const a = new THREE.Vector3(); monk.neckWorld(a); scarf.reset(a);

    if (t >= 1.6) { Game.state = 'play'; Game.respawned = false; Game.fade = 0; }
  }

  // monk visuals
  updateMonkVisual(dt, time);
  bird.update(dt, time, monk);
  monk.neckWorld(_v); _v.x -= monk.facing * 0.07; _v.y -= 0.03; _v.z = 0.18;
  scarf.update(dt, _v, Math.abs(monk.vx), monk.facing, time, !monk.onGround);

  // orbiting carried leaves around the bird
  if (rnd() < dt * (2 + Game.carried * 1.2)) {
    const a = rnd() * 6.28;
    motes.spawn(bird.x + Math.cos(a) * 0.32, bird.y + Math.sin(a) * 0.22, 0.6, { vx: -Math.sin(a) * 0.3, vy: Math.cos(a) * 0.2 + 0.1, life: rr(0.6, 1.1), size: rr(0.05, 0.09), kind: 2, spin: rr(-5, 5) });
  }
  // ambient motes
  if (rnd() < dt * 6) motes.spawn(camera.position.x + rr(-12, 12), camera.position.y + rr(-7, 5), rr(-3, 4), { vx: rr(-0.1, 0.1), vy: rr(-0.05, 0.12), life: rr(4, 8), size: rr(0.03, 0.06), kind: 1, frame: -1, tint: [1, 0.95, 0.85] });

    if (o.userData.bob) o.position.y = o.userData.bob.y0 + Math.sin(time * 0.35 + o.userData.bob.ph) * 0.25;
  }

  const at = Game.activeTarget;
  const showHint = Game.state === 'play' && at && !monk.mending && (Game.carried > 0 || Game.emptyPulse > 0 || (at.type === 'altar' && (at.paid || 0) >= 4));

}

function updateMonkVisual(dt, time) {
  const r = monk.root;
  r.position.set(monk.x, monk.y, 0.3);
  const targetYaw = monk.facing > 0 ? Math.PI / 2 - 0.3 : -Math.PI / 2 + 0.3;
  monk.yaw = damp(monk.yaw, targetYaw, 11, dt);
  r.rotation.y = monk.yaw;
  monk.landT = Math.max(0, monk.landT - dt);
  const sq = monk.landT > 0 ? Math.sin(monk.landT / 0.18 * Math.PI) * 0.06 : 0;
  r.scale.set(1 + sq, 1 - sq, 1 + sq);
  const speed = Math.abs(monk.vx);
  if (monk.mixer) {
    const A = monk.actions;
    let want = 'idle';
    if (Game.state === 'finale' || Game.state === 'end') want = 'bow';
    else if (!monk.onGround && monk.airT > 0.06) want = 'jump';
    else if (monk.mending && A.kneel) want = 'kneel';
    else if (speed > 0.25) want = 'walk';
    if (want === 'jump') {
      if (monk.curName !== 'jump') { monk.play('jump', 0.1); A.jump.time = monk.vy > 0 ? 0.46 : 0.86; }
      if (A.jump.time > 0.95) A.jump.time = 0.95;          // hold the airborne pose until we touch down
      monk.landAnim = 0;
    } else if (monk.curName === 'jump' && monk.landAnim === 0 && want !== 'bow') {
      monk.landAnim = 0.2; A.jump.time = Math.max(A.jump.time, 1.12);   // landing crouch
    }
    if (monk.landAnim > 0) { monk.landAnim -= dt; if (monk.landAnim <= 0) { monk.landAnim = -1; } }
    else if (want === 'kneel') {
      if (monk.curName !== 'kneel') { monk.play('kneel', 0.35); A.kneel.time = 0.1; }
      A.kneel.timeScale = 0; monk.kneeling = true;
    } else if (monk.curName === 'kneel' && want === 'idle' && monk.kneeling) {
      A.kneel.timeScale = 1.5;                               // stand back up
      if (A.kneel.time >= A.kneel.getClip().duration - 0.05) { monk.kneeling = false; monk.play('idle', 0.3); }
    } else if (want !== 'jump') {
      monk.kneeling = false;
      monk.play(want, want === 'walk' ? 0.2 : (want === 'bow' ? 0.5 : 0.3));
    }
    if (A.walk) {
      const ts = monk.walkSpeed ? speed / monk.walkSpeed : clamp(speed / P.speed, 0.5, 1.2) * 1.15;
      A.walk.timeScale = clamp(ts, 0.35, 3.5);
      // gold footsteps exactly when a foot lands
      if (monk.curName === 'walk' && monk.contacts && monk.onGround && Game.state === 'play') {
        const t0 = monk.lastWalkT ?? A.walk.time, t1 = A.walk.time, D = A.walk.getClip().duration;
        for (const c of monk.contacts) {
          const hit = t1 >= t0 ? (c.t > t0 && c.t <= t1) : (c.t > t0 || c.t <= t1);
          if (hit) footstep(c.foot === 'L' ? monk.lf : monk.rf);
        }
        monk.lastWalkT = t1;
      } else monk.lastWalkT = undefined;
    }
    monk.mixer.update(dt);
  } else if (monk.fallback) {
    const b = Math.abs(Math.sin(time * 9)) * 0.05 * clamp(speed, 0, 1);
    monk.fallback.position.y = b;
    monk.fallback.rotation.z = -monk.vx * 0.04;
  }
}

// ---------------------------------------------------------------- render
function render() {
  if (OPT.nopost) { camera.layers.set(0); renderer.render(scene, camera); return; }
  camera.layers.set(GLOW_LAYER);
  glowComposer.render();
  camera.layers.set(0);
  composePass.uniforms.uTime.value = Game.t;
  composer.render();
}

// ---------------------------------------------------------------- title / end / keys
const titleEl = document.getElementById('title'), endEl = document.getElementById('end');
function onKey(e) {
  if (e.code === 'KeyM' && Sfx.ctx) { Sfx.setMuted(!Sfx.muted); return; }
  if (Game.state === 'title') startGame();
  else if (Game.state === 'end' && e.code === 'KeyR') location.href = location.pathname + '?auto';
}
addEventListener('pointerdown', () => { if (Game.state === 'title') startGame(); });
async function startGame() {
  if (Game.state !== 'title') return;
  Game.state = 'play';
  titleEl.style.opacity = 0;
  await Sfx.init();
  Game.music = Sfx.loop('music', 0.55, 4);
  Game.windLoop = Sfx.loop('wind', 1.4, 3);
}
function endScreen() {
  Game.state = 'end';
  const m = Math.floor(Game.playT / 60), s = Math.floor(Game.playT % 60);
  document.getElementById('stats').textContent = `${m}:${String(s).padStart(2, '0')}  ·  gold leaf ${Game.collected} / ${Game.totalPickups}  ·  lanterns ${Game.lanternsLit} / ${lanterns.length}  ·  your steps healed ${Game.stepsHealed ?? 0}% of the cracks`;
  endEl.style.opacity = 1;

// ---------------------------------------------------------------- bot (keyboard-only autopilot used for end-to-end testing)
const Bot = {
  down: new Set(), stuckT: 0, lastX: 0,
  key(code, on) {
    if (on && !this.down.has(code)) { this.down.add(code); dispatchEvent(new KeyboardEvent('keydown', { code, key: code })); }
    if (!on && this.down.has(code)) { this.down.delete(code); dispatchEvent(new KeyboardEvent('keyup', { code, key: code })); }
  },
  tap(code) { this.key(code, false); this.key(code, true); setTimeout(() => this.key(code, false), 60); },
  update(dt) {
    if (Game.state === 'title') { this.tap('Enter'); return; }
    if (Game.state !== 'play') { this.key('ArrowRight', false); this.key('KeyE', false); return; }
    const at = Game.activeTarget;
    const wantMend = at && (at.type === 'altar' ? ((at.paid || 0) >= 4 || Game.carried > 0 || flyingLeaf) : (at.chunks.some(c => c.state === 'broken' && !c.claimed) && (Game.carried > 0 || flyingLeaf)));
    const waiting = at && at.type !== 'altar' && !at.chunks.every(c => c.placed) && !wantMend;
    this.key('KeyE', !!wantMend || (at && at.type !== 'altar' && at.chunks.some(c => c.state === 'rising')));
    this.key('ArrowRight', !wantMend && !waiting);
    if (waiting && !flyingLeaf && at.chunks.every(c => c.state !== 'rising')) { if (!this.warned) { console.warn('bot: not enough gold leaf for', at.type, 'carried', Game.carried); this.warned = true; } }
    if (!monk.onGround) return;
    const ahead = monk.x + 0.55;
    const gA = groundAt(ahead, monk.y);
    const wall = wallAt(monk.x + 0.5, monk.y) || wallAt(monk.x + 0.3, monk.y);
    const gapAhead = !isFinite(gA) || gA < monk.y - 2.5;
    let jump = wall;
    if (gapAhead && !(at && !at.done)) {
      for (let d = 0.6; d < 3.4; d += 0.2) { const g2 = groundAt(monk.x + d, monk.y + 0.5); if (isFinite(g2) && g2 > monk.y - 4) { jump = true; break; } }
    }
    for (const p of pickups) if (!p.taken && p.x - monk.x > 0.15 && p.x - monk.x < 0.9 && p.y - monk.y > 1.05 && p.y - monk.y < 2.6) jump = true;
    if (Math.abs(monk.x - this.lastX) < 0.01 && !wantMend) this.stuckT += dt; else this.stuckT = 0;
    this.lastX = monk.x;
    if (this.stuckT > 0.8) { jump = true; this.stuckT = 0; }
    if (jump) this.tap('Space');
  },
};

// ---------------------------------------------------------------- main loop
let last = performance.now(), simTime = 0, frames = 0, fpsT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  try { step(now); } catch (e) { if (!frame.errs) frame.errs = 0; if (frame.errs++ < 5) console.error('frame error:', e && e.stack || e); }
}
function step(now) {
  let dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  frames++; fpsT += dt; if (fpsT > 1) { Game.fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
  if (Game.state === 'loading') { render(); return; }
  const scaled = dt * OPT.fast;
  const steps = Math.max(1, Math.ceil(scaled / (1 / 120)));
  const h = scaled / steps;
  for (let i = 0; i < steps; i++) {
    simTime += h;
    if (OPT.bot && i === 0) Bot.update(scaled);
    fixedUpdate(h);
  }
  update(scaled, simTime);
  render();
  Game.x = monk.x; Game.y = monk.y;
}

(async () => {
  await build();
  resize();
  Game.state = 'title';
  titleEl.classList.remove('loading');
  document.getElementById('press').textContent = 'press any key';
  if (OPT.auto) { titleEl.style.transition = 'none'; startGame(); }
  window.__ready = true; window.__dbg = { monk, scarf, bird, segs, chunks, targets, lanterns };
  requestAnimationFrame(frame);
})();
window.__teleport = (x) => { monk.x = x; monk.y = groundAt(x, 99); camState.x = x; camState.y = monk.y; bird.x = x; bird.y = monk.y + 1.3; };
window.__status = () => JSON.stringify({ x: +Game.x.toFixed(1), y: +Game.y.toFixed(1), c: Game.carried, got: Game.collected, st: Game.state, lit: Game.lanternsLit, fps: Game.fps, t: targets.map(t => (t.chunks ? t.chunks.filter(c => c.placed).length : +t.progress.toFixed(2)) + (t.done ? 'D' : '')) });
window.__targets = () => targets.map(t => ({ type: t.type, done: t.done, placed: t.chunks ? t.chunks.filter(c => c.placed).length : t.progress }));
</script>
