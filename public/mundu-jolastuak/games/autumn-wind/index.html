<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================================
   AUTUMN WIND — a child in a cloak of leaves surfs the wind over golden hills.
   Every image, model and sound in /assets was generated with fal (see README.md).
   ===================================================================================== */

const Q = new URLSearchParams(location.search);
const DBG = { zoom: parseFloat(Q.get('zoom') || '1'), ts: parseFloat(Q.get('ts') || '1'), auto: Q.has('auto'), x: parseFloat(Q.get('x') || 'NaN'), state: Q.get('state'), nopost: Q.has('nopost'), leaves: parseInt(Q.get('leaves') || '0'), t: parseFloat(Q.get('t') || 'NaN') };
window.addEventListener('error', (e) => { document.getElementById('err').textContent += (e.message || e) + '\n'; });

const CFG = {
  END: 3150,            // x where the final plateau (great tree) begins
  G: 30,                // gravity
  JUMP: 12.5,
  MIN_SPEED: 9, MAX_SPEED: 44, WIND_ACC: 4.2,
  GLIDE_G: 0.24, GLIDE_TERM: -3.0, GLIDE_COST: 1.7,  // leaves per second while gliding
  DIVE_G: 2.4,
  TREE_COST: 12, N_TREES: 12,
  CHILD_SCALE: 1.75,
  MAX_LEAVES: 199,
};

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
function mulberry(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R0 = mulberry(1977);
const rnd = (a = 0, b = 1) => a + (b - a) * R0();
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HAZE = new THREE.Color('#ecdcbb'), DUSK_HAZE = new THREE.Color('#f2c3a2');
scene.background = new THREE.Color('#e9dcc0');
scene.fog = new THREE.Fog(HAZE.clone(), 34, 560);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 3000);
scene.add(camera);

const sun = new THREE.DirectionalLight(new THREE.Color('#fff1d6'), 2.3);
sun.position.set(-0.5, 1.0, 0.9);
scene.add(sun);
scene.add(new THREE.AmbientLight(new THREE.Color('#ffe6c4'), 1.25));

// ---------------------------------------------------------------- loading
const manager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
let toLoad = 0, loaded = 0;
const bump = () => { loaded++; document.getElementById('loadfill').style.width = (100 * loaded / Math.max(1, toLoad)) + '%'; };
function loadTex(url, { srgb = true, wrap = null, mirror = false, wrapX = false, mips = true } = {}) {
  toLoad++;
  return new Promise((res) => texLoader.load(url, (t) => {
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    if (wrap) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (mirror) t.wrapS = THREE.MirroredRepeatWrapping;
    if (wrapX) t.wrapS = THREE.RepeatWrapping;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    if (!mips) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
    bump(); res(t);
  }, undefined, () => { console.warn('missing texture', url); bump(); res(null); }));
}
function loadGLB(url) { toLoad++; return new Promise((res) => gltfLoader.load(url, (g) => { bump(); res(g); }, undefined, (e) => { console.warn('missing glb', url); bump(); res(null); })); }
function loadBin(url) { return fetch(url).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null); }   // audio streams in the background

const ASSET = {
  sky: ['assets/sky.jpg', { mirror: true }], far: ['assets/far_hills.webp', { mirror: true }],
  grass: ['assets/tex_grass.jpg', { wrap: true }], earth: ['assets/tex_earth.jpg', { wrap: true }],
  leaves: ['assets/leaves_atlas.webp', {}], paper: ['assets/paper.jpg', { wrap: true }],
  tree1: ['assets/sprites/tree_1.webp', {}], tree2: ['assets/sprites/tree_2.webp', {}], tree3: ['assets/sprites/tree_3.webp', {}],
  bushGold: ['assets/sprites/bush_gold.webp', {}], bushAmber: ['assets/sprites/bush_amber.webp', {}], bushOrange: ['assets/sprites/bush_orange.webp', {}],
  grassA: ['assets/sprites/grass_a.webp', {}], grassB: ['assets/sprites/grass_b.webp', {}],
  bare: ['assets/sprites/tree_bare.webp', {}], bloom: ['assets/sprites/tree_bloom.webp', {}],
  greatBare: ['assets/sprites/great_bare.webp', {}], greatBloom: ['assets/sprites/great_bloom.webp', {}],
  canopyBand: ['assets/sprites/canopy_band.webp', {}], canopyEnd: ['assets/sprites/canopy_end.webp', {}],
  ceiling: ['assets/sprites/canopy_ceiling.webp', { wrapX: true }], ceilingEnd: ['assets/sprites/canopy_ceiling_end.webp', {}],
  fgStrip: ['assets/sprites/fg_strip.webp', { wrapX: true }],
  stroke1: ['assets/fx/stroke_1.png', {}], stroke2: ['assets/fx/stroke_2.png', {}], stroke3: ['assets/fx/stroke_3.png', {}],
  glow: ['assets/fx/glow.png', {}], sparkle: ['assets/fx/sparkle.png', {}], swirl: ['assets/fx/swirl.png', {}], scarf: ['assets/scarf.webp', {}],
};
const SOUNDS = { music: 'assets/audio/music.mp3', wind: 'assets/audio/wind.mp3', chime: 'assets/audio/chime.mp3', bloom: 'assets/audio/bloom.mp3',
  jump: 'assets/audio/jump.mp3', land: 'assets/audio/land.mp3', stumble: 'assets/audio/stumble.mp3', gust: 'assets/audio/gust.mp3', finale: 'assets/audio/finale.mp3' };

const T = {}; const GLB = {}; const SND = {};
async function loadAll() {
  const jobs = [];
  for (const [k, [u, o]] of Object.entries(ASSET)) jobs.push(loadTex(u, o).then(t => T[k] = t));
  jobs.push(loadGLB('assets/child.glb').then(g => GLB.child = g));
  jobs.push(loadGLB('assets/rock_a.glb').then(g => GLB.rockA = g));
  for (const [k, u] of Object.entries(SOUNDS)) SND[k] = loadBin(u);          // not awaited: the game starts before the music arrives
  await Promise.all(jobs);
}

// ---------------------------------------------------------------- course: hills
class Ridge {
  constructor(pts) { this.p = pts; this.n = pts.length; this.i = 0; }
  seg(x) {
    const p = this.p; let i = this.i;
    if (x <= p[0].x) return 0;
    if (x >= p[this.n - 1].x) return this.n - 2;
    while (i > 0 && x < p[i].x) i--;
    while (i < this.n - 2 && x >= p[i + 1].x) i++;
    this.i = i; return i;
  }
  h(x) { const i = this.seg(x), a = this.p[i], b = this.p[i + 1]; const t = clamp((x - a.x) / (b.x - a.x), 0, 1); return a.y + (b.y - a.y) * (1 - Math.cos(Math.PI * t)) * 0.5; }
  d1(x) { const i = this.seg(x), a = this.p[i], b = this.p[i + 1]; const w = b.x - a.x; const t = clamp((x - a.x) / w, 0, 1); return (b.y - a.y) * 0.5 * Math.PI * Math.sin(Math.PI * t) / w; }
  d2(x) { const i = this.seg(x), a = this.p[i], b = this.p[i + 1]; const w = b.x - a.x; const t = clamp((x - a.x) / w, 0, 1); return (b.y - a.y) * 0.5 * Math.PI * Math.PI * Math.cos(Math.PI * t) / (w * w); }
}
function buildCourse() {
  const R = mulberry(4242);
  const pts = [{ x: -520, y: -4 }, { x: -260, y: 2 }, { x: -70, y: 7 }, { x: 0, y: 7.2 }];
  let x = 0, up = false;
  const crests = [];
  while (x < CFG.END) {
    const p = x / CFG.END; const act = p < 0.34 ? 0 : p < 0.68 ? 1 : 2;
    const w = (25 + R() * 19) * (1 + 0.14 * act) * (x < 60 ? 1.25 : 1);
    x += w;
    const base = 4.5 * Math.sin(x * 0.0041 + 0.4) + 2.4 * Math.sin(x * 0.0113 + 1.9);
    const amp = (4.0 + R() * 4.2) * (1 + 0.3 * act);
    const y = up ? base + amp : base - amp * (0.6 + R() * 0.35);
    pts.push({ x, y }); if (up) crests.push(x);
    up = !up;
  }
  if (up) { x += 34; pts.push({ x, y: pts[pts.length - 1].y + 10 }); up = false; }   // end on a crest
  const valleyY = pts[pts.length - 1].y - 9; x += 38; pts.push({ x, y: valleyY });
  const plateauY = valleyY + 15; x += 70; pts.push({ x, y: plateauY });
  const greatX = x + 70;
  pts.push({ x: x + 210, y: plateauY + 0.6 }); pts.push({ x: x + 420, y: plateauY - 10 }); pts.push({ x: x + 900, y: plateauY - 16 });
  return { ridge: new Ridge(pts), crests, greatX, plateauStart: x, pts };
}
const COURSE = buildCourse();
const ground = COURSE.ridge;
const smoothG = (() => { const x0 = -1200, x1 = COURSE.greatX + 1600, st = 4, n = Math.ceil((x1 - x0) / st), raw = new Float32Array(n + 1), out = new Float32Array(n + 1);
  for (let i = 0; i <= n; i++) raw[i] = ground.h(x0 + i * st);
  const K = 18; for (let i = 0; i <= n; i++) { let s = 0, c = 0; for (let k = -K; k <= K; k++) { const j = i + k; if (j >= 0 && j <= n) { s += raw[j]; c++; } } out[i] = s / c; }
  return (x) => { const f = clamp((x - x0) / st, 0, n - 1); const i = Math.floor(f); return lerp(out[i], out[i + 1], f - i); }; })();
const midA = new Ridge(sinePts(-900, COURSE.greatX + 1400, 12, (x) => smoothG(x) - 6.0 + 4.0 * Math.sin(x * 0.0183 + 1.1) + 2.4 * Math.sin(x * 0.0419 + 0.3) + 1.5 * Math.sin(x * 0.0071)));
const midB = new Ridge(sinePts(-1100, COURSE.greatX + 1800, 20, (x) => smoothG(x) * 0.6 - 7 + 6.0 * Math.sin(x * 0.0087 + 2.0) + 3.5 * Math.sin(x * 0.0231 + 0.7)));
function sinePts(x0, x1, step, f) { const p = []; for (let x = x0; x <= x1; x += step) p.push({ x, y: f(x) }); return p; }

// ---------------------------------------------------------------- materials
const commonUniforms = { uTime: { value: 0 } };
function groundMaterial({ gold, goldHi, brown, deep, band = 3.5, top = true, fogScale = 1, rim = 0.55, grassMix = 0.55, earthMix = 0.7 }) {
  const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog]);
  Object.assign(u, {
    tGrass: { value: T.grass }, tEarth: { value: T.earth }, uTime: commonUniforms.uTime,
    cGold: { value: new THREE.Color(gold) }, cGoldHi: { value: new THREE.Color(goldHi) }, cBrown: { value: new THREE.Color(brown) }, cDeep: { value: new THREE.Color(deep) },
    uBand: { value: band }, uRim: { value: rim }, uDebug: { value: Q.has('dbg') ? 1 : 0 }, uGrassMix: { value: grassMix }, uEarthMix: { value: earthMix },
  });
  return new THREE.ShaderMaterial({
    uniforms: u, fog: true,
    vertexShader: /* glsl */`
      attribute float aSurf; attribute float aKind;
      varying vec3 vW; varying float vSurf; varying float vKind;
      #include <fog_pars_vertex>
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz; vSurf = aSurf; vKind = aKind;
        vec4 mvPosition = viewMatrix * w;
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tGrass; uniform sampler2D tEarth; uniform float uTime;
      uniform vec3 cGold; uniform vec3 cGoldHi; uniform vec3 cBrown; uniform vec3 cDeep;
      uniform float uBand; uniform float uRim; uniform float uGrassMix; uniform float uEarthMix; uniform float uDebug;
      varying vec3 vW; varying float vSurf; varying float vKind;
      #include <fog_pars_fragment>
      void main() {
        float d = vSurf - vW.y;
        vec3 gTop = texture2D(tGrass, vec2(vW.x * 0.035, vW.z * 0.07)).rgb;
        vec3 gFront = texture2D(tGrass, vec2(vW.x * 0.028 - vW.y * 0.008, vW.y * 0.05)).rgb;
        vec3 e = texture2D(tEarth, vec2(vW.x * 0.018, vW.y * 0.03)).rgb;
        float n = texture2D(tEarth, vec2(vW.x * 0.0061, vW.y * 0.006 + 0.31)).r;
        float n2 = texture2D(tGrass, vec2(vW.x * 0.011 + vW.y * 0.004, vW.y * 0.017)).g;
        float jag = (n - 0.08) * 4.0 + (n2 - 0.4) * 1.2 + sin(vW.x * 0.21 + vW.y * 0.3) * 0.2;
        float band = smoothstep(uBand * 0.35, uBand * 1.0, d + jag);
        vec3 goldC = mix(cGold, gFront, uGrassMix);
        vec3 earthC = mix(cBrown, e, uEarthMix);
        vec3 front = mix(goldC, earthC, band);
        front = mix(front, cDeep, smoothstep(uBand * 1.6, uBand * 5.5, d + jag * 0.5));
        float sheen = 0.5 + 0.5 * sin(vW.x * 0.11 - uTime * 1.7 + vW.z * 0.2);
        vec3 top = mix(cGold, gTop, uGrassMix) * (0.94 + 0.12 * sheen);
        vec3 col = vKind < 0.5 ? top : front;
        col = mix(col, cGoldHi, (1.0 - smoothstep(0.0, 0.9, d)) * step(0.5, vKind) * uRim);
        gl_FragColor = vec4(col, 1.0);
        #include <fog_fragment>
        if (uDebug > 0.5) gl_FragColor = vec4(vKind, fract(d / 5.0), step(0.5, fract(vW.z / 4.0)), 1.0);
      }`,
  });
}

// ridge geometry: top strip + rounded lip + front face (with per-vertex surface height)
function ridgeGeometry(ridge, x0, x1, step, { zBack = -10, zFront = 3, depth = 80, top = true } = {}) {
  const cols = Math.ceil((x1 - x0) / step) + 1;
  const prof = top
    ? [[zBack, 0, 0], [zFront - 0.6, 0, 0], [zFront - 0.05, -0.3, 1], [zFront + 0.25, -1.1, 1], [zFront + 0.35, -depth, 1]]
    : [[zFront, 0.0, 1], [zFront, -depth, 1]];
  const P = prof.length;
  const pos = new Float32Array(cols * P * 3), surf = new Float32Array(cols * P), kind = new Float32Array(cols * P);
  for (let c = 0; c < cols; c++) {
    const x = x0 + c * step, h = ridge.h(x);
    for (let k = 0; k < P; k++) {
      const i = c * P + k; pos[i * 3] = x; pos[i * 3 + 1] = h + prof[k][1]; pos[i * 3 + 2] = prof[k][0];

  const idx = [];
  for (let c = 0; c < cols - 1; c++) for (let k = 0; k < P - 1; k++) {
    const a = c * P + k, b = (c + 1) * P + k, a2 = a + 1, b2 = b + 1;
    idx.push(a, a2, b, b, a2, b2);

// plain sprite plane with bottom-centre pivot
const spriteMats = new Map();
function spriteMat(tex, { fog = true, opacity = 1, color = 0xffffff, unique = false, depthWrite = false, alphaTest = 0.0 } = {}) {
  const key = tex.uuid + fog + opacity + color + depthWrite + alphaTest;

  const m = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite, fog, opacity, color, alphaTest });

}

// ---------------------------------------------------------------- instanced leaves (atlas 4x4)
function leafMaterial() {
  const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog]);
  u.map = { value: T.leaves }; u.uGrid = { value: new THREE.Vector2(4, 4) };
  return new THREE.ShaderMaterial({
    uniforms: u, fog: true, side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      attribute vec3 iPos; attribute vec3 iRot; attribute vec4 iData;
      uniform vec2 uGrid;
      varying vec2 vUv; varying float vAlpha; varying float vShade;
      #include <fog_pars_vertex>
      mat3 rotXYZ(vec3 r) {
        float cx = cos(r.x), sx = sin(r.x), cy = cos(r.y), sy = sin(r.y), cz = cos(r.z), sz = sin(r.z);
        mat3 X = mat3(1.0,0.0,0.0, 0.0,cx,sx, 0.0,-sx,cx);
        mat3 Y = mat3(cy,0.0,-sy, 0.0,1.0,0.0, sy,0.0,cy);
        mat3 Z = mat3(cz,sz,0.0, -sz,cz,0.0, 0.0,0.0,1.0);
        return Z * Y * X;
      }
      void main() {
        mat3 R = rotXYZ(iRot);
        vec3 p = iPos + R * (position * iData.x);
        vec3 n = R * vec3(0.0, 0.0, 1.0);
        vShade = (0.6 + 0.4 * abs(n.z)) * iData.w;
        float t = iData.y; float cx = mod(t, uGrid.x); float cy = floor(t / uGrid.x + 0.001);
        vUv = vec2((uv.x + cx) / uGrid.x, (uv.y + (uGrid.y - 1.0 - cy)) / uGrid.y);
        vAlpha = iData.z;
        vec4 mvPosition = viewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D map; varying vec2 vUv; varying float vAlpha; varying float vShade;
      #include <fog_pars_fragment>
      float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main() {
        vec4 c = texture2D(map, vUv);
        if (c.a < 0.5) discard;
        if (vAlpha < 0.999 && hash(gl_FragCoord.xy) > vAlpha) discard;
        gl_FragColor = vec4(c.rgb * vShade, 1.0);
        #include <fog_fragment>
      }`,
  });
}
class LeafBatch {
  constructor(n, mat) {
    this.n = n;
    const base = new THREE.PlaneGeometry(1, 1);
    const g = new THREE.InstancedBufferGeometry();
    g.index = base.index; g.setAttribute('position', base.attributes.position); g.setAttribute('uv', base.attributes.uv);
    this.pos = new Float32Array(n * 3); this.rot = new Float32Array(n * 3); this.data = new Float32Array(n * 4);
    this.aPos = new THREE.InstancedBufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aRot = new THREE.InstancedBufferAttribute(this.rot, 3).setUsage(THREE.DynamicDrawUsage);
    this.aData = new THREE.InstancedBufferAttribute(this.data, 4).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('iPos', this.aPos); g.setAttribute('iRot', this.aRot); g.setAttribute('iData', this.aData);
    g.instanceCount = n;
    this.mesh = new THREE.Mesh(g, mat); this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }
  set(i, p, r, scale, tile, alpha = 1, bright = 1) {
    const j = i * 3, k = i * 4;
    this.pos[j] = p.x; this.pos[j + 1] = p.y; this.pos[j + 2] = p.z;
    this.rot[j] = r.x; this.rot[j + 1] = r.y; this.rot[j + 2] = r.z;
    this.data[k] = scale; this.data[k + 1] = tile; this.data[k + 2] = alpha; this.data[k + 3] = bright;
  }
  hide(i) { this.data[i * 4] = 0; }

}

// generic additive / alpha sprite batch for strokes & glows (camera-facing in XY plane)
function fxMaterial(tex, additive = true) {
  const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog]); u.map = { value: tex };
  return new THREE.ShaderMaterial({
    uniforms: u, fog: false, transparent: true, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: /* glsl */`
      attribute vec3 iPos; attribute vec4 iData; attribute vec3 iCol;
      varying vec2 vUv; varying float vA; varying vec3 vC;
      void main() {
        float c = cos(iData.z), s = sin(iData.z);
        vec2 q = vec2(position.x * iData.x, position.y * iData.y);
        q = vec2(c * q.x - s * q.y, s * q.x + c * q.y);
        vUv = uv; vA = iData.w; vC = iCol;
        gl_Position = projectionMatrix * viewMatrix * vec4(iPos + vec3(q, 0.0), 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D map; varying vec2 vUv; varying float vA; varying vec3 vC;
      void main() { vec4 t = texture2D(map, vUv); gl_FragColor = vec4(t.rgb * vC, t.a * vA); if (gl_FragColor.a < 0.003) discard; }`,
  });
}
class FxBatch {
  constructor(n, tex, additive = true) {
    this.n = n; const base = new THREE.PlaneGeometry(1, 1);
    const g = new THREE.InstancedBufferGeometry(); g.index = base.index; g.setAttribute('position', base.attributes.position); g.setAttribute('uv', base.attributes.uv);
    this.pos = new Float32Array(n * 3); this.data = new Float32Array(n * 4); this.col = new Float32Array(n * 3).fill(1);
    this.aPos = new THREE.InstancedBufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aData = new THREE.InstancedBufferAttribute(this.data, 4).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.InstancedBufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('iPos', this.aPos); g.setAttribute('iData', this.aData); g.setAttribute('iCol', this.aCol); g.instanceCount = n;
    this.mesh = new THREE.Mesh(g, fxMaterial(tex, additive)); this.mesh.frustumCulled = false; this.mesh.renderOrder = 20; scene.add(this.mesh);
  }
  set(i, x, y, z, w, h, rot, a, r = 1, g = 1, b = 1) {
    const j = i * 3, k = i * 4; this.pos[j] = x; this.pos[j + 1] = y; this.pos[j + 2] = z;
    this.data[k] = w; this.data[k + 1] = h; this.data[k + 2] = rot; this.data[k + 3] = a;
    this.col[j] = r; this.col[j + 1] = g; this.col[j + 2] = b;
  }
  hide(i) { this.data[i * 4 + 3] = 0; this.data[i * 4] = 0; }
  flush() { this.aPos.needsUpdate = this.aData.needsUpdate = this.aCol.needsUpdate = true; }
}

// ================================================================ WORLD BUILD
let world = null;
function buildWorld() {
  world = {};
  // --- screen layers (sky + far hills) attached to the camera
  const skyMat = new THREE.MeshBasicMaterial({ map: T.sky, fog: false, depthWrite: false });
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), skyMat); sky.renderOrder = -100; sky.frustumCulled = false;
  camera.add(sky); world.sky = sky;
  if (T.far) {
    const farMat = new THREE.MeshBasicMaterial({ map: T.far, fog: false, transparent: true, depthWrite: false, color: new THREE.Color('#fbf3e3') });
    const far = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), farMat); far.renderOrder = -90; far.frustumCulled = false;
    camera.add(far); world.far = far;
  }
  layoutScreenLayers();

  // --- ridges
  const X0 = -600, X1 = COURSE.greatX + 700;
  const gMat = groundMaterial({ gold: '#e9b545', goldHi: '#fde7a0', brown: '#6c3f1e', deep: '#2c1c11', band: 2.8, rim: 0.65 });
  const gGeo = ridgeGeometry(ground, X0, X1, 0.5, { zBack: -14, zFront: 3, depth: 90, top: true });
  world.ground = new THREE.Mesh(gGeo, gMat); scene.add(world.ground);

  const aMat = groundMaterial({ gold: '#e8b850', goldHi: '#f8e0a0', brown: '#c98c45', deep: '#a8743c', band: 9, rim: 0.35, grassMix: 0.45, earthMix: 0.35 });
  world.midA = new THREE.Mesh(ridgeGeometry(midA, -800, X1 + 400, 1.5, { zFront: -55, depth: 120, top: false }), aMat); scene.add(world.midA);
  const bMat = groundMaterial({ gold: '#e6c27a', goldHi: '#f2dfae', brown: '#d2ab70', deep: '#c49c66', band: 14, rim: 0.2, grassMix: 0.3, earthMix: 0.25 });
  world.midB = new THREE.Mesh(ridgeGeometry(midB, -1000, X1 + 800, 3, { zFront: -150, depth: 160, top: false }), bMat); scene.add(world.midB);

  // --- decorative sprites
  const trees = [T.tree1, T.tree2, T.tree3].filter(Boolean);
  const bushes = [T.bushGold, T.bushAmber, T.bushOrange].filter(Boolean);
  // far ridge B: big tree masses
  for (let x = -800; x < X1 + 600; x += rnd(45, 110)) {
    const t = trees[Math.floor(rnd(0, trees.length))]; const z = -152 + rnd(-6, 4);
    sprite(t, x, midB.h(x) - 1.5, z, rnd(16, 30), { flip: rnd() < 0.5 });
  }
  // mid ridge A: tree clusters + bushes
  for (let x = -700; x < X1 + 300; x += rnd(22, 70)) {
    const t = trees[Math.floor(rnd(0, trees.length))]; const z = -57 + rnd(-5, 3);
    sprite(t, x, midA.h(x) - 1.0, z, rnd(9, 17), { flip: rnd() < 0.5 });
    if (rnd() < 0.5) { const b = bushes[Math.floor(rnd(0, bushes.length))]; sprite(b, x + rnd(6, 16), midA.h(x + 10) - 0.6, z + 3, rnd(2.5, 4.5)); }
  }
  // behind the track: bushes, birch clusters, tufts
  for (let x = -300; x < X1; x += rnd(9, 26)) {
    const r = rnd();
    if (r < 0.16 && trees.length) sprite(T.tree2 || trees[0], x, ground.h(x) - 0.6, rnd(-13, -9), rnd(8, 12), { flip: rnd() < 0.5 });
    else if (r < 0.62 && bushes.length) sprite(bushes[Math.floor(rnd(0, bushes.length))], x, ground.h(x) - 0.4, rnd(-9, -4), rnd(1.8, 3.6), { flip: rnd() < 0.5 });
    else if (T.grassA) sprite(rnd() < 0.5 ? T.grassA : T.grassB, x, ground.h(x) - 0.15, rnd(-5, -1.5), rnd(1.2, 2.2));
  }
  // in front of the track: some bushes / tufts on the lip (layering like the video)
  for (let x = -200; x < X1; x += rnd(14, 40)) {
    const r = rnd();
    if (r < 0.45 && T.grassA) sprite(rnd() < 0.5 ? T.grassA : T.grassB, x, ground.h(x) - 0.5, rnd(3.6, 5.5), rnd(1.0, 1.9));
    else if (r < 0.7 && bushes.length) sprite(bushes[Math.floor(rnd(0, bushes.length))], x, ground.h(x) - 1.6, rnd(5, 7), rnd(1.6, 2.6));
  }
  // giant golden tree masses rising behind the near hills (the cumulus-sized trees of the video)
  for (let x = -40; x < X1; x += rnd(120, 230)) {
    const z = rnd(-72, -60), base = midA.h(x) - 1.6;
    sprite(T.tree1 || trees[0], x, base, z, rnd(23, 31), { flip: rnd() < 0.5 });
    sprite(T.tree3 || trees[0], x + rnd(11, 19), midA.h(x + 15) - 1.4, z + 1.5, rnd(16, 23), { flip: rnd() < 0.5 });
    if (rnd() < 0.6) sprite(T.tree1 || trees[0], x - rnd(10, 16), midA.h(x - 13) - 1.4, z + 1, rnd(14, 19), { flip: rnd() < 0.5 });
  }

  // --- rocks (3D, collidable) on the gameplay ridge
  world.rocks = [];
  const rockSrc = [GLB.rockA].filter(Boolean);
  const R = mulberry(99);
  for (let i = 0; i < COURSE.crests.length; i++) {
    const cx = COURSE.crests[i];
    if (cx < 160 || cx > COURSE.plateauStart - 40) continue;
    const p = cx / CFG.END; if (R() > 0.32 + 0.35 * p) continue;
    const x = cx - lerp(6, 16, R());                     // on the upslope just before a crest
    const size = lerp(1.5, 2.4, R());
    world.rocks.push(makeRock(rockSrc, x, size, 0.4, true));
  }
  // decorative rocks behind / in front
  for (let x = -100; x < X1; x += rnd(60, 160)) world.rocks.push(makeRock(rockSrc, x, rnd(2.5, 5), rnd(-12, -6), false));

  // --- sleeping trees to awaken
  world.trees = [];
  const span = (COURSE.plateauStart - 220) / CFG.N_TREES;
  for (let i = 0; i < CFG.N_TREES; i++) {
    const target = 210 + i * span;
    let best = COURSE.crests[0];
    for (const c of COURSE.crests) if (Math.abs(c - target) < Math.abs(best - target)) best = c;
    const x = best + 4;
    const y = ground.h(x) - 0.5, z = -6.5, hgt = 10.5;
    const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
    const bare = makeTreePlane(T.bare, hgt); const bloom = makeTreePlane(T.bloom, hgt);
    bloom.material.opacity = 0; g.add(bare); g.add(bloom);
    world.trees.push({ i, x, y, z, g, bare, bloom, state: 0, t: 0 });
  }
  // --- the great tree
  {
    const x = COURSE.greatX, y = ground.h(x) - 1.5, z = -14, hgt = 46;
    const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
    const bare = makeTreePlane(T.greatBare || T.bare, hgt); const bloom = makeTreePlane(T.greatBloom || T.bloom, hgt);
    bloom.material.opacity = 0; g.add(bare); g.add(bloom);
    world.great = { x, y, z, g, bare, bloom, t: 0 };
  }

  // --- leaves
  const lm = leafMaterial();
  world.swarmBatch = new LeafBatch(440, lm);
  world.fxBatch = new LeafBatch(520, lm);
  world.ambBatch = new LeafBatch(300, lm);
  world.pickBatch = new LeafBatch(700, lm);
  world.carpetBatch = new LeafBatch(1300, lm);
  world.glow = T.glow ? new FxBatch(700, T.glow, true) : null;
  world.sparkB = T.sparkle ? new FxBatch(80, T.sparkle, true) : null;
  world.swirlB = T.swirl ? new FxBatch(24, T.swirl, true) : null;
  const strokes = [T.stroke1, T.stroke2, T.stroke3].filter(Boolean);
  world.strokeBatches = strokes.map(t => new FxBatch(40, t, true));

  buildPickupsAndGusts();
  buildPlayer();
  world.swarm = new Swarm(world.swarmBatch);
  world.fx = new FxLeaves(world.fxBatch);
  world.amb = new Ambient(world.ambBatch);
  world.wind = new WindStrokes(world.strokeBatches);
  world.carpet = new Carpet(world.carpetBatch);
  buildFraming();
}

function makeTreePlane(tex, hgt) {
  const aspect = tex ? tex.image.width / tex.image.height : 0.75;
  const m = new THREE.Mesh(unitPlane, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: true }));
  m.scale.set(hgt * aspect, hgt, 1); m.renderOrder = 2; return m;
}

function makeRock(src, x, size, z, solid) {
  if (!src.length) return { x, w: 0, top: -1e9, solid: false };
  const g = src[Math.floor(rnd(0, src.length))].scene.clone(true);
  const box = new THREE.Box3().setFromObject(g); const s = box.getSize(V3());
  const k = size / Math.max(s.x, s.y, s.z);
  g.scale.set(k * rnd(0.95, 1.5), k * rnd(0.62, 1.0), k * rnd(0.85, 1.2)); g.rotation.y = rnd(0, TAU);
  const box2 = new THREE.Box3().setFromObject(g); const c = box2.getCenter(V3());
  const y = ground.h(x);
  g.position.set(x - c.x, y - box2.min.y - size * 0.18, z - c.z);
  g.traverse((o) => { if (o.isMesh) { o.material = new THREE.MeshLambertMaterial({ map: o.material.map, color: new THREE.Color(solid ? '#e6e0cc' : '#efe6cf'), emissive: new THREE.Color('#3a3328'), emissiveIntensity: 0.6 }); } });
  scene.add(g);
  const b = new THREE.Box3().setFromObject(g);
  return { x, w: (b.max.x - b.min.x) * 0.42, top: b.max.y - 0.25, solid, g, hit: false };
}

// ---------------------------------------------------------------- pickups & gusts
function buildPickupsAndGusts() {
  world.picks = []; world.gusts = [];
  const R = mulberry(7);
  const crests = COURSE.crests.filter(c => c > 40 && c < COURSE.plateauStart - 30);
  for (let ci = 0; ci < crests.length; ci++) {
    const cx = crests[ci];
    const p = cx / CFG.END;
    const kind = R();
    if (kind < 0.62) {
      // an arc that follows a typical leap from the crest
      const speed = lerp(17, 25, R()) * (1 + 0.15 * p), vy0 = CFG.JUMP * lerp(0.75, 1.05, R());
      let x = cx - 1, y = ground.h(cx) + 1.0, vx = speed, vy = vy0;
      const n = 8 + Math.floor(R() * 6);
      for (let k = 0; k < n * 3; k++) {
        const dt = 0.035; x += vx * dt; vy -= CFG.G * 0.55 * dt; y += vy * dt;
        if (k % 3 === 0) { if (y < ground.h(x) + 0.9) break; addPick(x, y, 0); }
      }
    } else if (kind < 0.8) {
      // a low ribbon along the ground on the downslope
      const n = 6 + Math.floor(R() * 5);
      for (let k = 0; k < n; k++) { const x = cx + 4 + k * 2.2; addPick(x, ground.h(x) + 0.9 + Math.sin(k * 0.7) * 0.25, 0); }
    } else {
      // a high floating spiral over the next valley (glide to reach it)
      const nx = cx + 26 + R() * 12; const top = ground.h(cx) + 7 + R() * 5;
      for (let k = 0; k < 10; k++) { const a = k * 0.62; addPick(nx + k * 1.6, top + Math.sin(a) * 1.6, Math.cos(a) * 1.2); }
    }
    // gusts: a swirl of wind on some valleys
    if (R() < 0.2 + 0.12 * p && ci > 1) {
      const vx = (cx + (crests[ci + 1] || cx + 60)) * 0.5;
      world.gusts.push({ x: vx, y: ground.h(vx) + 4.2, r: 3.6, used: false, t: R() * 10 });
    }
  }
  // a few lone leaves drifting everywhere
  for (let x = 30; x < COURSE.plateauStart; x += 14 + R() * 26) addPick(x, ground.h(x) + 1.6 + R() * 5, 0);
  function addPick(x, y, z) { world.picks.push({ x, y, z, taken: false, ph: R() * TAU, tile: Math.floor(R() * 16), t: 0 }); }
}

// ---------------------------------------------------------------- trail of the child (for the swarm)
class Trail {
  constructor(n = 360, step = 1 / 60) { this.n = n; this.step = step; this.x = new Float32Array(n); this.y = new Float32Array(n); this.z = new Float32Array(n); this.head = 0; this.acc = 0; this.filled = 0; }
  reset(p) { for (let i = 0; i < this.n; i++) { this.x[i] = p.x; this.y[i] = p.y; this.z[i] = p.z; } this.filled = this.n; }
  push(p, dt) {
    this.acc += dt;
    while (this.acc >= this.step) { this.acc -= this.step; this.head = (this.head + 1) % this.n; this.x[this.head] = p.x; this.y[this.head] = p.y; this.z[this.head] = p.z; }
  }
  at(delay, out) {
    const k = clamp(delay / this.step, 0, this.n - 2); const i0 = Math.floor(k), f = k - i0;
    const a = (this.head - i0 + this.n) % this.n, b = (a - 1 + this.n) % this.n;
    out.set(lerp(this.x[a], this.x[b], f), lerp(this.y[a], this.y[b], f), lerp(this.z[a], this.z[b], f));
    return out;
  }
}

// ---------------------------------------------------------------- swarm of leaves following the child
class Swarm {
  constructor(batch) { this.b = batch; this.items = []; this.tmp = V3(); this.cp = V3(); this.cr = V3(); }
  get count() { return this.items.length; }
  add(from, vel) {
    if (this.items.length >= this.b.n / 2) return;
    this.items.push({
      p: from.clone(), v: vel ? vel.clone() : V3(rnd(-2, 2), rnd(0, 3), rnd(-1, 1)),
      delay: Math.pow(rnd(), 1.35) * 0.64 + 0.04, rad: rnd(0.4, 1.5), ph: rnd(0, TAU), om: rnd(1.2, 3.4) * (rnd() < 0.5 ? -1 : 1),
      zo: rnd(-1.3, 1.3), yo: rnd(-0.4, 0.5), r: V3(rnd(0, TAU), rnd(0, TAU), rnd(0, TAU)), rv: V3(rnd(-7, 7), rnd(-5, 5), rnd(-6, 6)),
      tile: Math.floor(rnd(0, 16)), s: rnd(0.36, 0.62), age: 0,

  take(n) {
    const out = [];

    for (let k = 0; k < n && this.items.length; k++) out.push(this.items.pop());

  update(dt, t, trail, player) {
    const gl = player.glide, tmp = this.tmp;
    for (let i = 0; i < this.items.length; i++) {
      const L = this.items[i]; L.age += dt;
      const d = L.delay * (gl ? 0.35 : 1);
      trail.at(d, tmp);
      const ang = L.ph + t * L.om * (gl ? 1.8 : 1);
      const r = L.rad * (0.6 + 1.6 * d) * (gl ? 0.8 : 1);
      let tx, ty;
      if (gl) {
        // gliding: the leaves gather into a flat whirling cushion just under her feet (she surfs on them)
        tx = tmp.x + Math.cos(ang) * r * 1.0 - 0.35;
        ty = tmp.y + 0.5 + Math.sin(ang) * r * 0.32 - 0.25 * Math.abs(Math.cos(ang));
      } else {

      // run does not leave the swarm lagging metres behind: the stream starts at her and trails back, as in the video
      const k = gl ? 34 : 18, c = 2 * Math.sqrt(k) * 0.72;
      L.v.x += ((tx - L.p.x) * k - (L.v.x - player.vx) * c) * dt;

      L.v.z += ((tz - L.p.z) * k - L.v.z * c) * dt;

      L.r.x += L.rv.x * dt * spin; L.r.y += L.rv.y * dt * spin; L.r.z += L.rv.z * dt;
      const grow = Math.min(1, L.age * 5);

      // each leaf carries a smaller companion fluttering around it: the swarm reads as dense as in the video
      const a2 = L.ph * 1.7 + t * L.om * 1.35 + Math.PI, rr = 0.35 + 0.25 * Math.sin(L.ph * 3.1);
      this.cp.set(L.p.x + Math.cos(a2) * rr * 1.3, L.p.y + Math.sin(a2) * rr, L.p.z + Math.sin(a2 * 0.7) * 0.5);
      this.cr.set(L.r.x + 1.7, L.r.y - 0.9, L.r.z + 2.1);

    this.b.flush();
  }
}

// ---------------------------------------------------------------- free leaves (bursts, drift, homing)
class FxLeaves {
  constructor(batch) { this.b = batch; this.items = []; }
  spawn(p, v, o = {}) {
    if (this.items.length >= this.b.n) this.items.shift();
    this.items.push({ p: p.clone(), v: v.clone(), r: V3(rnd(0, TAU), rnd(0, TAU), rnd(0, TAU)), rv: V3(rnd(-8, 8), rnd(-6, 6), rnd(-8, 8)),
      tile: o.tile ?? Math.floor(rnd(0, 16)), s: o.s ?? rnd(0.35, 0.6), life: o.life ?? rnd(1.6, 3.2), max: 0, grav: o.grav ?? 2.2, drag: o.drag ?? 1.2,
      home: o.home || null, homeK: o.homeK ?? 0, onArrive: o.onArrive || null, bright: o.bright ?? 1 });
    this.items[this.items.length - 1].max = this.items[this.items.length - 1].life;
  }
  burst(p, n, speed = 8, o = {}) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), e = rnd(-0.6, 1.2); this.spawn(p, V3(Math.cos(a) * speed * rnd(0.3, 1), Math.sin(e) * speed * rnd(0.4, 1.2) + 2, Math.sin(a) * speed * 0.6), o); } }
  update(dt, wind) {

        if (dist < 0.8) { L.life = 0; if (L.onArrive) L.onArrive(L); }

        L.v.y += Math.sin(S.time * 3 + L.r.x) * 1.5 * dt;

      L.r.x += L.rv.x * dt; L.r.y += L.rv.y * dt; L.r.z += L.rv.z * dt;

// ---------------------------------------------------------------- ambient wind-blown leaves
class Ambient {
  constructor(b) { this.b = b; this.items = []; for (let i = 0; i < b.n; i++) this.items.push(this.make(true)); }

      rv: V3(rnd(-5, 5), rnd(-4, 4), rnd(-5, 5)), tile: Math.floor(rnd(0, 16)), s: rnd(0.3, 0.58) };

      if (L.p.x > cx + 75) { L.p.x -= 150; L.p.y = cy + rnd(-28, 30); }

// ---------------------------------------------------------------- carpet of fallen leaves on the golden hills
// (the video's hilltops are strewn with orange leaves, drifting into the hollows; the child kicks them up)
class Carpet {
  constructor(b) { this.b = b; this.items = []; this.tmp = V3(); this.pt = V3(); for (let i = 0; i < b.n; i++) { const L = {}; this.place(L, rnd(-70, 110)); this.items.push(L); } }
  reset(camX) { for (const L of this.items) this.place(L, camX + rnd(-70, 125)); }
  place(L, x) {
    for (let k = 0; k < 6; k++) {                          // more leaves gather in the hollows
      const hollow = clamp((smoothG(x) - ground.h(x)) / 5 + 0.3, 0.12, 1);
      if (rnd() < hollow) break; x += rnd(-7, 7);
    }
    const tilt = rnd(0.5, 1.15);
    L.x = x; L.z = 2.15 - Math.pow(rnd(), 0.75) * 12.5;    // denser towards the front lip, where the child runs
    L.s = rnd(0.22, 0.4); L.tile = Math.floor(rnd(0, 16)); L.sh = rnd(0.78, 1.0);
    L.r = V3(-Math.PI / 2 + tilt * (rnd() < 0.5 ? 1 : -1), rnd(0, TAU), rnd(-0.25, 0.25));
    L.y = ground.h(x) + 0.5 * L.s * Math.sin(tilt) * 0.85 + 0.02;

        world.fx.spawn(this.tmp, V3(rnd(-2, 3) + P.speed * 0.12, rnd(2.5, 6.5), rnd(-1.5, 1.5)), { tile: L.tile, s: L.s, life: rnd(0.9, 1.8), grav: 3.2 });

}

// ---------------------------------------------------------------- brush-stroke wind streaks
class WindStrokes {
  constructor(batches) { this.bs = batches; this.items = []; }
  spawn(x, y, z, len, life, a = 0.5, vx = 24) { if (!this.bs.length) return; this.items.push({ x, y, z, len, life, max: life, a, vx, b: Math.floor(rnd(0, this.bs.length)), rot: rnd(-0.12, 0.12) }); if (this.items.length > 36 * this.bs.length) this.items.shift(); }
  update(dt) {
    const counts = this.bs.map(() => 0);
    for (let i = this.items.length - 1; i >= 0; i--) { const s = this.items[i]; s.life -= dt; s.x += s.vx * dt; if (s.life <= 0) this.items.splice(i, 1); }
    for (const s of this.items) {
      const B = this.bs[s.b]; const k = counts[s.b]++; if (k >= B.n) continue;
      const u = 1 - s.life / s.max; const a = Math.sin(Math.PI * u) * s.a;
      B.set(k, s.x, s.y, s.z, s.len, s.len * 0.085, s.rot, a, 1, 0.95, 0.86);
    }
    this.bs.forEach((B, j) => { for (let k = counts[j]; k < B.n; k++) B.hide(k); B.flush(); });
  }
}

// ================================================================ PLAYER
let P = null;
function buildPlayer() {
  P = { x: 0, y: ground.h(0), vx: 0, vy: 0, speed: 0, grounded: true, glide: false, dive: false, coyote: 0, airT: 0, stumble: 0, inv: 0,
        face: V3(), trail: new Trail(), anim: 'idle', model: null, mixer: null, actions: {}, pitch: 0, roll: 0, lastLand: 0 };
  const root = new THREE.Group(); scene.add(root); P.root = root;
  if (GLB.child) {
    const m = GLB.child.scene; m.scale.setScalar(CFG.CHILD_SCALE);
    const ramp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
    ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
    m.traverse((o) => {
      if (o.isMesh || o.isSkinnedMesh) {
        o.material = new THREE.MeshToonMaterial({ map: o.material.map, gradientMap: ramp, color: new THREE.Color('#ffffff') });
        o.frustumCulled = false;
      }
      if (o.isBone && o.name === 'neck') P.neck = o;
      if (o.isBone && o.name === 'Hips') P.hips = o;
    });
    const pivot = new THREE.Group(); pivot.add(m); root.add(pivot); P.pivot = pivot; P.model = m;
    m.rotation.y = Math.PI / 2 - 0.32;
    P.mixer = new THREE.AnimationMixer(m);
    for (const clip of GLB.child.animations) {
      // keep the animation in place: freeze Hips x/z translation (keep the vertical bob)
      const c = clip.clone();
      for (const tr of c.tracks) {
        if (tr.name === 'Hips.position') {
          const v = tr.values; const x0 = v[0], z0 = v[2];
          for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; if (/leap|fall|jump|slide/.test(c.name)) v[i + 1] = lerp(v[i + 1], v[1], 0.6); }
        }
      }
      const a = P.mixer.clipAction(c); a.enabled = true; a.setEffectiveWeight(0); a.play();
      P.actions[c.name] = a;
    }
    setAnim('idle', 0);
  }
  // scarf ribbon
  P.scarf = new Scarf(T.scarf);
}

function setAnim(name, fade = 0.25, time = null, timeScale = 1) {
  if (!P.mixer || !P.actions[name]) return;
  const a = P.actions[name];
  if (P.anim === name) { if (time !== null) a.time = time; a.timeScale = timeScale; return; }
  const prev = P.actions[P.anim];
  a.reset(); a.enabled = true; a.setEffectiveTimeScale(timeScale); a.setEffectiveWeight(1); if (time !== null) a.time = time;
  a.play();
  if (prev && fade > 0) prev.crossFadeTo(a, fade, false); else if (prev) prev.setEffectiveWeight(0);
  P.anim = name;
}

class Scarf {
  constructor(tex) {
    this.n = 16; this.len = 2.15; this.seg = this.len / (this.n - 1);   // a broad cape-like flap, as in the video
    this.p = []; for (let i = 0; i < this.n; i++) this.p.push(V3(-i * this.seg, 1.4, -0.12));
    const pos = new Float32Array(this.n * 2 * 3), uv = new Float32Array(this.n * 2 * 2), idx = [];
    for (let i = 0; i < this.n; i++) { const u = i / (this.n - 1); uv[i * 4] = u; uv[i * 4 + 1] = 0; uv[i * 4 + 2] = u; uv[i * 4 + 3] = 1; }
    for (let i = 0; i < this.n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);
    const mat = tex ? new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, alphaTest: 0.35, depthWrite: true, fog: true })
                    : new THREE.MeshBasicMaterial({ color: '#d9532a', side: THREE.DoubleSide, fog: true });
    this.mesh = new THREE.Mesh(g, mat); this.mesh.frustumCulled = false; scene.add(this.mesh);
    this.dir = V3(); this.wind = V3(); this.d = []; for (let i = 0; i < this.n; i++) this.d.push(V3(-1, 0, 0));
  }
  reset(anchor) { for (let i = 0; i < this.n; i++) this.p[i].set(anchor.x - i * this.seg, anchor.y - i * 0.02, anchor.z); }
  update(dt, anchor, vel, t) {
    const n = this.n;
    // relative wind: the scarf streams away from the motion, lifted a little by the autumn wind
    this.wind.set(-(vel.x + 7), -vel.y * 0.55 + 1.2, 0).normalize();
    this.p[0].copy(anchor);
    for (let i = 1; i < n; i++) {
      const prev = this.p[i - 1], cur = this.p[i];
      this.dir.subVectors(cur, prev); this.dir.z = 0;
      if (this.dir.lengthSq() < 1e-8) this.dir.copy(this.wind);
      this.dir.normalize().lerp(this.wind, clamp(dt * (3 + i * 0.35), 0, 1)).normalize();
      cur.copy(prev).addScaledVector(this.dir, this.seg); cur.z = anchor.z;
      this.d[i].copy(this.dir);
    }
    this.d[0].copy(this.d[1]);
    const pos = this.mesh.geometry.attributes.position.array;
    const amp = 0.08 + clamp(Math.abs(vel.x) / 70, 0, 0.11);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), dir = this.d[i];
      const px = -dir.y, py = dir.x;                                   // perpendicular in the picture plane
      const wave = Math.sin(t * 10 - i * 0.7) * amp * Math.pow(u, 0.8) + Math.sin(t * 19 - i * 1.4) * 0.035 * u;
      const cx = this.p[i].x + px * wave, cy = this.p[i].y + py * wave;
      const w = (0.29 - 0.17 * u) * (0.78 + 0.22 * Math.abs(Math.cos(t * 6.5 - i * 0.45)));
      pos[i * 6] = cx + px * w; pos[i * 6 + 1] = cy + py * w; pos[i * 6 + 2] = this.p[i].z;
      pos[i * 6 + 3] = cx - px * w; pos[i * 6 + 4] = cy - py * w; pos[i * 6 + 5] = this.p[i].z;
    }
    this.mesh.geometry.attributes.position.needsUpdate = true;
  }
}

function resetRun() {
  const x0 = isFinite(DBG.x) ? DBG.x : 0;
  Object.assign(P, { x: x0, y: ground.h(x0), vx: 0, vy: 0, speed: 0, grounded: true, glide: false, dive: false, coyote: 0, airT: 0, stumble: 0, inv: 0, pitch: 0, roll: 0 });
  S.leaves = 0; S.trees = 0; S.delivered = 0; S.playTime = 0; S.ended = false; S.endT = 0; S.combo = 0;
  for (const p of world.picks) p.taken = false;
  for (const g of world.gusts) g.used = false;
  for (const r of world.rocks) r.hit = false;
  for (const t of world.trees) { t.state = t.x < x0 ? -2 : 0; t.t = 0; t.burst = false; t.bloom.material.opacity = 0; t.bare.material.opacity = 1; t.g.scale.setScalar(1); }
  world.great.burst = false; world.great.acc = 0;
  world.great.t = 0; world.great.bloom.material.opacity = 0; world.great.bare.material.opacity = 1;
  world.swarm.items.length = 0; world.fx.items.length = 0;
  P.trail.reset(V3(P.x, P.y, 0));
  const startLeaves = DBG.leaves || 10;
  for (let i = 0; i < startLeaves; i++) { world.swarm.add(V3(P.x - rnd(0, 2), P.y + rnd(0.5, 2), rnd(-1, 1))); }
  S.leaves = world.swarm.count;
  buildTreeHud(); world.trees.forEach(t => { if (t.state === -2) markTreeHud(t.i, false); });
  P.scarf.reset(V3(P.x, P.y + 1.5, 0));

// ---------------------------------------------------------------- physics step
function stepPlayer(dt) {
  const G = CFG.G; const inp = S.input;
  P.inv = Math.max(0, P.inv - dt); P.stumble = Math.max(0, P.stumble - dt);
  const playing = S.state === 'play';
  const wantGlide = playing && inp.hold && !P.grounded && P.airT > 0.12;
  const wantDive = playing && inp.dive;
  P.dive = wantDive;
  // jump on press (with coyote time and a short input buffer)
  if (inp.justPressed) inp.buffer = 0.16; else inp.buffer = Math.max(0, (inp.buffer || 0) - dt);
  if (playing && inp.buffer > 0 && (P.grounded || P.coyote > 0) && P.stumble <= 0) {
    inp.buffer = 0;
    const sl = ground.d1(P.x); const nlen = Math.hypot(sl, 1);
    let vx = P.grounded ? P.speed / nlen : P.vx, vy = P.grounded ? P.speed * sl / nlen : P.vy;
    vy = Math.max(vy, 0) + CFG.JUMP; vx += 1.5;
    P.vx = vx; P.vy = vy; P.grounded = false; P.coyote = 0; P.airT = 0;
    sfx('jump', 0.32, rnd(0.92, 1.08));
    world.fx.burst(V3(P.x, P.y + 0.2, 0.3), 5, 4, { s: 0.3, life: 1.2 });
  }
  inp.justPressed = false;

  if (P.grounded) {
    const sl = ground.d1(P.x), cth = 1 / Math.hypot(1, sl), sth = sl * cth;
    let acc = -G * sth * (sl < 0 ? (P.dive ? 1.75 : 1) : 0.78) + CFG.WIND_ACC - 0.0045 * P.speed * P.speed;
    if (P.dive && sl > 0) acc -= 2;                   // pressing on an upslope costs speed (Tiny-Wings logic)
    if (!playing) acc = 0;
    P.speed = clamp(P.speed + acc * dt, playing ? CFG.MIN_SPEED : 0, CFG.MAX_SPEED);
    if (P.stumble > 0) P.speed = Math.min(P.speed, 9);
    const dx = P.speed * cth * dt;
    const nx = P.x + dx;
    // launch test: does the ground fall away faster than gravity can hold us?
    const k2 = ground.d2(nx), s1 = ground.d1(nx);
    const kappa = -k2 / Math.pow(1 + s1 * s1, 1.5);
    const gEff = G * (P.dive ? CFG.DIVE_G : 1);
    if (playing && kappa > 0 && P.speed * P.speed * kappa > gEff * cth * 1.02 && P.speed > 14) {
      const c2 = 1 / Math.hypot(1, s1);
      P.vx = P.speed * c2; P.vy = P.speed * s1 * c2; P.grounded = false; P.airT = 0; P.coyote = 0.12;
    } else {
      P.x = nx; P.y = ground.h(P.x);
      P.vx = P.speed * cth; P.vy = P.speed * sth;
    }
    P.coyote = P.grounded ? 0.12 : P.coyote;
  } else {
    P.airT += dt; P.coyote = Math.max(0, P.coyote - dt);
    let g = G;
    P.glide = false;
    if (wantGlide) {
      if (S.leaves > 0) { g = G * CFG.GLIDE_G; P.glide = true; drainGlide(dt); }
      else g = G * 0.62;
    }
    if (P.dive) g = G * CFG.DIVE_G;
    P.vy -= g * dt;
    if (P.glide) { P.vy = Math.max(P.vy, CFG.GLIDE_TERM); P.vx += (Math.max(P.vx, 16) - P.vx) * dt * 0.6; }
    P.vx += (12 - P.vx) * 0.03 * dt;                  // the wind keeps pushing

function updateEnding(dt) {

  }

  S.endT += dt;

  if (P.grounded) {

    if (P.x >= stopX) P.speed = 0;

  if (S.endT > 1.4 && world.swarm.count > 0) {

    while (gT.acc >= 1 && world.swarm.count > 0) {

      const crown = V3(gT.x + rnd(-11, 11), gT.y + 30 + rnd(-6, 8), gT.z + 1);
      world.fx.spawn(L.p, V3(rnd(-3, 3), rnd(8, 14), rnd(-2, 2)), { tile: L.tile, s: L.s, life: 6, home: crown, grav: 0, bright: 1.1 });
    }

  if (S.endT > 2.2) { gT.t = Math.min(want, gT.t + dt * 0.18); gT.bloom.material.opacity = smooth(gT.t); gT.bare.material.opacity = 1 - smooth(gT.t) * 0.9; }
  if (S.endT > 3 && !gT.burst) { gT.burst = true; world.fx.burst(V3(gT.x, gT.y + 28, gT.z + 2), 120, 16, { s: 0.5, life: 4, grav: 1.4, bright: 1.15 }); S.flash = 0.25; }

}

const CAM = { x: 0, y: 8, dist: 34, yaw: 0, lookX: 0, lookY: 0, shakeT: 0 };
function updateCamera(dt) {
  const air = Math.max(0, P.y - ground.h(P.x));

  let ty = P.y + 1.5 - Math.min(air, 18) * 0.4;
  if (S.state === 'title') { lead = 2.5; dist = 19 + Math.sin(S.time * 0.15) * 1.5; ty = P.y + 2.6; }
  if (S.state === 'ending' || S.state === 'end') { const u = smooth(clamp(S.endT / 6, 0, 1)); lead = lerp(lead, (world.great.x - P.x) * 0.55, u); dist = lerp(dist, 70, u); ty = lerp(ty, P.y + 16, u); }

  CAM.dist = damp(CAM.dist, dist * DBG.zoom * portrait, 1.4, dt);
  CAM.yaw = 0.11 * Math.sin(S.time * 0.071) + 0.05 * Math.sin(S.time * 0.031 + 1.0);
  const pitch = 0.012 + 0.012 * Math.sin(S.time * 0.05);
  camera.position.set(CAM.lookX + Math.sin(CAM.yaw) * CAM.dist - 1.2, CAM.lookY + Math.sin(pitch) * CAM.dist, Math.cos(CAM.yaw) * CAM.dist);
  camera.lookAt(CAM.lookX, CAM.lookY + 1.6, 0);
  camera.rotateZ(0.012 * Math.sin(S.time * 0.11));

  if (world.sky) {
    world.sky.material.map.offset.x = CAM.lookX * 0.00009 + CAM.yaw * 0.06;
    world.sky.material.map.offset.y = clamp(0.05 - (CAM.lookY - 6) * 0.0012, 0, 0.1);
  }

let composer = null, gradePass = null, bloomPass = null;
function buildPost() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const rt = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(size.x / 2, size.y / 2), 0.22, 0.55, 0.92);
  composer.addPass(bloomPass);
  gradePass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, tPaper: { value: T.paper }, uP: { value: 0 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(size.x, size.y) }, uFlash: { value: 0 }, uVig: { value: 1 }, uHasPaper: { value: T.paper ? 1 : 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse; uniform sampler2D tPaper; uniform float uP; uniform float uTime; uniform vec2 uRes; uniform float uFlash; uniform float uVig; uniform float uHasPaper;
      varying vec2 vUv;
      void main() {

        vec3 tA = vec3(1.0, 0.99, 0.965), tB = vec3(1.05, 0.975, 0.875);
        float noon = smoothstep(0.0, 0.5, uP);
        c.rgb *= mix(tA, tB, noon);

        vec3 hi = vec3(1.12, 0.86, 0.66), lo = vec3(0.86, 0.72, 0.92);

        c.rgb = mix(c.rgb, c.rgb * split, dusk * 0.85);
        c.rgb += vec3(0.20, 0.07, 0.03) * dusk * smoothstep(0.35, 1.0, vUv.y) * 0.55;
        if (uHasPaper > 0.5) { vec3 paper = texture2D(tPaper, vUv * uRes / 1100.0).rgb; c.rgb *= mix(vec3(1.0), paper * 1.06, 0.2); }
        float d = distance(vUv, vec2(0.5, 0.48));
        c.rgb *= mix(1.0, 0.74, smoothstep(0.38, 0.98, d) * uVig);
        c.rgb += uFlash * vec3(1.0, 0.86, 0.62);

}

// ================================================================ CHARACTER POSE
function updateCharacter(dt) {
  if (!P.model) return;
  let anim = 'idle', ts = 1, pitch = 0;
  const sl = ground.d1(P.x);
  if (S.state === 'title') anim = 'idle';
  else if ((S.state === 'ending' || S.state === 'end') && P.grounded && P.speed < 1.5) anim = S.endT > 2 ? 'cheer' : 'idle';
  else if (P.stumble > 0.15) { anim = 'fall2'; ts = 1.6; }
  else if (P.grounded) {
    if (P.speed < 2) anim = 'idle';
    else if (P.speed < 15) { anim = 'running'; ts = clamp(P.speed / 11, 0.7, 1.5); }
    else { anim = 'sprint'; ts = clamp(P.speed / 20, 0.9, 1.7); }
    pitch = -Math.atan(sl) * 0.75;
  } else {
    if (P.glide) { anim = 'fall1'; ts = 1.2; pitch = 0.62 + clamp(P.vy * 0.02, -0.2, 0.2); }
    else if (P.dive) { anim = 'fall2'; ts = 1.4; pitch = -0.4; }
    else { anim = 'jump'; ts = 0; pitch = -Math.atan2(P.vy, P.vx) * 0.35; }
  }
  if (anim === 'jump') setAnim('jump', 0.12, 1.05, 0); else setAnim(anim, anim === 'fall1' ? 0.22 : 0.18, null, ts);
  if (P.actions[anim]) P.actions[anim].timeScale = ts;
  P.pitch = damp(P.pitch, pitch, 8, dt);
  const air = !P.grounded;
  P.root.position.set(P.x, P.y, 0);
  P.pivot.rotation.z = P.pitch;
  P.pivot.position.y = air && P.glide ? 0.9 : 0;
  P.mixer.update(dt);
}

// ================================================================ MAIN LOOP
let last = performance.now() / 1000, acc = 0;
const QUAL = { acc: 0, n: 0, level: 0 };
const FIXED = 1 / 120;

  requestAnimationFrame(frame);
  const now = performance.now() / 1000; let dt = Math.min(0.05, now - last) * DBG.ts; last = now;
  if (S.state === 'loading' || !world) return;
  S.slowmo = damp(S.slowmo, 1, 2.5, dt);
  const gdt = dt * S.slowmo;
  S.time += gdt; commonUniforms.uTime.value = S.time;
  if (S.comboT > 0) S.comboT -= gdt;
  if (S.state === 'play') S.playTime += gdt;
  // auto-pilot for headless testing (?auto)
  if (DBG.auto && S.state === 'play') autoPilot();
  if (DBG.auto && S.state !== 'end' && (S.logT = (S.logT || 0) + gdt) > 5) { S.logT = 0; console.log('auto', JSON.stringify({ t: S.playTime.toFixed(0), x: P.x.toFixed(0), y: P.y.toFixed(1), v: P.speed.toFixed(1), leaves: S.leaves, trees: S.trees, st: S.state, del: S.delivered })); }
  acc += gdt;
  while (acc >= FIXED) { stepPlayer(FIXED); acc -= FIXED; }
  P.trail.push(V3(P.x, P.y, 0), gdt);
  updateTrees(gdt); updateGusts(gdt); updatePickups(gdt); updateEnding(gdt);
  updateCharacter(gdt);
  updateCamera(dt);
  // scarf: anchored at the neck bone
  const anchor = V3(P.x, P.y + 1.3, -0.1);
  if (P.neck) { P.neck.getWorldPosition(anchor); anchor.z = -0.16; anchor.x -= 0.08; }
  P.scarf.update(gdt, anchor, V3(P.vx, P.vy, 0), S.time);
  world.swarm.update(gdt, S.time, P.trail, P);
  world.fx.update(gdt, 7 + P.speed * 0.3);
  world.amb.update(gdt, camera.position, P.glide ? 0.6 : 0.15 + P.speed / 80);
  world.carpet.update(gdt, camera.position.x);
  // wind streaks around the child when fast
  if (S.state === 'play' && P.speed > 16 && Math.random() < gdt * (P.speed * 0.08)) world.wind.spawn(P.x + rnd(-14, 18), P.y + rnd(-1, 6), rnd(-4, -1), rnd(5, 9), rnd(0.5, 0.9), 0.1 + P.speed * 0.004, 20 + P.speed * 0.6);
  if (Math.random() < gdt * 0.8) world.wind.spawn(camera.position.x + rnd(-40, 40), CAM.lookY + rnd(5, 16), rnd(-40, -14), rnd(5, 9), rnd(1, 1.8), 0.1, 14);
  world.wind.update(gdt);
  updateSparks(gdt);
  updateAudio();
  if (S.state === 'play' || S.state === 'ending') updateHud();
  S.progress = clamp(P.x / COURSE.greatX, 0, 1);
  const dusk = smooth(clamp((S.progress - 0.55) / 0.45, 0, 1));
  scene.fog.color.copy(HAZE).lerp(DUSK_HAZE, dusk * 0.6);
  world.sky.material.color.setRGB(1, 0.985 - 0.13 * dusk, 0.935 - 0.28 * dusk);   // warmer, creamier sky like the video
  if (world.far) world.far.material.color.setRGB(0.97, 0.93 - 0.08 * dusk, 0.86 - 0.17 * dusk);

}
function updateSparks(dt) {
  if (!world.glow) return;
  const gb = world.glow; let gi = world.glowUsed || 0; const sb = world.sparkB; let si = 0;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.t += dt; if (s.t > 0.6) { sparks.splice(i, 1); continue; }

// simple bot used only with ?auto for automated screenshots
function autoPilot() {
  const sl = ground.d1(P.x);
  const nextCrest = COURSE.crests.find(c => c > P.x + 1) || P.x + 40;
  const air = P.y - ground.h(P.x);
  if (P.grounded) {
    S.input.dive = sl < -0.08;
    S.input.hold = false;
    if (sl > 0.1 && nextCrest - P.x < 4 + P.speed * 0.12) { S.input.justPressed = true; S.input.hold = true; }
    const r = world.rocks.find(r => r.solid && !r.hit && r.x > P.x && r.x - P.x < 3 + P.speed * 0.12);
    if (r) { S.input.justPressed = true; S.input.hold = true; }
  } else {
    S.input.dive = P.vy < 0 && air < 3 && ground.d1(P.x + 4) < -0.15;
    S.input.hold = P.vy < -1 && air > 3 && S.leaves > 9 && !S.input.dive;
  }
}

(async function boot() {
  await loadAll();
  buildWorld();
  buildTreeHud();
  if (!DBG.nopost) { try { buildPost(); } catch (e) { console.warn('post disabled', e); composer = null; } }
  resetRun();
  $('loading').classList.add('hide');
  if (DBG.state === 'play' || DBG.auto) { startRun(); } else showTitle();
  frame();
  window.__game = { S, P, world, CFG, COURSE, HOLE, CAM, camera };
  console.log('ready', { crests: COURSE.crests.length, greatX: COURSE.greatX.toFixed(0), picks: world.picks.length, gusts: world.gusts.length, rocks: world.rocks.filter(r => r.solid).length });
})();
</script>
<script src="../brand/gamepad.js"></script>
