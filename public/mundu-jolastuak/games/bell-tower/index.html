<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================================
   BELL TOWER: a bell-ringer swings on long ropes inside a pastel bell tower.
   Every visual asset (sky, rainbow sky, tower storeys, hills, foliage, clouds, leaves,
   glow, paper, rope, beam, scarf, bells GLB, rigged girl GLB) and every sound was
   generated with fal (see README.md).
   ===================================================================================== */

const QS = new URLSearchParams(location.search);
const AUTO = QS.has('auto');                 // skip the title (testing / screenshots)
const START_LEVEL = Math.min(3, +(QS.get('level') || 0));
const A = 'assets/';

// ---------- world layout (measured on the generated images) ----------
const TIER_W = 20, TIER_H = 17.79;                // storey image 20x20 units, stacked every 17.79
const OPEN_HALF = 5.08;                            // half width of the arch opening
const BEAM_Y = 11.6;                               // beam / rope anchor height inside a storey
const TOP_W = 22.94, TOP_H = 28.48, TOP_Y = 3 * TIER_H;
const BASE_W = 22.4, BASE_H = 16.7, BASE_TOP = 1.71;
const GREAT_TOP = TOP_Y + 13.55;                   // crown of the great bell

// ---------- gameplay constants ----------
const G = 30, PUMP = 4.7, DAMP = 0.07, CLIMB = 3.0, BODY = 1.5, L_MIN = 1.35, L_MAX = 7.1, L_START = 5.4;
const REST = 0.6, HAND_LIMIT = 4.3, HIT_R = 0.46;
const STD_BELL_H = 3.6;                            // crown-to-clapper height of a size-1 bell

const LEVELS = [
  { bells: [ { x: -2.55, drop: 0,   size: 1.00, note: 0 },  { x: 2.55, drop: 0, size: 1.00, note: 7 } ],
    goal: 'free', count: 6 },
  { bells: [ { x: -2.2,  drop: 0,   size: 0.78, note: 12 }, { x: 2.75, drop: 1.0, size: 1.18, note: -5 } ],
    goal: 'seq', seq: [0, 1, 1, 0, 1, 0] },
  { bells: [ { x: -2.8,  drop: 0.6, size: 1.00, note: 4 },  { x: 1.7, drop: 0, size: 0.60, note: 16 },
             { x: 3.05, drop: 2.6, size: 1.08, note: -3 } ],
    goal: 'seq', seq: [0, 1, 2, 1, 0, 2] },
  { great: true, count: 4 }
];
const RAINBOW_CSS = ['#f28a7a', '#f6b26b', '#f3dc84', '#9fd8a8', '#7fd3d6', '#8ea9ee'];

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(0, 8, 34);

// ---------- loading ----------
const manager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
let loadTotal = 0, loadDone = 0;
const barEl = document.querySelector('#loading .bar b');
function tick() { loadDone++; barEl.style.width = (100 * loadDone / Math.max(1, loadTotal)).toFixed(1) + '%'; }
function loadTex(file, { repeat = false, srgb = true } = {}) {
  loadTotal++;
  return new Promise((res) => {
    texLoader.load(A + file, (t) => {
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = Math.min(8, maxAniso);
      if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
      tick(); res(t);
    }, undefined, () => { console.warn('missing texture', file); tick(); res(null); });
  });
}
function loadGLB(file) {
  loadTotal++;
  return new Promise((res) => {
    gltfLoader.load(A + file, (g) => { tick(); res(g); }, undefined, (e) => { console.warn('missing glb', file, e); tick(); res(null); });
  });
}

// ---------- shared uniforms ----------
const U = {
  time: { value: 0 },
  sat: { value: 0.78 },
  lights: { value: [new THREE.Vector4(0, -999, 1, 0), new THREE.Vector4(0, -999, 1, 0), new THREE.Vector4(0, -999, 1, 0)] },
  lightCol: { value: new THREE.Color(1.0, 0.72, 0.36) },
};

// ---------- painted layer material ----------
const paintVS = /* glsl */`
  varying vec2 vUv; varying vec3 vW;
  void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const paintFS = /* glsl */`
  uniform sampler2D map; uniform float uSat, uOpacity, uHazeAmt, uBright, uSatMul; uniform vec3 uHaze, uTint;
  uniform vec4 uLights[3]; uniform vec3 uLightCol; uniform float uLightAmt;
  varying vec2 vUv; varying vec3 vW;
  void main(){
    vec4 c = texture2D(map, vUv);
    if (c.a < 0.004) discard;
    vec3 col = c.rgb;
    float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
    col = mix(vec3(l), col, uSat * uSatMul) * uTint * uBright;
    col = mix(col, uHaze, uHazeAmt);
    float g = 0.0;
    for (int i = 0; i < 3; i++) { vec2 d = vW.xy - uLights[i].xy; g += uLights[i].w * exp(-dot(d, d) / (uLights[i].z * uLights[i].z)); }
    col += uLightCol * g * uLightAmt;
    gl_FragColor = vec4(col, c.a * uOpacity);
    #include <colorspace_fragment>
  }`;
function paintMat(map, o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: map }, uSat: U.sat, uSatMul: { value: o.satMul ?? 1 }, uOpacity: { value: o.opacity ?? 1 },
      uHaze: { value: new THREE.Color(o.haze ?? 0xf4e6d6) }, uHazeAmt: { value: o.hazeAmt ?? 0 },
      uBright: { value: o.bright ?? 1 }, uTint: { value: new THREE.Color(o.tint ?? 0xffffff) },
      uLights: U.lights, uLightCol: U.lightCol, uLightAmt: { value: o.lightAmt ?? 0 },
    },
    vertexShader: paintVS, fragmentShader: paintFS, transparent: true, depthWrite: false,
  });
}
function layer(map, w, h, x, y, z, o = {}) {
  if (!map) return null;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), paintMat(map, o));
  m.position.set(x, y, z);
  if (o.flip) m.scale.x = -1;
  if (o.order !== undefined) m.renderOrder = o.order;
  scene.add(m);
  return m;
}

// ---------- sky (full-screen painted sky with rolling rainbow waves) ----------
const MAX_WAVES = 10;
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uPlain: { value: null }, uRain: { value: null }, uTime: U.time, uSat: U.sat,
    uRes: { value: new THREE.Vector2(1, 1) }, uTexAspect: { value: 4096 / 1738 }, uPan: { value: new THREE.Vector2(0.5, 0) },
    uPersist: { value: 0 }, uFlash: { value: 0 },
    uWaves: { value: Array.from({ length: MAX_WAVES }, () => new THREE.Vector4(0, 0, -100, 0)) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.99999, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uPlain, uRain; uniform float uTime, uTexAspect, uPersist, uSat, uFlash;
    uniform vec2 uRes, uPan; uniform vec4 uWaves[${MAX_WAVES}];
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*noise(p); p = p*2.03 + 7.1; a *= 0.5; } return s; }
    void main(){
      float asp = uRes.x / uRes.y;
      float hv = 0.74, wv = hv * asp / uTexAspect;
      if (wv > 0.985) { hv *= 0.985 / wv; wv = 0.985; }
      vec2 st = vec2(uPan.x * (1.0 - wv) + vUv.x * wv, uPan.y * (1.0 - hv) + vUv.y * hv);
      vec3 plain = texture2D(uPlain, st).rgb;
      float px = vUv.x * asp;
      float n = fbm(st * vec2(6.0, 3.0) + vec2(uTime * 0.02, 0.0));
      // As in the video, each ring sends the painted rainbow ribbon rolling sideways across the sky,
      // starting at the bell and travelling out through the arches on both sides.
      float reveal = uPersist * (0.62 + 0.38 * smoothstep(0.25, 0.75, n));    // the colour that stays
      float sheen = 0.0, disp = 0.0;
      for (int i = 0; i < ${MAX_WAVES}; i++){
        vec4 W = uWaves[i];
        float age = uTime - W.z;
        if (W.w <= 0.0 || age < 0.0 || age > 11.0) continue;
        float d = abs(px - W.x * asp) + (n - 0.5) * 0.14;      // horizontal distance from the bell, ragged watercolour edge
        float front = age * (0.62 + 0.18 * min(W.w, 2.0));
        float fade = exp(-max(age - 1.8, 0.0) * 0.3) * (1.0 - smoothstep(9.0, 11.0, age));    // holds, then fades
        float inside = (1.0 - smoothstep(front - 0.3, front + 0.04, d)) * smoothstep(0.0, 0.2, front);
        reveal = max(reveal, inside * fade * min(1.0, 0.5 + 0.5 * W.w));
        float e = (d - front + 0.05) / 0.11;
        sheen += exp(-e * e) * fade * min(W.w, 1.6);
        disp += sin(d * 11.0 - age * 6.5) * exp(-abs(d - front) * 2.6) * fade * min(W.w, 1.6) * 0.0075;
      }
      reveal = clamp(reveal, 0.0, 1.0);
      vec2 rst = st + vec2(sin(st.y * 17.0 + uTime * 0.7) * 0.0028, disp + cos(st.x * 9.0 + uTime * 0.45) * 0.0022);
      vec3 rain = texture2D(uRain, rst).rgb;
      vec3 plainR = texture2D(uPlain, rst).rgb;
      float rib = smoothstep(0.05, 0.24, distance(rain, plainR));      // where the painted ribbon is
      vec3 col = mix(plain, rain, reveal * rib);
      col = mix(col, min(vec3(1.0), rain * 1.16 + 0.04), clamp(sheen, 0.0, 1.0) * rib * 0.55);   // bright leading edge
      col += vec3(1.0, 0.95, 0.86) * clamp(sheen, 0.0, 1.0) * 0.035;
      col += vec3(1.0, 0.94, 0.82) * uFlash * 0.12;
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, mix(uSat, 1.0, 0.45));
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat);
sky.frustumCulled = false; sky.renderOrder = -1000;
scene.add(sky);
let waveIdx = 0;
function addWave(sx, sy, amp, delay = 0) {
  const w = skyMat.uniforms.uWaves.value[waveIdx++ % MAX_WAVES];
  w.set(sx, sy, U.time.value + delay, amp);
}
const _pv = new THREE.Vector3();
function screenOf(x, y, z = 0) { _pv.set(x, y, z).project(camera); return [_pv.x * 0.5 + 0.5, _pv.y * 0.5 + 0.5]; }

// ---------- lights for the 3D models ----------
const hemi = new THREE.HemisphereLight(0xe3f0ff, 0xf6c79a, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.1);
sun.position.set(-10, 16, 14);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc8d8ff, 0.55);
fill.position.set(12, 4, 10);
scene.add(fill);
const toonRamp = (() => {
  const d = new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 215, 215, 215, 255, 255, 255, 255, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const bellLights = [0, 1, 2].map(() => { const l = new THREE.PointLight(0xffc06a, 0, 9, 1.6); scene.add(l); return l; });

// ---------- world containers ----------
const world = { tiers: [], ropes: [], bells: [], great: null, foliage: [], clouds: [], hills: [] };

// ---------- ribbon (rope / strap / scarf) ----------
class Ribbon {
  constructor(n, width, mat, taper = 0) {
    this.n = n; this.width = width; this.taper = taper;
    const g = new THREE.BufferGeometry();
    this.pos = new Float32Array(n * 2 * 3); this.uv = new Float32Array(n * 2 * 2);
    const idx = [];
    for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    g.setIndex(idx);
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(this.uv, 2));
    this.mesh = new THREE.Mesh(g, mat); this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }
  update(pts, vScale = 1, count = pts.length, fit = false) {
    let acc = 0; const n = this.n; const c = Math.max(2, Math.min(count, n));
    let total = 1;
    if (fit) { total = 0; for (let i = 1; i < c; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); total = total || 1; }
    for (let i = 0; i < n; i++) {
      const k = Math.min(i, c - 1);
      const p = pts[k], a = pts[Math.max(k - 1, 0)], b = pts[Math.min(k + 1, c - 1)];
      let dx = b.x - a.x, dy = b.y - a.y; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const t = i / (n - 1);
      const w = this.width * (1 - this.taper * t) * 0.5;
      const nx = -dy * w, ny = dx * w;
      if (i > 0 && k === i) acc += Math.hypot(p.x - pts[k - 1].x, p.y - pts[k - 1].y);
      this.pos.set([p.x + nx, p.y + ny, p.z, p.x - nx, p.y - ny, p.z], i * 6);
      const v = fit ? 1 - acc / total : acc * vScale;
      this.uv.set([0, v, 1, v], i * 4);
    }
    this.mesh.geometry.attributes.position.needsUpdate = true;
    this.mesh.geometry.attributes.uv.needsUpdate = true;
  }
}

// ---------- verlet rope ----------
const ROPE_N = 30, ROPE_Z = -0.62, ROPE_TAIL = 1.5;
class Rope {
  constructor(ax, ay, len, mat, golden = false) {
    this.ax = ax; this.ay = ay; this.len = len; this.golden = golden;
    this.visible = golden ? 0 : len;               // unfurl length
    this.pts = []; this.old = [];
    for (let i = 0; i < ROPE_N; i++) {
      const y = ay - (len * i) / (ROPE_N - 1);
      this.pts.push(new THREE.Vector3(ax, y, ROPE_Z)); this.old.push(new THREE.Vector3(ax, y, ROPE_Z));
    }
    this.ribbon = new Ribbon(ROPE_N, 0.1, mat);
    this.hand = null;                                // {L, x, y} when the girl holds it
    this.floorY = -1e9;
  }
  step(dt, wind) {
    const seg = this.len / (ROPE_N - 1);
    const g = -22 * dt * dt;
    // while she holds it, only a short end dangles below her hands (as in the video); the rest is hauled up out of sight
    const last = this.hand ? Math.max(1, Math.min(ROPE_N - 1, Math.ceil(this.visible / seg))) : ROPE_N - 1;
    for (let i = 1; i <= last; i++) {
      const p = this.pts[i], o = this.old[i];
      const vx = (p.x - o.x) * 0.985, vy = (p.y - o.y) * 0.985;
      o.copy(p);
      p.x += vx + wind * dt * dt * (0.3 + i / ROPE_N); p.y += vy + g;
    }
    // the girl's hands pin the rope at distance L: everything above is taut and straight
    let first = 1, rootX = this.ax, rootY = this.ay, rest0 = seg;
    if (this.hand) {
      const hk = Math.min(ROPE_N - 1, Math.floor(this.hand.L / seg));
      for (let i = 1; i <= hk; i++) {
        const t = (i * seg) / Math.max(1e-3, this.hand.L);
        const p = this.pts[i];
        p.set(this.ax + (this.hand.x - this.ax) * t, this.ay + (this.hand.y - this.ay) * t, ROPE_Z);
        this.old[i].copy(p);
      }
      first = hk + 1; rootX = this.hand.x; rootY = this.hand.y; rest0 = Math.max(0.001, first * seg - this.hand.L);
    }
    this.pts[0].set(this.ax, this.ay, ROPE_Z);
    if (first <= last) {
      for (let it = 0; it < 12; it++) {
        // root (anchor or hands) -> first free point
        { const b = this.pts[first]; const dx = b.x - rootX, dy = b.y - rootY; const d = Math.hypot(dx, dy) || 1e-6;

const AudioSys = {
  ctx: null, master: null, sfx: null, musicGain: null, windGain: null, verb: null, buffers: {}, muted: false, started: false,
  init() {

    this.windGain = c.createGain(); this.windGain.gain.value = 0; this.windGain.connect(this.master);

  texP.push(loadTex('paper.webp', { repeat: true }).then((t) => (T.paper = t)));

    AudioSys.load('bell', 'bell.mp3'), AudioSys.load('great', 'great_bell.mp3'), AudioSys.load('wind', 'wind.mp3'),
    AudioSys.load('music', 'music.mp3'), AudioSys.load('chime', 'chime.mp3'), AudioSys.load('whoosh', 'whoosh.mp3'),
  ];

  if (T.skyPlain && T.skyPlain.image) skyMat.uniforms.uTexAspect.value = T.skyPlain.image.width / T.skyPlain.image.height;

  // --- far landscape layers (true depth parallax) ---
  if (T.hillsFar) { const a = T.hillsFar.image.width / T.hillsFar.image.height; const w = 760;
    world.hills.push(layer(T.hillsFar, w, w / a, 0, -52 - w / a / 2 + 12, -520, { hazeAmt: 0.16, satMul: 0.95, order: -520 })); }

    world.hills.push(layer(T.hillsNear, w, w / a, 10, -24 - w / a / 2 + 9, -210, { hazeAmt: 0.05, order: -210 })); }

    const spots = [
      [-175, 62, -400, 120, 0.9], [185, 96, -420, 130, 0.9], [-150, 142, -380, 110, 0.9],
      [-58, 70, -150, 30, 0.92], [62, 92, -165, 34, 0.92], [-50, 112, -140, 28, 0.92],

  layer(T.beam, beamW * 1.12, beamH * 1.12, 0, GREAT_TOP + ringOff * 1.12 - 0.15, -1.95, { order: 0, lightAmt: 0.8 });

  putFol(3, 11, -3, -8.8, 12, { bright: 0.8, order: 41, amp: 0.06 });
  // cornice tufts on the upper storeys (variety)

  putFol(0, 3.2, 8.6, TIER_H + 18.2, 0.35, { flip: true, order: 6 });

  }

  world.goldMat = new THREE.MeshBasicMaterial({ map: T.rope, transparent: true, alphaTest: 0.08, color: 0xffd98a, side: THREE.DoubleSide });
  // --- bells ---

}

function anchorOf(level) {
  if (level < 3) return { x: 0, y: level * TIER_H + BEAM_Y };
  const g = world.great; return { x: 0, y: g ? g.clapperY : TOP_Y + 7.8 };
}
function makeLevelRope(level, golden) {
  const an = anchorOf(level);
  let len = 7.45;
  if (level > 0) { const below = anchorOf(level - 1); len = an.y - (below.y - 1.9); }
  const r = new Rope(an.x, an.y, len, golden ? world.goldMat : world.ropeMat, golden);
  r.floorY = level > 0 ? level * TIER_H + (level === 3 ? 0 : 0) : -1e9;
  if (!golden) r.visible = len;
  return r;
}

    b.glowV = 1.4;
    AudioSys.play('bell', { rate: semis(b.note), gain: 0.36, pan: b.x / 6, verb: 0.9 });
    const [sx, sy] = screenOf(b.x, b.clapper.y, -1.2); addWave(sx, sy, 1.0);
    emitSparks(b.x, b.clapper.y, 0, 20, { speed: 3, size: 1.8 });
  }, 900 + i * 330));
  setTimeout(() => { const [sx, sy] = screenOf(0, TOP_Y + 10, 0); addWave(sx, sy, 2.2); addWave(sx, sy, 1.6, 0.6); addWave(sx, sy, 1.2, 1.2); }, 600);
  AudioSys.play('chime', { gain: 0.7, delay: 0.4, verb: 1.0 });
}

// ---------- input ----------
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', KeyQ: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', KeyZ: 'up', ArrowDown: 'down', KeyS: 'down' };
window.addEventListener('keydown', (e) => {
  if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === 'KeyM') AudioSys.toggleMute();
  if (e.code === 'KeyR' && (game.state === 'end' || game.state === 'finale')) restart();
  anyKey();
});
window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) input[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { input.left = input.right = input.up = input.down = false; });
// touch / mouse: left third = swing left, right third = swing right, middle = climb up (upper half) / down (lower half)
const pointers = new Map();
function pointerInput() {
  input.left = input.right = input.up = input.down = false;
  for (const p of pointers.values()) {
    const fx = p.x / window.innerWidth, fy = p.y / window.innerHeight;
    if (fx < 0.33) input.left = true; else if (fx > 0.67) input.right = true; else if (fy < 0.5) input.up = true; else input.down = true;
  }
}
renderer.domElement.addEventListener('pointerdown', (e) => { anyKey(); if (game.state === 'title') return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); pointerInput(); });
renderer.domElement.addEventListener('pointermove', (e) => { if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); pointerInput(); } });
const pointerUp = (e) => { pointers.delete(e.pointerId); pointerInput(); };
renderer.domElement.addEventListener('pointerup', pointerUp);
renderer.domElement.addEventListener('pointercancel', pointerUp);

function anyKey() {
  AudioSys.resume();
  if (game.state === 'title') startIntro();
}
function startIntro() {
  game.state = 'intro'; game.introT = 0;
  titleEl.style.opacity = 0;
  AudioSys.play('great', { gain: 0.5, verb: 0.9 });
  const gb = world.great; if (gb) { gb.glowV = 1.2; gb.vel += 0.6; }
  const [sx, sy] = screenOf(0, GREAT_TOP - 4, -1); addWave(sx, sy, 1.3);
}
function restart() {
  endEl.style.opacity = 0;
  for (let i = 1; i < world.ropes.length; i++) if (world.ropes[i]) { scene.remove(world.ropes[i].ribbon.mesh); world.ropes[i] = null; }
  world.ropes.length = 1;
  for (const b of world.bells) { b.glowV = 0; b.angle = 0; b.vel = 0; }
  game.persist = 0; game.persistTarget = 0; game.satTarget = 0.78; U.sat.value = 0.78;
  attachToLevel(0, L_START); swing.theta = 0.25; swing.omega = 0; swing.lock = false;
  enterLevel(0);
  game.state = 'play'; game.startTime = performance.now();
  camState.y = BEAM_Y - 3; camState.z = 34;
}

// ---------- camera ----------
const camState = { x: 0, y: GREAT_TOP - 0.6, z: 47, look: GREAT_TOP - 1.5 };
function updateCamera(dt, t, hx, hy) {
  let ty = hy + 1.6, tx = hx * 0.28, tz = 34, k = 2.0;
  if (game.state === 'title' || game.state === 'loading') { ty = GREAT_TOP - 0.6 + Math.sin(t * 0.25) * 0.4; tx = 0; tz = 47; k = 1.5; }
  else if (game.state === 'intro') {
    const p = Math.min(1, game.introT / 5.2); const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    ty = (GREAT_TOP - 0.6) + ((hy + 1.6) - (GREAT_TOP - 0.6)) * e; tz = 47 - 13 * e; k = 6;
  } else if (game.state === 'finale' || game.state === 'end') {
    const p = Math.min(1, game.finaleT / 6); const e = 1 - Math.pow(1 - p, 3);
    ty = (hy + 1.6) + (TOP_Y + 9 - (hy + 1.6)) * e; tz = 34 + 26 * e; tx = 0; k = 1.2;
  } else if (game.state === 'ascend') { k = 2.6; }
  tz *= Math.max(1, Math.pow(1.3 / camera.aspect, 0.9));          // portrait / narrow screens: step back to keep the arch in view
  const f = 1 - Math.exp(-dt * k);
  camState.x += (tx - camState.x) * f; camState.y += (ty - camState.y) * f; camState.z += (tz - camState.z) * f;
  const sway = Math.sin(t * 0.13) * 1.3, bob = Math.sin(t * 0.21) * 0.25;
  game.shake = Math.max(0, game.shake - dt * 1.4);
  const sh = game.shake * game.shake;
  camera.position.set(camState.x + sway + (Math.random() - 0.5) * sh * 0.8, camState.y + bob + (Math.random() - 0.5) * sh * 0.8, camState.z);
  camera.lookAt(camState.x * 0.85 + sway * 0.35, camState.y - 0.4, 0);
}

// ---------- main loop ----------
let last = performance.now();
const clock = { t: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 20, Math.max(0.0005, (now - last) / 1000)); last = now;
  clock.t += dt; U.time.value = clock.t;
  const t = clock.t;
  if (game.state === 'loading') { renderLite(); return; }
  if (game.state === 'intro') { game.introT += dt; if (game.introT > 5.4) { game.state = 'play'; game.startTime = performance.now(); dotsEl.style.opacity = 1; } }
  if (game.state === 'finale') { game.finaleT += dt; if (game.finaleT > 4.5 && endEl.style.opacity !== '1') showEnd(); }
  if (game.state === 'ascend') updateAscend(dt);

  // physics (substeps)
  const N = Math.max(2, Math.ceil(dt * 240));
  for (let i = 0; i < N; i++) stepSwing(dt / N);
  const hx = swing.ax + swing.L * Math.sin(swing.theta), hy = swing.ay - swing.L * Math.cos(swing.theta);

  // ropes
  const wind = 1.6 + Math.sin(t * 0.37) * 1.2;
  world.ropes.forEach((r) => {
    if (!r) return;
    r.hand = r === swing.rope ? (r.hand || {}) : null;
    if (r.hand) {
      r.hand.L = swing.L; r.hand.x = hx; r.hand.y = hy;
      const end = Math.min(r.len, swing.L + ROPE_TAIL);
      r.visible = r.visible > end ? Math.max(end, r.visible - dt * 6) : end;
    } else if (r.visible < r.len) r.visible = Math.min(r.len, r.visible + dt * r.len / 1.6);   // unfurls (golden rope) or drops back down
    r.step(dt, wind); r.draw();
    if (r.golden && r !== swing.rope) {
      if (Math.random() < dt * 6) emitSparks(r.ax + (Math.random() - 0.5) * 0.2, r.ay - Math.random() * r.visible, ROPE_Z + 0.3, 1, { speed: 0.4, size: 1.1, up: 0.6, life: 1.4 });
    }
  });
  // golden rope fades to the plain rope once used
  const cr = swing.rope;
  if (cr && cr.golden && game.state === 'play') { cr.golden = false; cr.ribbon.mesh.material = world.ropeMat; }

  // animation state
  if (G_OBJ.mixer) {
    swing.kickT = Math.max(0, swing.kickT - dt);
    const climbing = swing.climbing && (game.state === 'play' || game.state === 'ascend');
    const pumping = (input.left || input.right) && game.state === 'play';
    swing.pumpHold = pumping ? (swing.pumpHold || 0) + dt : Math.max(0, (swing.pumpHold || 0) - dt * 0.5);
    if (swing.kickT <= 0) {
      if (climbing) { const a = playAnim('climb', 0.25); if (a) a.timeScale = swing.climbing > 0 ? 1.2 : -1.0; }
      else if (swing.pumpHold > 0.3 || Math.abs(swing.omega) > 1.6) playAnim('barhang', 0.45);
      else playAnim('hang', 0.5);
    }
  }
  updateGirl(dt, hx, hy);
  updateBells(dt, t);

  // hint: climb when the next rope is ready
  if (game.canAscend && game.state === 'play') {
    game.hintTimer += dt;
    hintEl.classList.toggle('show', game.hintTimer > 2.2);
  } else hintEl.classList.remove('show');

  // persistent colour and saturation
  game.persist += (game.persistTarget - game.persist) * Math.min(1, dt * 0.8);
  skyMat.uniforms.uPersist.value = game.persist;
  U.sat.value += (game.satTarget - U.sat.value) * Math.min(1, dt * 0.8);
  skyMat.uniforms.uFlash.value = Math.max(0, skyMat.uniforms.uFlash.value - dt * 1.2);

  // ambient life
  for (const c of world.clouds) { const u = c.userData; c.position.x += u.vx * dt; if (c.position.x > u.x0 + u.span) c.position.x = u.x0 - u.span; }
  for (const f of world.foliage) { const u = f.userData; f.rotation.z = Math.sin(t * 0.8 + u.ph) * u.amp * 0.3; f.position.x = u.x0 + Math.sin(t * 0.6 + u.ph) * u.amp; }
  if (Math.random() < dt * 2.5) emitSparks(camera.position.x + (Math.random() - 0.5) * 30, camera.position.y + (Math.random() - 0.5) * 16, -2 + Math.random() * 6, 1,
    { speed: 0.2, up: 0.25, size: 0.9, life: 4, colors: [[1, 0.92, 0.72]] });
  updateLeaves(dt, t, wind);
  updateSparks(dt);
  if (AudioSys.windGain && AudioSys.started && !AudioSys.muted) AudioSys.windGain.gain.value = 0.16 + Math.min(0.2, Math.max(0, camera.position.y / 300));

  updateCamera(dt, t, hx, hy);
  // sky parallax window
  skyMat.uniforms.uPan.value.set(0.5 + camera.position.x * 0.003, Math.min(1, Math.max(0, (camera.position.y - 4) / 74)));
  if (world.sunHaze) world.sunHaze.position.set(camera.position.x - 95, camera.position.y + 48, -300);
  render();
}
function render() { if (composer) composer.render(); else renderer.render(scene, camera); }
function renderLite() { renderer.render(scene, camera); }
function showEnd() {
  game.state = 'end';
  const s = Math.max(0, (game.endTime - game.startTime) / 1000);
  document.getElementById('endTime').textContent = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  endEl.style.opacity = 1; dotsEl.style.opacity = 0;
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  skyMat.uniforms.uRes.value.set(w, h);
  if (composer) { composer.setSize(w, h); bloom.setSize(w, h); gradePass.uniforms.uRes.value.set(w, h); }
  if (sparks) sparks.pts.material.uniforms.uScale.value = h * renderer.getPixelRatio() * 0.5;
}
window.addEventListener('resize', onResize);

// ---------- boot ----------
build().then(() => {
  onResize();
  const an = anchorOf(START_LEVEL);
  attachToLevel(START_LEVEL, L_START);
  swing.theta = 0.3;
  enterLevel(START_LEVEL);
  document.getElementById('loading').style.opacity = 0;
  if (AUTO) {
    game.state = 'play'; game.startTime = performance.now(); dotsEl.style.opacity = 1;
    camState.y = an.y - L_START + 1.6; camState.z = 34; camState.x = 0;
    AudioSys.resume();
  } else {
    game.state = 'title'; titleEl.style.opacity = 1;
  }
  window.__bt = { game, swing, input, world, LEVELS, ring: (i) => { const L = LEVELS[game.level]; if (L.bellObjs) onBellHit(L.bellObjs[i], 0.8); },
    complete: () => { if (game.level < 3) { while (!game.done) { const L = LEVELS[game.level]; onBellHit(L.bellObjs[L.goal === 'seq' ? L.seq[game.seqIdx] : 0], 0.8); } } },
    start: () => anyKey(), camera, renderer, G_OBJ, THREE };
});
requestAnimationFrame(frame);
</script>
<script src="../brand/gamepad.js"></script>
</body>
</html>
