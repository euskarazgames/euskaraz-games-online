<script type="module">
window.EGPad.getState=()=>{try{return S.mode}catch{return "loading"}};

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

THREE.ColorManagement.enabled = false;

/* =========================================================================
   CONFIG
   ========================================================================= */
const Q = new URLSearchParams(location.search);
const PAPER_HEX = 0xdbdddd;
const PAPER = new THREE.Color(PAPER_HEX);
const CFG = {
  gUp: 27, gUpRelease: 64, gDown: 40, jumpV: 11.6, maxFall: 24,
  speed0: 6.3, speedStep: 0.45, speedMax: 10.2,
  coyote: 0.12, jumpBuffer: 0.14,
  inkMax: 100, inkPerUnit: 4.6, inkMinStart: 8, strokeGrow: 18, strokeMax: 9.5, strokeMin: 2.8,
  strokeLife: 4.4, strokeFade: 1.0, strokeT: 0.82, dropInk: 12,
  foxScale: 1.72, lives: 3,

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = t => t * t * (3 - 2 * t);

class RNG {
  constructor(seed) { this.s = seed >>> 0; }
  next() {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }

  chance(p) { return this.next() < p; }
}
const fxRng = new RNG(1234567);   // visual-only randomness
const R = () => fxRng.next();

/* =========================================================================
   RENDERER / SCENE / CAMERA
   ========================================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(PAPER, 1);
let VW = innerWidth, VH = innerHeight;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(VW, VH, false);
const sceneRT = new THREE.WebGLRenderTarget(VW * DPR, VH * DPR, { samples: 4 });

const scene = new THREE.Scene();
scene.background = PAPER;
const camera = new THREE.PerspectiveCamera(30, VW / VH, 0.5, 700);
window.EGMobileView(renderer,camera);

const TAN = Math.tan(THREE.MathUtils.degToRad(15));
let camDist = 19;
function fitCamera() {
  const aspect = VW / VH;
  const viewH = Math.max(10.4, Math.min(20, 12.5 / aspect));       // world units visible at z = 0
  camDist = viewH / 2 / TAN;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
fitCamera();
const halfWidthAt = (z) => (camDist - z) * TAN * camera.aspect;
const halfHeightAt = (z) => (camDist - z) * TAN;

const hemi = new THREE.HemisphereLight(0xffffff, 0x9aa0a6, 1.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-4, 7, 9);
scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.55);
rim.position.set(3, 2, -6);
scene.add(rim);

/* =========================================================================
   ASSETS
   ========================================================================= */
const texLoader = new THREE.TextureLoader();
const TEX = {};
let MAN = null;
function loadTex(file) {
  if (TEX[file]) return TEX[file];
  TEX[file] = new Promise((res, rej) => texLoader.load('assets/' + file, t => {
    t.colorSpace = THREE.NoColorSpace;
    t.premultiplyAlpha = true;
    t.anisotropy = 4;
    res(t);
  }, undefined, rej));
  return TEX[file];
}

/* ----- shared geometries ----- */
const G_CENTER = new THREE.PlaneGeometry(1, 1);
const G_LEFT = new THREE.PlaneGeometry(1, 1).translate(0.5, 0, 0);
const G_BOTTOM = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0);
const G_TOP = new THREE.PlaneGeometry(1, 1).translate(0, -0.5, 0);
const G_TOPLEFT = new THREE.PlaneGeometry(1, 1).translate(0.5, -0.5, 0);
const ANCHOR = { center: G_CENTER, bottom: G_BOTTOM, top: G_TOP, topleft: G_TOPLEFT, left: G_LEFT };

/* ----- sprite material: premultiplied ink, depth tint toward paper, misty base ----- */
const SPRITE_VS = /* glsl */`
  uniform vec4 uRect;
  varying vec2 vUv; varying vec2 vRaw;
  void main() {
    vRaw = uv;
    vUv = uRect.xy + uv * uRect.zw;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const SPRITE_FS = /* glsl */`
  uniform sampler2D map; uniform vec3 uPaper;
  uniform float uTint, uOpacity, uBase, uDarken, uFlash;
  varying vec2 vUv; varying vec2 vRaw;
  void main() {
    vec4 t = texture2D(map, vUv);
    float a = t.a * uOpacity;
    if (a < 0.004) discard;
    vec3 c = t.rgb / max(t.a, 1e-4);
    c *= uDarken;
    float k = uTint;
    float b = uBase * (1.0 - smoothstep(0.0, 0.55, vRaw.y));
    k = k + (1.0 - k) * b;
    c = mix(c, uPaper, clamp(k, 0.0, 1.0));
    c = mix(c, vec3(1.0), uFlash);
    gl_FragColor = vec4(c * a, a);
  }`;
const premulBlend = {
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
};
const matCache = new Map();
function spriteMat(tex, o = {}, shared = true) {
  const key = shared ? [tex.uuid, o.tint || 0, o.flip ? 1 : 0, o.base || 0, o.darken || 1, o.opacity ?? 1].join('|') : null;
  if (key && matCache.has(key)) return matCache.get(key);
  const m = new THREE.ShaderMaterial({
    uniforms: {
      map: { value: tex }, uPaper: { value: PAPER },
      uTint: { value: o.tint || 0 }, uOpacity: { value: o.opacity ?? 1 },
      uBase: { value: o.base || 0 }, uDarken: { value: o.darken || 1 }, uFlash: { value: 0 },
      uRect: { value: new THREE.Vector4(o.flip ? 1 : 0, 0, o.flip ? -1 : 1, 1) },
    },
    vertexShader: SPRITE_VS, fragmentShader: SPRITE_FS, ...premulBlend,
  });
  if (key) matCache.set(key, m);
  return m;
}
// spr = { tex, w, h } ; returns mesh sized in world units
function makeSprite(spr, o) {
  const w = o.w ?? (o.h * spr.w / spr.h);
  const h = o.h ?? (o.w * spr.h / spr.w);
  const mesh = new THREE.Mesh(ANCHOR[o.anchor || 'center'], spriteMat(spr.tex, o, !o.unique));
  mesh.scale.set(w, h, 1);
  mesh.position.set(o.x || 0, o.y || 0, o.z || 0);
  if (o.rot) mesh.rotation.z = o.rot;
  mesh.renderOrder = o.order ?? 0;
  mesh.userData.w = w; mesh.userData.h = h;
  return mesh;
}

/* =========================================================================
   STROKE MATERIAL (9-slice brush stroke that can grow and dissolve)
   ========================================================================= */
const STROKE_FS = /* glsl */`
  uniform sampler2D map; uniform vec3 uPaper;
  uniform float uLen, uHead, uTail, uHeadU, uTailU, uFade, uSeed, uTint, uWet, uPaint, uGhost;
  varying vec2 vUv; varying vec2 vRaw;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  void main() {
    float L = max(uLen, 1e-3);
    float hw = uHead, tw = uTail;
    float s = hw + tw;
    if (L < s) { hw *= L / s; tw *= L / s; }
    float x = vRaw.x * L;
    float u;
    if (x < hw) u = x / max(hw, 1e-4) * uHeadU;
    else if (x > L - tw) u = uTailU + (x - (L - tw)) / max(tw, 1e-4) * (1.0 - uTailU);
    else u = uHeadU + (x - hw) / max(L - hw - tw, 1e-4) * (uTailU - uHeadU);
    vec4 t = texture2D(map, vec2(u, vRaw.y));
    float a = t.a;
    if (uFade > 0.0) {
      float n = noise(vec2(x * 3.0, vRaw.y * 5.0) + uSeed) * 0.75 + noise(vec2(x * 11.0, vRaw.y * 17.0) + uSeed) * 0.25;
      a *= smoothstep(uFade - 0.12, uFade + 0.02, n);
    }
    // the part not painted yet is a pale underdrawing; the brush front is ragged like wet ink
    float front = uPaint + (noise(vec2(vRaw.y * 9.0, uSeed)) - 0.5) * 0.35;
    float ink = smoothstep(front + 0.03, front - 0.22, x);
    a *= mix(uGhost, 1.0, ink);
    if (a < 0.004) discard;
    vec3 c = t.rgb / max(t.a, 1e-4);
    c = mix(mix(c, uPaper, 0.38), c, ink);
    c += uWet * 0.10 * smoothstep(0.62, 0.95, vRaw.y);
    c = mix(c, uPaper, uTint);
    gl_FragColor = vec4(c * a, a);
  }`;
function strokeMat(spr) {
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: spr.tex }, uPaper: { value: PAPER },
      uLen: { value: 0.01 }, uHead: { value: 0.1 }, uTail: { value: 1 }, uHeadU: { value: spr.headU }, uTailU: { value: spr.tailU },
      uFade: { value: 0 }, uSeed: { value: R() * 100 }, uTint: { value: 0 }, uWet: { value: 0 },
      uPaint: { value: 1e3 }, uGhost: { value: 0 },
      uRect: { value: new THREE.Vector4(0, 0, 1, 1) },
    },
    vertexShader: SPRITE_VS, fragmentShader: STROKE_FS, ...premulBlend,
  });
}

/* =========================================================================
   FX PARTICLES (instanced quads sampling an atlas built from the fal ink sheet)
   ========================================================================= */
const FX = { mesh: null, list: [], max: 520, cells: {}, dummy: new THREE.Object3D() };
async function buildFxAtlas(fxSprites) {
  const N = 4, C = 256;
  const cv = document.createElement('canvas'); cv.width = cv.height = N * C;
  const g = cv.getContext('2d');
  let i = 0;
  for (const f of fxSprites) {
    const img = f.tex.image;
    const s = Math.min((C - 8) / img.width, (C - 8) / img.height);
    const w = img.width * s, h = img.height * s;
    const cx = (i % N) * C, cy = Math.floor(i / N) * C;
    g.drawImage(img, cx + (C - w) / 2, cy + (C - h) / 2, w, h);
    (FX.cells[f.kind] ||= []).push(i);
    i++;
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.NoColorSpace; tex.premultiplyAlpha = true; tex.anisotropy = 4;
  const geo = new THREE.InstancedBufferGeometry().copy(G_CENTER);
  geo.instanceCount = 0;
  const aCell = new THREE.InstancedBufferAttribute(new Float32Array(FX.max), 1);
  const aAlpha = new THREE.InstancedBufferAttribute(new Float32Array(FX.max), 1);
  const aTint = new THREE.InstancedBufferAttribute(new Float32Array(FX.max), 1);
  aCell.setUsage(THREE.DynamicDrawUsage); aAlpha.setUsage(THREE.DynamicDrawUsage); aTint.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aCell', aCell); geo.setAttribute('aAlpha', aAlpha); geo.setAttribute('aTint', aTint);
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, uPaper: { value: PAPER } },
    vertexShader: /* glsl */`
      attribute float aCell; attribute float aAlpha; attribute float aTint;
      varying vec2 vUv; varying float vA; varying float vT;
      void main() {
        float cx = mod(aCell, 4.0), cy = floor(aCell / 4.0);
        vUv = (vec2(cx, 3.0 - cy) + uv) / 4.0;
        vA = aAlpha; vT = aTint;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D map; uniform vec3 uPaper;
      varying vec2 vUv; varying float vA; varying float vT;
      void main() {
        vec4 t = texture2D(map, vUv);
        float a = t.a * vA;
        if (a < 0.004) discard;
        vec3 c = mix(t.rgb / max(t.a, 1e-4), uPaper, vT);
        gl_FragColor = vec4(c * a, a);
      }`,
    ...premulBlend,
  });
  const mesh = new THREE.InstancedMesh(geo, mat, FX.max);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.renderOrder = 6;
  mesh.count = 0;
  FX.mesh = mesh; FX.aCell = aCell; FX.aAlpha = aAlpha; FX.aTint = aTint;
  scene.add(mesh);
}
function fx(kind, o) {
  if (FX.list.length >= FX.max) FX.list.shift();
  const cells = FX.cells[kind] || FX.cells.bead;
  FX.list.push({
    cell: o.cell ?? cells[Math.floor(R() * cells.length)],
    x: o.x, y: o.y, z: o.z ?? 0.25, vx: o.vx || 0, vy: o.vy || 0,
    rot: o.rot ?? R() * 6.28, vr: o.vr || 0, s0: o.s0 ?? 0.2, s1: o.s1 ?? o.s0 ?? 0.2,
    sy: o.sy ?? 1, life: 0, max: o.life ?? 0.8, a0: o.a ?? 1, g: o.g ?? 0, drag: o.drag ?? 0,
    tint: o.tint || 0, fadeIn: o.fadeIn || 0, hold: o.hold ?? 0.0, follow: o.follow || null,
  });
}
function updateFx(dt) {
  if (!FX.mesh) return;
  const L = FX.list; let n = 0;
  for (let i = L.length - 1; i >= 0; i--) {
    const p = L[i];
    p.life += dt;
    if (p.life >= p.max) { L.splice(i, 1); continue; }
    p.vy -= p.g * dt;
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (const p of L) {
    const t = p.life / p.max;
    const s = lerp(p.s0, p.s1, smooth(Math.min(1, t * 1.3)));
    let a = p.a0;
    if (p.fadeIn) a *= Math.min(1, p.life / p.fadeIn);
    if (t > p.hold) a *= 1 - smooth((t - p.hold) / (1 - p.hold));
    const d = FX.dummy;
    d.position.set(p.x, p.y, p.z); d.rotation.set(0, 0, p.rot); d.scale.set(s, s * p.sy, 1);
    d.updateMatrix();
    FX.mesh.setMatrixAt(n, d.matrix);
    FX.aCell.array[n] = p.cell; FX.aAlpha.array[n] = a; FX.aTint.array[n] = p.tint;
    n++;
  }
  FX.mesh.count = n;
  FX.mesh.geometry.instanceCount = n;
  FX.mesh.instanceMatrix.needsUpdate = true;
  FX.aCell.needsUpdate = FX.aAlpha.needsUpdate = FX.aTint.needsUpdate = true;
}
function splash(x, y, power = 1, dir = 1) {
  const n = Math.round(10 + 10 * power);
  for (let i = 0; i < n; i++) {
    const ang = Math.PI * (0.12 + 0.76 * R());
    const sp = (2.2 + R() * 4.2) * (0.6 + power * 0.5);
    const front = R() < 0.08;
    fx('bead', { x: x + (R() - 0.5) * 0.5, y: y + 0.05, z: front ? 0.55 : -0.32, vx: Math.cos(ang) * sp * 1.15 - dir * 0.8, vy: Math.sin(ang) * sp * 0.75,
      s0: 0.05 + R() * 0.1, s1: 0.03, g: 22, life: 0.45 + R() * 0.45, hold: 0.5 });

   WORLD: platforms (rocks + brush strokes), ink drops, moon gates

const world = { plats: [], drops: [], gates: [], decor: [] };

class RockPlat {
  constructor(spr, x, y, width, flip, sy = 1) {
    this.kind = 'rock'; this.spr = spr; this.flip = flip;
    this.W = width; this.H = width * spr.h / spr.w * sy;
    const top = flip ? [...spr.top].reverse() : spr.top;
    const bot = flip ? [...spr.bot].reverse() : spr.bot;
    this.top = top; this.bot = bot;
    // walk level y is placed on the flat part (median of the central tops)
    const mid = top.slice(Math.floor(top.length * 0.25), Math.ceil(top.length * 0.75)).filter(v => v !== null).sort((a, b) => a - b);
    const t0 = mid[Math.floor(mid.length * 0.3)] ?? 0.05;
    this.inset = Math.min(0.14, this.H * 0.03);
    this.yq = y + t0 * this.H + this.inset;      // quad top edge
    this.x0q = x;                                 // quad left edge
    let a = 0, b = top.length - 1;
    while (a < b && (top[a] === null || top[a] - t0 > 0.12)) a++;
    while (b > a && (top[b] === null || top[b] - t0 > 0.12)) b--;
    this.x0 = x + (a + 0.3) / top.length * this.W;
    this.x1 = x + (b + 0.7) / top.length * this.W;
    this.xr = x + this.W;
    this.mesh = makeSprite(spr, { w: this.W, h: this.H, x, y: this.yq, z: -0.7, anchor: 'topleft', flip, order: 1, darken: 0.42 });
    scene.add(this.mesh);

  }
  prof(arr, x) {

    const i = Math.floor(u), f = u - i;
    const a = arr[clamp(i, 0, arr.length - 1)], b = arr[clamp(i + 1, 0, arr.length - 1)];
    if (a === null && b === null) return null;
    if (a === null) return b; if (b === null) return a;
    return lerp(a, b, f);
  }
  surf(x) {
    if (x < this.x0 || x > this.x1) return null;
    const t = this.prof(this.top, x); if (t === null) return null;
    return this.yq - t * this.H - this.inset;
  }
  span(x) {   // vertical extent of the rock silhouette at x (for walls and ceilings)
    if (x < this.x0q || x > this.xr) return null;
    const t = this.prof(this.top, x), b = this.prof(this.bot, x);
    if (t === null || b === null) return null;

/* ----- decor attached to rocks: pine tufts, branches, little trees ----- */
function decorateRock(p, rng) {
  const out = [];
  const span = p.x1 - p.x0;
  const nT = span > 6 ? 3 : span > 3 ? 2 : 1;
  for (let i = 0; i < nT; i++) {
    const x = p.x0 + span * (0.12 + 0.76 * rng.next());
    const y = p.surf(x); if (y === null) continue;
    const front = rng.chance(0.42);
    const w = front ? rng.range(0.7, 1.15) : rng.range(1.0, 1.9);
    const spr = rng.pick(SPR.tufts);
    out.push(makeSprite(spr, { w, x, y: y - 0.06 - (front ? 0.02 : 0), z: front ? 0.42 : -0.78, anchor: 'bottom', flip: rng.chance(0.5), order: front ? 7 : 1 }));
  }
  if (span > 5 && rng.chance(0.28)) {
    const left = rng.chance(0.5);
    const x = left ? p.x0 + 0.4 : p.x1 - 0.4; const y = p.surf(x);
    if (y !== null) out.push(makeSprite(SPR.tree, { h: rng.range(1.8, 2.5), x, y: y - 0.05, z: -0.85, anchor: 'bottom', flip: !left, order: 1 }));
  }
  if (rng.chance(0.4) && p.H > 1.6) {
    const right = rng.chance(0.55);
    const spr = right ? SPR.branchR : SPR.branchL;
    const w = rng.range(2.2, 3.4);
    const yy = p.yq - p.H * rng.range(0.25, 0.5);
    const x = right ? p.xr - 0.5 + w / 2 : p.x0q + 0.5 - w / 2;
    out.push(makeSprite(spr, { w, x, y: yy, z: -0.9, order: 1 }));
  }
  for (const m of out) { scene.add(m); world.decor.push({ m, x: m.position.x + (m.userData.w || 3) }); }
}

function surfAtFeet(p, x) {
  const s = p.surf(x);
  if (s !== null) return s;
  const a = p.surf(x - 0.34), b = p.surf(x + 0.34);
  if (a !== null && b !== null) return Math.max(a, b);
  return a ?? b;
}
function surfaceUnder(x, yMax, yMin) {
  let best = null, bp = null;
  for (const p of world.plats) {
    const s = surfAtFeet(p, x);
    if (s === null || s > yMax || s < yMin) continue;
    if (best === null || s > best) { best = s; bp = p; }
  }
  return [best, bp];
}
function wallAhead(x, y, ignore) {
  for (const p of world.plats) {
    if (p.kind !== 'rock' || p === ignore) continue;
    const sp = p.span(x); if (!sp) continue;
    const [b, t] = sp;
    if (y < t - 0.32 && y + 0.75 > b) return p;
  }
  return null;
}
function ceilingAt(x, yHead) {
  for (const p of world.plats) {
    if (p.kind !== 'rock') continue;
    const sp = p.span(x); if (!sp) continue;
    const [b, t] = sp;
    if (yHead > b && yHead < t - 0.4) return b;
  }
  return null;
}

  const t = S.time;

  // mode transitions driven by real input
  if (S.mode === 'title' && input.start && (S.titleT > 0.6 || performance.now() - S.titleAt > 600)) {
    newRun(); S.mode = 'play'; ui.title.classList.add('hidden'); ui.hud.classList.add('on');
    keys.clear(); pointer.jump = pointer.paint = false; refreshInput();
    input.jumpPressed = false; input.paintPressed = false;
  }
  if (S.mode === 'over' && input.start && S.wipe > 0.95 && S.overT > 0.8) {
    ui.over.classList.remove('on'); newRun(); S.mode = 'play'; S.wipeTarget = 0; ui.hud.classList.add('on');
    input.jumpPressed = false;
  }
  input.start = false;
  if (S.mode === 'title') S.titleT = (S.titleT || 0) + dt;
  if (S.mode === 'over') S.overT += dt;

  // the pilot plays the attract loop behind the title (and the whole game with ?demo)
  const piloted = S.mode === 'title' || (S.demo && S.mode === 'play');
  if (piloted) {
    const p = runPilot(dt);
    if (p.jump && !pilot.prevJump) input.jumpPressed = true;
    if (p.paint && !pilot.prevPaint) input.paintPressed = true;
    pilot.prevJump = p.jump; pilot.prevPaint = p.paint;
    input.jump = p.jump; input.paint = p.paint;
  }
  const running = S.mode === 'play' || S.mode === 'title';
  if (running) {
    if (input.paintPressed) startPaint();
    S.paintCD -= dt;
  }
  acc += dt;
  while (acc >= FIXED) {
    acc -= FIXED;
    if (running) { stepFox(FIXED); updatePaint(FIXED); }
    fox.root.position.set(fox.x, fox.y, 0);
    stepScarf(FIXED, S.time);
    input.jumpPressed = false; input.paintPressed = false;
  }
  input.jumpPressed = false; input.paintPressed = false;
  if (piloted) { input.jump = false; input.paint = false; refreshInput(); }

  const floorY = lowestNear(fox.x);
  if (running) {
    // collect ink
    for (const d of world.drops) {
      if (d.taken) continue;
      const dx = d.x - (fox.x + 0.2), dy = d.mesh.position.y - (fox.y + 0.6);
      if (dx * dx + dy * dy < 0.7) {
        d.taken = true; S.drops++; S.ink = Math.min(CFG.inkMax, S.ink + CFG.dropInk);
        sfx('drop', 0.5, 1 + (S.drops % 5) * 0.06);
        for (let i = 0; i < 8; i++) fx('bead', { x: d.x, y: d.mesh.position.y, z: -0.3, vx: (R() - 0.5) * 5, vy: (R() - 0.2) * 5, s0: 0.05 + R() * 0.05, s1: 0.01, g: 6, life: 0.45 });
      }
    }
    // moon gates = checkpoints
    for (const g of world.gates) {
      if (!g.passed && fox.x > g.x) {
        g.passed = true; g.flash = 1;
        if (S.mode === 'play') {
          S.checkpoint = { snap: g.snap, chapter: g.snap.chapter };
          S.chapter = g.snap.chapter + 1;
          S.ink = CFG.inkMax;
          showSeal(S.chapter);
          sfx('gate', 0.8);
        } else S.chapter = g.snap.chapter + 1;
        for (let i = 0; i < 10; i++) puff(g.x + (R() - 0.5) * 3, g.y + 0.5 + R() * 3, -1.1, 0.8, 0.35);
      }
    }
    if (S.mode === 'play') S.dist = Math.max(S.dist, fox.x - S.startX);
    // out of the picture with nothing left to land on (a ledge still below the fox keeps it alive)
    const camBottom = S.camY - halfHeightAt(0);
    let fell = fox.y < floorY - 3.4 || fox.y < camBottom - 6;
    if (!fell && !fox.grounded && fox.y < camBottom - 1.0) {
      const ahead = fox.x + Math.max(0, fox.vx) * 0.35;
      fell = surfaceUnder(fox.x, fox.y + 0.05, fox.y - 9)[0] === null && surfaceUnder(ahead, fox.y + 0.05, fox.y - 9)[0] === null;
    }
    if (fell) {
      if (S.mode === 'play') die();
      else { newRun(); }          // attract loop: just start over
    }
  }
  if (S.mode === 'dying') {
    S.deadT += dt;
    fox.vy -= CFG.gDown * dt; fox.y += fox.vy * dt; fox.x += fox.vx * dt * 0.5;
    if (S.deadT > 0.9) { if (S.lives <= 0) gameOver(); else respawn(); }
  }

  for (const p of world.plats) p.update(dt);
  for (const d of world.drops) d.update(dt);
  for (const g of world.gates) g.update(dt);
  if (S.mode !== 'over') animateFox(dt, t);
  updateScarf(dt, t);

  // camera
  const lookAhead = 2.4 + clamp(fox.vx, 0, 10) * 0.08;
  S.camX = damp(S.camX, fox.x + lookAhead, 5, dt);
  const titleLift = S.mode === 'title' ? 2.3 : 0;
  if (S.mode !== 'dying') {
    if (fox.grounded) S.camTY = fox.y + 1.4 + titleLift;
    else {
      if (fox.y + 1.4 + titleLift > S.camTY + 1.2) S.camTY = fox.y + 0.2 + titleLift;
      if (fox.y < S.camTY - 2.4 - titleLift) S.camTY = Math.max(fox.y + 2.4 + titleLift, floorY + 0.9 + titleLift);
    }
  }
  S.camY = damp(S.camY, S.camTY, fox.grounded ? 3.2 : 4.5 + Math.max(0, -fox.vy - 8) * 0.45, dt);   // keeps up with long falls
  S.shake = Math.max(0, S.shake - dt * 1.5);
  const sx = (R() - 0.5) * S.shake, sy = (R() - 0.5) * S.shake;
  const drift = S.mode === 'title' ? Math.sin(t * 0.3) * 0.3 : 0;
  camera.position.set(S.camX + sx, S.camY + sy + 0.6 + drift, camDist);
  camera.lookAt(S.camX + sx, S.camY + sy, 0);

  ensureWorld(S.camX);
  for (const l of layers) l.update(S.camX, S.camY);
  updateFx(dt);
  if (motes) { motes.material.uniforms.uTime.value = t; motes.material.uniforms.uCam.value.set(S.camX, S.camY, 0); }

  // wipe
  if (S.wipeTarget > S.wipe) { S.wipe = damp(S.wipe, S.wipeTarget, 5.5, dt); post.mat.uniforms.uReveal.value = 0; }
  else if (S.wipe > 0) { S.wipe = Math.max(0, S.wipe - dt * 1.35); post.mat.uniforms.uReveal.value = 1; }
  post.mat.uniforms.uWipe.value = S.wipe;
  post.mat.uniforms.uTime.value = t;

  if (S.sealT > 0) { S.sealT -= dt; if (S.sealT <= 0) { ui.chap.classList.remove('on'); } }
  if (S.mode === 'play' || S.mode === 'dying') hudUpdate();
}

function onResize() {
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  sceneRT.setSize(VW * DPR, VH * DPR);
  post.mat.uniforms.uRes.value.set(VW, VH);
  fitCamera();
  if (motes) motes.material.uniforms.uScale.value = VH * DPR / (2 * TAN);
}
addEventListener('resize', onResize);

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot() {
  requestAnimationFrame(frame);
  MAN = await fetch('assets/manifest.json').then(r => r.json());
  const files = new Set();
  const collect = o => { if (!o) return; if (Array.isArray(o)) o.forEach(collect); else if (typeof o === 'object') { if (o.file) files.add(o.file); else Object.values(o).forEach(collect); } };
  collect([MAN.strokes, MAN.fx, MAN.rocks, MAN.pines, MAN.bg, MAN.fg, MAN.far, MAN.ui, MAN.paper]);
  let done = 0; const total = files.size + 1;
  const loadTick = () => { done++; ui.load.style.width = Math.round(done / total * 100) + '%'; };
  await Promise.all([...files].map(f => loadTex(f).then(loadTick)));
  const withTex = async (o) => ({ ...o, tex: await loadTex(o.file) });
  SPR = {
    strokes: await Promise.all(MAN.strokes.map(withTex)),
    rocks: await Promise.all(MAN.rocks.map(withTex)),
    fx: await Promise.all(MAN.fx.map(withTex)),
    tufts: await Promise.all(MAN.pines.filter(p => p.kind === 'tuft').map(withTex)),
    branchR: await withTex(MAN.pines.find(p => p.kind === 'branchR')),
    branchL: await withTex(MAN.pines.find(p => p.kind === 'branchL')),
    droop: await withTex(MAN.pines.find(p => p.kind === 'droop')),
    tree: await withTex(MAN.pines.find(p => p.kind === 'tree')),
    bg: Object.fromEntries(await Promise.all(MAN.bg.map(async b => [b.kind, await withTex(b)]))),
    fg: { overhang: await Promise.all(MAN.fg.filter(f => f.kind === 'overhang').map(withTex)), cliff: await Promise.all(MAN.fg.filter(f => f.kind === 'cliff').map(withTex)), mound: await Promise.all(MAN.fg.filter(f => f.kind === 'mound').map(withTex)) },
    far: await withTex(MAN.far),
  };
  SPR.beads = SPR.fx.filter(f => f.kind === 'bead');
  await buildFox(); loadTick();
  await buildFxAtlas(SPR.fx);
  buildMotes(SPR.beads[3].tex);
  const U = MAN.ui || {};
  buildScarf((await withTex(U.ribbon || MAN.strokes[0])).tex);
  if (MAN.paper) {
    const pt = (await withTex(MAN.paper)).tex;
    pt.wrapS = pt.wrapT = THREE.RepeatWrapping; pt.premultiplyAlpha = false; pt.needsUpdate = true;
    post.mat.uniforms.tPaper.value = pt; post.mat.uniforms.uPaperAmt.value = 0.5;
  }
  post.mat.uniforms.tBlot.value = SPR.fx.find(f => f.kind === 'blot').tex;
  // UI images (all fal generated)
  const logo = document.querySelector('#title img.logo');
  if (U.title) logo.src = 'assets/' + U.title.file; else logo.remove();
  document.querySelector('#ink .bg').src = document.querySelector('#ink .fill img').src = 'assets/' + MAN.strokes[2].file;
  document.querySelector('#drops img').src = 'assets/' + MAN.fx.find(f => f.kind === 'bead').file;
  if (U.seal) { ui.seal.src = 'assets/' + U.seal.file; ui.over.querySelector('img').src = 'assets/' + U.seal.file; }
  for (let i = 0; i < CFG.lives; i++) { const im = document.createElement('img'); im.src = 'assets/' + (U.icon ? U.icon.file : MAN.fx[1].file); ui.lives.appendChild(im); }
  buildLayers();
  newRun();
  S.mode = 'title'; S.titleAt = performance.now();
  ui.press.classList.remove('hidden');
  if (matchMedia('(pointer: coarse)').matches) {
    document.querySelector('#title .hint').innerHTML = '<b>EZKERRA UKITU</b> salto egiteko · <b>EUTSI ESKUINARI</b> margotzeko';
    ui.press.textContent = 'ukitu hasteko';
    ui.over.querySelector('.press').textContent = 'ukitu berriro margotzeko';
  }
  document.getElementById('load').style.opacity = 0;
  if (S.demo) { S.mode = 'play'; ui.title.classList.add('hidden'); ui.hud.classList.add('on'); }
  window.__inkfox = {
    S, fox, world, gen, input, keys, CFG, DBG,
    // test hooks: freeze real time and advance the game by `sec` seconds at 60 Hz
    sim(sec) { TEST.frozen = true; const n = Math.round(sec * 60); for (let i = 0; i < n; i++) tick(1 / 60); return S.time; },
    resume() { TEST.frozen = false; last = performance.now(); },
  };
}

// Hiru jokatzeko modu erreal: abiadura, tinta-kontsumoa eta bizitzak.
const egDifficultyBox=document.createElement("div");
egDifficultyBox.id="eg-ink-difficulty";
egDifficultyBox.innerHTML="<span>ZAILTASUNA</span>";
const styleEg=document.createElement("style");
styleEg.textContent="#eg-ink-difficulty{position:fixed;z-index:190;right:12px;top:10px;background:#1d1820e6;padding:10px;border:1px solid #f6a16a88;border-radius:12px;color:#ffbd84;box-shadow:0 8px 24px #0009;font:800 11px system-ui}#eg-ink-difficulty span{display:block;margin-bottom:8px}#eg-ink-difficulty button{border:1px solid #765e52;background:#34313a;color:white;border-radius:8px;margin-right:5px;padding:7px 9px;cursor:pointer;font-weight:800}#eg-ink-difficulty button[aria-pressed=true]{background:#f6a16a;color:#23150e}#eg-ink-difficulty[hidden]{display:none!important}@media(max-width:550px){#eg-ink-difficulty{right:5px;top:4px;padding:5px}#eg-ink-difficulty button{font-size:10px;padding:5px}}";
document.head.appendChild(styleEg);
for(const name of ["lasaia","arrunta","ausarta"]){
  const b=document.createElement("button");b.type="button";b.textContent=EG_MODE[name].label;b.dataset.mode=name;
  b.setAttribute("aria-pressed",String(name===egMode));
  b.addEventListener("pointerdown",event=>event.stopPropagation());
  b.addEventListener("click",event=>{
    event.preventDefault();event.stopPropagation();
    if(S.mode!=="title")return;
    egMode=name;
    const mode=EG_MODE[name];
    for(const key of ["speed0","speedStep","speedMax","inkMax","inkPerUnit","lives"])CFG[key]=mode[key];
    S.ink=CFG.inkMax;S.lives=CFG.lives;
    for(const button of egDifficultyBox.querySelectorAll("button"))button.setAttribute("aria-pressed",String(button.dataset.mode===name));
  });
  egDifficultyBox.appendChild(b);
}
document.body.appendChild(egDifficultyBox);
ui.title.addEventListener("pointerdown",()=>{egDifficultyBox.hidden=true});
addEventListener("keydown",event=>{if(S.mode==="title"&&(event.code==="Space"||event.code==="Enter"))egDifficultyBox.hidden=true});

boot().catch(err => { console.error(err); document.querySelector('#title .press').textContent = 'Ezin izan da kargatu: ' + err.message; document.querySelector('#title .press').classList.remove('hidden'); });
