<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =====================================================================
   MIRROR SEA — a boy walks barefoot across an endless mirror-calm sea at dawn.
   Each step sends ripples that reveal watercolor memories beneath the surface.
   Every image / model / sound in assets/ was generated with fal.
   ===================================================================== */

const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo');                    // ?demo=1: autopilot (attract mode / automated playthrough checks)
const $ = (id) => document.getElementById(id);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp, smooth = THREE.MathUtils.smoothstep;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const DEG = Math.PI / 180;

// ---------------------------------------------------------------- config
const CFG = {
  walkSpeed: 2.15, runSpeed: 4.6,
  skySpanH: 200 * DEG,              // horizontal angle covered by sky.jpg (the two halves overlap by 20° on each side)
  skyAspect: 949 / 4096,            // h / w of sky.jpg (bottom row = horizon)
  skyBackSpanH: 200 * DEG,          // horizontal angle covered by sky_back.jpg (centred behind the boy)
  sunUV: [0.4158, 0.0950],          // centre of the painted sun measured in sky.jpg
  maskOrigin: [0, -72], maskSize: 300, maskRes: 1024,
  decay: 0.012,                     // reveal fades per second (unless the memory is restored)
  goal: 0.45,                       // fraction of a memory to uncover
};

const MEMORIES = [
  { key: 'dog',   x: -17, z: -34,  r: 10.5, color: [1.0, 0.86, 0.68],
    objs: [{ m: 'dog', x: 0.6, z: -0.8, ry: 2.2, size: 1.75 }, { m: 'bush', x: -3.6, z: -3.2, ry: 0.6, size: 2.4 }] },
  { key: 'tree',  x:  27, z: -60,  r: 12.5, color: [0.93, 1.0, 0.78],
    objs: [{ m: 'tree', x: 0, z: -1.5, ry: 0.4, size: 8.5 }, { m: 'bush', x: 3.4, z: 1.2, ry: 2.0, size: 2.2 }, { m: 'bush', x: -3.8, z: 0.6, ry: 4.1, size: 1.8 }] },
  { key: 'wagon', x: -31, z: -90,  r: 10.0, color: [1.0, 0.8, 0.82],
    objs: [{ m: 'wagon', x: 0, z: 0, ry: -0.7, size: 2.4 }, { m: 'bush', x: 2.6, z: -2.4, ry: 1.2, size: 2.0 }] },
  { key: 'home',  x:   4, z: -128, r: 19.0, final: true, color: [1.0, 0.9, 0.72],
    objs: [{ m: 'house', x: 0, z: -6.5, ry: 0, size: 10.5 }, { m: 'tree', x: -12.5, z: -7.5, ry: 1.3, size: 8.5 },
           { m: 'bush', x: -4.6, z: -2.0, ry: 0.3, size: 2.6 }, { m: 'bush', x: 4.6, z: -2.0, ry: 2.4, size: 2.4 },
           { m: 'bush', x: -8.4, z: -2.6, ry: 1.1, size: 2.1 }, { m: 'bush', x: 8.6, z: -3.4, ry: 3.3, size: 2.8 },
           { m: 'dog', x: 3.6, z: 1.4, ry: 2.6, size: 1.75 }, { m: 'wagon', x: 9.0, z: 1.2, ry: 0.9, size: 2.3 }] },
];

// ---------------------------------------------------------------- renderer
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, Q.get('dpr') ? +Q.get('dpr') : 1.5);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const HALF = THREE.HalfFloatType;

const rtMain   = new THREE.WebGLRenderTarget(4, 4, { type: HALF, samples: 4 });
const rtMirror = new THREE.WebGLRenderTarget(4, 4, { type: HALF });
const rtBloomA = new THREE.WebGLRenderTarget(4, 4, { type: HALF, depthBuffer: false });
const rtBloomB = new THREE.WebGLRenderTarget(4, 4, { type: HALF, depthBuffer: false });
const maskOpts = { type: HALF, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false };
let rtMaskA = new THREE.WebGLRenderTarget(CFG.maskRes, CFG.maskRes, maskOpts);
let rtMaskB = new THREE.WebGLRenderTarget(CFG.maskRes, CFG.maskRes, maskOpts);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 6000);
window.EGMobileView(renderer,camera);

camera.layers.enable(2);   // layer 2 = the memories beneath the surface (hidden from the mirror camera)

// full-screen helper
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
fsMesh.frustumCulled = false;
const fsScene = new THREE.Scene(); fsScene.add(fsMesh);
const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
function fsPass(mat, target) { fsMesh.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }

// ---------------------------------------------------------------- GLSL helpers
const NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  float a = hash12(i), b = hash12(i+vec2(1.0,0.0)), c = hash12(i+vec2(0.0,1.0)), d = hash12(i+vec2(1.0,1.0));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 17.17; a *= 0.5; } return s; }
`;
// Two hand-painted halves of the dawn sky: sky.jpg faces the sun, sky_back.jpg is the view behind the boy.
const SKYLOOK = /* glsl */`
uniform sampler2D tSky; uniform sampler2D tSkyB; uniform float uSpanH, uSpanV, uSpanHB, uSpanVB;
vec3 skyLook(vec3 d, float bias){
  float az = atan(d.x, -d.z);
  float el = asin(clamp(d.y, -1.0, 1.0));
  float u = 0.5 + az / uSpanH;
  float uu = 1.0 - abs(1.0 - mod(u, 2.0));
  vec3 cf = texture2D(tSky, vec2(uu, clamp(el / uSpanV, 0.004, 0.996)), bias).rgb;
  float azb = az - sign(az) * 3.14159265;
  float ub = 0.5 + azb / uSpanHB;
  float uub = 1.0 - abs(1.0 - mod(ub, 2.0));
  vec3 cb = texture2D(tSkyB, vec2(uub, clamp(el / uSpanVB, 0.004, 0.996)), bias).rgb;
  return mix(cf, cb, smoothstep(1.40, 1.74, abs(az)));      // blend only where both paintings are valid (80°..100°)
}
`;

// ---------------------------------------------------------------- loading
const manager = new THREE.LoadingManager();
manager.onProgress = (_u, l, t) => { $('loading').firstElementChild.style.width = (100 * l / t).toFixed(0) + '%'; };
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
const loadTex = (f, { srgb = true, repeat = false, mips = true } = {}) => new Promise((res) => texLoader.load('assets/' + f, (t) => {
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.generateMipmaps = mips; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  res(t);
}, undefined, () => { console.warn('missing texture', f); res(null); }));
const loadGLB = (f) => new Promise((res) => gltfLoader.load('assets/' + f, res, undefined, (e) => { console.warn('missing model', f, e); res(null); }));

const [skyTex, skyBackTex, hillsTex, meadowTex, ripTex, moteTex, paperTex, boyG, walkG, runG, dogG, houseG, treeG, wagonG, bushG] = await Promise.all([
  loadTex('sky.jpg'), loadTex('sky_back.jpg'), loadTex('hills.png'), loadTex('meadow.jpg', { repeat: true }), loadTex('ripples.png', { srgb: false }),
  loadTex('motes.png', { srgb: false }), loadTex('paper.jpg', { repeat: true }),
  loadGLB('boy_idle.glb'), loadGLB('boy_walk_anim.glb'), loadGLB('boy_run_anim.glb'),
  loadGLB('dog.glb'), loadGLB('house.glb'), loadGLB('tree.glb'), loadGLB('wagon.glb'), loadGLB('bush.glb'),
]);
const whiteTex = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1); whiteTex.needsUpdate = true;

// ---------------------------------------------------------------- sun & sky
const sunAz = (CFG.sunUV[0] - 0.5) * CFG.skySpanH;
const sunEl = CFG.sunUV[1] * CFG.skySpanH * CFG.skyAspect;
const sunDir = new THREE.Vector3(Math.sin(sunAz) * Math.cos(sunEl), Math.sin(sunEl), -Math.cos(sunAz) * Math.cos(sunEl)).normalize();
const skyB = skyBackTex || skyTex || whiteTex;
const skyBAspect = skyB.image ? skyB.image.height / skyB.image.width : CFG.skyAspect;
const skyCommon = { tSky: { value: skyTex || whiteTex }, uSpanH: { value: CFG.skySpanH }, uSpanV: { value: CFG.skySpanH * CFG.skyAspect },
  tSkyB: { value: skyB }, uSpanHB: { value: CFG.skyBackSpanH }, uSpanVB: { value: CFG.skyBackSpanH * skyBAspect } };
const G = { time: { value: 0 }, warm: { value: 0 }, sunDir: { value: sunDir } };   // shared uniforms

const skyMat = new THREE.ShaderMaterial({
  uniforms: { ...skyCommon, uTime: G.time, uWarm: G.warm, uSunDir: G.sunDir, uZenith: { value: new THREE.Color(0xcfcbe8) } },
  side: THREE.BackSide, depthWrite: false, depthFunc: THREE.LessEqualDepth,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
    uniform float uTime, uWarm; uniform vec3 uSunDir, uZenith;
    varying vec3 vDir;
    ${NOISE}
    ${SKYLOOK}
    void main(){
      vec3 d = normalize(vDir);
      vec3 col = skyLook(d, 0.0);
      float el = asin(clamp(d.y, -1.0, 1.0));
      col = mix(col, uZenith, smoothstep(0.85, 1.4, el / uSpanV));
      // the sun: the large painted disk is dissolved into the surrounding glow and a smaller, crisper sun
      // is drawn in its place (the video's sun is a small soft disk low over the horizon)
      float saz = atan(uSunDir.x, -uSunDir.z), sel = asin(clamp(uSunDir.y, -1.0, 1.0));
      float az = atan(d.x, -d.z);
      float dAz = az - saz; dAz -= 6.2831853 * floor((dAz + 3.14159265) / 6.2831853);
      float er = length(vec2(dAz / 0.090, (el - sel) / 0.060));
      if (er < 1.3) {
        vec3 ringc = vec3(0.0);
        for (int i = 0; i < 10; i++) {
          float a = float(i) * 0.6283185;
          float raz = saz + cos(a) * 0.122, rel = max(sel + sin(a) * 0.081, 0.004);
          ringc += skyLook(vec3(sin(raz) * cos(rel), sin(rel), -cos(raz) * cos(rel)), 3.0);
        }
        col = mix(col, ringc / 10.0, smoothstep(1.28, 0.5, er));
      }
      vec3 side = normalize(cross(uSunDir, vec3(0.0, 1.0, 0.0)));
      vec3 sp = d - uSunDir * dot(d, uSunDir);
      float ang = dot(sp, sp) > 1e-10 ? atan(dot(sp, vec3(0.0, 1.0, 0.0)), dot(sp, side)) : 0.0;   // atan(0,0) is undefined
      float rays = vnoise(vec2(ang * 7.0, uTime * 0.04)) * vnoise(vec2(ang * 19.0 + 3.0, uTime * 0.07 + 5.0));
      float sang = acos(clamp(dot(d, uSunDir), -1.0, 1.0));
      col = mix(col, vec3(1.0, 0.975, 0.93) * 1.16, smoothstep(0.0170, 0.0138, sang));
      col += vec3(1.0, 0.86, 0.66) * (exp(-sang * 46.0) * 0.32 + exp(-sang * 10.0) * 0.10 + rays * exp(-sang * 12.0) * 0.07) * (1.0 + uWarm * 0.6);
      col *= mix(vec3(1.0), vec3(1.05, 1.0, 0.92), uWarm);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 64, 32), skyMat);
sky.renderOrder = -100; sky.frustumCulled = false;
scene.add(sky);

// ---------------------------------------------------------------- distant hills (parallax layers)
const hazeColor = new THREE.Color(0xd9cfd6);
const hills = [];
function addHill(u0, u1, v0, v1, az, dist, width, k, haze, taperOn = 1) {
  if (!hillsTex) return;
  const img = hillsTex.image; const aspect = ((u1 - u0) * img.width) / ((v1 - v0) * img.height);
  const geo = new THREE.PlaneGeometry(width, width / aspect);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, lerp(u0, u1, uv.getX(i)), lerp(v0, v1, uv.getY(i)));
  geo.translate(0, width / aspect * 0.5 - width / aspect * 0.06, 0);
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: hillsTex }, uHaze: { value: hazeColor }, uHazeAmt: { value: haze }, uWarm: G.warm, uW: { value: width }, uTaperOn: { value: taperOn } },
    transparent: true, depthWrite: false,
    vertexShader: `uniform float uW; varying vec2 vUv; varying float vY; varying float vLu; void main(){ vUv = uv; vLu = position.x / uW + 0.5; vec4 w = modelMatrix * vec4(position, 1.0); vY = w.y; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
      uniform sampler2D map; uniform vec3 uHaze; uniform float uHazeAmt, uWarm, uTaperOn; varying vec2 vUv; varying float vY; varying float vLu;
      void main(){
        // the painted ridge is cut by the image edge: let its silhouette slope down to the sea, then dissolve into haze
        float taper = smoothstep(0.55, 1.0, vLu) * uTaperOn;
        vec4 t = texture2D(map, vec2(vUv.x, vUv.y + taper * taper * 0.75));
        float ends = smoothstep(0.0, 0.05, vLu) * mix(1.0, smoothstep(1.0, 0.9, vLu), uTaperOn);
        float a = t.a * ends; if (a < 0.02) discard;
        float h = uHazeAmt + (1.0 - uHazeAmt) * 0.45 * exp(-max(vY, 0.0) * 0.03) + taper * 0.25;
        vec3 c = mix(t.rgb, uHaze * mix(vec3(1.0), vec3(1.04, 1.0, 0.94), uWarm), clamp(h, 0.0, 1.0));
        gl_FragColor = vec4(c, a);
        #include <colorspace_fragment>
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.userData = { base: new THREE.Vector3(Math.sin(az) * dist, 0, -Math.cos(az) * dist), k };
  m.lookAt(0, 0, 0); m.rotation.set(0, -az, 0);
  m.renderOrder = -50; m.frustumCulled = false;
  scene.add(m); hills.push(m);
}

// ---------------------------------------------------------------- reflection (mirror camera)
const mirrorCam = new THREE.PerspectiveCamera();
const texMatrix = new THREE.Matrix4();
const _mp = { plane: new THREE.Plane(), n: new THREE.Vector3(0, 1, 0), rp: new THREE.Vector3(), cp: new THREE.Vector3(), rot: new THREE.Matrix4(),
  look: new THREE.Vector3(), view: new THREE.Vector3(), target: new THREE.Vector3(), clip: new THREE.Vector4(), q: new THREE.Vector4() };
function updateMirror() {
  const m = _mp;
  m.rp.set(camera.position.x, 0, camera.position.z);
  m.cp.setFromMatrixPosition(camera.matrixWorld);
  m.view.subVectors(m.rp, m.cp);
  m.view.reflect(m.n).negate(); m.view.add(m.rp);
  m.rot.extractRotation(camera.matrixWorld);
  m.look.set(0, 0, -1).applyMatrix4(m.rot).add(m.cp);
  m.target.subVectors(m.rp, m.look); m.target.reflect(m.n).negate(); m.target.add(m.rp);
  mirrorCam.position.copy(m.view);
  mirrorCam.up.set(0, 1, 0).applyMatrix4(m.rot).reflect(m.n);
  mirrorCam.lookAt(m.target);
  mirrorCam.far = camera.far;
  mirrorCam.updateMatrixWorld();
  mirrorCam.projectionMatrix.copy(camera.projectionMatrix);
  texMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  texMatrix.multiply(mirrorCam.projectionMatrix).multiply(mirrorCam.matrixWorldInverse);
  m.plane.setFromNormalAndCoplanarPoint(m.n, m.rp).applyMatrix4(mirrorCam.matrixWorldInverse);
  m.clip.set(m.plane.normal.x, m.plane.normal.y, m.plane.normal.z, m.plane.constant);
  const e = mirrorCam.projectionMatrix.elements;
  m.q.x = (Math.sign(m.clip.x) + e[8]) / e[0];
  m.q.y = (Math.sign(m.clip.y) + e[9]) / e[5];
  m.q.z = -1.0; m.q.w = (1.0 + e[10]) / e[14];
  m.clip.multiplyScalar(2.0 / m.clip.dot(m.q));
  e[2] = m.clip.x; e[6] = m.clip.y; e[10] = m.clip.z + 1.0 - 0.003; e[14] = m.clip.w;
  mirrorCam.projectionMatrixInverse.copy(mirrorCam.projectionMatrix).invert();
}

// ---------------------------------------------------------------- reveal mask (ping-pong, world space)
const MAXR = 24, MAXI = 4;
const ripU = Array.from({ length: MAXR }, () => new THREE.Vector4(0, 0, 0, 0));
const islU = Array.from({ length: MAXI }, () => new THREE.Vector4(0, 0, 1, 0));
const islB = Array.from({ length: MAXI }, () => new THREE.Vector4(0, 0, 0, 0));
const bloomU = Array.from({ length: MAXI }, () => new THREE.Vector4(0, 0, 0, 0));

// ---------------------------------------------------------------- water
const waterU = {

    uniform vec4 uRip[MAXR]; uniform vec4 uIsl[MAXI]; uniform vec4 uIslB[MAXI];
    uniform vec4 uBoy; uniform vec3 uSunDir; uniform float uTime, uWarm, uPathOn; uniform vec4 uPath;

      vec2 muv = (xz - uMaskXf.xy) / uMaskXf.z + 0.5;

      if (muv.x > 0.0 && muv.x < 1.0 && muv.y > 0.0 && muv.y < 1.0) mask = texture2D(tMask, muv).r;

      #include <colorspace_fragment>
    }`,
});

const PR = () => renderer.getPixelRatio() * (innerHeight / 900);
function makeMoteMaterial(cell, color, additive = true) {
  return new THREE.ShaderMaterial({
    uniforms: { tMote: { value: moteTex || whiteTex }, uCell: { value: new THREE.Vector2(...cell) }, uColor: { value: new THREE.Color(...color) },
      uTime: G.time, uState: { value: 0 }, uCenter: { value: new THREE.Vector3() }, uRadius: { value: 8 }, uHeight: { value: 6 }, uSize: { value: 1 },
      uBurst: { value: 0 }, uPR: { value: 1 } },
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: /* glsl */`
      attribute vec4 aSeed; uniform vec3 uCenter; uniform float uRadius, uHeight, uTime, uState, uSize, uBurst, uPR;
      varying float vA;
      void main(){

        float life = fract(uTime * sp * 0.10 + aSeed.z);
        float ang = aSeed.x * 6.2831853; float rad = sqrt(aSeed.y) * uRadius * (1.0 + uBurst * 0.6);
        vec3 p = uCenter + vec3(cos(ang) * rad, 0.0, sin(ang) * rad);
        p.y = 0.15 + life * uHeight * (1.0 + uBurst * 2.2);
        p.x += sin(uTime * 0.6 + aSeed.z * 30.0) * 0.7 * life;

        gl_Position = projectionMatrix * mv;

    fragmentShader: /* glsl */`

let dropHead = 0;
function splash(x, z, n, power) {
  for (let i = 0; i < n; i++) {
    const k = dropHead = (dropHead + 1) % DROP_MAX;
    const a = Math.random() * Math.PI * 2, s = (0.35 + Math.random() * 0.8) * power;
    dropPos[k * 3] = x; dropPos[k * 3 + 1] = 0.02; dropPos[k * 3 + 2] = z;
    dropVel[k * 3] = Math.cos(a) * s; dropVel[k * 3 + 1] = (1.1 + Math.random() * 1.4) * power; dropVel[k * 3 + 2] = Math.sin(a) * s;

  }
}
function updateDrops(dt) {
  for (let k = 0; k < DROP_MAX; k++) {
    if (dropLife[k] <= 0) continue;
    dropLife[k] -= dt;
    dropVel[k * 3 + 1] -= 9.0 * dt;
    dropPos[k * 3] += dropVel[k * 3] * dt; dropPos[k * 3 + 1] += dropVel[k * 3 + 1] * dt; dropPos[k * 3 + 2] += dropVel[k * 3 + 2] * dt;
    if (dropPos[k * 3 + 1] < 0) { dropLife[k] = 0; }
  }

}

  boy.model = model; boy.root.add(model);

  const idleClip = boyG.animations[0];

  const strip = (clip) => { if (!clip) return null; clip.tracks = clip.tracks.filter((tr) => !(tr.name.endsWith('.position') && !tr.name.startsWith('Hips'))); return clip; };
  [['idle', idleClip], ['walk', strip(walkClip)], ['run', strip(runClip)]].forEach(([k, c]) => {

}

  if (boy.air) {
    boy.vy -= 11.5 * dt; boy.y += boy.vy * dt;
    if (boy.y <= 0) { boy.y = 0; boy.air = false; spawnRipple(boy.pos.x, boy.pos.z, { big: true }); spawnRipple(boy.pos.x, boy.pos.z, { rmax: 3.2, delay: 0.25 }); splash(boy.pos.x, boy.pos.z, 26, 1.3); play('splash', { gain: 0.8, rate: 0.95 + Math.random() * 0.1 }); }
  }

  // ---- animation blend
  if (boy.mixer) {
    const sp = boy.speed;
    const wWalk = smooth(sp, 0.05, 0.9) * (1 - smooth(sp, 2.6, 4.0)), wRun = smooth(sp, 2.6, 4.0), wIdle = 1 - smooth(sp, 0.05, 0.9);
    const A = boy.actions;
    if (A.idle) A.idle.setEffectiveWeight(wIdle);
    if (A.walk) { A.walk.setEffectiveWeight(wWalk); A.walk.timeScale = clamp(sp / 1.25, 0.6, 2.0); }
    if (A.run) { A.run.setEffectiveWeight(wRun); A.run.timeScale = clamp(sp / 4.2, 0.8, 1.4); }
    boy.mixer.update(dt);
  }
  boy.root.position.set(boy.pos.x, boy.y - 0.03 * (1 - smooth(boy.y, 0, 0.1)), boy.pos.z);   // ankle-deep: soles just under the mirror
  boy.root.rotation.y = boy.heading;
  boy.root.updateMatrixWorld(true);

  // ---- footsteps → ripples
  const moving = boy.speed > 0.4 && !boy.air;
  boy.feet.forEach((f, i) => {
    if (!f) return;
    f.getWorldPosition(tmpV);
    const fy = tmpV.y - boy.y - boy.footRest;
    const ring = footRings[i]; ring.x = tmpV.x; ring.z = tmpV.z;
    ring.a = damp(ring.a, boy.air ? 0 : (fy < 0.06 ? 0.95 : 0.25), 10, dt);
    if (!boy.footDown[i] && fy < 0.025 && moving) {
      boy.footDown[i] = true;
      spawnRipple(tmpV.x, tmpV.z, { rmax: 2.7 + Math.random() * 0.6 + (boy.speed > 3 ? 0.6 : 0) });
      if (Math.random() < 0.4) spawnRipple(tmpV.x, tmpV.z, { rmax: 1.2, delay: 0.18, strength: 0.6 });
      splash(tmpV.x, tmpV.z, boy.speed > 3 ? 7 : 3, boy.speed > 3 ? 0.8 : 0.5);
      play('step', { gain: 0.22 + Math.random() * 0.08, rate: 0.9 + Math.random() * 0.25, pan: i ? 0.12 : -0.12 });
    } else if (boy.footDown[i] && fy > 0.07) boy.footDown[i] = false;
  });
  if (!boy.feet.length && moving) { // fallback cadence if no skeleton
    state.lastStepSide += dt * boy.speed * 1.6; if (state.lastStepSide > 1) { state.lastStepSide = 0; spawnRipple(boy.pos.x, boy.pos.z); }
  }
  updateRipples(dt);
  updateDrops(dt);

  // ---- memories: coverage on a coarse CPU grid (mirrors the GPU mask)
  decayAcc += dt;
  let focus = 0;
  for (const isl of islands) {
    const d = isl.def; const bd = Math.hypot(boy.pos.x - d.x, boy.pos.z - d.z);
    if (isl.active && !isl.found) {
      if (bd < d.r + 12) {
        const cells = isl.cells, xz = isl.cellXZ;
        for (let c = 0; c < cells.length; c++) cells[c] = Math.max(0, cells[c] - CFG.decay * dt);
        for (let u = 0; u < MAXR; u++) {
          const r = ripU[u]; if (r.w <= 0.001) continue;
          if (Math.hypot(r.x - d.x, r.y - d.z) > d.r + r.z + 1) continue;
          const rr = r.z * 1.05;
          for (let c = 0; c < cells.length; c++) { const ex = xz[c * 2] - r.x, ez = xz[c * 2 + 1] - r.y; if (ex * ex + ez * ez < rr * rr) cells[c] = 1; }
        }
        let s = 0; for (let c = 0; c < cells.length; c++) s += cells[c];
        isl.coverage = s / cells.length;
        if (isl.coverage > CFG.goal) memoryFound(isl);
      } else {
        for (let c = 0; c < isl.cells.length; c++) isl.cells[c] = Math.max(0, isl.cells[c] - CFG.decay * dt);
        isl.coverage = Math.max(0, isl.coverage - CFG.decay * dt);
      }
    }
    if (isl.active || isl.found) focus = Math.max(focus, smooth(d.r * 1.15 - bd, 0, 6) * (isl.found ? 0.7 : 1));
    // bloom (a restored memory floods outward and stays)
    if (isl.found) {
      isl.bloomT += dt;
      const finalR = d.final ? 58 : d.r * 1.08;
      isl.bloom = finalR * (1 - Math.pow(1 - clamp(isl.bloomT / (d.final ? 9 : 3.2), 0, 1), 2.4));
      isl.glow = Math.max(0, 1 - isl.bloomT / 4) ;
    }
    // per-island shader + objects
    const I = isl.i;
    islU[I].set(d.x, d.z, isl.found ? Math.max(d.r, isl.bloom) : d.r, isl.active || isl.found ? 1 : 0);
    isl.hint = damp(isl.hint, isl.active && !isl.found ? 1 : 0, 1.5, dt);
    islB[I].set(isl.found ? 1 : 0, isl.hint, 0, 0);
    bloomU[I].set(d.x, d.z, isl.bloom, isl.found ? 1 : 0);
    const revealTarget = isl.found ? 1 : 0;
    for (const o of isl.objs) for (const m of o.userData.mats) { m.uniforms.uReveal.value = damp(m.uniforms.uReveal.value, revealTarget, 0.9, dt); m.uniforms.uGlow.value = isl.glow; }
    const beaconOn = isl.active && !isl.found ? 0.5 * smooth(bd, d.r * 0.8, d.r * 2.4) : 0;
    isl.beacon.material.uniforms.uA.value = damp(isl.beacon.material.uniforms.uA.value, beaconOn, 0.8, dt);
    isl.beacon.visible = isl.beacon.material.uniforms.uA.value > 0.003;
    const mu = isl.motes.material.uniforms;
    mu.uState.value = damp(mu.uState.value, isl.found ? (isl.bloomT < 3 ? 1.4 : 0) : (isl.active ? 0.85 + 0.6 * isl.coverage : 0), 1.2, dt);
    mu.uBurst.value = isl.found ? clamp(isl.bloomT / 3, 0, 1) : 0;
    mu.uPR.value = PR();
  }
  state.focus = damp(state.focus, focus, 1.4, dt);

  // memory "pull": a soft chime grows as you uncover
  for (const isl of islands) {
    const lv = Math.floor(isl.coverage * 5);
    if (!isl.found && isl.active && lv > (isl.lastLv || 0)) play('chime', { gain: 0.10 + lv * 0.04, rate: 0.6 + lv * 0.12, pan: panFor(isl.def.x, isl.def.z) * 0.4 });
    isl.lastLv = isl.found ? 0 : lv;
  }

  // ---- decay accumulator for the GPU mask (half-float friendly)
  maskMat.uniforms.uDecay.value = 0;
  if (decayAcc > 0.25) { maskMat.uniforms.uDecay.value = CFG.decay * decayAcc; decayAcc = 0; }

  // ---- path of light to the last memory
  const home = islands.find((i) => i.def.final);
  state.pathOn = damp(state.pathOn, home.active && !home.found ? 1 : 0, 0.6, dt);
  waterU.uPathOn.value = state.pathOn;
  waterU.uPath.value.set(boy.pos.x, boy.pos.z, home.def.x, home.def.z);

  // ---- dawn warms as memories return
  const warmTarget = state.found / islands.length + (state.mode === 'end' ? 0.25 : 0);
  state.warm = damp(state.warm, warmTarget, 0.5, dt); G.warm.value = state.warm;
  waterU.uBoy.value.set(boy.pos.x, boy.pos.z, boy.y, 1);

  // ---- camera
  updateCamera(dt);

  // ---- where the boy is on screen (memories dissolve in front of him)
  {
    const c = _bs.c.set(boy.pos.x, boy.y + 0.65, boy.pos.z).project(camera);
    const hd = _bs.h.set(boy.pos.x, boy.y + 1.4, boy.pos.z).project(camera);
    const ft = _bs.f.set(boy.pos.x, boy.y - 0.05, boy.pos.z).project(camera);
    const vz = _bs.v.set(boy.pos.x, boy.y + 0.65, boy.pos.z).applyMatrix4(camera.matrixWorldInverse).z;
    memU.uBoyScr.value.set(c.x * 0.5 + 0.5, c.y * 0.5 + 0.5, Math.abs(hd.y - ft.y) * 0.5 * 0.85 + 0.015, -vz);
  }

  // ---- hills parallax
  for (const h of hills) { const u = h.userData; h.position.set(u.base.x + camera.position.x * u.k, 0, u.base.z + camera.position.z * u.k); }
  sky.position.copy(camera.position);
  water.position.set(Math.round(camera.position.x / 50) * 50, 0, Math.round(camera.position.z / 50) * 50);
  dustMat.uniforms.uCam.value.copy(boy.pos); dustMat.uniforms.uPR.value = PR(); dropMat.uniforms.uPR.value = PR();

  // ---- ending
  if (state.mode === 'end') {
    const e = state.t - state.endT;
    if (e > 13.5) $('end').classList.remove('hidden');
    if (e > 3) $('memories').classList.add('hidden');
  }
}

function updateCamera(dt) {
  const intro = state.mode === 'title' || state.mode === 'loading';
  const ending = state.mode === 'end';
  const endT = ending ? smooth(state.t - state.endT, 0.5, 9) : 0;
  // look offset from the pointer (gentle parallax of the 3D camera)
  const lookYaw = intro ? Math.sin(state.t * 0.07) * 0.12 : (pointer.down || ending ? 0 : clamp(pointer.nx, -1, 1) * 0.10);
  camRig.lookYaw = damp(camRig.lookYaw, lookYaw, 2, dt);
  if (ending) {
    // the closing shot: three-quarter view from behind the boy, the house and its garden ahead, sky above
    let d = ((0.32 - camRig.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    camRig.yaw += d * (1 - Math.exp(-0.7 * dt));
  } else if (!intro) {
    // lazy follow of the walking direction (calm third-person) + Q / E to turn the camera
    if(window.EGPad.right.active){camRig.touchLookTime=state.t;camRig.yaw -= window.EGPad.right.x * dt * 1.7 * window.EGPad.sensitivity;camRig.touchPitch=clamp((camRig.touchPitch||0)+window.EGPad.right.y*dt*.6*window.EGPad.sensitivity,-.35,.3);}
    if (keys.has('KeyQ')) camRig.yaw += 1.4 * dt;
    if (keys.has('KeyE')) camRig.yaw -= 1.4 * dt;
    if (boy.speed > 0.5 && state.t - (camRig.touchLookTime??-100) > 1.2) {
      const want = boy.heading + Math.PI; // camera sits behind the boy
      let d = ((want - camRig.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      const backwards = Math.abs(d) > 2.3;
      if (!backwards) camRig.yaw += d * (1 - Math.exp(-0.55 * dt)) * smooth(boy.speed, 0.5, 2.0);
    }
  } else {
    camRig.yaw = damp(camRig.yaw, 0.02, 1.0, dt);
    boy.heading = damp(boy.heading, 2.45, 2.0, dt);
  }
  const f = state.focus;
  // above a memory the camera rises and tilts down, as in the video, so the painted world opens beneath the boy
  const endT2 = ending ? smooth(state.t - state.endT, 10, 19) : 0;   // then the camera lifts its eyes to the dawn sky
  const pitch = (intro ? -0.085 : lerp(lerp(-0.2, -0.40, f), -0.115, endT)) + (camRig.touchPitch||0);
  const dist = intro ? 4.6 : lerp(lerp(6.4, 8.2, f), 16.5, endT);
  const h = intro ? 0.95 : lerp(0.9, 1.9, endT);
  const k = intro ? 1.2 : (ending ? 0.8 : 1.6);
  camRig.pitch = damp(camRig.pitch, pitch, k, dt); camRig.dist = damp(camRig.dist, dist, k, dt); camRig.h = damp(camRig.h, h, k, dt);
  const yaw = camRig.yaw + camRig.lookYaw;
  const cp = Math.cos(camRig.pitch), sp = Math.sin(camRig.pitch);
  // at the end the camera aims between the boy and his home
  const home = islands.find((i) => i.def.final).def;
  const ax = lerp(boy.pos.x, home.x + 0.5, endT * 0.55), az = lerp(boy.pos.z, home.z - 5, endT * 0.55);
  const tx = ax, ty = camRig.h + boy.y * 0.35, tz = az;
  const breathe = Math.sin(state.t * 0.5) * 0.04;
  camera.position.set(tx + Math.sin(yaw) * cp * camRig.dist, ty - sp * camRig.dist + breathe, tz + Math.cos(yaw) * cp * camRig.dist);
  camera.lookAt(tx - Math.sin(yaw) * 0.6, ty + breathe * 0.5 + endT2 * camRig.dist * 0.13, tz - Math.cos(yaw) * 0.6);   // the camera stays above the sea; only its gaze lifts
  camera.updateMatrixWorld();
}

// ---------------------------------------------------------------- post-processing
const brightMat = new THREE.ShaderMaterial({ uniforms: { tSrc: { value: null } }, vertexShader: FS_VERT, fragmentShader: /* glsl */`
  uniform sampler2D tSrc; varying vec2 vUv;
  void main(){ vec3 c = texture2D(tSrc, vUv).rgb; if (any(isnan(c)) || any(isinf(c))) c = vec3(0.0); float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(1.0, 1.7, l), 1.0); }` });
const blurMat = new THREE.ShaderMaterial({ uniforms: { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } }, vertexShader: FS_VERT, fragmentShader: /* glsl */`
  uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;
  void main(){ vec3 c = texture2D(tSrc, vUv).rgb * 0.227;
    c += (texture2D(tSrc, vUv + uDir * 1.38).rgb + texture2D(tSrc, vUv - uDir * 1.38).rgb) * 0.316;
    c += (texture2D(tSrc, vUv + uDir * 3.23).rgb + texture2D(tSrc, vUv - uDir * 3.23).rgb) * 0.070;
    gl_FragColor = vec4(c, 1.0); }` });
const finalMat = new THREE.ShaderMaterial({
  uniforms: { tScene: { value: rtMain.texture }, tBloom: { value: rtBloomB.texture }, tPaper: { value: paperTex || whiteTex }, uRes: { value: new THREE.Vector2(1, 1) },
    uWarm: G.warm, uFade: { value: 1 }, uFadeCol: { value: new THREE.Color(0xeae2dc) }, uTime: G.time },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene, tBloom, tPaper; uniform vec2 uRes; uniform float uWarm, uFade, uTime; uniform vec3 uFadeCol;
    varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tScene, vUv).rgb;
      if (any(isnan(c)) || any(isinf(c))) c = vec3(0.8);   // safety net: one bad pixel must never become a hole
      c += texture2D(tBloom, vUv).rgb * 0.42;
      c = c / (1.0 + 0.10 * c);                                   // soft shoulder
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(c, c * vec3(0.95, 0.96, 1.05), (1.0 - l) * 0.35);   // lavender shadows
      c *= mix(vec3(1.0), vec3(1.05, 1.0, 0.93), uWarm * 0.5);    // the dawn warms
      vec3 paper = texture2D(tPaper, vUv * uRes / 1100.0).rgb;
      c *= mix(vec3(1.0), paper / max(dot(paper, vec3(0.3333)), 0.2), 0.10);
      c *= 0.97 + 0.06 * paper.g;
      vec2 q = vUv - 0.5; c *= mix(0.80, 1.0, smoothstep(0.9, 0.25, length(q * vec2(1.0, 0.85))));
      c = mix(c, uFadeCol, uFade);
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
});

// ---------------------------------------------------------------- resize
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  const pw = Math.floor(w * DPR), ph = Math.floor(h * DPR);
  rtMain.setSize(pw, ph); rtMirror.setSize(Math.floor(pw * 0.5), Math.floor(ph * 0.5));
  rtBloomA.setSize(Math.floor(pw / 4), Math.floor(ph / 4)); rtBloomB.setSize(Math.floor(pw / 4), Math.floor(ph / 4));
  waterU.uRes.value.set(pw, ph); finalMat.uniforms.uRes.value.set(pw, ph);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 52 : 38; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- render
function render() {
  // 1. reveal mask
  maskMat.uniforms.tPrev.value = rtMaskA.texture;
  fsPass(maskMat, rtMaskB);
  maskMat.uniforms.uClear.value = 0;
  [rtMaskA, rtMaskB] = [rtMaskB, rtMaskA];
  waterU.tMask.value = rtMaskA.texture; memU.tMask.value = rtMaskA.texture;
  for (const isl of islands) for (const o of isl.objs) for (const m of o.userData.mats) m.uniforms.tMask.value = rtMaskA.texture;

  // 2. memories beneath the surface (seen through the water)
  memU.uResM.value.set(rtMain.width, rtMain.height);

  // 3. mirror
  updateMirror();
  water.visible = false; ripMesh.visible = false; drops.visible = false; dust.visible = false;
  renderer.setRenderTarget(rtMirror); renderer.setClearColor(0xd8cfd8, 1); renderer.clear(); renderer.render(scene, mirrorCam);
  water.visible = true; ripMesh.visible = true; drops.visible = true; dust.visible = true;

  // 4. main
  renderer.setRenderTarget(rtMain); renderer.clear(); renderer.render(scene, camera);

  // 5. bloom + final
  brightMat.uniforms.tSrc.value = rtMain.texture; fsPass(brightMat, rtBloomA);
  blurMat.uniforms.tSrc.value = rtBloomA.texture; blurMat.uniforms.uDir.value.set(1.6 / rtBloomA.width, 0); fsPass(blurMat, rtBloomB);
  blurMat.uniforms.tSrc.value = rtBloomB.texture; blurMat.uniforms.uDir.value.set(0, 1.6 / rtBloomA.height); fsPass(blurMat, rtBloomA);
  blurMat.uniforms.tSrc.value = rtBloomA.texture; blurMat.uniforms.uDir.value.set(3.2 / rtBloomA.width, 0); fsPass(blurMat, rtBloomB);
  blurMat.uniforms.tSrc.value = rtBloomB.texture; blurMat.uniforms.uDir.value.set(0, 3.2 / rtBloomA.height); fsPass(blurMat, rtBloomA);
  finalMat.uniforms.tBloom.value = rtBloomA.texture;
  fsPass(finalMat, null);
}

// ---------------------------------------------------------------- dev helper: scripted walk (headless verification only)
const demo = { ang: 0, lastT: 0, leapT: 0, inside: false };
function demoTarget() {
  const order = islands.filter((i) => i.active && !i.found);
  if (!order.length) return null;
  const isl = order[0]; const d = isl.def;
  const bd = Math.hypot(boy.pos.x - d.x, boy.pos.z - d.z);
  const dt = Math.min(0.05, state.t - demo.lastT); demo.lastT = state.t;
  if (bd > d.r * 0.95 && !demo.inside) return { x: d.x, z: d.z };
  if (!demo.inside) { demo.inside = true; demo.ang = Math.atan2(boy.pos.z - d.z, boy.pos.x - d.x); }
  // walk a breathing circle inside the memory, leaping now and then (as a player would)
  const rr = d.r * (0.3 + 0.42 * (0.5 + 0.5 * Math.sin(state.t * 0.13)));
  demo.ang += dt * CFG.walkSpeed * 0.9 / rr;
  if (state.t - demo.leapT > 2.6) { demo.leapT = state.t; wantLeap = true; }
  return { x: d.x + Math.cos(demo.ang) * rr, z: d.z + Math.sin(demo.ang) * rr };
}

// ---------------------------------------------------------------- start
if (hillsTex) {
  // hills.png: a small islet (u 0–0.2) and a long ridge with its own islet (u 0.2–1), as in the video: right of the sun
  const HL = [
    { u0: 0.00, u1: 0.20, v0: 0.0, v1: 1.0, az: 0.07, dist: 900, width: 115, k: 0.90, haze: 0.22, taper: 0 },
    { u0: 0.20, u1: 1.00, v0: 0.0, v1: 1.0, az: 0.42, dist: 1500, width: 560, k: 0.95, haze: 0.28, taper: 1 },
  ];
  HL.forEach((h) => addHill(h.u0, h.u1, h.v0, h.v1, h.az, h.dist, h.width, h.k, h.haze, h.taper));
}
state.mode = 'title';
$('loading').classList.add('hidden');
setTimeout(() => { $('veil').style.opacity = 0; $('title').classList.remove('hidden'); }, 200);
if (DEMO) setTimeout(() => startGame(), 400);

let first = true;
renderer.setAnimationLoop(() => {
  let dt = Math.min(clock.getDelta(), 1 / 20);
  if (first) { dt = 1 / 60; first = false; }
  update(dt);
  finalMat.uniforms.uFade.value = state.fade = damp(state.fade, state.mode === 'loading' ? 1 : 0, 1.2, dt);
  render();
});
window.__mirror = { state, boy, islands, camRig, AUD, memoryFound };   // read-only handle for automated checks
</script>
<script src="../brand/gamepad.js"></script>
