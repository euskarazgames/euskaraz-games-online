<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================
//  SPACE MOWER — a tiny-planet lawn mowing arcade game.
//  Every texture, sprite, model and sound in /assets was generated with fal.
// =====================================================================
const QS = new URLSearchParams(location.search);
const DEBUG = QS.has('debug');
const AUTOSTART = QS.has('autostart');
const LOWQ = QS.get('q') === 'low';

const R = 10;                     // planet radius (world units)
const CUT_R = 0.66;               // mower cutting radius
const MOWER_LEN = 1.75;           // mower model length
const MAX_CRATERS = 32;
const MOW_W = 2048, MOW_H = 1024; // equirect mowing mask
const N_SAMPLES = 16000;          // scoring sample points
// grass look (matched to the video frames): tuft density/size, tuft base..tip shading, ground brightness,
// share of mown colour under the tall grass, tuft clustering, grass saturation
const TN = 0.8, TS = 1.1, TB = 0.55, TT = 1.22, GL = 0.81, GM = 0.4, TC = 0.35, GS = 0.83;
const N_TUFTS = Math.round((LOWQ ? 32000 : 72000) * TN * (R * R) / 100);

const $ = id => document.getElementById(id);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(2028);
const frand = Math.random;

const UP = new THREE.Vector3(0, 1, 0), XA = new THREE.Vector3(1, 0, 0), YA = new THREE.Vector3(0, 1, 0);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _m1 = new THREE.Matrix4();

// tangent offset (x right, z back) at the north pole -> unit direction (exponential map)
function dirFromPole(x, z) {
  const d = Math.hypot(x, z); if (d < 1e-6) return UP.clone();
  const th = d / R, s = Math.sin(th) / d;
  return new THREE.Vector3(x * s, Math.cos(th), z * s).normalize();
}
function randomDir(r = rng) { const u = r() * 2 - 1, t = r() * Math.PI * 2, s = Math.sqrt(1 - u * u); return new THREE.Vector3(s * Math.cos(t), u, s * Math.sin(t)); }
function arc(a, b) { return Math.acos(clamp(a.dot(b), -1, 1)) * R; }
function surfQuat(dir, yaw, out = new THREE.Quaternion()) {
  out.setFromUnitVectors(UP, dir); return out.multiply(_q2.setFromAxisAngle(UP, yaw));
}
// random direction at arc distance d from dir
function offsetDir(dir, d, ang) {
  const t1 = _v3.crossVectors(Math.abs(dir.y) < 0.9 ? UP : XA, dir).normalize();
  const t2 = _v4.crossVectors(dir, t1);
  const tdir = t1.clone().multiplyScalar(Math.cos(ang)).addScaledVector(t2, Math.sin(ang));
  const th = d / R;
  return dir.clone().multiplyScalar(Math.cos(th)).addScaledVector(tdir, Math.sin(th)).normalize();
}

// ---------------------------------------------------------------------
//  Renderer / scene / post
// ---------------------------------------------------------------------
const maxPR = Math.min(window.devicePixelRatio || 1, LOWQ ? 1 : 1.5);
let pixelRatio = maxPR;
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fd3f2, 16, 46);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 900);
window.EGMobileView(renderer,camera);


const hemi = new THREE.HemisphereLight(0xe8f3ff, 0x5f8a2c, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.9);
sun.castShadow = true;
sun.shadow.mapSize.set(LOWQ ? 1024 : 2048, LOWQ ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 80 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);
const flash = new THREE.PointLight(0xffa040, 0, 9, 1.6);
scene.add(flash);

const size2 = new THREE.Vector2(); renderer.getDrawingBufferSize(size2);
const composerRT = new THREE.WebGLRenderTarget(size2.x, size2.y, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.addPass(new RenderPass(scene, camera));
const TiltShader = {
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uRes: { value: new THREE.Vector2(1, 1) },
    uFocus: { value: 0.5 }, uBand: { value: 0.17 }, uAmount: { value: 22 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uDir, uRes; uniform float uFocus, uBand, uAmount; varying vec2 vUv;
    void main(){
      float dy = vUv.y - uFocus;
      float d = max(0.0, abs(dy) - uBand) * (dy < 0.0 ? 1.25 : 0.3);
      float r = d * uAmount;
      if (r < 0.15) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
      vec4 s = vec4(0.0); float ws = 0.0;
      for (int i = -6; i <= 6; i++) { float fi = float(i); float w = exp(-fi*fi/14.0);
        s += texture2D(tDiffuse, vUv + uDir * (fi * r / 6.0) / uRes) * w; ws += w; }
      gl_FragColor = s / ws; }`
};
const tiltH = new ShaderPass(TiltShader), tiltV = new ShaderPass(TiltShader);
tiltV.uniforms.uDir.value.set(0, 1);
composer.addPass(tiltH); composer.addPass(tiltV);
const bloom = new UnrealBloomPass(new THREE.Vector2(size2.x / 2, size2.y / 2), 0.32, 0.55, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSat: { value: 1.07 }, uCon: { value: 1.04 }, uVig: { value: 0.55 }, uHit: { value: 0 } },
  vertexShader: TiltShader.vertexShader,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSat, uCon, uVig, uHit; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      float l = dot(c.rgb, vec3(0.299,0.587,0.114));
      c.rgb = mix(vec3(l), c.rgb, uSat);
      c.rgb = (c.rgb - 0.5) * uCon + 0.5;
      vec2 q = vUv - 0.5; c.rgb *= 1.0 - dot(q,q) * uVig;
      c.rgb = mix(c.rgb, vec3(1.0,0.45,0.2), uHit * smoothstep(0.15, 0.75, length(q)));
      gl_FragColor = vec4(c.rgb, 1.0); }`
});
composer.addPass(gradePass);

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pixelRatio); composer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(size2);
  tiltH.uniforms.uRes.value.copy(size2); tiltV.uniforms.uRes.value.copy(size2);
  tiltH.uniforms.uAmount.value = tiltV.uniforms.uAmount.value = 26 * size2.y / 720;
}
addEventListener('resize', onResize);

// ---------------------------------------------------------------------
//  Assets
// ---------------------------------------------------------------------
const manager = new THREE.LoadingManager();
manager.onProgress = (u, l, t) => { $('loadFill').style.width = (l / t * 100).toFixed(0) + '%'; };
const gltfLoader = new GLTFLoader(manager).setMeshoptDecoder(MeshoptDecoder);
const texLoader = new THREE.TextureLoader(manager);
const loadGLB = url => new Promise(res => gltfLoader.load(url, g => res(g.scene), undefined, () => { console.warn('missing', url); res(null); }));
const loadTex = (url, srgb = true) => new Promise(res => texLoader.load(url, t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, () => { console.warn('missing', url); res(null); }));
const AUDIO_FILES = { music: 'assets/music.mp3', engine: 'assets/sfx_engine.mp3', cut: 'assets/sfx_cut.mp3', impact: 'assets/sfx_impact.mp3',
  whoosh: 'assets/sfx_whoosh.mp3', chime: 'assets/sfx_chime.mp3', bonk: 'assets/sfx_bonk.mp3', win: 'assets/sfx_win.mp3', hurt: 'assets/sfx_hurt.mp3' };
const audioData = {};

const A = {};
async function loadAll() {
  const glbs = { mower: 'mower', house: 'house', pine: 'pine', pine2: 'pine2', rock: 'rock', meteor: 'meteor', sign: 'sign', bush: 'bush', cloud: 'cloud' };
  const texs = { tall: 'tex_grass_tall.jpg', cut: 'tex_grass_cut.jpg', tuft: 'tuft_atlas.png', flowers: 'flowers_atlas.png', skyDay: 'sky_day.jpg',
    skySpace: 'sky_space.jpg', puff: 'fx_puff.png', dust: 'fx_dust.png', fire: 'fx_fire.png', ring: 'fx_ring.png', spark: 'fx_spark.png' };
  const jobs = [];
  for (const [k, f] of Object.entries(glbs)) jobs.push(loadGLB(`assets/${f}.glb`).then(s => A[k] = s));
  for (const [k, f] of Object.entries(texs)) jobs.push(loadTex(`assets/${f}`).then(t => A[k] = t));
  for (const [k, u] of Object.entries(AUDIO_FILES)) jobs.push(fetch(u).then(r => r.ok ? r.arrayBuffer() : null).then(b => { if (b) audioData[k] = b; }).catch(() => {}));
  await Promise.all(jobs);
  $('logo').onerror = () => { $('logo').style.display = 'none'; };
  $('clockIco').onerror = () => { $('clockIco').style.display = 'none'; };
  $('logo').src = 'assets/logo.webp';
  $('clockIco').src = 'assets/icon_clock.png';
  $('turboIco').onerror = () => { $('turboIco').style.display = 'none'; };
  $('turboIco').src = 'assets/icon_turbo.png';
}

// normalize a model: base at y=0, centred in xz, scaled so that `dim` (x|y|z|xz) equals `size`
function normalizeModel(src, size, dim = 'y') {
  const root = new THREE.Group();
  const m = src.clone(true);
  root.add(m);
  m.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const ref = dim === 'xz' ? Math.max(s.x, s.z) : s[dim];
  const k = size / ref;
  const p0 = m.position.clone();
  m.position.set((p0.x - c.x) * k, (p0.y - b.min.y) * k, (p0.z - c.z) * k);
  m.scale.multiplyScalar(k);
  root.userData.size = s.multiplyScalar(k);
  return root;
}
function prepMaterials(obj, opts = {}) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = opts.cast !== false; o.receiveShadow = opts.receive !== false;
    if (opts.cloneMat) o.material = o.material.clone();
    const m = o.material;
    if (m && m.isMeshStandardMaterial) {
      m.metalness = 0; m.roughness = opts.rough ?? 0.62; m.envMapIntensity = opts.env ?? 0.55;
      if (m.map) { m.map.anisotropy = 4; }
      if (opts.emissive) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.emissiveI ?? 0.2; if (m.map) m.emissiveMap = m.map; }
      if (opts.color) m.color.multiply(new THREE.Color(opts.color));
    }
  });
  return obj;
}

// ---------------------------------------------------------------------
//  Mowing mask (equirect render target). R = cut, G/B = mowing direction
// ---------------------------------------------------------------------
const mowRT = new THREE.WebGLRenderTarget(MOW_W, MOW_H, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping, wrapT: THREE.ClampToEdgeWrapping, depthBuffer: false, generateMipmaps: false });
const MAX_STAMPS = 16;
const brushMat = new THREE.ShaderMaterial({
  uniforms: { uStamp: { value: Array.from({ length: MAX_STAMPS }, () => new THREE.Vector4()) },
    uStampT: { value: Array.from({ length: MAX_STAMPS }, () => new THREE.Vector3()) }, uCount: { value: 0 }, uR: { value: R } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform vec4 uStamp[${MAX_STAMPS}]; uniform vec3 uStampT[${MAX_STAMPS}]; uniform int uCount; uniform float uR; varying vec2 vUv;
    void main(){
      float lon = (vUv.x - 0.5) * 6.2831853, lat = (vUv.y - 0.5) * 3.1415927;
      vec3 d = vec3(cos(lat) * sin(lon), sin(lat), cos(lat) * cos(lon));
      float a = 0.0; vec3 T = vec3(0.0);
      for (int i = 0; i < ${MAX_STAMPS}; i++) {

//  Main loop with adaptive resolution
// ---------------------------------------------------------------------
const clock = new THREE.Clock();

  composer.render(dt);
  frameAcc += rawDt; frameN++;

    if (avg > 1 / 38 && pixelRatio > 0.7) { pixelRatio = Math.max(0.7, pixelRatio - 0.15); onResize(); }
    else if (avg < 1 / 58 && pixelRatio < maxPR) { pixelRatio = Math.min(maxPR, pixelRatio + 0.1); onResize(); }
