<script id="world-src">
// ===== KITE RIDER : shared world generation (runs in main thread AND terrain worker) =====
var WORLD = (function () {
  'use strict';
  // ---------- seeded simplex noise ----------
  var perm = new Uint8Array(512);
  var GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
  var seed = 90210;
  function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
  var p = new Uint8Array(256), i;
  for (i = 0; i < 256; i++) p[i] = i;
  for (i = 255; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = p[i]; p[i] = p[j]; p[j] = t; }
  for (i = 0; i < 512; i++) perm[i] = p[i & 255];
  var F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  function N(xin, yin) {
    var s = (xin + yin) * F2;
    var ii = Math.floor(xin + s), jj = Math.floor(yin + s);
    var t = (ii + jj) * G2;
    var x0 = xin - (ii - t), y0 = yin - (jj - t);
    var i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
    var x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    var a = ii & 255, b = jj & 255, n = 0, tt, g;
    tt = 0.5 - x0 * x0 - y0 * y0; if (tt > 0) { g = perm[a + perm[b]] & 7; tt *= tt; n += tt * tt * (GX[g] * x0 + GY[g] * y0); }
    tt = 0.5 - x1 * x1 - y1 * y1; if (tt > 0) { g = perm[a + i1 + perm[b + j1]] & 7; tt *= tt; n += tt * tt * (GX[g] * x1 + GY[g] * y1); }
    tt = 0.5 - x2 * x2 - y2 * y2; if (tt > 0) { g = perm[a + 1 + perm[b + 1]] & 7; tt *= tt; n += tt * tt * (GX[g] * x2 + GY[g] * y2); }
    return 70 * n;
  }
  function hash(ix, iz, salt) {
    var h = (Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263) + Math.imul(salt | 0, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }
  function sm(a, b, x) { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }

  // ---------- terrain constants ----------
  var STEP = 7.4;     // terrace step height (m)
  var GEO_T = 0.3;   // how much of the terrace step is real geometry (the rest is shading)
  var RISER = 0.42;   // fraction of a step used by the riser

  // ---------- river / lakes (course follows -Z) ----------
  function riverX(z) { return 150 * Math.sin(z * 0.00185 + 0.6) + 62 * Math.sin(z * 0.0047 + 1.3) + 18 * Math.sin(z * 0.0119 + 0.4); }
  function riverDX(z) { return 150 * 0.00185 * Math.cos(z * 0.00185 + 0.6) + 62 * 0.0047 * Math.cos(z * 0.0047 + 1.3) + 18 * 0.0119 * Math.cos(z * 0.0119 + 0.4); }
  // lakes recur every ~3 km, first one ~1.4 km ahead of the start
  function lakeAmt(z) { var t = 0.5 + 0.5 * Math.sin(z * 0.0021 + 4.25); return sm(0.62, 0.93, t); }
  function halfW(z) { return 16 + 6 * N(z * 0.004, 3.3) + lakeAmt(z) * 82; }

  // ---------- hills: field of rounded mounds (concentric rice terraces) + far massifs ----------
  var MC = 205;
  var MD = { d: 1 };
  function smax(a, b, k) { var h = k - Math.abs(a - b); h = h > 0 ? h / k : 0; return Math.max(a, b) + h * h * k * 0.25; }
  function hills(x, z) {
    var wx = x + 26 * N(x * 0.0058, z * 0.0058) + 9 * N(x * 0.019 - 5.1, z * 0.019 + 2.7), wz = z + 26 * N(x * 0.0058 + 13.3, z * 0.0058 - 7.9) + 9 * N(x * 0.019 + 8.4, z * 0.019 - 6.6);
    var cx = Math.floor(wx / MC), cz = Math.floor(wz / MC);
    var acc = 0, bestD = 1, bestH = 0;
    for (var j = -1; j <= 1; j++) for (var i = -1; i <= 1; i++) {
      var gx = cx + i, gz = cz + j;
      if (hash(gx, gz, 7) > 0.9) continue;
      var px = (gx + 0.18 + 0.64 * hash(gx, gz, 8)) * MC, pz = (gz + 0.18 + 0.64 * hash(gx, gz, 9)) * MC;
      var r = 95 + 80 * hash(gx, gz, 10);
      var hg = Math.min(20 + 72 * Math.pow(hash(gx, gz, 11), 1.15), 0.48 * r);
      var dx = wx - px, dz = wz - pz;
      var d = Math.sqrt(dx * dx + dz * dz) / r;
      if (d >= 1) continue;
      var prof = (1 - d) * (1 - d) * (1 + 2 * d);
      var hh = hg * prof;
      if (hh > bestH) { bestH = hh; bestD = d; }
      acc = smax(acc, hh, 14);
    }
    MD.d = bestD;
    var base = 3 + 7 * (N(x * 0.0021 + 1.7, z * 0.0021 - 4.2) * 0.5 + 0.5);
    var m = N(x * 0.00062 + 11.1, z * 0.00062 - 3.3) * 0.5 + 0.5;
    var massif = sm(0.5, 0.97, m) * 165 * (0.75 + 0.25 * N(x * 0.003, z * 0.003));
    return base + smax(acc, massif, 30);
  }

  var S = { h: 0, ta: 0, d: 0, hw: 0, ht: 0, la: 0, rx: 0, cap: 0 };
  function terr(h, ta) {
    if (ta <= 0.001) return h;
    var s = h / STEP, fl = Math.floor(s), f = s - fl;
    var u = (f - (1 - RISER)) / RISER; u = u < 0 ? 0 : u > 1 ? 1 : u; u = u * u * (3 - 2 * u);
    return h + ((fl + u) * STEP - h) * ta;
  }
  function sample(x, z) {
    var rx = riverX(z), dx = riverDX(z);
    var d = Math.abs(x - rx) / Math.sqrt(1 + dx * dx);
    var la = lakeAmt(z);
    var hw = halfW(z);
    var H = hills(x, z);
    var bankT = sm(hw - 4, hw + 5, d);
    var riseT = sm(hw + 8, hw + 120 + 60 * la, d);
    var bed = -0.7 - 3.2 * (1 - sm(hw * 0.3, hw, d));
    var meadow = 1.3 + 0.9 * N(x * 0.021, z * 0.021) + 2.0 * sm(hw + 3, hw + 40, d);
    var h = bed * (1 - bankT) + (meadow + H * riseT) * bankT;
    var mask = sm(-0.55, -0.2, N(x * 0.0023 + 3.1, z * 0.0023 + 8.2));
    var cap = 1 - sm(0.1, 0.2, MD.d);
    var ta = sm(hw + 14, hw + 40, d) * sm(5, 11, h) * mask * (1 - cap) * (1 - sm(150, 205, h));
    S.cap = cap;
    S.h = h; S.ta = ta; S.d = d; S.hw = hw; S.la = la; S.rx = rx; S.ht = terr(h, ta * GEO_T);
    return S;
  }
  function heightAt(x, z) { return sample(x, z).ht; }
  function groundAt(x, z) { var s = sample(x, z); return s.ht > 0 ? s.ht : 0; }

  // ---------- terrain chunk mesh (local coords relative to x0,z0) ----------
  function buildChunk(x0, z0, size, cells, skirtDepth, geoT) {
    if (geoT === undefined) geoT = GEO_T;
    var n = cells + 1, step = size / cells, nb = n + 2;
    var H = new Float32Array(nb * nb), HT = new Float32Array(nb * nb), TA = new Float32Array(nb * nb);
    var a, b, k;
    for (b = 0; b < nb; b++) for (a = 0; a < nb; a++) {
      var s = sample(x0 + (a - 1) * step, z0 + (b - 1) * step);
      k = b * nb + a; H[k] = s.h; HT[k] = geoT === GEO_T ? s.ht : terr(s.h, s.ta * geoT); TA[k] = s.ta;
    }
    var vcount = n * n + 4 * n;
    var pos = new Float32Array(vcount * 3), nor = new Float32Array(vcount * 3), raw = new Float32Array(vcount * 4);
    var v = 0;
    for (b = 0; b < n; b++) for (a = 0; a < n; a++) {
      k = (b + 1) * nb + (a + 1);
      pos[v * 3] = a * step; pos[v * 3 + 1] = HT[k]; pos[v * 3 + 2] = b * step;
      var nx = HT[k - 1] - HT[k + 1], ny = 2 * step, nz = HT[k - nb] - HT[k + nb];
      var l = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nor[v * 3] = nx / l; nor[v * 3 + 1] = ny / l; nor[v * 3 + 2] = nz / l;
      raw[v * 4] = H[k]; raw[v * 4 + 1] = (H[k + 1] - H[k - 1]) / (2 * step); raw[v * 4 + 2] = (H[k + nb] - H[k - nb]) / (2 * step); raw[v * 4 + 3] = TA[k];
      v++;
    }
    // skirt vertices: copies of the 4 borders, pushed down
    var edges = [];
    for (a = 0; a < n; a++) edges.push(a);                    // z = 0 row
    for (a = 0; a < n; a++) edges.push((n - 1) * n + a);      // z = max row
    for (b = 0; b < n; b++) edges.push(b * n);                // x = 0 col
    for (b = 0; b < n; b++) edges.push(b * n + n - 1);        // x = max col
    for (var e = 0; e < edges.length; e++) {
      var src = edges[e];
      pos[v * 3] = pos[src * 3]; pos[v * 3 + 1] = pos[src * 3 + 1] - skirtDepth; pos[v * 3 + 2] = pos[src * 3 + 2];
      nor[v * 3] = nor[src * 3]; nor[v * 3 + 1] = nor[src * 3 + 1]; nor[v * 3 + 2] = nor[src * 3 + 2];
      raw[v * 4] = raw[src * 4]; raw[v * 4 + 1] = raw[src * 4 + 1]; raw[v * 4 + 2] = raw[src * 4 + 2]; raw[v * 4 + 3] = raw[src * 4 + 3];
      v++;
    }
    var tri = cells * cells * 2 + 4 * cells * 2;
    var idx = vcount > 65535 ? new Uint32Array(tri * 3) : new Uint16Array(tri * 3);
    var q = 0;
    for (b = 0; b < cells; b++) for (a = 0; a < cells; a++) {
      var i0 = b * n + a, i1 = i0 + 1, i2 = i0 + n, i3 = i2 + 1;
      // alternate diagonal for nicer shading
      if ((a + b) & 1) { idx[q++] = i0; idx[q++] = i2; idx[q++] = i1; idx[q++] = i1; idx[q++] = i2; idx[q++] = i3; }
      else { idx[q++] = i0; idx[q++] = i2; idx[q++] = i3; idx[q++] = i0; idx[q++] = i3; idx[q++] = i1; }
    }
    var base = n * n;
    // row z=0 (normal facing -z): skirt below, winding so outside is visible
    for (a = 0; a < cells; a++) { var t0 = a, t1 = a + 1, s0 = base + a, s1 = base + a + 1; idx[q++] = t0; idx[q++] = t1; idx[q++] = s0; idx[q++] = t1; idx[q++] = s1; idx[q++] = s0; }
    for (a = 0; a < cells; a++) { var u0 = (n - 1) * n + a, u1 = u0 + 1, w0 = base + n + a, w1 = w0 + 1; idx[q++] = u0; idx[q++] = w0; idx[q++] = u1; idx[q++] = u1; idx[q++] = w0; idx[q++] = w1; }
    for (b = 0; b < cells; b++) { var c0 = b * n, c1 = (b + 1) * n, d0 = base + 2 * n + b, d1 = d0 + 1; idx[q++] = c0; idx[q++] = d0; idx[q++] = c1; idx[q++] = c1; idx[q++] = d0; idx[q++] = d1; }
    for (b = 0; b < cells; b++) { var e0 = b * n + n - 1, e1 = (b + 1) * n + n - 1, f0 = base + 3 * n + b, f1 = f0 + 1; idx[q++] = e0; idx[q++] = e1; idx[q++] = f0; idx[q++] = e1; idx[q++] = f1; idx[q++] = f0; }
    return { pos: pos, nor: nor, raw: raw, idx: idx };
  }

  // ---------- vegetation / houses for a chunk ----------
  // returns flat array [type, x, y, z, scale, rot, ...]; types: 0 pine, 1 round tree, 2 bush, 3 house
  function chunkProps(x0, z0, size, cell) {
    var out = [];
    var c0x = Math.floor(x0 / cell) - 1, c0z = Math.floor(z0 / cell) - 1;
    var c1x = Math.floor((x0 + size) / cell) + 1, c1z = Math.floor((z0 + size) / cell) + 1;
    for (var cz = c0z; cz <= c1z; cz++) for (var cx = c0x; cx <= c1x; cx++) {
      var x = (cx + 0.1 + 0.8 * hash(cx, cz, 1)) * cell, z = (cz + 0.1 + 0.8 * hash(cx, cz, 2)) * cell;
      if (x < x0 || x >= x0 + size || z < z0 || z >= z0 + size) continue;
      var s = sample(x, z);
      if (s.ht < 0.9) continue;
      var forest = sm(0.0, 0.5, N(x * 0.0042 + 20.0, z * 0.0042 - 7.0));
      var dens;
      if (s.ta > 0.45) {
        var f = s.h / STEP - Math.floor(s.h / STEP);
        dens = f > 1 - RISER * 0.85 ? 0.10 + 0.12 * forest : 0.012;
      } else {
        dens = 0.10 + forest * 0.55;
      }
      if (s.cap > 0.5) dens *= 0.5;
      var bank = sm(s.hw + 2, s.hw + 7, s.d) * (1 - sm(s.hw + 22, s.hw + 50, s.d));
      dens += bank * 0.32;
      if (s.ht > 230) dens *= 0.4;
      var r = hash(cx, cz, 3);

let lastScoreShown = -1;

  $('combo').textContent = G.combo > 1 ? 'combo x' + G.combo : '';

function render() {
  const P = player;
  // ---- 1. reflection pass (mirror camera under the water plane)
  reflCam.fov = camera.fov; reflCam.aspect = camera.aspect; reflCam.near = camera.near; reflCam.far = camera.far;
  reflCam.projectionMatrix.copy(camera.projectionMatrix);

  points.visible = false; streakLines.visible = false; trails[0].mesh.visible = trails[1].mesh.visible = false;
  renderer.shadowMap.autoUpdate = false;
  renderer.clippingPlanes = [clipPlane];
  mtnMat.uniforms.uClipY.value = -0.05;
  renderer.setRenderTarget(reflRT);
  renderer.render(scene, reflCam);
  renderer.clippingPlanes = [];
  mtnMat.uniforms.uClipY.value = -1e9;
  points.visible = true; streakLines.visible = true; trails[0].mesh.visible = trails[1].mesh.visible = true;

  U.uProjInv.value.copy(camera.projectionMatrixInverse);
  U.uCamWorld.value.copy(camera.matrixWorld);
  U.uCamPos.value.copy(camera.position);
  U.uCamFwd.value.set(0, 0, -1).applyQuaternion(camera.quaternion);

  U.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

  U.uKiteShadow.value.set(P.pos.x - SUN_DIR.x * ks, P.pos.z - SUN_DIR.z * ks, -P.yaw, KITE_SPAN * 0.55);
  U.uKiteShadowK.value = clamp(1 - P.pos.y / 26, 0, 1) * (kiteBody.visible ? 1 : 0);
  renderer.setRenderTarget(compRT);

  renderer.render(scene, camera);
  renderer.autoClear = true;

  F.tComp.value = compRT.texture; F.uFlash.value = flash; F.uTime.value = uTimeNow; F.uBoost.value = P.boosting;

    loadTex('assets/tex_rice.jpg'), loadTex('assets/tex_grass.jpg'), loadTex('assets/tex_earth.jpg'), loadTex('assets/tex_water.jpg', { srgb: false }),
