<script type="module">
window.EGPad.getState=()=>{try{return G.state}catch{return "loading"}};
window.EGPad.resume=()=>{try{if(G.paused)setPause(false)}catch{}};
window.EGPad.isPaused=()=>{try{return !!G.paused}catch{return false}};

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

// ============================================================================
// Utilities
// ============================================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const QS = new URLSearchParams(location.search);
const DEMO = QS.get('demo') === '1';
const SEED = +(QS.get('seed') || 7);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion();

// Terrain height of the canyon trail (analytic so shaders can use it for the canyon mist).
const H_GLSL = 'float trailH(float x){ return 3.4*sin(x*0.024+0.4) + 2.1*sin(x*0.051+1.1) + 0.8*sin(x*0.12+2.0); }';
const trailH = (x) => 3.4 * Math.sin(x * 0.024 + 0.4) + 2.1 * Math.sin(x * 0.051 + 1.1) + 0.8 * Math.sin(x * 0.12 + 2.0);
const trailSlope = (x) => (trailH(x + 0.6) - trailH(x - 0.6)) / 1.2;

// ============================================================================
// Global fog patch: exponential aerial perspective + a pale mist filling the canyon a few units under the trail.
// ============================================================================
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
  varying float vFogDepth; varying vec2 vFogWXY;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vFogDepth = - mvPosition.z;
  vec4 fogWP = vec4( transformed, 1.0 );
  #ifdef USE_INSTANCING
    fogWP = instanceMatrix * fogWP;
  #endif
  fogWP = modelMatrix * fogWP;
  vFogWXY = fogWP.xy;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
  uniform vec3 fogColor; varying float vFogDepth; varying vec2 vFogWXY;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear; uniform float fogFar;
  #endif
  ${H_GLSL}
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
  #else
    // aerial perspective: exponential from fogNear, reaching the haze colour at fogFar
    float fogT = max( vFogDepth - fogNear, 0.0 ) / ( fogFar - fogNear );
    float fogFactor = clamp( ( 1.0 - exp( -2.0 * fogT ) ) / 0.865, 0.0, 1.0 );
  #endif
  // valley haze: the distance gets milkier toward the canyon floor
  fogFactor = max( fogFactor, fogFactor * 1.6 * clamp( ( trailH(vFogWXY.x) + 2.0 - vFogWXY.y ) / 30.0, 0.0, 1.0 ) );
  float mistTop = trailH(vFogWXY.x) - 4.2;
  float mist = clamp((mistTop - vFogWXY.y) / 9.0, 0.0, 1.0);
  mist = mist * (2.0 - mist) * 0.92;
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor * vec3(0.94, 0.92, 0.87), mist );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, clamp( fogFactor, 0.0, 1.0 ) );
#endif`;

// ============================================================================
// Renderer / scene / camera
// ============================================================================
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // tone mapping + colour grade happen in the final STYLE pass
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

// Palette taken from the source video: pale neutral sky, grey-ochre haze, ochre grass, olive-charcoal rock, lemon-gold birches.
const FOG_COL = new THREE.Color(0xd6c9ad);
const HAZE_FAR = new THREE.Color(0xd9d7cd);   // neutral far haze for the sky horizon and the mountain ranges
const scene = new THREE.Scene();
scene.background = FOG_COL.clone();
scene.fog = new THREE.Fog(FOG_COL, 46, 600);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.3, 1600);
window.EGMobileView(renderer,camera);

camera.position.set(0, 4, 30);

// soft overcast-ish key: cool pale sky fill, ochre bounce from the grass, a high warm sun from the upper left
const hemi = new THREE.HemisphereLight(0xdedbd0, 0x6e5230, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b4, 4.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -42; sun.shadow.camera.right = 42; sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 170;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
sun.shadow.radius = 3;
scene.add(sun); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0xffcf7a, 1.4);   // warm back light: glowing edges like the video
scene.add(rim); scene.add(rim.target);

// ============================================================================
// STYLE: post-processing chain (EffectComposer, three addons)
//   scene -> MSAA HDR target with depth
//   -> depth of field (foreground strongly out of focus, background softly, the flight plane sharp)
//   -> bloom (wide, low) -> final grade: AgX tone mapping, custom colour grade matched to the video,
//      soft halation, vignette, edge chromatic aberration, paper grain
// ============================================================================
const STYLE = {
  focusBand: 6.5,      // world units around the focus distance that stay perfectly sharp
  fg: 1.15, bg: 0.32,  // circle-of-confusion gains (foreground / background)
  maxR: 14,            // max blur radius in pixels at 1080p
};
const sceneRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
sceneRT.depthTexture = new THREE.DepthTexture(1, 1, THREE.UnsignedIntType);
class ScenePass extends Pass {
  constructor() { super(); this.needsSwap = false; }
  render(r) { r.setRenderTarget(sceneRT); r.clear(); r.render(scene, camera); }
}
class FSPass extends Pass {
  // full-screen shader pass; `input` lets a pass read another target than the composer's read buffer
  constructor(shader, input = null) {
    super(); this.material = new THREE.ShaderMaterial(shader); this.uniforms = this.material.uniforms;
    this.fsq = new FullScreenQuad(this.material); this.input = input;
  }
  render(r, writeBuffer, readBuffer) {
    if (this.uniforms.tDiffuse) this.uniforms.tDiffuse.value = this.input ? this.input() : readBuffer.texture;
    r.setRenderTarget(this.renderToScreen ? null : writeBuffer); this.fsq.render(r);
  }
}
const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

// painterly filter: Kuwahara (4 sectors) - flattens texture noise into soft painted patches, keeps edges crisp
const paintPass = new FSPass({
  uniforms: { tDiffuse: { value: null }, uPx: { value: new THREE.Vector2() }, uMix: { value: 0.85 } },
  vertexShader: FS_VERT,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uPx; uniform float uMix; varying vec2 vUv;
    void main(){
      vec3 m[4]; vec3 s[4];
      for (int k = 0; k < 4; k++) { m[k] = vec3(0.0); s[k] = vec3(0.0); }
      // 5x5 bilinear taps 1.5 px apart: a 7 px footprint for 25 fetches
      for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++) {
        vec3 c = texture2D(tDiffuse, vUv + vec2(float(i), float(j)) * uPx * 1.5).rgb;
        c = c / (1.0 + c);   // compress HDR so a few hot pixels do not dominate the variance
        vec3 c2 = c * c;
        if (i <= 0 && j <= 0) { m[0] += c; s[0] += c2; }
        if (i >= 0 && j <= 0) { m[1] += c; s[1] += c2; }
        if (i <= 0 && j >= 0) { m[2] += c; s[2] += c2; }
        if (i >= 0 && j >= 0) { m[3] += c; s[3] += c2; }
      }
      float best = 1e9; vec3 outc = vec3(0.0);
      for (int k = 0; k < 4; k++) {
        vec3 mu = m[k] / 9.0; vec3 v = abs(s[k] / 9.0 - mu * mu);
        float sv = v.r + v.g + v.b;
        if (sv < best) { best = sv; outc = mu; }
      }
      outc = outc / max(vec3(1e-4), 1.0 - outc);
      vec3 orig = texture2D(tDiffuse, vUv).rgb;
      gl_FragColor = vec4(mix(orig, outc, uMix), 1.0);
    }`,
}, () => sceneRT.texture);

// depth of field at half resolution: (1) colour + signed circle of confusion, (2) scatter-as-gather bokeh
// on a golden-angle spiral, (3) full-res composite (sharp where in focus, blurred where the CoC or a blurred
// foreground covers the pixel). Foreground strongly out of focus, background softly, the flight plane sharp.
const DOF_COMMON = `uniform sampler2D tDepth; uniform float uNear, uFar, uFocus, uBand, uFg, uBg, uMaxR;
  float linZ(vec2 uv){ float z = texture2D(tDepth, uv).x * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
  float cocS(float z){   // signed: < 0 in front of the focus band, > 0 behind; in half-res pixels
    float dz = z - uFocus;
    return dz < 0.0 ? -clamp(max(0.0, -dz - uBand * 0.5) / z * uFg, 0.0, 1.0) * uMaxR : clamp(max(0.0, dz - uBand) / z * uBg, 0.0, 1.0) * uMaxR;
  }`;
class DofPass extends Pass {
  constructor() {
    super();
    const U = this.uniforms = { tDepth: { value: sceneRT.depthTexture }, uNear: { value: camera.near }, uFar: { value: camera.far }, uFocus: { value: 24 },
      uBand: { value: STYLE.focusBand }, uFg: { value: STYLE.fg }, uBg: { value: STYLE.bg }, uMaxR: { value: STYLE.maxR * 0.5 }, uStep: { value: 0.5 },
      uPxHalf: { value: new THREE.Vector2() }, tColor: { value: null }, tIn: { value: null }, tBlur: { value: null } };
    const rtOpt = { type: THREE.HalfFloatType, depthBuffer: false };
    this.rtA = new THREE.WebGLRenderTarget(1, 1, rtOpt); this.rtB = new THREE.WebGLRenderTarget(1, 1, rtOpt);
    const mk = (fs) => new FullScreenQuad(new THREE.ShaderMaterial({ uniforms: U, vertexShader: FS_VERT, fragmentShader: fs, depthTest: false, depthWrite: false }));
    this.prep = mk(`${DOF_COMMON} uniform sampler2D tColor; varying vec2 vUv;
      void main(){ gl_FragColor = vec4(texture2D(tColor, vUv).rgb, cocS(linZ(vUv))); }`);
    this.gather = mk(`uniform sampler2D tIn; uniform vec2 uPxHalf; uniform float uMaxR, uStep; varying vec2 vUv;
      void main(){
        vec4 c0 = texture2D(tIn, vUv); float cz = c0.a, cs = abs(cz);
        vec3 col = c0.rgb; float cov = cs, tot = 1.0, rad = uStep;
        for (int i = 0; i < 64; i++) {
          if (rad >= uMaxR) break;
          float ang = float(i) * 2.39996323;
          vec4 sm = texture2D(tIn, vUv + vec2(cos(ang), sin(ang)) * uPxHalf * rad);
          float ss = abs(sm.a);
          if (sm.a > cz) ss = clamp(ss, 0.0, cs * 2.0);
          float m = smoothstep(rad - 0.5, rad + 0.5, ss);
          col += mix(col / tot, sm.rgb, m); cov += mix(cov / tot, ss, m); tot += 1.0; rad += uStep / rad;
        }
        gl_FragColor = vec4(col / tot, cov / tot);
      }`);
    this.comp = mk(`${DOF_COMMON} uniform sampler2D tColor, tBlur; varying vec2 vUv;
      void main(){
        vec3 sharp = texture2D(tColor, vUv).rgb; vec4 b = texture2D(tBlur, vUv);
        float k = smoothstep(0.3, 1.1, max(abs(cocS(linZ(vUv))), b.a));
        gl_FragColor = vec4(mix(sharp, b.rgb, k), 1.0);
      }`);
  }
  setSize(w, h) {
    const hw = Math.max(1, Math.ceil(w / 2)), hh = Math.max(1, Math.ceil(h / 2)), sc = Math.max(1, h / 1080);
    this.rtA.setSize(hw, hh); this.rtB.setSize(hw, hh);
    this.uniforms.uPxHalf.value.set(1 / hw, 1 / hh);
    this.uniforms.uMaxR.value = STYLE.maxR * 0.5 * sc;
    this.uniforms.uStep.value = 0.5 * sc * sc;   // same sample count at any size
  }
  render(r, writeBuffer, readBuffer) {
    const U = this.uniforms;
    U.tColor.value = readBuffer.texture; r.setRenderTarget(this.rtA); this.prep.render(r);
    U.tIn.value = this.rtA.texture; r.setRenderTarget(this.rtB); this.gather.render(r);
    U.tBlur.value = this.rtB.texture; r.setRenderTarget(this.renderToScreen ? null : writeBuffer); this.comp.render(r);
  }
}
const dofPass = new DofPass();

const gradePass = new FSPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uFlash: { value: 0 }, uSunset: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },

  A.trunkGeo = new THREE.CylinderGeometry(0.42, 0.55, 1, 9, 4).translate(0, 0.5, 0);
  analyzeModels();
  makeMaterials();
  buildCourse(SEED);
  buildWorld();
  buildSky(); buildSunset();
  girl = new Girl(); dragon = new Dragon();
  leaves = new LeafField(); lanterns = new LanternSet();
  sparks = new Sparks(700);
  scraps = new Flutter(A.scrap0, 60, 0.55, { color: 0xffffff });
  fallLeaves = [new Flutter(A.leaf1, 36, 0.42, { ambient: true, color: 0xfff0c0 }), new Flutter(A.leaf2, 36, 0.38, { ambient: true, color: 0xffe0a0 }), new Flutter(A.leaf3, 30, 0.45, { ambient: true, color: 0xffd890 })];
  showTitle();
  // warm up: compile shaders before the first visible frame
  updateCamera(1); visualTick(0.016); renderer.compile(scene, camera);
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 900);
  if (DEMO) newGame();
  last = performance.now(); requestAnimationFrame(frame);
  document.title = 'Paper Dragon';
  window.__pd.ready = true;
}

// test hooks (used by the automated play-through)
window.__pd = {
  ready: false, G, COURSE, get girl() { return girl; }, get dragon() { return dragon; },
  start() { newGame(); }, title() { showTitle(); }, auto(on) { G.auto = on; },
  sim(seconds, fps = 60) { SIM = true; const dt = 1 / fps; for (let i = 0; i < seconds * fps; i++) { step(dt); } document.querySelectorAll('.pop').forEach((e) => e.remove()); render(); return { state: G.state, x: +girl.x.toFixed(1), dx: +dragon.x.toFixed(1), leaves: G.leaves, total: COURSE.total, hits: G.hits, health: G.health, score: G.score, mode: girl.mode }; },
  validate() {
    // fly the guide path and report any obstacle it touches (level sanity check)
    const bad = []; const g0 = COURSE.guideX[0], g1 = COURSE.guideX[COURSE.guideX.length - 1];
    for (let x = START_X; x < GATE_X + 10; x += 0.25) { const y = guideAt(x); for (const o of COURSE.obstacles) { if (Math.abs(o.x - x) > 20) continue; if (hitTest(o, x, y, 0.62)) { bad.push([+x.toFixed(1), o.type, o.kind || '', +y.toFixed(2)]); break; } } }
    const lo = []; for (let x = START_X; x < GATE_X; x += 1) { const y = guideAt(x), H = trailH(x); if (y < H - 5.6 || y > H + 13) lo.push([x, +(y - H).toFixed(1)]); }
    const arches = COURSE.obstacles.filter((o) => o.type === 'arch').map((o) => { let multi = 0, maxN = 0; for (const l of o.slice.iv.values()) { if (l.length > 1) multi++; maxN = Math.max(maxN, l.length); } return [+o.x.toFixed(0), o.kind, +(o.under - o.minUnder).toFixed(2), multi, maxN, +(o.x1 - o.x0).toFixed(1)]; });
    return { arches, bad: bad.slice(0, 40), nbad: bad.length, outOfLane: lo.slice(0, 20), leaves: COURSE.total, obstacles: COURSE.obstacles.length };
  },
  resume() { SIM = false; last = performance.now(); },
  simTo(x, maxSec = 200, fps = 60) { SIM = true; const dt = 1 / fps; let n = 0; while (dragon.x < x && n < maxSec * fps && (G.state === 'play' || G.state === 'won')) { step(dt); n++; } document.querySelectorAll('.pop').forEach((e) => e.remove()); render(); return { state: G.state, x: +girl.x.toFixed(1), dx: +dragon.x.toFixed(1), leaves: G.leaves, hits: G.hits, health: G.health, mode: girl.mode }; },
  obstacles() { return COURSE.obstacles.map((o) => [o.type, o.kind || '', +o.x.toFixed(1), +(o.x0 ?? 0).toFixed(1), +(o.x1 ?? 0).toFixed(1)]); },
  hold(code, on) { keys[code] = on; },
  debug: { scene, camera, world, get sky() { return SKY; }, A, AU, renderer, composer, STYLE, passes: { paintPass, dofPass, bloom, gradePass } },
};
boot().catch((e) => { console.error(e); $('loading').querySelector('.lbl').textContent = 'LOADING FAILED'; });

</script>
