<!doctype html>
<html lang="eu">
<head>
<!-- Original © 2026 Lovis Odin, MIT. Euskaraz Games localization. -->
<script src="/mundu-jolastuak/euskara.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Harea-erlojua · Euskaraz Games</title>
<meta name="description" content="A tiny wanderer climbs the dunes inside a giant hourglass. WebGL game, every asset generated with fal.">
<style>
  :root {
    --ink: #2c3638;
    --ink-soft: rgba(44, 54, 56, 0.62);
    --gold: #c99a3e;
    --paper: #efe7d6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #d9d2bf;
    font-family: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #ddd5c2; z-index: 30; transition: opacity 1.2s ease;
  }
  #loading .bar { width: min(260px, 60vw); height: 2px; background: rgba(44,54,56,0.15); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: var(--gold); transition: width .25s ease; }
  #loading p { margin: 14px 0 0; letter-spacing: .4em; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; }

  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: 6vh 16px 6vh; pointer-events: none; z-index: 10;
    transition: opacity 1.4s ease;
  }
  #title img { width: min(560px, 74vw); height: auto; filter: drop-shadow(0 2px 14px rgba(255,248,230,.55)); }
  #title .bottom { text-align: center; }
  #title .press { font-size: clamp(15px, 2vw, 20px); letter-spacing: .34em; text-transform: uppercase; color: var(--ink); animation: breathe 2.8s ease-in-out infinite; text-shadow: 0 0 14px rgba(255,248,230,.9); }
  #title .keys { margin-top: 12px; font-size: clamp(13px, 1.5vw, 16px); letter-spacing: .06em; color: var(--ink); opacity: .8; font-style: italic; text-shadow: 0 0 12px rgba(255,248,230,.95); }
  @keyframes breathe { 0%,100% { opacity: .35 } 50% { opacity: .95 } }

  #hud { position: fixed; top: 14px; right: 18px; z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 9px; opacity: 0; transition: opacity 1s ease; pointer-events: none; padding: 12px 14px; border-radius: 40px; background: radial-gradient(closest-side, rgba(246,238,220,.85), rgba(246,238,220,.55) 60%, rgba(246,238,220,0)); }
  #hud svg { width: 26px; height: 40px; overflow: visible; filter: drop-shadow(0 0 6px rgba(255,248,230,.8)); }
  #hud .cyc { display: flex; gap: 6px; }
  #hud .cyc i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-soft); display: block; transition: all .6s ease; }
  #hud .cyc i.on { background: #f3d58a; border-color: var(--gold); box-shadow: 0 0 8px rgba(240,200,110,.95); }

  #hint {
    position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); z-index: 8; text-align: center;
    font-size: clamp(14px, 1.7vw, 19px); font-style: italic; letter-spacing: .06em; color: var(--ink);
    text-shadow: 0 0 12px rgba(255,248,230,.95), 0 0 3px rgba(255,248,230,.9); opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
    width: auto; max-width: min(92vw, 760px); padding: 10px 28px; border-radius: 30px;
    background: radial-gradient(closest-side, rgba(246,238,220,.82), rgba(246,238,220,.5) 70%, rgba(246,238,220,0));
  }

  #fade { position: fixed; inset: 0; background: #fbf3e1; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 1.4s ease; }

  #end {
    position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    opacity: 0; pointer-events: none; transition: opacity 2.2s ease; text-align: center; padding: 5vh 16px 6vh;
    background: linear-gradient(rgba(246,238,220,.55), rgba(246,238,220,0) 26%, rgba(246,238,220,0) 70%, rgba(246,238,220,.6));
  }
  #end img { width: min(460px, 66vw); filter: drop-shadow(0 2px 14px rgba(255,248,230,.6)); }
  #end .line { margin-top: 0; font-size: clamp(17px, 2.1vw, 23px); font-style: italic; letter-spacing: .1em; color: var(--ink); text-shadow: 0 0 14px rgba(255,248,230,.95); }
  #end .stats { margin-top: 12px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); opacity: .75; text-shadow: 0 0 10px rgba(255,248,230,.95); }
  #end .press { margin-top: 30px; font-size: 14px; letter-spacing: .32em; text-transform: uppercase; animation: breathe 2.8s ease-in-out infinite; text-shadow: 0 0 10px rgba(255,248,230,.95); }

  #err { position: fixed; left: 12px; bottom: 12px; z-index: 40; color: #7a2b1b; font: 12px/1.4 monospace; white-space: pre-wrap; max-width: 90vw; pointer-events: none; }
</style>
</head>
<body>
<div id="loading"><div class="bar"><i></i></div><p>gathering sand</p></div>

<div id="title" style="opacity:0">
  <img src="assets/title.webp" alt="Hourglass">
  <div class="bottom">
    <div class="press">press space</div>
    <div class="keys">&larr; &rarr; walk &nbsp;&middot;&nbsp; space jump &nbsp;&middot;&nbsp; hold &darr; to call the sand</div>
  </div>
</div>

<div id="hud">
  <svg viewBox="0 0 26 40" aria-hidden="true">
    <defs>
      <clipPath id="topBulb"><path d="M3 2 H23 C23 12 15 16 13.6 20 H12.4 C11 16 3 12 3 2 Z"/></clipPath>
      <clipPath id="botBulb"><path d="M12.4 20 H13.6 C15 24 23 28 23 38 H3 C3 28 11 24 12.4 20 Z"/></clipPath>
    </defs>
    <rect id="sandTop" x="0" y="2" width="26" height="18" fill="#c99a3e" clip-path="url(#topBulb)"/>
    <rect id="sandBot" x="0" y="38" width="26" height="0" fill="#c99a3e" clip-path="url(#botBulb)"/>
    <rect id="sandStream" x="12.6" y="20" width="0.8" height="18" fill="#c99a3e"/>
    <path d="M3 2 H23 C23 12 15 16 13.6 20 C15 24 23 28 23 38 H3 C3 28 11 24 12.4 20 C11 16 3 12 3 2 Z" fill="none" stroke="#2c3638" stroke-opacity=".7" stroke-width="1"/>
    <line x1="1" y1="1.5" x2="25" y2="1.5" stroke="#2c3638" stroke-opacity=".7" stroke-width="1.4"/>
    <line x1="1" y1="38.5" x2="25" y2="38.5" stroke="#2c3638" stroke-opacity=".7" stroke-width="1.4"/>
  </svg>
  <div class="cyc"><i></i><i></i><i></i></div>
</div>

<div id="hint"></div>
<div id="fade"></div>

<div id="end">
  <img src="assets/title.webp" alt="Hourglass">
  <div class="bottom">
    <div class="line">she climbed the falling time</div>
    <div class="stats"></div>
    <div class="press">press space</div>
  </div>
</div>

<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="game.js"></script>
<script src="../brand/gamepad.js"></script>
</body>
</html>
