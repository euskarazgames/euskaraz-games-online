<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================================
//  helpers
// ============================================================================
const QS = new URLSearchParams(location.search);
const AUTOPLAY = QS.has('autoplay');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const $ = s => document.querySelector(s);

// ============================================================================
//  world layout
// ============================================================================
const LEN = 720;                  // height of the library (metres)
const BELL_Y = [180, 360, 540];   // chapter bells
const CHUNK = 30;
const DIST = 10.6;                // camera distance to the flight plane
const TILT = -1.0;                // rider roll that shows the open book to the camera
const C0 = 4.2 * Math.sin(0.4) + 2.0 * Math.sin(2.1) + 0.7 * Math.sin(0.7);
function cxAt(y) { return 4.2 * Math.sin(y * 0.0145 + 0.4) + 2.0 * Math.sin(y * 0.037 + 2.1) + 0.7 * Math.sin(y * 0.083 + 0.7) - C0; }
function hwAt(y) { let w = lerp(4.3, 3.45, clamp(y / LEN, 0, 1)); if (y < 16) w += (16 - y) * 0.08; return w; }
function rollAt(y) { return lerp(0.98, 0.76, smooth(0, LEN * 0.8, y)) * (1 - smooth(LEN - 22, LEN + 22, y)); }

const PAL = [
  { y: -100, fog: '#dccaa6', bg: '#f0e6c6', sky: '#fbf0d4', gnd: '#6a4733', key: '#fff2da' },
  { y: 180,  fog: '#ddc8a0', bg: '#f1e2bf', sky: '#fcebc8', gnd: '#6b4330', key: '#ffe8c4' },
  { y: 360,  fog: '#dcc4aa', bg: '#f0dcc8', sky: '#fbe3d2', gnd: '#664036', key: '#ffe0cc' },
  { y: 540,  fog: '#dfcfa8', bg: '#f4e8c8', sky: '#fff2d2', gnd: '#6c4a33', key: '#fff0d2' },
  { y: 760,  fog: '#f4ecd6', bg: '#fbf5e0', sky: '#fffaf0', gnd: '#7a5a40', key: '#fff8e6' },
].map(p => ({ y: p.y, fog: new THREE.Color(p.fog), bg: new THREE.Color(p.bg), sky: new THREE.Color(p.sky), gnd: new THREE.Color(p.gnd), key: new THREE.Color(p.key) }));
const palOut = { fog: new THREE.Color(), bg: new THREE.Color(), sky: new THREE.Color(), gnd: new THREE.Color(), key: new THREE.Color() };
function palette(y) {
  let i = 0; while (i < PAL.length - 2 && y > PAL[i + 1].y) i++;
  const a = PAL[i], b = PAL[i + 1], t = smooth(a.y, b.y, y);
  for (const k of ['fog', 'bg', 'sky', 'gnd', 'key']) palOut[k].copy(a[k]).lerp(b[k], t);
  return palOut;
}

// ============================================================================
//  renderer / scene
// ============================================================================
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#efe6c6');
scene.fog = new THREE.Fog(new THREE.Color('#e6d6ac'), 11, 50);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 500);

const hemi = new THREE.HemisphereLight('#fbf0d4', '#6a4733', 2.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff2da', 2.4);
scene.add(sun, sun.target);
// invisible light used only to project the huge, soft "shadow theatre" of the shelves onto the far haze
const shade = new THREE.SpotLight(0xffffff, 0, 0, 0.82, 0, 0);
shade.castShadow = true;
shade.shadow.mapSize.set(1024, 1024);
shade.shadow.camera.near = 6; shade.shadow.camera.far = 170;
shade.shadow.radius = 9; shade.shadow.blurSamples = 10; shade.shadow.bias = -0.0005;
scene.add(shade, shade.target);

const U = { time: { value: 0 } };

// ============================================================================
//  asset loading (every image / model / sound below was generated with fal)
// ============================================================================
const texLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
let loadDone = 0, loadTotal = 0;
function progress() { loadDone++; $('#loading .bar b').style.width = (100 * loadDone / Math.max(1, loadTotal)) + '%'; }
function solidTex(hex, alpha = 1) {
  const n = parseInt(hex.slice(1), 16);
  const t = new THREE.DataTexture(new Uint8Array([(n >> 16) & 255, (n >> 8) & 255, n & 255, alpha * 255]), 1, 1);
  t.needsUpdate = true; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function loadTex(url, o = {}) {
  loadTotal++;
  return new Promise(res => texLoader.load(url, t => {
    t.colorSpace = o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    if (o.repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (o.mirror) t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
    t.anisotropy = ANISO; progress(); res(t);
  }, undefined, () => { console.warn('missing texture', url); progress(); res(solidTex(o.fallback || '#d8c49a', o.fallbackAlpha ?? 1)); }));
}
function loadGLB(url) { loadTotal++; return gltfLoader.loadAsync(url).then(g => { progress(); return g; }).catch(() => { console.warn('missing model', url); progress(); return null; }); }

// ---------------------------------------------------------------- audio
const SND = {
  ctx: null, raw: {}, buf: {}, out: null, music: null, sfx: null, amb: null, muted: store.get('skylib_mute', '0') === '1', loops: {},
  fetch(list) { return Promise.all(list.map(async ([k, url]) => { loadTotal++; try { const r = await fetch(url); if (r.ok) this.raw[k] = await r.arrayBuffer(); } catch (e) {} progress(); })); },
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.out = ctx.createGain(); this.out.gain.value = this.muted ? 0 : 0.9; this.out.connect(ctx.destination);
    const mk = v => { const g = ctx.createGain(); g.gain.value = v; g.connect(this.out); return g; };
    this.music = mk(0.42); this.sfx = mk(0.85); this.amb = mk(G.state === 'play' ? 0.35 : 0.0);
    for (const [k, ab] of Object.entries(this.raw)) ctx.decodeAudioData(ab.slice(0)).then(b => { this.buf[k] = b; if (k === 'music') this.startMusic(); if (k === 'wind') this.startLoop('wind', this.amb, 0.5); if (k === 'flutter') this.startLoop('flutter', this.flutterGain(), 1); }).catch(() => {});
  },
  resume() { this.init(); if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); },
  flutterGain() { if (!this._fl) { this._fl = this.ctx.createGain(); this._fl.gain.value = 0; this._fl.connect(this.sfx); } return this._fl; },
  startMusic() {
    if (this._musicOn || !this.buf.music) return; this._musicOn = true;
    const XF = 4, b = this.buf.music, ctx = this.ctx;
    const sched = when => {
      const s = ctx.createBufferSource(); s.buffer = b; const g = ctx.createGain();
      g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + XF);
      g.gain.setValueAtTime(1, when + b.duration - XF); g.gain.linearRampToValueAtTime(0, when + b.duration);
      s.connect(g); g.connect(this.music); s.start(when);
      const next = when + b.duration - XF;
      setTimeout(() => sched(next), Math.max(0, (next - ctx.currentTime - 1.5) * 1000));
    };
    sched(ctx.currentTime + 0.1);
  },
  startLoop(k, dest, vol) {
    if (this.loops[k] || !this.buf[k]) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buf[k]; s.loop = true;
    s.loopStart = 0.04; s.loopEnd = Math.max(0.5, this.buf[k].duration - 0.04);
    const g = this.ctx.createGain(); g.gain.value = vol; s.connect(g); g.connect(dest); s.start(); this.loops[k] = { s, g };
  },
  play(k, o = {}) {
    if (!this.ctx || !this.buf[k]) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buf[k]; s.playbackRate.value = o.rate || 1;
    const g = this.ctx.createGain(); g.gain.value = o.vol ?? 1;
    let node = g;
    if (o.pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = o.pan; g.connect(p); node = p; }
    s.connect(g); node.connect(this.sfx); s.start(this.ctx.currentTime + (o.delay || 0));
  },
  setMuted(m) { this.muted = m; store.set('skylib_mute', m ? '1' : '0'); if (this.out) this.out.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05); $('#muted').style.opacity = m ? 0.8 : 0; }
};

// ============================================================================
//  materials
// ============================================================================
function makeWoodMat(tex) {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  m.onBeforeCompile = sh => {
    sh.uniforms.tWood = { value: tex };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
      varying vec2 vWUv; varying float vDepth; varying float vFront;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
      vec3 sc = vec3(1.0); vec3 io = vec3(0.0);
      #ifdef USE_INSTANCING
        sc = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
        io = instanceMatrix[3].xyz;
      #endif
      vec3 sp = position * sc; vec3 an = abs(normal); vec2 w;
      if (an.z > 0.5) { w = sc.y > sc.x ? sp.yx : sp.xy; }
      else if (an.y > 0.5) { w = sp.xz; }
      else { w = sc.y > sc.z ? sp.yz : sp.zy; }
      vWUv = w * vec2(0.17, 0.45) + fract(io.xy * 0.1371 + io.z * 0.213);
      vDepth = position.z + 0.5; vFront = step(0.5, normal.z);`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      uniform sampler2D tWood; varying vec2 vWUv; varying float vDepth; varying float vFront;`)
      .replace('#include <map_fragment>', `
      vec3 wc = texture2D(tWood, vWUv).rgb;
      float ao = mix(mix(0.42, 1.0, smoothstep(0.0, 1.0, vDepth)), 1.0, vFront);
      diffuseColor.rgb *= wc * ao * 1.12;`);
  };
  return m;
}
function makeBookMat(spines, edges, covers) {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  m.onBeforeCompile = sh => {
    sh.uniforms.tSpines = { value: spines }; sh.uniforms.tEdges = { value: edges }; sh.uniforms.uCover = { value: covers };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
      attribute float aVariant; varying float vVar; varying vec3 vON; varying vec2 vBUv; varying vec3 vOP;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
      vVar = aVariant; vON = normal; vBUv = uv; vOP = position;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      uniform sampler2D tSpines; uniform sampler2D tEdges; uniform vec3 uCover[8];
      varying float vVar; varying vec3 vON; varying vec2 vBUv; varying vec3 vOP;`)
      .replace('#include <map_fragment>', `
      float vv = floor(vVar + 0.5);
      vec3 cov = uCover[0];
      for (int i = 1; i < 8; i++) { if (float(i) == vv) cov = uCover[i]; }
      vec3 bc;
      if (vON.z > 0.5) {
        bc = texture2D(tSpines, vec2((vv + 0.03 + vBUv.x * 0.94) / 8.0, vBUv.y)).rgb;
      } else if (vON.z < -0.5) {
        bc = texture2D(tEdges, vec2(vBUv.y * 1.5, vBUv.x * 0.6)).rgb * 0.8;
      } else if (abs(vON.y) > 0.5) {
        float rim = 1.0 - step(0.09, vBUv.x) * step(vBUv.x, 0.91);
        vec3 pg = texture2D(tEdges, vec2(vBUv.y * 1.3, vBUv.x * 0.5)).rgb;
        bc = mix(pg, cov, rim);
      } else {
        bc = cov * (0.86 + 0.28 * texture2D(tSpines, vec2((vv + 0.5) / 8.0, vBUv.y * 0.25 + 0.4)).g / max(0.05, cov.g + 0.05));
      }
      float dk = smoothstep(-0.5, 0.5, vOP.z);
      if (vON.z < 0.5) bc *= mix(0.4, 1.0, dk);
      diffuseColor.rgb *= bc * 1.12;`);
  };
  return m;
}
function makePageMat(tex, o = {}) {
  const m = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide, color: o.color || 0xffffff, emissive: o.emissive || 0x8a7e68, emissiveMap: tex });
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = U.time;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
      uniform float uTime; attribute float aPhase; varying float vFl;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
      float ph = aPhase;
      float spd = 6.5 + fract(ph * 3.17) * 5.0;
      float fl = sin(uTime * spd + ph * 6.2831);
      float sx = position.x / 0.25;
      transformed.z += sx * sx * fl * 0.15 + sin(position.y * 7.0 + uTime * 4.0 + ph * 3.0) * 0.025;
      vFl = fl * sx;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying float vFl;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
      diffuseColor.rgb *= 0.92 + 0.12 * vFl;`);
  };
  return m;
}
function makeGirlMat(map) {
  const m = new THREE.MeshLambertMaterial({ map, color: 0xffffff });
  m.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', `
      float rimK = 1.0 - clamp(dot(normalize(vViewPosition), normal), 0.0, 1.0);
      outgoingLight += vec3(1.0, 0.86, 0.62) * pow(rimK, 2.6) * 0.45;
      outgoingLight = mix(outgoingLight, diffuseColor.rgb, 0.18);
      #include <opaque_fragment>`);
  };
  return m;

  sun.position.set(cam.x + (lx * cr - ly * sr) * 30, cam.y + (lx * sr + ly * cr) * 30, 22); sun.target.position.set(cam.x, cam.y, 0);
  shade.position.set(cam.x + (-0.3 * cr - 0.5 * sr) * 6, cam.y + (-0.3 * sr + 0.5 * cr) * 6, 30);
  shade.target.position.set(cam.x + 1, cam.y - 1, -34);
  shadowWall.position.set(cam.x, cam.y, -34);
  bgPlane.position.set(cam.x * 0.7, cam.y, -120);
  A.bg.offset.set(cam.x * 0.0012, cam.y * 0.0011);
}
function updateWorld(dt) {
  const pal = palette(cam.y);
  scene.fog.color.copy(pal.fog); scene.background.copy(pal.bg);
  scene.fog.near = (cam.eff || cam.dist) + 0.4; scene.fog.far = (cam.eff || cam.dist) + 22;
  bgPlane.material.color.setRGB(pal.bg.r / PAL[0].bg.r, pal.bg.g / PAL[0].bg.g, pal.bg.b / PAL[0].bg.b);
  hemi.color.copy(pal.sky); hemi.groundColor.copy(pal.gnd); sun.color.copy(pal.key);
  for (const c of chunks) c.visible = !c.userData.hidden && c.userData.y1 > cam.y - 46 && c.userData.y0 < cam.y + 48;
  for (const mv of movers) {
    mv.ang += mv.m.av * dt; mv.grp.rotation.z = mv.ang; mv.grp.visible = Math.abs(mv.m.y - cam.y) < 40;
    mv.col.c = Math.cos(mv.ang); mv.col.s = Math.sin(mv.ang);
  }
  if (tomeMesh) {
    let k = 0;
    for (const ts of tomeState) {
      const t = ts.t, cx = cxAt(t.y), hw = hwAt(t.y), span = 2 * hw + 5;
      const u = ((ts.u * span + G.t * t.speed * t.dir + ts.i * span / t.n) % span + span) % span;
      ts.x = cx - span / 2 + u; ts.y = t.y + ts.dy + Math.sin(G.t * 0.8 + ts.ph) * 0.4;
      _e4.set(Math.sin(G.t * 0.7 + ts.ph) * 0.6, Math.sin(G.t * 0.5 + ts.ph) * 0.5, G.t * ts.spin + ts.ph);
      _q4.setFromEuler(_e4); _m4.compose(_p4.set(ts.x, ts.y, -0.55 + Math.sin(G.t + ts.ph) * 0.2), _q4, _s4.set(0.3, 1.05, 0.8));
      tomeMesh.setMatrixAt(k++, _m4);
    }
    tomeMesh.instanceMatrix.needsUpdate = true;
  }
  for (const b of bellObjs) { b.sv = damp(b.sv, 0, 0.6, dt); b.swing += dt * 3; b.pivot.rotation.z = b.base + Math.sin(b.swing) * 0.3 * b.sv + Math.sin(G.t * 0.7 + b.y) * 0.03; }
  const endK = smooth(LEN - 45, LEN + 8, cam.y);
  skyRays.material.uniforms.uK.value = endK * (1 + G.endBlend);
  skylight.material.uniforms.uGlow.value = G.endBlend;
  for (const m of streamGlows) m.visible = true;
}
function updatePages(dt) {
  pageN = 0; goldMesh.userData.n = 0;
  const t = G.t;
  // collectible flocks: pages circling like a small flight of birds
  for (const f of LV.flocks) {
    if (Math.abs(f.y - cam.y) > 32) continue;
    const fcx = f.x + Math.sin(t * 0.4 + f.dph) * 0.7, fcy = f.y + Math.cos(t * 0.33 + f.dph) * 0.5;
    for (const p of f.pages) {
      if (!p.alive) continue;
      if (f.golden) { p.x = fcx; p.y = fcy + Math.sin(t * 1.4) * 0.25; p.z = 0.2; writePage(goldMesh, p.x, p.y, p.z, Math.sin(t * 1.1) * 0.4, Math.sin(t * 0.9) * 0.5, Math.sin(t * 0.7) * 0.4, 1.7, 0); if (Math.random() < dt * 6) burst(p.x + (Math.random() - 0.5) * 0.8, p.y + (Math.random() - 0.5) * 0.8, p.z, 1, 0.8); continue; }
      const a = p.ph + t * p.sp;
      p.x = fcx + Math.cos(a) * p.rad; p.y = fcy + Math.sin(a) * p.rad * 0.75; p.z = Math.sin(a * 1.3 + p.zs) * 0.45;
      writePage(pageMesh, p.x, p.y, p.z, Math.sin(t * 1.3 + p.zs) * 0.6, Math.sin(t * 0.9 + p.ph) * 0.5, a + Math.PI / 2 * Math.sign(p.sp), 1, p.ph2);
    }
  }
  // warm-air streams: a river of pages flowing up the shaft
  for (const s of LV.streams) {
    if (s.y1 < cam.y - 34 || s.y0 > cam.y + 36) continue;
    const L = s.y1 - s.y0;
    for (const p of s.pages) {
      const u = (p.u + t * 6 / L) % 1, y = s.y0 + u * L;
      const x = cxAt(y) + p.off + Math.sin(u * 20 + p.ph * 6) * 0.6;
      const fade = smooth(0, 0.08, u) * smooth(1, 0.9, u);
      writePage(pageMesh, x, y, p.z, Math.sin(t * 2 + p.ph * 9) * 0.7, 0.4, Math.sin(t + p.ph) * 0.5, 0.75 * fade + 0.01, p.ph);
    }
  }
  // her flock: the open books and loose pages following her, like the video
  const nB = G.pages > 0 ? Math.min(9, 1 + Math.floor(G.pages / 5)) : 0;
  trailBooks.count = nB; trailFlaps.count = nB;
  for (let i = 0; i < nB; i++) {
    const s = sampleHist(1.5 + i * 1.05);
    const hd = Math.atan2(s.tx, s.ty || 1e-3);
    const wob = Math.sin(t * 2.0 + i * 1.7) * 0.18;
    _e4.set(Math.sin(t * 1.7 + i) * 0.12, TILT * (1 - G.endBlend) + Math.sin(t * 1.3 + i * 0.9) * 0.18, -hd + wob * 0.4, 'ZYX');
    _q4.setFromEuler(_e4);
    const sc = 0.98 - i * 0.035;
    _m4.compose(_p4.set(s.x + Math.cos(hd) * wob, s.y, -0.12 - i * 0.03 + Math.sin(t * 1.5 + i * 2) * 0.15), _q4, _s4.set(sc, sc, sc));
    trailBooks.setMatrixAt(i, _m4); trailFlaps.setMatrixAt(i, _m4);
  }
  trailBooks.instanceMatrix.needsUpdate = true; trailFlaps.instanceMatrix.needsUpdate = true;
  const nP = Math.min(G.pages, 70);
  const swirl = 1 + G.endBlend * 3;
  for (let j = 0; j < nP; j++) {
    const back = 0.8 + j * 0.26 + Math.sin(t * 0.7 + j) * 0.35;
    const s = sampleHist(back);
    const a = t * (1.2 + (j % 5) * 0.2) + j * 2.399;
    const r = (0.45 + (j % 7) * 0.13) * swirl;
    const hd = Math.atan2(s.tx, s.ty || 1e-3);
    const ox = Math.cos(a) * r, oz = Math.sin(a) * r * 0.6;
    writePage(pageMesh, s.x + ox * Math.cos(hd), s.y - ox * Math.sin(hd) + Math.sin(a * 0.7) * 0.25, oz, Math.sin(a) * 0.8, 0.3 + Math.cos(a) * 0.5, -hd + Math.sin(a * 1.3) * 0.6, 0.78, (j * 0.618) % 1);
  }
  // pages flying from a flock into hers
  for (let i = transfers.length - 1; i >= 0; i--) {
    const tr = transfers[i]; tr.t += dt * 2.6;
    if (tr.t >= 1) { transfers.splice(i, 1); continue; }
    const s = sampleHist(1.0), e = tr.t * tr.t * (3 - 2 * tr.t);
    writePage(tr.golden ? goldMesh : pageMesh, lerp(tr.x, s.x, e), lerp(tr.y, s.y, e) + Math.sin(e * 3.14) * 1.2, lerp(tr.z, 0, e), e * 6, e * 3, e * 4, tr.golden ? 1.5 - e * 0.6 : 1 - e * 0.2, 0.5);
  }
  // scattered pages (after a bump or while riding the flock)
  for (let i = scatter.length - 1; i >= 0; i--) {
    const p = scatter[i]; p.life -= dt;
    if (p.life <= 0) { scatter.splice(i, 1); continue; }
    p.vx = damp(p.vx, Math.sin(t + p.ph * 9) * 0.8, 1.2, dt); p.vy = damp(p.vy, -1.6, 0.9, dt); p.vz = damp(p.vz, 0, 1, dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.rx += dt * 3; p.ry += dt * 2.2; p.rz += dt * 1.6;
    writePage(pageMesh, p.x, p.y, p.z, p.rx, p.ry, p.rz, 0.85 * Math.min(1, p.life / 0.6), p.ph);
  }
  // ambient pages drifting in the far air
  for (const a of ambient) {
    const yy = ((a.oy - t * a.sp * 0.8 - cam.y) % 44 + 44) % 44 - 22 + cam.y;
    const xx = ((a.ox + Math.sin(t * 0.3 + a.ph) * 3 - cam.x) % 44 + 44) % 44 - 22 + cam.x;
    writePage(pageMesh, xx, yy, a.z, Math.sin(t * 0.8 + a.ph) * 1.2, t * 0.4 + a.ph, Math.sin(t * 0.5 + a.ph) * 1.5, a.s, a.ph);
  }
  pageMesh.count = pageN; pageMesh.instanceMatrix.needsUpdate = true; pageGeo.attributes.aPhase.needsUpdate = true;
  goldMesh.count = goldMesh.userData.n; goldMesh.instanceMatrix.needsUpdate = true;
  // sparkles
  const sl = sparks.userData.list, sp = sparks.geometry.attributes.position.array, sa = sparks.geometry.attributes.alpha.array;
  let n = 0;
  for (let i = sl.length - 1; i >= 0; i--) { const q = sl[i]; q.t += dt; if (q.t > q.life) { sl.splice(i, 1); continue; } q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vx *= 0.96; q.vy *= 0.96; }
  for (const q of sl) { if (n >= sparks.userData.n) break; sp[n * 3] = q.x; sp[n * 3 + 1] = q.y; sp[n * 3 + 2] = q.z; sa[n] = 1 - q.t / q.life; n++; }
  for (let i = n; i < sparks.userData.n; i++) sa[i] = 0;
  sparks.geometry.attributes.position.needsUpdate = true; sparks.geometry.attributes.alpha.needsUpdate = true;
  sparks.geometry.setDrawRange(0, Math.max(1, n));
  dust.material.uniforms.uCam.value.set(cam.x, cam.y, 0);
}
let hudPages = -1;
function updateHUD() {
  if (hudPages !== G.pages) { $('#pages span').textContent = G.pages; hudPages = G.pages; }
  $('#alt .dot').style.bottom = (clamp(P.y / LEN, 0, 1) * 100) + '%';
}

// ============================================================================
//  loop
// ============================================================================
let last = performance.now(), slowT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.016;
  dt = Math.min(dt, 1 / 24);
  G.t += dt; U.time.value = G.t;
  if (G.state === 'play') updatePlay(dt);
  else if (G.state === 'ending' || G.state === 'end') { if (G.state === 'ending') updateEnding(dt); else { G.endT += dt; P.vy = damp(P.vy, 0.2, 0.8, dt); P.y += P.vy * dt; P.x = damp(P.x, skylight.position.x, 0.8, dt); P.vx = 0; } }
  else if (G.state === 'title') { P.vy = 0; P.x = cxAt(P.y); }
  pushHist(P.x, P.y + (G.state === 'title' ? G.t * 0.0 : 0));
  if (G.state === 'title') { histD += dt * 2.2; const l = hist[hist.length - 1]; if (l) { l.d = histD; for (let i = hist.length - 2; i >= 0; i--) hist[i].d = l.d - (P.y - hist[i].y); } }
  updateRider(dt);
  updateCamera(dt);
  updateWorld(dt);
  updatePages(dt);
  updateHUD();
  renderer.render(scene, camera);
  // adaptive quality
  if (dt > 1 / 34) slowT += dt; else slowT = Math.max(0, slowT - dt * 0.5);
  if (slowT > 2.5 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); slowT = 0; }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => { if (SND.ctx) { if (document.hidden) SND.ctx.suspend(); else if (G.state !== 'loading') SND.ctx.resume(); } last = performance.now(); });

boot().catch(e => { console.error(e); $('#loading .t').textContent = 'could not start: ' + e.message; });
</script>
