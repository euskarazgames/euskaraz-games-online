{ "imports": {

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// =====================================================================
//  utils
// =====================================================================
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(20261012);
const R = (a, b) => a + (b - a) * rng();
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');

// =====================================================================
//  world layout
// =====================================================================
const WORLD_END = 1235;
const ASCENT_X = 950;
const SURFACE_Y = 116;
const VERSES = [
  { x: 0, name: 'I · The Reef' },
  { x: 230, name: 'II · The Open Blue' },
  { x: 590, name: 'III · The Shoal' },
  { x: ASCENT_X, name: 'IV · The Ascent' },
];
function routeY(x) { if (x <= ASCENT_X) return 0; return (SURFACE_Y - 5) * smooth((x - ASCENT_X) / 235); }
function verseAt(x) { let v = 0; for (let i = 0; i < VERSES.length; i++) if (x >= VERSES[i].x) v = i; return v; }
const VENTS = [38, 175, 320, 455, 600, 745, 880, 1010];
const WS = 1.45; // whale scale: a truly giant ghost whale, as in the video (model normalised to 27 m, shown ~39 m)

// =====================================================================
//  renderer / scene / post
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 1200);
camera.position.set(0, 2, 18);

const rt = new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 v = c.rgb;
      if (any(isnan(v)) || any(isinf(v))) v = vec3(0.0);
      gl_FragColor = vec4(clamp(v, 0.0, 24.0), 1.0); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.45, 0.88);
composer.addPass(bloom);

const FinalShader = {
  uniforms: {
    tDiffuse: { value: null }, tPaper: { value: null }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uTime: { value: 0 }, uVignette: { value: 0.45 }, uDesat: { value: 0 }, uLow: { value: 0 },
    uFlash: { value: 0 }, uFlashCol: { value: new THREE.Color(1, 1, 1) }, uFade: { value: 1 }, uFadeCol: { value: new THREE.Color('#0c3653') },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D tPaper; uniform vec2 uRes; uniform float uTime, uVignette, uDesat, uLow, uFlash, uFade;
    uniform vec3 uFlashCol, uFadeCol; varying vec2 vUv;
    vec3 toSRGB(vec3 c){ c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c)); }
    void main(){
      vec2 uv = vUv + vec2(sin(vUv.y * 17.0 + uTime * 1.2), cos(vUv.x * 13.0 + uTime * 0.9)) * 0.0007;
      vec3 c = texture2D(tDiffuse, uv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(c, vec3(l) * vec3(0.82, 0.94, 1.08), uDesat);
      c = toSRGB(c);
      // watercolor paper grain (generated texture, mean ~0.955): centred and amplified
      float g = dot(texture2D(tPaper, vUv * uRes / 820.0).rgb, vec3(0.3333));
      c *= 1.0 + (g - 0.955) * 2.4 * (1.0 - 0.65 * smoothstep(0.45, 0.95, dot(c, vec3(0.333))));
      vec2 q = vUv - 0.5; q.x *= uRes.x / uRes.y;
      float vig = smoothstep(1.05, 0.22, length(q) * (1.0 + uLow * 0.9));
      c *= mix(1.0, vig, uVignette + uLow * 0.25);
      c = mix(c, uFlashCol, clamp(uFlash, 0.0, 1.0));
      c = mix(c, uFadeCol, clamp(uFade, 0.0, 1.0));
      gl_FragColor = vec4(c, 1.0);
    }`,
};
const finalPass = new ShaderPass(FinalShader);
composer.addPass(finalPass);

// =====================================================================
//  loading
// =====================================================================
const manager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
function tex(url, o = {}) {
  const t = texLoader.load(url);
  t.colorSpace = o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (o.repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (o.mirror) t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const T = {
  deep: tex('assets/bg_deep.jpg', { mirror: true }),
  surf: tex('assets/bg_surface.jpg', { mirror: true }),
  rocksA: tex('assets/rocks_a.webp'), rocksB: tex('assets/rocks_b.webp'),
  reefA: tex('assets/reef_a.webp'), reefB: tex('assets/reef_b.webp'),
  jelly: tex('assets/jelly_alpha.webp'),
  orb: tex('assets/fx_orb.webp'), bubble: tex('assets/fx_bubble.webp'), spark: tex('assets/fx_spark.webp'), dot: tex('assets/fx_dot.webp'),
  streak: tex('assets/streak.webp', { repeat: true }),
  rays: tex('assets/godrays.webp'),
  caustics: tex('assets/caustics.webp', { repeat: true, linear: true }),
  paper: tex('assets/paper.webp', { repeat: true, linear: true }),
  scarf: tex('assets/scarf.webp', { mirror: true }),
};
const MODELS = {};
for (const n of ['whale', 'diver', 'fish']) gltfLoader.load(`assets/${n}.glb`, (g) => { MODELS[n] = g; });
const loadBar = document.querySelector('#loading .bar i');
manager.onProgress = (url, loaded, total) => { loadBar.style.width = (100 * loaded / total).toFixed(0) + '%'; };
manager.onError = (url) => console.warn('failed to load', url);
manager.onLoad = () => { try { init(); } catch (e) { console.error(e); } };

// =====================================================================
//  shared GLSL
// =====================================================================
const FOG = `
  uniform vec3 uFogColor; uniform float uFogDensity;
  vec3 applyFog(vec3 c, vec3 wp, float k){ float d = length(wp - cameraPosition); return mix(c, uFogColor, (1.0 - exp(-uFogDensity * d)) * k); }`;
const fogU = () => ({ uFogColor: SHARED.fogColor, uFogDensity: SHARED.fogDensity });
const SHARED = { fogColor: { value: new THREE.Color('#14557a') }, fogDensity: { value: 0.0075 }, time: { value: 0 } };

// =====================================================================
//  audio (WebAudio; generated tracks + small synths)
// =====================================================================
const AudioSys = {
  ctx: null, buffers: {}, ready: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(ctx.destination);
    this.musicBus = ctx.createGain(); this.musicBus.gain.value = 0; this.musicBus.connect(this.master);
    this.sfx = ctx.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    // generated impulse response for a deep underwater reverb
    const len = ctx.sampleRate * 3.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.verb = ctx.createConvolver(); this.verb.buffer = ir;
    this.verbOut = ctx.createGain(); this.verbOut.gain.value = 0.55;
    this.verb.connect(this.verbOut); this.verbOut.connect(this.master);
    // low-pass "underwater" filter on the whole sfx bus
    this.lp = ctx.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 5200; this.lp.connect(this.sfx);
    const files = { music: 'assets/music.mp3', ambience: 'assets/ambience.mp3', call1: 'assets/whale_call_1.mp3', call2: 'assets/whale_call_2.mp3', call3: 'assets/whale_call_3.mp3', hum: 'assets/hum.mp3' };
    for (const [k, u] of Object.entries(files)) {
      fetch(u).then(r => r.ok ? r.arrayBuffer() : Promise.reject(u)).then(b => ctx.decodeAudioData(b)).then(buf => {
        this.buffers[k] = buf;
        if (k === 'music' && this.wantMusic) this.startMusic();
        if (k === 'ambience' && this.wantMusic) this.startAmbience();
      }).catch(() => {});
    }
  },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); },
  startMusic() {
    this.wantMusic = true;
    if (!this.ctx || !this.buffers.music || this.musicSrc) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buffers.music; s.loop = true; s.connect(this.musicBus); s.start();
    this.musicSrc = s;
    this.musicBus.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicBus.gain.setValueAtTime(0, this.ctx.currentTime);
    this.musicBus.gain.linearRampToValueAtTime(0.5, this.ctx.currentTime + 6);
  },
  startAmbience() {
    if (!this.ctx || !this.buffers.ambience || this.ambSrc) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buffers.ambience; s.loop = true;
    const g = this.ctx.createGain(); g.gain.value = 0.32; s.connect(g); g.connect(this.master); s.start(); this.ambSrc = s;
  },
  play(name, { vol = 1, rate = 1, wet = 0.4, pan = 0 } = {}) {
    if (!this.ctx || !this.buffers[name]) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buffers[name]; s.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = vol;
    const p = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    s.connect(g); if (p) { p.pan.value = pan; g.connect(p); p.connect(this.lp); } else g.connect(this.lp);
    const w = this.ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(this.verb);
    s.start();
  },
  // pentatonic glass chime (D major pentatonic), index climbs along a line
  chime(i, vol = 0.22) {
    if (!this.ctx) return;
    const scale = [0, 2, 4, 7, 9];
    const semi = scale[i % 5] + 12 * Math.floor(i / 5);
    const f = 587.33 * Math.pow(2, Math.min(semi, 26) / 12);
    const t = this.ctx.currentTime;
    const out = this.ctx.createGain(); out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(vol, t + 0.008); out.gain.exponentialRampToValueAtTime(0.0008, t + 2.4);
    out.connect(this.lp); const w = this.ctx.createGain(); w.gain.value = 0.8; out.connect(w); w.connect(this.verb);
    [[1, 1], [2.01, 0.35], [3.98, 0.12], [0.5, 0.18]].forEach(([m, a]) => {
      const o = this.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = this.ctx.createGain(); g.gain.value = a; o.connect(g); g.connect(out); o.start(t); o.stop(t + 2.5);
    });
  },
  sting() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.5);
    const o2 = this.ctx.createOscillator(); o2.type = 'square'; o2.frequency.setValueAtTime(233, t); o2.frequency.exponentialRampToValueAtTime(74, t + 0.5);
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.lp); o.start(t); o2.start(t); o.stop(t + 0.7); o2.stop(t + 0.7);
  },
  heartbeat() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [0, 0.22].forEach((d, k) => {
      const o = this.ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(62, t + d); o.frequency.exponentialRampToValueAtTime(38, t + d + 0.18);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(k ? 0.16 : 0.24, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25);
      o.connect(g); g.connect(this.master); o.start(t + d); o.stop(t + d + 0.3);
    });
  },
  bubbles(vol = 0.12) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (let k = 0; k < 4; k++) {
      const o = this.ctx.createOscillator(); o.type = 'sine'; const d = k * 0.07 + Math.random() * 0.05; const f0 = 380 + Math.random() * 500;
      o.frequency.setValueAtTime(f0, t + d); o.frequency.exponentialRampToValueAtTime(f0 * 2.2, t + d + 0.08);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(vol, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.1);
      o.connect(g); g.connect(this.lp); o.start(t + d); o.stop(t + d + 0.12);
    }
  },
  setUnderwater(depthK) { if (this.lp) this.lp.frequency.value = lerp(2600, 9000, depthK); },
};

// =====================================================================
//  input
// =====================================================================
const keys = new Set();
const pressed = new Set();
addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
  anyInput();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const pointer = { down: false, x: 0, y: 0, t0: 0, world: V3() };
renderer.domElement.addEventListener('pointerdown', (e) => { pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY; pointer.t0 = performance.now(); anyInput(); });
addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
addEventListener('pointerup', () => { if (pointer.down && performance.now() - pointer.t0 < 220 && G.state === 'play') pressed.add('Space'); pointer.down = false; });
function readInput() {

function whaleSing() {
  const W = whale;
  W.singT = 0; W.songCD = 6.0; W.autoT = R(9, 12); W.answerT = -1; W.lastSongAt = G.t;
  G.songsHeard++;
  const call = ['call1', 'call2', 'call3'][Math.floor(rng() * 3)];
  AudioSys.play(call, { vol: 0.95, rate: R(0.92, 1.06), wet: 0.6 });
  spawnRing(W.headPos.clone(), 40, 3.4, '#9fe9ff', 0.014, 0.5);
  spawnRing(W.headPos.clone(), 22, 2.6, '#e8fbff', 0.025, 0.35);
  G.songBreathGiven = false;
  // the song draws glowing lines through the water, ahead of the diver
  const v = verseAt(diver.pos.x);
  const count = v === 0 ? 2 : 3;
  const offs = [[-0.6, 3.2], [-3.6, 1.2, 4.2], [-3.4, 0.6, 4.4]][Math.min(count - 1, 2)];
  const L = v === 3 ? R(95, 125) : R(75, 105);
  const x0 = diver.pos.x + R(-7, -3);
  const dyStart = diver.pos.y - routeY(diver.pos.x);
  const bandTarget = R(-5, 5);
  for (let k = 0; k < count; k++) {
    const off = offs[k] + R(-0.5, 0.5);
    const amp = R(1.6, 4.2), freq = R(0.028, 0.05) * Math.PI * 2, ph = R(0, 6.28);
    const pts = [];
    for (let a = 0; a <= L; a += 0.5) {
      const x = x0 + a;
      const env = smooth(a / 22);
      const lateral = lerp(dyStart, bandTarget, smooth(a / 70)) + off * (0.55 + 0.45 * env) + amp * Math.sin(a * freq * 0.1 + ph) * env;
      const y = routeY(x) + clamp(lateral, -17, 17);
      pts.push(V3(x, y, Math.sin(a * 0.05 + ph) * 0.4 * env));
    }
    const line = new SongLine(pts, { delay: k * 0.16 + 0.1, life: L / 34 + 11 });
    lines.push(line);
    const guards = v === 0 ? 0 : v === 1 ? (k === 1 ? 1 : 0) : (k !== 2 ? 1 : 0);
    for (let gI = 0; gI < guards; gI++) {
      const gp = line.at(R(30, 58)); gp.y += R(-0.3, 0.3); gp.z = 0;
      const j = new Jelly(gp); j.guard = true; j.vel.set(0, 0.05, 0); jellies.push(j);
    }
    for (let s = R(9, 13); s < line.len - 6; s += R(8.5, 11.5)) {
      const p = line.at(s);
      if (jellies.some(j => j.pos.distanceTo(p) < 2.2)) continue;
      notes.push(new Note(line, s));
    }
  }
  if (!G.hints.song) showHint('The whale sings — glide along her song', 4.5, 'song');
}

function spawnChunk(ci) {

  const x0 = ci * 40; if (x0 < 60 || x0 > WORLD_END) return;
  const v = verseAt(x0);
  const r = mulberry32(ci * 7919 + 13);
  const n = v === 0 ? 0 : v === 1 ? (r() < 0.7 ? 1 : 2) : v === 2 ? 2 + (r() < 0.5 ? 1 : 0) : 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + r() * 40;
    if (VENTS.some(vx => Math.abs(vx - x) < 6)) continue;
    jellies.push(new Jelly(V3(x, routeY(x) + (r() * 2 - 1) * 12, 0)));
  }
  // drifting background jellies for depth
  if (v >= 1 && r() < 0.6) { const x = x0 + r() * 40; jellies.push(new Jelly(V3(x, routeY(x) + (r() * 2 - 1) * 14, -18 - r() * 15), true)); }
}

  if (Math.abs(v.x) > 0.6) diver.facing = Math.sign(v.x);
  let fwd = sp > 0.35 ? _f.copy(v).normalize() : _f.set(diver.facing, 0, 0);
  if (!diver.riding && sp < 2.5) { // idle: relax toward a near-horizontal, gently drifting pose
    const k = sp / 2.5; fwd.lerp(V3(diver.facing, 0.12, 0), 1 - k).normalize();
  }
  _l.set(0, 0, diver.facing);
  _b.crossVectors(fwd, _l).normalize();
  _l.crossVectors(_b, fwd).normalize();
  _m4.makeBasis(_b, fwd, _l);
  _q.setFromRotationMatrix(_m4);
  // roll a little so we see her back from above, like the video
  _q.multiply(new THREE.Quaternion().setFromAxisAngle(V3(0, 1, 0), -0.42 * diver.facing));
  if (snap) diver.quat.copy(_q); else diver.quat.slerp(_q, 1 - Math.exp(-dt * 7));
  diverObj.root.quaternion.copy(diver.quat);
  diverObj.root.position.copy(diver.pos);
}

function updateDiver(dt, t, inp) {
  const d = diver;
  d.invuln = Math.max(0, d.invuln - dt); d.singCD = Math.max(0, d.singCD - dt); d.detachT = Math.max(0, d.detachT - dt);
  d.hurt = damp(d.hurt, 0, 4, dt);
  const canControl = G.state === 'play';
  if (!canControl) { inp = { x: 0, y: 0, kick: false, sing: false }; }
  if (G.state === 'end' || G.state === 'over') { inp = { x: 0.08, y: 0.36, kick: false, sing: false }; }

  // ---- sing ----
  if (inp.sing && d.singCD <= 0 && canControl) {
    d.singCD = 0.9;
    spawnRing(d.pos.clone(), 7, 1.0, '#dffaff', 0.03, 0.6, d.pos);
    AudioSys.play('hum', { vol: 0.55, rate: [1, 1.122, 1.26, 1.498, 1.682][Math.floor(rng() * 5)], wet: 0.7 });
    for (const n of notes) if (n.state === 'live' && n.base.distanceTo(d.pos) < 10) n.magnet = true;
    for (const j of jellies) { const a = V3().subVectors(j.pos, d.pos); const dist = a.length(); if (dist < 7 && !j.deco) j.repel.addScaledVector(a.normalize(), (7 - dist) * 1.6); }
    if (whale.songCD <= 0 && whale.answerT < 0) { whale.answerT = 0.7; }
    if (!G.hints.call && G.songsHeard >= 1) G.hints.call = true;
  }

  // ---- riding a song line ----
  if (d.riding) {
    const L = d.riding;
    const tgtSpeed = inp.kick ? 20 : 15.5;
    d.rideSpeed = damp(d.rideSpeed, tgtSpeed, 2.2, dt);
    d.rideS += d.rideSpeed * dt;
    // she can't overtake the pen while the song is still being drawn; once drawn, she glides off its end
    if (L.drawn < L.len && d.rideS > L.drawn - 1.5) { d.rideS = L.drawn - 1.5; }
    const tan = L.tangent(d.rideS);
    const nrm = V3(-tan.y, tan.x, 0);
    const perp = inp.x * nrm.x + inp.y * nrm.y;
    d.rideOff = clamp(d.rideOff + perp * dt * 2.4, -0.8, 0.8);
    if (Math.abs(perp) < 0.2) d.rideOff = damp(d.rideOff, 0, 2, dt);
    d.push = Math.abs(perp) > 0.7 ? d.push + dt : 0;
    const p = L.at(d.rideS).addScaledVector(nrm, d.rideOff);
    d.vel.subVectors(p, d.pos).divideScalar(Math.max(dt, 1e-4)); d.vel.z = 0; // the line's slight depth wobble must not turn her toward the camera
    d.vel.clampLength(0, 26);
    d.pos.copy(p); d.pos.z = damp(d.pos.z, 0, 4, dt);
    L.mat.uniforms.uRiding.value = 1; L.mat.uniforms.uRiderS.value = d.rideS;
    G.breath = Math.min(100, G.breath + 4.5 * dt);
    d.kickAmp = damp(d.kickAmp, 0.22, 3, dt); d.dolphin = damp(d.dolphin, 1, 3, dt); d.kickPhase += dt * 5;
    d.glow = damp(d.glow, 1, 4, dt);
    const end = d.rideS >= L.len - 1.2 || L.fade < 0.3 || d.push > 0.22 || L.dead;
    if (end) {
      d.vel.copy(tan).setZ(0).multiplyScalar(d.rideSpeed * 0.75);
      if (d.push > 0.22) d.vel.addScaledVector(nrm, Math.sign(perp) * 5);
      else if (d.rideS >= L.len - 1.2) for (let i = 0; i < 10; i++) sparks.spawn(d.pos, V3(R(-1, 1), R(-1, 1), R(-0.3, 0.3)).normalize().multiplyScalar(R(1.5, 4)).addScaledVector(tan, 3), R(0.4, 0.8), R(0.15, 0.35));
      L.mat.uniforms.uRiding.value = 0; d.detachLine = L; d.detachT = 0.7; d.riding = null;
    }
    // speed streaks (video look)
    if (Math.random() < dt * 22) {
      const off = V3(R(-1, 1), R(-1, 1), R(-1.5, 0.6)).multiplyScalar(2.2);
      spawnStreak(d.pos.clone().add(off).addScaledVector(tan, R(-3, 1)), tan, R(3, 8), R(0.35, 0.7), R(0.5, 1));
    }
    if (Math.random() < dt * 30) sparks.spawn(d.pos.clone().addScaledVector(tan, -1.1), V3(R(-0.5, 0.5), R(-0.5, 0.5), R(-0.3, 0.3)), R(0.5, 1), R(0.12, 0.3));
  } else {
    // ---- free swimming ----
    const maxSp = inp.kick ? 8.6 : 5.6, acc = inp.kick ? 20 : 13;
    const il = Math.hypot(inp.x, inp.y);
    d.vel.x += inp.x * acc * dt; d.vel.y += inp.y * acc * dt;
    const sp = d.vel.length();
    if (sp > maxSp) d.vel.multiplyScalar(damp(sp, maxSp, 3.5, dt) / sp);
    d.vel.multiplyScalar(Math.exp(-dt * (il > 0.1 ? 0.6 : 1.15)));
    d.vel.y += Math.sin(t * 1.3) * 0.12 * dt; // gentle buoyancy bob
    // keep near the route (soft bounds)
    const ry = routeY(d.pos.x), dy = d.pos.y - ry;
    if (Math.abs(dy) > 22) d.vel.y -= Math.sign(dy) * (Math.abs(dy) - 22) * 3 * dt;
    if (d.pos.x < -6) d.vel.x += (-6 - d.pos.x) * 4 * dt;
    if (d.pos.y > SURFACE_Y - 2) d.vel.y -= (d.pos.y - SURFACE_Y + 2) * 6 * dt;
    d.pos.addScaledVector(d.vel, dt); d.pos.z = damp(d.pos.z, 0, 3, dt);
    d.kickAmp = damp(d.kickAmp, il > 0.1 ? (inp.kick ? 1.35 : 1.0) : 0.28, 3, dt);
    d.dolphin = damp(d.dolphin, 0, 3, dt);
    d.kickPhase += dt * (il > 0.1 ? (inp.kick ? 11 : 7.5) : 2.4);
    d.glow = damp(d.glow, 0, 2, dt);
    // breath
    G.breath -= dt * (canControl ? (inp.kick && il > 0.1 ? 3.4 : 1.7) : 0);
    // catch a line
    if (canControl) {
      for (const L of lines) {
        if (L.dead || L.delay > 0 || L.fade < 0.5) continue;
        if (L === d.detachLine && d.detachT > 0) continue;
        const c = L.closest(d.pos);
        if (c.d < 1.35 && c.s < L.drawn - 2 && c.s < L.len - 4) {
          const tan = L.tangent(c.s);
          if (d.vel.dot(tan) > -1.5) {
            const lp = L.at(c.s), ln = V3(-tan.y, tan.x, 0);
            d.riding = L; d.rideS = c.s; d.rideSpeed = Math.max(8, d.vel.dot(tan)); d.push = 0;
            d.rideOff = clamp((d.pos.x - lp.x) * ln.x + (d.pos.y - lp.y) * ln.y, -0.8, 0.8);
            AudioSys.chime(L.chime + 2, 0.12); spawnRing(d.pos.clone(), 3, 0.6, '#ffffff', 0.08, 0.7);
            if (!G.firstRide) { G.firstRide = true; setTimeout(() => showHint('Press Space to sing — the whale answers', 4.5, 'call'), 2500); }
            break;
          }
        }
      }
    }
  }
  // bubbles from the diver
  d.bubbleT -= dt;
  if (d.bubbleT <= 0) {
    d.bubbleT = R(0.9, 2.2);
    const head = diverObj.mesh.localToWorld(diverObj.head.clone());
    const n = Math.floor(R(2, 5));
    for (let i = 0; i < n; i++) bubbles.spawn(head.clone().add(V3(R(-0.1, 0.1), R(0, 0.2), R(-0.1, 0.1))), V3(R(-0.3, 0.3), R(0.6, 1.4), 0), R(1.8, 3.2), R(0.07, 0.16), 1);
  }
  // shader params
  diverObj.uniforms.uKick.value = d.kickPhase;
  diverObj.uniforms.uKickAmp.value = d.kickAmp;
  diverObj.uniforms.uDolphin.value = d.dolphin;
  diverObj.uniforms.uHurt.value = d.hurt + (d.invuln > 0 ? 0.25 * (Math.sin(t * 30) > 0 ? 1 : 0) : 0);
  diverObj.uniforms.uGlow.value = d.glow;
  orientDiver(dt);
  d.speed = d.vel.length();
}

// collisions & pickups
const _a = V3(), _bb = V3();
function segDist(p, a, b) { _bb.subVectors(b, a); const tt = clamp(_a.subVectors(p, a).dot(_bb) / _bb.lengthSq(), 0, 1); return _a.copy(a).addScaledVector(_bb, tt).distanceTo(p); }
function interactions(dt) {
  const d = diver;
  const f = V3(0, 1, 0).applyQuaternion(d.quat);
  const head = d.pos.clone().addScaledVector(f, 0.85), feet = d.pos.clone().addScaledVector(f, -1.0);
  // notes
  for (const n of notes) {
    if (n.state !== 'live') continue;
    const r = d.riding ? 1.6 : 1.25;
    if (segDist(n.sp.position, head, feet) < r) n.take();
  }
  // jellyfish stings
  if (d.invuln <= 0 && G.state === 'play') {
    for (const j of jellies) {
      if (j.deco || j.dead) continue;
      const bell = j.bell;
      if (Math.abs(bell.x - d.pos.x) > 4) continue;
      // bell (r~0.55) + tentacles (thin capsule below it) vs the diver's body capsule (r~0.3)
      const tl = j.tail;
      let hit = segDist(bell, head, feet) < 0.85;
      if (!hit) for (let k = 1; k <= 4 && !hit; k++) { const q = bell.clone().lerp(tl, k / 4); hit = segDist(q, head, feet) < 0.55; }
      if (hit) {
        G.breath = Math.max(0, G.breath - 18); G.stings++;
        const away = V3().subVectors(d.pos, bell).setZ(0).normalize();
        if (d.riding) { d.riding.mat.uniforms.uRiding.value = 0; d.detachLine = d.riding; d.detachT = 1.0; d.riding = null; }
        d.vel.copy(away).multiplyScalar(9);
        d.invuln = 1.5; d.hurt = 1; G.flash = 0.35; G.flashCol.set('#ff8a7a'); G.shake = 0.5;
        AudioSys.sting();
        for (let i = 0; i < 16; i++) sparks.spawn(bell, V3(R(-1, 1), R(-1, 1), 0).normalize().multiplyScalar(R(2, 5)), R(0.3, 0.7), R(0.15, 0.35));
        if (!G.hints.jelly) showHint('Jellyfish sting — sing to push them away', 4, 'jelly');
        break;
      }
    }
  }
  // the song wave gives breath when it washes over the diver
  if (whale.singT > 0.6 && whale.singT < 1.4 && !G.songBreathGiven) { G.songBreathGiven = true; G.breath = Math.min(100, G.breath + 6); }
}

// =====================================================================
//  camera
// =====================================================================
const camState = { pos: V3(0, 3, 22), look: V3(), dist: 18, fov: 40, init: false };
function updateCamera(dt, t) {
  const d = diver;
  const ascentK = smooth((d.pos.x - ASCENT_X + 30) / 160);
  let target, dist, yaw, pitch;
  if (G.state === 'title') {
    target = V3(d.pos.x + 3 + Math.sin(t * 0.05) * 2, d.pos.y + 0.5, 0);
    dist = 19; yaw = 0.18 * Math.sin(t * 0.04) - 0.08; pitch = 0.12;
  } else {
    const lead = V3(d.vel.x, d.vel.y, 0).multiplyScalar(0.33);
    target = d.pos.clone().add(lead);
    const wk = smooth(1 - Math.abs(whale.pos.x - d.pos.x) / 38) * smooth(1 - Math.abs(whale.pos.y - d.pos.y + 7) / 14);
    camState.whaleK = damp(camState.whaleK || 0, wk, 1.2, dt);
    target.y += lerp(0.6, 2.5, ascentK) - camState.whaleK * 2.4;
    dist = 17 + clamp(d.speed - 6, 0, 14) * 0.38 + (whale.singT >= 0 ? 2 : 0) + ascentK * 3 + camState.whaleK * 3;
    yaw = 0.11 * Math.sin(t * 0.07) + clamp(d.vel.x, -12, 12) * 0.004;
    pitch = lerp(0.13 + 0.04 * Math.sin(t * 0.05), -0.32, ascentK);
    if (G.state === 'end' || G.state === 'over') { pitch = -0.42; dist = 24; }
  }
  if (DEBUG && params.has('zoom')) dist = +params.get('zoom');
  camState.dist = damp(camState.dist, dist, 1.5, dt);
  const cd = camState.dist;
  const want = V3(target.x + Math.sin(yaw) * cd, target.y + Math.sin(pitch) * cd, Math.cos(yaw) * Math.cos(pitch) * cd);
  if (!camState.init) { camState.pos.copy(want); camState.look.copy(target); camState.init = true; }
  camState.pos.lerp(want, 1 - Math.exp(-dt * 2.6));
  camState.look.lerp(target, 1 - Math.exp(-dt * 4));
  camera.position.copy(camState.pos);
  if (G.shake > 0) { camera.position.x += (Math.random() - 0.5) * G.shake; camera.position.y += (Math.random() - 0.5) * G.shake; G.shake = Math.max(0, G.shake - dt * 1.4); }
  camera.lookAt(camState.look);
  camState.fov = damp(camState.fov, 40 + clamp(d.speed - 8, 0, 12) * 0.45, 2, dt);
  camera.fov = camState.fov; camera.updateProjectionMatrix();
}

// =====================================================================
//  atmosphere (water colour, light) driven by depth/progress
// =====================================================================
const C_DEEP = new THREE.Color('#0f4a6d'), C_SURF = new THREE.Color('#3f9fc4'), C_REEF = new THREE.Color('#14587d');
function updateAtmosphere(dt) {
  const k = clamp(diver.pos.y / (SURFACE_Y - 10), 0, 1);
  G.lightK = damp(G.lightK, k, 1.5, dt);
  const fog = SHARED.fogColor.value;
  fog.copy(C_DEEP).lerp(C_SURF, G.lightK);
  SHARED.fogDensity.value = lerp(0.0078, 0.0055, G.lightK);
  backdrop.material.uniforms.uMix.value = smooth(G.lightK * 1.2);
  backdrop.material.uniforms.uBright.value = 1 - G.lightK * 0.12;
  bloom.threshold = lerp(0.88, 1.35, G.lightK); bloom.strength = lerp(0.6, 0.38, G.lightK);
  backdrop.material.uniforms.uOff.value.set(Math.sin(camera.position.x * 0.0021) * 0.06 + (camera.rotation.y) * -0.25, clamp(camera.position.y * 0.0012, -0.05, 0.12) + camera.rotation.x * 0.25);
  surface.material.uniforms.uK.value = smooth((diver.pos.y - 30) / 60);
  lineDim.value = 1 - 0.4 * G.lightK;
  AudioSys.setUnderwater(G.lightK);
}

// =====================================================================
//  main loop
// =====================================================================
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 1 / 20);
  G.t += dt; const t = G.t; SHARED.time.value = t;
  const inp = readInput(); pressed.clear();

  if (G.state === 'play') {
    G.playT += dt;
    // verses
    const v = verseAt(diver.pos.x);
    if (v !== G.verse) { G.verse = v; showVerse(v); }
    // checkpoints every 100 m
    if (diver.pos.x > G.checkpoint.x + 100) G.checkpoint.set(diver.pos.x, routeY(diver.pos.x) + 2, 0);
    // chunk spawning
    const ci = Math.floor((diver.pos.x + 110) / 40); for (let c = ci - 3; c <= ci; c++) spawnChunk(c);
    // breath / faint
    if (G.breath < 28) { G.lastHeart -= dt; if (G.lastHeart <= 0) { AudioSys.heartbeat(); G.lastHeart = lerp(0.7, 1.2, G.breath / 28); } if (!G.hints.breath) showHint('Out of breath — ride her song or find rising bubbles', 4.5, 'breath'); }
    if (G.breath <= 0) { G.state = 'faint'; G.faintT = 0; G.faints++; hintTimer = 0; hud.hint.style.opacity = 0; if (diver.riding) { diver.riding.mat.uniforms.uRiding.value = 0; diver.riding = null; } }
    // the end: reaching the light
    if (diver.pos.y > SURFACE_Y - 24 || diver.pos.x > WORLD_END) {
      G.state = 'end'; G.endT = 0; whale.mode = 'end'; whale.modeT = 0; hud.el.style.opacity = 0;
      AudioSys.play('call1', { vol: 1, rate: 0.9, wet: 0.8 });
      if (diver.riding) { diver.riding.mat.uniforms.uRiding.value = 0; diver.riding = null; }
      // frame the last shot like the video: reef ledges hanging above, the light beyond
      const [a, b, c] = G.endReefs, d = diver.pos;
      a.position.set(d.x + 28, d.y + 21, 3); b.position.set(d.x - 22, d.y + 29, -20); c.position.set(d.x + 52, d.y + 30, -12); // keep her rising path clear, ledge top-right as in the last frame
      showHint('', 0.01);
    }
  } else if (G.state === 'faint') {
    G.faintT += dt;
    G.fade = smooth(G.faintT / 1.6);
    if (G.faintT > 2.2) {
      // the whale carries her back to the last calm water
      diver.pos.copy(G.checkpoint); diver.vel.set(3, 0, 0); G.breath = 75;
      for (const L of lines) if (!L.dead) L.dispose();
      lines.length = 0;
      whale.pos.set(diver.pos.x - 16, diver.pos.y - 11, -14); whale.heading.set(1, 0, 0);
      orientDiver(1, true); resetScarf();
      G.state = 'play'; G.fade = 1; whale.autoT = 2.5; whale.songCD = 0;
      showHint('The whale carried you back', 3);
    }
  } else if (G.state === 'end') {
    G.endT += dt;
    if (G.endT > 2.5) { G.flashCol.set('#eafcff'); G.flash = smooth((G.endT - 2.5) / 4.5); }
    if (G.endT > 6.5) { G.fade = smooth((G.endT - 6.5) / 2.5) * 0.9; finalPass.uniforms.uFadeCol.value.set('#0e4a68'); }
    if (G.endT > 7.5 && G.state !== 'over') {
      G.state = 'over';
      const pct = G.notesTotal ? Math.round(100 * G.notes / G.notesTotal) : 0;
      const mm = Math.floor(G.playT / 60), ss = Math.floor(G.playT % 60).toString().padStart(2, '0');
      $('#endStats').innerHTML = `you sang <em>${G.notes}</em> of her <em>${G.notesTotal}</em> notes &middot; harmony <em>${pct}%</em><br>${mm}:${ss} beneath the waves${G.faints ? ` &middot; ${G.faints} time${G.faints > 1 ? 's' : ''} carried` : ''}`;
      $('#end').style.opacity = 1;
    }
  }

  if (G.state === 'title') { diver.vel.set(Math.sin(t * 0.5) * 0.3, Math.sin(t * 0.7) * 0.25, 0); diver.pos.addScaledVector(diver.vel, dt); diver.kickPhase += dt * 2; diverObj.uniforms.uKick.value = diver.kickPhase; diverObj.uniforms.uKickAmp.value = 0.35; orientDiver(dt); }
  else updateDiver(dt, t, inp);
  G.breath = clamp(G.breath, 0, 100);

  updateWhale(dt, t);
  for (const L of lines) L.update(dt);
  for (let i = lines.length - 1; i >= 0; i--) if (lines[i].dead) { if (diver.riding === lines[i]) diver.riding = null; lines.splice(i, 1); }
  for (const n of notes) n.update(dt, t);
  for (let i = notes.length - 1; i >= 0; i--) if (notes[i].state === 'dead') notes.splice(i, 1);
  for (const j of jellies) { j.update(dt, t); if (j.pos.x < diver.pos.x - 90 || j.pos.y > routeY(j.pos.x) + 40) j.kill(); }
  for (let i = jellies.length - 1; i >= 0; i--) if (jellies[i].dead) jellies.splice(i, 1);
  if (G.state === 'play') interactions(dt);
  updateFish(dt, t);
  updateVents(dt, t);
  updateScarf(dt, t);
  updateCamera(dt, t);
  updateAtmosphere(dt);
  updateRays(t); updateSilhouettes();
  snow.material.uniforms.uCam.value.copy(camera.position);
  bubbles.update(dt, t); sparks.update(dt, t);
  updateRings(dt); updateStreaks(dt);
  // the pen-heads of lines being drawn leave sparkles
  for (const L of lines) if (L.delay <= 0 && L.drawn < L.len) { const p = L.at(L.drawn); if (Math.random() < 0.8) sparks.spawn(p, V3(R(-1, 1), R(-1, 1), 0), R(0.3, 0.6), R(0.2, 0.45)); }

  // post
  pointScale.value = (innerHeight * PR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  const fu = finalPass.uniforms;
  fu.uTime.value = t;
  if (G.state === 'title' || G.state === 'play') G.fade = damp(G.fade, 0, G.state === 'title' ? 0.9 : 2, dt);
  if (G.state === 'over') { G.endT += dt; G.fade = Math.min(0.9, G.fade + dt * 0.4); }
  fu.uFade.value = G.fade;
  if (G.state !== 'end' && G.state !== 'over') G.flash = Math.max(0, G.flash - dt * 1.2);
  fu.uFlash.value = G.flash; fu.uFlashCol.value.copy(G.flashCol);
  const low = G.state === 'play' ? smooth((30 - G.breath) / 30) : 0;
  fu.uLow.value = damp(fu.uLow.value, low, 3, dt); fu.uDesat.value = fu.uLow.value * 0.7;
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) hud.hint.style.opacity = 0; }
  if (verseTimer > 0) { verseTimer -= dt; if (verseTimer <= 0) hud.verse.style.opacity = 0; }
  if (G.state === 'play' || G.state === 'faint') hud.update();
  composer.render(dt);
  if (DEBUG) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { const el = $('#fps'); el.style.display = 'block'; el.textContent = `${(fpsN / fpsAcc).toFixed(0)} fps  x=${diver.pos.x.toFixed(0)} y=${diver.pos.y.toFixed(0)} breath=${G.breath.toFixed(0)} lines=${lines.length} notes=${G.notes}/${G.notesTotal} ${G.state}`; fpsAcc = 0; fpsN = 0; } }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
  finalPass.uniforms.uRes.value.set(innerWidth, innerHeight);
  if (backdrop) backdrop.material.uniforms.uAspect.value = innerWidth / innerHeight;
});
finalPass.uniforms.tPaper.value = T.paper;
</script>
