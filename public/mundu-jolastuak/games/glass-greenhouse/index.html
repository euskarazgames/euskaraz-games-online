import * as THREE from 'three';

// =====================================================================================
// Config
// =====================================================================================
const Q = new URLSearchParams(location.search);
const DBG = { auto: Q.has('auto') || Q.has('bot') || Q.has('tier'), bot: Q.has('bot'), tier: parseInt(Q.get('tier') || '0', 10), nopost: Q.has('nopost'), fast: parseFloat(Q.get('fast') || '1') };
const R = 10, FLOOR_Y = -5.6, DEG = Math.PI / 180;
const LATS = [-75, -56, -33.4, -13.3, 5.2, 23.6, 43.6, 58, 72];
const CELL = 22.5;
const CAM_H = 3.4; // camera height above the robot (the video's camera is almost level with it)
const ROBOT_H = 0.95, STEP_UP = 0.5, SPEED = 3.7, GRAV = 24, JUMP_V = 7.7;
const SUN_DIR = new THREE.Vector3(0.62, 0.70, 0.36).normalize();
const wr = (y) => Math.sqrt(Math.max(0, R * R - y * y));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const sph = (th, lat, r = R) => new THREE.Vector3(r * Math.cos(lat * DEG) * Math.sin(th * DEG), r * Math.sin(lat * DEG), r * Math.cos(lat * DEG) * Math.cos(th * DEG));
const polar = (th, rho, y) => new THREE.Vector3(rho * Math.sin(th * DEG), y, rho * Math.cos(th * DEG));
const angOf = (x, z) => Math.atan2(x, z) / DEG;
const normAng = (a, base) => { let d = (a - base) % 360; if (d < 0) d += 360; return base + d; };
const angDiff = (a, b) => { let d = (a - b) % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = (id) => document.getElementById(id);
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// =====================================================================================
// Level
// =====================================================================================
const LEVEL = {
  spawn: { th: -28, rho: 5.4, y: FLOOR_Y, face: 75 },
  ledges: [
    { id: 'T1a', top: -2.15, th0: 94, th1: 141, rin: 6.9, thick: 1.2, seed: 11 },
    { id: 'T1b', top: -2.15, th0: 148, th1: 210, rin: 6.9, thick: 1.2, seed: 12 },
    { id: 'T2', top: 1.05, th0: 226, th1: 326, rin: 6.8, thick: 1.2, seed: 13, narrow: [259, 284, 8.75] },
    { id: 'T3', top: 4.15, th0: -20, th1: 66, rin: 6.2, thick: 1.2, seed: 14 },
  ],
  doors: [
    { cell: 1, band: 2, top: FLOOR_Y, bed: [36, 7.6], time: 13 },
    { cell: 8, band: 3, top: -2.15, bed: [192, 7.9], time: 12 },
    { cell: 13, band: 4, top: 1.05, bed: [304, 7.6], time: 11.5 },
    { cell: 2, band: 5, top: 4.15, bed: [56, 6.6], time: 11.5 },
  ],
  stairs: [
    { from: FLOOR_Y, to: -2.15, n: 9, path: [[44, 7.1], [72, 7.5], [101, 8.25]], target: 'T1a' },
    { from: -2.15, to: 1.05, n: 8, path: [[199, 7.6], [217, 7.9], [235, 8.4]], target: 'T2' },
    { from: 1.05, to: 4.15, n: 8, path: [[311, 7.4], [330, 7.5], [349.5, 7.7]], target: 'T3' },
    { from: 4.15, to: 7.0, n: 7, path: [[63, 6.5], [82, 5.2], [99, 2.75]], target: 'crown' },
  ],
  crown: { y: 7.0, r: 2.65 },
  rocks: [[-62, 6.5, 0.85, 0.62], [138, 5.6, 0.7, 0.48], [-108, 4.6, 0.62, 0.42], [-160, 7.1, 0.75, 0.55]],
};

// =====================================================================================
// Renderer / scene
// =====================================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
// Two hazes, as in the video. Inside the glass the air is thick with a pale blue-green mist: the haze
// grows with the length of the view ray that runs *inside the sphere* (analytic ray / sphere test), so the
// robot stays crisp, the far side of the greenhouse melts away, and the sphere seen from far away keeps its
// dark iron and contrast. Outside, a thin aerial perspective over long distances (cloud sea).
// fogNear = inside length scale, fogFar = outside length scale.
const HAZE = new THREE.Color('#bfd0d0');
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
  varying float vFogDepth; varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vFogDepth = - mvPosition.z;
  vFogWorld = transpose(mat3(viewMatrix)) * (mvPosition.xyz - viewMatrix[3].xyz);
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
  uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogWorld;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear; uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  {
    vec3 rd = vFogWorld - cameraPosition; float L = length(rd); rd /= max(L, 1e-4);
    float b = dot(cameraPosition, rd), c = dot(cameraPosition, cameraPosition) - ${(R * R).toFixed(2)};
    float disc = b * b - c, inside = 0.0;
    if (disc > 0.0) { float s = sqrt(disc); inside = max(min(-b + s, L) - max(-b - s, 0.0), 0.0); }
    float fIn = 0.52 * (1.0 - exp(-max(inside - 3.0, 0.0) / fogNear));
    float fOut = 0.55 * (1.0 - exp(-max(L - inside - 24.0, 0.0) / fogFar));
    float fogFactor = 1.0 - (1.0 - fIn) * (1.0 - fOut);
    vec3 hz = fogColor * mix(0.86, 1.08, smoothstep(-9.0, 9.0, vFogWorld.y));
    gl_FragColor.rgb = mix(gl_FragColor.rgb, hz, fogFactor);
  }
#endif`;
scene.fog = new THREE.Fog(HAZE, 15.0, 160.0);
const FOG_U = () => THREE.UniformsUtils.clone(THREE.UniformsLib.fog);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 2500);
window.EGMobileView(renderer,camera);

camera.position.set(0, 4, 34);

// soft overcast-blue fill (cool teal shadows) + a warm low-ish key sun, as in the video
const hemi = new THREE.HemisphereLight(new THREE.Color('#b9cfd6'), new THREE.Color('#25362f'), 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(new THREE.Color('#ffe7bd'), 3.5);
sun.position.copy(SUN_DIR).multiplyScalar(32);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 8, far: 62 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);

// x-ray uniforms shared by occluders (frame, glass, foliage) so the robot stays visible
const XR = { uXrPos: { value: new THREE.Vector2(0.5, 0.5) }, uXrRes: { value: new THREE.Vector2(1, 1) }, uXrRad: { value: 0.1 }, uXrDist: { value: 0 }, uXrAmt: { value: 0 } };
const XR_GLSL = `
uniform vec2 uXrPos; uniform vec2 uXrRes; uniform float uXrRad; uniform float uXrDist; uniform float uXrAmt;
float xrBayer(vec2 p){ vec2 q = mod(floor(p), 4.0); float i = q.x + q.y*4.0;
  return mod(i*7.0 + floor(i/4.0)*5.0, 16.0)/16.0 + 0.03; }
float xrFade(float dist){ vec2 sp = gl_FragCoord.xy / uXrRes; vec2 d = (sp - uXrPos) * vec2(uXrRes.x/uXrRes.y, 1.0);
  float r = length(d) / uXrRad; if (r > 1.0 || dist > uXrDist - 0.55) return 0.0; return (1.0 - smoothstep(0.45, 1.0, r)) * uXrAmt; }
`;
function addXray(mat, alphaMode = false) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, XR);
    sh.fragmentShader = XR_GLSL + sh.fragmentShader;
    if (alphaMode) {
      sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n gl_FragColor.a *= 1.0 - 0.8*xrFade(length(vViewPosition));');
    } else {
      sh.fragmentShader = sh.fragmentShader.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n if (xrBayer(gl_FragCoord.xy) < xrFade(length(vViewPosition))) discard;');
    }
  };
  return mat;
}

// =====================================================================================
// Assets
// =====================================================================================
const loading = { done: 0, total: 0 };
function track(p) { loading.total++; return p.then((v) => { loading.done++; $('lfill').style.width = (100 * loading.done / loading.total) + '%'; return v; }); }
const texLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();
function loadTex(url, opt = {}) {
  return track(texLoader.loadAsync(url).then((t) => {
    t.colorSpace = opt.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    if (opt.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    t.anisotropy = opt.aniso ?? 8;
    if (opt.nomip) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
    return t;
  }));
}
const loadJSON = (u) => track(fetch(u).then((r) => r.json()));
const loadGLB = (u) => track(gltfLoader.loadAsync(u));

const AUDIO_FILES = ['music', 'amb_wind', 'sfx_open', 'sfx_close', 'sfx_beam', 'sfx_bloom', 'sfx_step', 'sfx_seed', 'sfx_jump', 'sfx_land', 'sfx_foot', 'sfx_wilt', 'sfx_root', 'sfx_iris', 'sfx_win', 'sfx_start', 'sfx_creak'];
const AC = new (window.AudioContext || window.webkitAudioContext)();
const master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
const musicGain = AC.createGain(); musicGain.gain.value = 0.0; musicGain.connect(master);
const sfxGain = AC.createGain(); sfxGain.gain.value = 0.85; sfxGain.connect(master);
const BUF = {};
function loadAudio(name) {
  return track(fetch(`assets/audio/${name}.mp3`).then((r) => r.ok ? r.arrayBuffer() : null).then((ab) => ab ? AC.decodeAudioData(ab) : null).then((b) => { BUF[name] = b; }).catch(() => { BUF[name] = null; }));
}
function sfx(name, { vol = 1, rate = 1, delay = 0 } = {}) {
  const b = BUF[name]; if (!b || AC.state !== 'running') return null;
  const s = AC.createBufferSource(); s.buffer = b; s.playbackRate.value = rate;
  const g = AC.createGain(); g.gain.value = vol; s.connect(g); g.connect(sfxGain);
  s.start(AC.currentTime + delay); return s;
}
let musicSrc = null, windSrc = null, muted = false;
function startLoops() {
  if (AC.state !== 'running') return;
  if (!musicSrc && BUF.music) { musicSrc = AC.createBufferSource(); musicSrc.buffer = BUF.music; musicSrc.loop = true; musicSrc.connect(musicGain); musicSrc.start(); musicGain.gain.setTargetAtTime(0.42, AC.currentTime, 1.5); }
  if (!windSrc && BUF.amb_wind) { windSrc = AC.createBufferSource(); windSrc.buffer = BUF.amb_wind; windSrc.loop = true; const g = AC.createGain(); g.gain.value = 0.32; windSrc.connect(g); g.connect(master); windSrc.start(); }
}
function unlockAudio() { if (AC.state !== 'running') AC.resume().then(startLoops); else startLoops(); }

const A = {};
async function loadAll() {
  const jobs = {
    sky: loadTex('assets/tex/sky.jpg', { nomip: true }), moss: loadTex('assets/tex/moss.jpg', { repeat: true }), stone: loadTex('assets/tex/stone.jpg', { repeat: true }),
    ground: loadTex('assets/tex/ground.jpg'), bark: loadTex('assets/tex/bark.jpg', { repeat: true }),
    iron: loadTex('assets/tex/iron.jpg', { repeat: true }), beam: loadTex('assets/tex/beam.jpg', { repeat: true, linear: true }), glow: loadTex('assets/tex/glow.jpg'),
    flowersT: loadTex('assets/sprites/flowers.webp'), foliageT: loadTex('assets/sprites/foliage.webp'), grassT: loadTex('assets/sprites/grass.webp'),
    ivyT: loadTex('assets/sprites/ivy.webp'), cloudsT: loadTex('assets/sprites/clouds.webp'),
    flowersJ: loadJSON('assets/sprites/flowers.json'), foliageJ: loadJSON('assets/sprites/foliage.json'), grassJ: loadJSON('assets/sprites/grass.json'),
    ivyJ: loadJSON('assets/sprites/ivy.json'), cloudsJ: loadJSON('assets/sprites/clouds.json'),
    robot: loadGLB('assets/models/robot.glb'), step: loadGLB('assets/models/step.glb'), finial: loadGLB('assets/models/finial.glb'), crank: loadGLB('assets/models/crank.glb'),
  };
  AUDIO_FILES.forEach((n) => loadAudio(n));
  const keys = Object.keys(jobs);
  const vals = await Promise.all(keys.map((k) => jobs[k].catch((e) => { console.warn('asset failed', k, e); return null; })));
  keys.forEach((k, i) => { A[k] = vals[i]; });
  while (loading.done < loading.total) await new Promise((r) => setTimeout(r, 30));

// Shared GLSL
// =====================================================================================
const SKY_GLSL = `
uniform sampler2D uSky; uniform vec3 uSkyTop; uniform vec3 uSkyBot; uniform vec3 uSunDir;
vec3 skyColor(vec3 d){
  d = normalize(d);
  float u = atan(d.x, d.z) / 6.2831853 + 0.5;
  float e = asin(clamp(d.y, -1.0, 1.0)) * 57.29578;
  float v = e >= 0.0 ? 0.40 + e / 40.0 * 0.58 : 0.40 + e / 24.0 * 0.40;
  vec3 c = texture2D(uSky, vec2(u * 2.0 + 0.35, clamp(v, 0.003, 0.997))).rgb;
  // video sky: pale cyan-grey, cloud sea shaded in blue-grey (the painted sky is warm cream: re-tone it)
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  vec3 tone = mix(vec3(0.19, 0.30, 0.37), vec3(0.66, 0.76, 0.79), smoothstep(0.30, 0.92, l));
  c = mix(tone, c * vec3(0.86, 0.96, 1.02), 0.22);
  c = mix(c, uSkyTop, smoothstep(0.80, 1.3, v));
  c = mix(c, uSkyBot, smoothstep(0.10, -0.3, v));
  float s = max(dot(d, uSunDir), 0.0);
  c += vec3(1.0, 0.92, 0.76) * (pow(s, 90.0) * 1.1 + pow(s, 8.0) * 0.20 + pow(s, 2.0) * 0.06);
  return c;
}`;
const skyUniforms = { uSky: { value: null }, uSkyTop: { value: new THREE.Color('#9db8c5') }, uSkyBot: { value: new THREE.Color('#c9d4d4') }, uSunDir: { value: SUN_DIR } };
// albedo grading shared by the painted textures: pulls the lime/yellow greens of the sprites towards the
// video's olive / teal greens (hue rotation towards cyan, less chroma)
const ALB_GLSL = `
vec3 albGrade(vec3 c, float sat, float hue, vec3 tint){
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  // rotate hue around the grey axis (hue > 0 -> yellow-green goes green / teal)
  const vec3 k = vec3(0.57735);
  float ch = cos(hue), sh = sin(hue);
  c = c * ch + cross(k, c) * sh + k * dot(k, c) * (1.0 - ch);
  c = max(mix(vec3(l), c, sat), 0.0);
  return c * tint;
}
`;
// Dappled canopy light inside the sphere (a leafy light "cookie" projected along the sun direction) and a
// darker, enclosed ambient at the bottom of the greenhouse: the video's floor sits in cool shade with warm
// patches of sun. Only inside the glass; the iron, ivy and the robot keep the open light.
const GOBO_GLSL = (() => {
  const s = SUN_DIR, t1 = new THREE.Vector3().crossVectors(s, new THREE.Vector3(0, 1, 0)).normalize(), t2 = new THREE.Vector3().crossVectors(t1, s).normalize();
  const v = (x) => `vec3(${x.x.toFixed(4)}, ${x.y.toFixed(4)}, ${x.z.toFixed(4)})`;
  return `
float ggHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float ggNoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(ggHash(i), ggHash(i + vec2(1.0, 0.0)), f.x), mix(ggHash(i + vec2(0.0, 1.0)), ggHash(i + vec2(1.0, 1.0)), f.x), f.y); }
float ggInside(vec3 w){ return (1.0 - smoothstep(9.3, 9.75, length(w))) * (1.0 - smoothstep(6.6, 7.6, w.y)); }
float ggGobo(vec3 w){
  vec2 uv = vec2(dot(w, ${v(t1)}), dot(w, ${v(t2)})) * 0.62;
  float n = ggNoise(uv) * 0.58 + ggNoise(uv * 2.3 + 7.1) * 0.29 + ggNoise(uv * 5.3 + 3.7) * 0.13;
  return mix(1.0, mix(0.16, 1.0, smoothstep(0.43, 0.6, n)), ggInside(w));
}
float ggAmb(vec3 w){ return mix(1.0, mix(0.4, 1.0, smoothstep(-6.0, 7.0, w.y)), ggInside(w)); }
`;
})();

function buildClouds() {

function cellPatch(th0, th1, lat0, lat1, r = R, nu = 6, nv = 6) {
  const pos = [], nor = [], uv = [], idx = [];

function makeGlassMaterial(side) {

    uniforms: { ...skyUniforms, ...XR, ...FOG_U(), uTint: { value: new THREE.Color('#9fb9b8') }, uLight: { value: 1 } },
    transparent: true, depthWrite: false, side, fog: true,

      #include <fog_pars_vertex>

      vec4 mvPosition = viewMatrix * w; vViewPosition = -mvPosition.xyz; gl_Position = projectionMatrix * mvPosition;

    fragmentShader: SKY_GLSL + XR_GLSL + `uniform vec3 uTint; varying vec3 vW; varying vec3 vN; varying vec3 vViewPosition; varying vec2 vUv;

    let r = L.rin + 0.28 * Math.sin(th * 0.19 + s) + 0.16 * Math.sin(th * 0.47 + s * 2.1) + 0.08 * Math.sin(th * 1.3 + s * 0.7);

function taperTube(points, r0, r1, segs = 28, rs = 10, vRep = 3) {

  }
  g.computeVertexNormals();

}

function leafCloud(cards, name) {
  const n = cards.length;
  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([-.5, -.5, 0, .5, -.5, 0, .5, .5, 0, -.5, .5, 0], 3));
  geo.setIndex([0, 1, 2, 0, 2, 3]);

  cards.forEach((c, k) => {
    iPos.set([c.pos.x, c.pos.y, c.pos.z], k * 3);
    iUv.set([c.s.x, 1 - c.s.y - c.s.h, c.s.w, c.s.h], k * 4);
    iSize[k] = c.size; iRot[k] = c.rot;
    // painterly two-tone volume: x = how much the card faces the sun (0..1), y = how deep it sits in the clump
    let lit = 0.72, depth = 1;
    if (c.center) { const nrm = c.pos.clone().sub(c.center).normalize(); lit = clamp(0.5 + 0.55 * nrm.dot(SUN_DIR) + 0.25 * nrm.y, 0, 1); depth = clamp(c.pos.distanceTo(c.center) / c.rad, 0, 1); }
    iCol.set([lit, depth, 0], k * 3);
  });
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iUv', new THREE.InstancedBufferAttribute(iUv, 4));
  geo.setAttribute('iSize', new THREE.InstancedBufferAttribute(iSize, 1));
  geo.setAttribute('iRot', new THREE.InstancedBufferAttribute(iRot, 1));
  geo.setAttribute('iCol', new THREE.InstancedBufferAttribute(iCol, 3));
  geo.instanceCount = n;
  const LEAF_VS = `attribute vec3 iPos; attribute vec4 iUv; attribute float iSize; attribute float iRot; attribute vec3 iCol;
      uniform float uTime; uniform float uGoboAmt; varying vec2 vUv; varying vec3 vCol; varying vec3 vViewPosition; varying float vGobo;
      #include <fog_pars_vertex>
      ${GOBO_GLSL}
      void main(){ vec4 mvPosition = modelViewMatrix * vec4(iPos, 1.0);
        float s = sin(iRot), c = cos(iRot); vec2 q = position.xy; q = vec2(q.x*c - q.y*s, q.x*s + q.y*c);
        float sw = sin(uTime*0.8 + iPos.x*0.9 + iPos.z*0.6) * 0.035 * iSize;

        #include <fog_vertex>
      }`;

    uniforms: { uMap: { value: A.foliageT }, uTime: { value: 0 }, uBloom: { value: 0 }, uGoboAmt: { value: name === 'bushes' ? 1 : 0 }, ...XR, ...FOG_U() }, fog: true,
    vertexShader: LEAF_VS,
    fragmentShader: XR_GLSL + ALB_GLSL + `uniform sampler2D uMap; uniform float uBloom; varying vec2 vUv; varying vec3 vCol; varying vec3 vViewPosition; varying float vGobo;
      #include <fog_pars_fragment>

        vec3 c = albGrade(t.rgb, 0.92, 0.08, vec3(1.0));
        float tl = dot(t.rgb, vec3(0.2126, 0.7152, 0.0722));
        float lit = clamp(vCol.x * 0.85 + tl * 0.5 - 0.1, 0.0, 1.0) * mix(0.55, 1.0, vCol.y) * mix(0.35, 1.0, vGobo);
        vec3 shade = mix(vec3(0.15, 0.26, 0.27), vec3(1.06, 1.0, 0.74), smoothstep(0.08, 0.92, lit));
        vec3 col = c * shade;

        #include <fog_fragment>
        #include <tonemapping_fragment>

function surfContains(s, x, z, m) {

}

    if (s.top > yFeet + STEP_UP) continue;
    if (!surfContains(s, x, z, 0.1)) continue;

}

}

const POST_FINAL_FS = POST_COMMON + `
uniform sampler2D tHalf; uniform float uTime; uniform float uExposure; uniform float uWarm; uniform float uVig; uniform float uCA; uniform float uGrain; uniform vec3 uShaftCol; uniform float uDof;
vec3 ggRrtFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
vec3 ggAces(vec3 c){

  const mat3 O = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
  return clamp(O * ggRrtFit(I * (c / 0.6)), 0.0, 1.0);
}
vec3 toSRGB(vec3 c){ c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
vec3 rgb2hsv(vec3 c){ vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0); vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r)); float d = q.x - min(q.w, q.y); float e = 1.0e-10;
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x); }

const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
vec3 grade(vec3 c){
  // hue-selective: chartreuse -> sage / teal green, reds and oranges softened, everything a little calmer
  // shadows and mid tones drift to teal, sunlit foliage keeps (and gains) its olive-yellow glow
  vec3 h = rgb2hsv(c);
  float l0 = dot(c, LUMA);
  float hi = smoothstep(0.42, 0.78, l0);
  float yg = exp(-pow((h.x - 0.21) / 0.09, 2.0));
  float gr = exp(-pow((h.x - 0.33) / 0.08, 2.0));
  float rd = exp(-pow(min(h.x, 1.0 - h.x) / 0.07, 2.0));
  h.x += mix(0.045, -0.018, hi) * (yg + 0.6 * gr);
  h.y *= mix(1.0 - 0.1 * yg, 1.0 + 0.14 * yg, hi) * (1.0 - 0.22 * rd) * 1.18;

  float l = dot(c, LUMA);

  c = mix(c, c * vec3(0.90, 1.0, 1.03), 1.0 - smoothstep(0.15, 0.6, l));
  c = mix(c, c * mix(vec3(1.0, 1.0, 0.985), vec3(1.05, 1.0, 0.9), uWarm), smoothstep(0.5, 0.95, l));

  c = mix(c, c * c * (3.0 - 2.0 * c), 0.55);
  c = vec3(0.025, 0.06, 0.062) + c * (vec3(0.95, 0.955, 0.94) - vec3(0.025, 0.06, 0.062));

}
void main(){
  vec2 d = vUv - 0.5;

  vec2 ca = d * dot(d, d) * uCA;

  vec4 hb = texture2D(tHalf, vUv);
  float coc = cocOf(linZ(vUv)) * uDof;
  col = mix(col, hb.rgb, coc);
  col += uShaftCol * hb.a;
  col = toSRGB(ggAces(col * uExposure));
  col = grade(col);
  // vignette (oval, soft) and fine animated grain, strongest in the mid tones
  float v = smoothstep(0.95, 0.25, length(d * vec2(1.0, 0.86)));
  col *= mix(1.0 - uVig, 1.0, v);
  float n = fract(sin(dot(gl_FragCoord.xy + fract(uTime * 7.13) * 91.7, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
  float lm = dot(col, LUMA);

class StylePass extends Pass {
  constructor() {
    super();
    this.half = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
    const shared = { tColor: { value: null }, tDepth: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uNear: { value: camera.near }, uFar: { value: camera.far }, uFocus: { value: 12 } };
    this.halfMat = new THREE.ShaderMaterial({ uniforms: { ...shared, uSun: { value: new THREE.Vector2(0.8, 1.2) }, uSunAmt: { value: 0 }, uBlur: { value: 9 } }, vertexShader: POST_VS, fragmentShader: POST_HALF_FS, depthTest: false, depthWrite: false });
    this.finalMat = new THREE.ShaderMaterial({
      uniforms: { ...shared, tHalf: { value: this.half.texture }, uTime: { value: 0 }, uExposure: { value: 0.93 }, uWarm: { value: 0 }, uVig: { value: 0.3 }, uCA: { value: 0.0035 }, uGrain: { value: 0.03 }, uShaftCol: { value: new THREE.Color('#fff1d6') }, uDof: { value: 0.9 } },
      vertexShader: POST_VS, fragmentShader: POST_FINAL_FS, depthTest: false, depthWrite: false });
    this.fsHalf = new FullScreenQuad(this.halfMat); this.fsFinal = new FullScreenQuad(this.finalMat);
    this.u = this.finalMat.uniforms; this.uh = this.halfMat.uniforms;
  }
  setSize(w, h) { this.half.setSize(Math.max(1, Math.round(w / 2)), Math.max(1, Math.round(h / 2))); this.uh.uRes.value.set(w, h); this.uh.uBlur.value = 9 * h / 1080; }
  render(renderer, writeBuffer, readBuffer) {
    this.uh.tColor.value = readBuffer.texture; this.uh.tDepth.value = readBuffer.depthTexture;
    renderer.setRenderTarget(this.half); this.fsHalf.render(renderer);
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer); this.fsFinal.render(renderer);
  }
  dispose() { this.half.dispose(); this.halfMat.dispose(); this.finalMat.dispose(); this.fsHalf.dispose(); this.fsFinal.dispose(); }
}
let composer = null, bloomPass = null, stylePass = null;
const POST_PR = () => Math.min(devicePixelRatio, 1.5);
function buildPost() {
  if (DBG.nopost) return;
  const pr = POST_PR();
  const rt = new THREE.WebGLRenderTarget(Math.round(innerWidth * pr), Math.round(innerHeight * pr), { type: THREE.HalfFloatType, samples: 4 });
  rt.depthTexture = new THREE.DepthTexture(rt.width, rt.height);
  rt.texture.name = 'scene.hdr';
  renderer.setPixelRatio(pr);
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.8, 0.78);
  composer.addPass(bloomPass);
  stylePass = new StylePass();
  composer.addPass(stylePass);
}
// per-frame post uniforms: focus on the robot (or the sphere on the title / end screens), sun position on screen
const _sunP = new THREE.Vector3(), _camF = new THREE.Vector3();
function updatePost(dt) {
  if (!stylePass) return;
  const u = stylePass.u, uh = stylePass.uh;
  const playing = G.mode === 'play' || G.mode === 'intro' || G.mode === 'paused' || (G.mode === 'finale' && G.finT < 4);
  const focus = playing && robot ? camera.position.distanceTo(robot.pos) : Math.max(12, camera.position.length() - 4);
  uh.uFocus.value = damp(uh.uFocus.value, focus, 4, dt);
  _sunP.copy(camera.position).addScaledVector(SUN_DIR, 1000).project(camera);
  uh.uSun.value.set((_sunP.x + 1) / 2, (_sunP.y + 1) / 2);
  camera.getWorldDirection(_camF);
  uh.uSunAmt.value = smooth(-0.05, 0.45, _camF.dot(SUN_DIR)) * (G.mode === 'finale' || G.mode === 'end' ? 1.25 : 1.0);
  u.uTime.value = T.time % 100;
  u.uWarm.value = damp(u.uWarm.value, G.mode === 'finale' || G.mode === 'end' ? 1 : 0, 1.5, dt);
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (composer) { renderer.setPixelRatio(POST_PR()); composer.setPixelRatio(POST_PR()); composer.setSize(innerWidth, innerHeight); }
  if (sparks) sparks.mat.uniforms.uSize.value = 0.16 * innerHeight * 0.9;
  if (motes) motes.material.uniforms.uSize.value = 0.07 * innerHeight;
}
addEventListener('resize', onResize);

// =====================================================================================
// Main loop
// =====================================================================================
const clock = new THREE.Clock();
const dbuf = new THREE.Vector2();
let fpsAcc = 0, fpsN = 0, fps = 60;
function frame() {
  requestAnimationFrame(frame);
  let dt = Math.min(clock.getDelta(), 1 / 20) * DBG.fast;
  T.time += dt; G.t += dt;
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  pollInput();
  updateBot(dt);
  if (G.mode === 'title') {
    if (input.aP || input.stP || input.anyP) startGame();
    animateRobot(dt);
  } else if (G.mode === 'intro') {
    G.introT += dt; if (G.introT > 1.6) G.mode = 'play';
    updateRobot(dt, false);
  } else if (G.mode === 'play') {
    if (input.stP) { G.mode = 'paused'; $('pause').classList.add('on'); setPrompt(null); }
    else {
      G.playT += dt;
      updateRobot(dt, true);
      const ring = updateDoors(dt); updateStairs(dt);
      const svg = document.querySelector('#hud .sun svg');
      if (ring >= 0) { svg.classList.add('on'); $('ring').setAttribute('stroke-dashoffset', String(106.8 * (1 - ring))); } else svg.classList.remove('on');
      $('time').textContent = fmtTime(G.playT);
      setPrompt(G.mode === 'play' ? G.prompt : null);
    }
  } else if (G.mode === 'paused') {
    if (input.stP || input.aP) { G.mode = 'play'; $('pause').classList.remove('on'); }
  } else if (G.mode === 'finale') {
    updateRobot(dt, false); updateDoors(dt); updateStairs(dt); updateFinale(dt);
  } else if (G.mode === 'end') {
    animateRobot(dt);
    if ((input.aP || input.stP) && T.time - G.endT0 > 1.2) restartGame();
  }
  if (G.mode === 'end' && !G.endT0) G.endT0 = T.time;
  // seeds bob
  for (const s of seeds) { if (s.taken) continue; s.s.position.y = s.base.y + Math.sin(T.time * 2 + s.ph) * 0.12; const k = 0.8 + 0.12 * Math.sin(T.time * 4 + s.ph); s.s.scale.setScalar(k); }
  // petals
  for (const p of petals) p.g.quaternion.setFromAxisAngle(p.axis, p.sign * p.open * 1.95);
  if (sparks) sparks.update(dt);
  if (motes) { motes.material.uniforms.uTime.value = T.time; const bs = motes.material.uniforms.uBeams.value; doors.forEach((d, i) => bs[i].set(d.bed.x, d.bed.y, d.bed.z, d.light)); bs[4].set(0, LEVEL.crown.y, 0, finale.light ? finale.light.intensity / 30 : 0); }
  for (const u of updaters) u(dt);
  updateCamera(dt);
  // x-ray: keep the robot visible through bars, glass and leaves
  if (robot) {
    const c = robot.pos.clone().add(new THREE.Vector3(0, ROBOT_H * 0.5, 0)); const dist = camera.position.distanceTo(c);
    const v = c.clone().project(camera); XR.uXrPos.value.set((v.x + 1) / 2, (v.y + 1) / 2);
    renderer.getDrawingBufferSize(dbuf); XR.uXrRes.value.copy(dbuf);
    XR.uXrRad.value = clamp(1.05 / dist, 0.05, 0.17); XR.uXrDist.value = dist;
    XR.uXrAmt.value = damp(XR.uXrAmt.value, (G.mode === 'play' || G.mode === 'intro' || G.mode === 'paused') ? 1 : 0, 4, dt);
  }
  updatePost(dt);
  if (composer) composer.render(); else renderer.render(scene, camera);
}

function startGame() {
  unlockAudio(); sfx('sfx_start', { vol: 0.8 });
  $('title').classList.remove('on'); $('hud').classList.add('on');
  G.mode = 'intro'; G.introT = 0;
  cam.az = angOf(robot.pos.x, robot.pos.z); cam.y = robot.pos.y + CAM_H;
}
function restartGame() {
  $('end').classList.remove('on'); G.endT0 = 0; robot.cheer = 0; robot.crankT = 0; finale.bloomed = false;
  extraFlowers.forEach((k) => flowers.hide(k)); extraFlowers.length = 0; flowers.n = flowers.baseN; flowers.geo.instanceCount = flowers.n;
  resetLevel(); startGame();
}

// =====================================================================================
// Boot
// =====================================================================================
async function boot() {
  await loadAll();
  buildMaterials();
  buildSky(); buildClouds();
  flowers = new PlantField(A.flowersT, A.flowersJ, 2400, [0.8, 0.06, 0.95]);
  grass = new PlantField(A.grassT, A.grassJ, 1600, [0.85, 0.08, 0.72]);
  buildGreenhouse(); buildFloor();
  for (const L of LEVEL.ledges) buildLedge(L);
  buildTree(); buildStairs(); buildBeds(); buildCrown(); buildDecor();
  sparks = new Sparks(600); buildMotes(); buildSeeds(); buildFinale();
  buildRobot(); buildPost();
  flowers.baseN = flowers.n; grass.baseN = grass.n;
  // env map for metals and glass highlights, generated from the sky shader
  const pm = new THREE.PMREMGenerator(renderer); const envScene = new THREE.Scene();
  const envSky = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.ShaderMaterial({ uniforms: skyUniforms, side: THREE.BackSide, vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`, fragmentShader: SKY_GLSL + `varying vec3 vDir; void main(){ gl_FragColor = vec4(skyColor(vDir), 1.0); }` }));
  envScene.add(envSky); scene.environment = pm.fromScene(envScene, 0.02).texture;
  resetLevel();
  if (DBG.tier) skipToTier(DBG.tier);
  onResize();
  G.mode = 'title';
  $('loading').classList.remove('on');
  if (DBG.auto) { startGame(); camera.position.set(Math.sin(cam.az * DEG) * 16, robot.pos.y + CAM_H, Math.cos(cam.az * DEG) * 16); G.mode = 'play'; }
  else $('title').classList.add('on');
  if (DBG.bot) bot.active = true;
  window.__gg = {
    G, robot, doors, stairs, seeds, petals, camera, scene, ledges, groundAt, fps: () => fps, bot: botState,
    state: () => ({ mode: G.mode, pos: robot.pos.toArray().map((v) => +v.toFixed(2)), grounded: robot.grounded, ground: robot.ground && robot.ground.tag, lights: G.lights, seeds: G.seeds, t: +G.playT.toFixed(1), doors: doors.map((d) => d.state + (d.rooted ? '*' : '')), stairs: stairs.map((s) => s.grown + (s.rooted ? '*' : '')), botStep: botState.i, botLog: botState.log, fps: +fps.toFixed(0) }),
    tp: (x, y, z) => { spawnRobot(new THREE.Vector3(x, y, z), robot.yaw); },
    root: (i) => rootStair(stairs[i], true), finish: () => startFinale(),
  };
  frame();
}
boot().catch((e) => { console.error(e); });
</script>
