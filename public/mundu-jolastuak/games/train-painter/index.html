class Particles {

const PROTOS = {};
function buildProtos() {
  PROTOS.loco = makeProto('loco', { lengthX: CFG.locoLen, roughness: 0.42, physical: true, clearcoat: 0.7, rotY: Math.PI / 2 });
  PROTOS.tender = makeProto('tender', { lengthX: CFG.tenderLen, roughness: 0.45, physical: true, clearcoat: 0.6, rotY: Math.PI / 2 });
  PROTOS.pine = makeProto('pine', { height: 5.0, lambert: true });
  PROTOS.station = makeProto('station', { width: 11.5, roughness: 0.72 });
  PROTOS.bridge = makeProto('bridge', { roughness: 0.8 });
  PROTOS.cloud = makeProto('cloud', { width: 13, lambert: true, emissive: 0xffffff, emissiveIntensity: 0.6 });
  PROTOS.mountain = makeProto('mountain', { height: 70, lambert: true });
  PROTOS.rock = makeProto('rock', { width: 2.6, lambert: true });
  PROTOS.flower = makeProto('flower', { height: 0.75, lambert: true });
  PROTOS.grass = makeProto('grass', { height: 0.6, lambert: true });
  PROTOS.star = makeProto('star', { height: 1.7, roughness: 0.3, emissive: 0xffc23a, emissiveIntensity: 0.35 });
  PROTOS.coal = makeProto('coal', { width: 1.8, roughness: 0.7 });
  PROTOS.fence = makeProto('fence', { lengthX: 2.25, lambert: true });
  PROTOS.sign = makeProto('sign', { height: 3.4, roughness: 0.6 });
  PROTOS.sheep = makeProto('sheep', { length: 1.6, lambert: true });

  const bp = PROTOS.bridge;
  if (bp.size.z > bp.size.x) {
    const r = new THREE.Matrix4().makeRotationY(Math.PI / 2);
    bp.parts.forEach(p => { p.geometry.applyMatrix4(r); p.geometry.computeBoundingBox(); p.geometry.computeBoundingSphere(); });
    bp.size.set(bp.size.z, bp.size.y, bp.size.x);

  const ray = new THREE.Raycaster(), N = 49; bp.profile = [];

    let best = null;
    for (const zz of [-0.06, 0, 0.06]) {

    const showPlan = S.state === 'play' || S.state === 'crash' || S.state === 'rewind' || S.state === 'intro' || S.state === 'title';
    T.plan.visible = showPlan;
    if (showPlan) T.updatePlan(S.sLoco + CFG.layLead - 0.6, T.length, t, S.state === 'play' ? { h: S.head.h, turn: S.turnVel, speed: S.speed, len: 8 + S.speed * 0.7 } : null);
    placeTrain(t);
    if (S.state === 'play' || S.state === 'arrive' || S.state === 'stalled') updateTrainFx(dt, t, adv);
    if (S.state === 'play') updatePickups();
    // head marker
    const hm = headMarker; hm.visible = showPlan && S.state !== 'title';
    if (hm.visible) {
      const hp = T.pointAt(T.length, {});
      hm.position.set(hp.x + Math.sin(S.head.h) * 0.9, hp.y + 0.12, hp.z - Math.cos(S.head.h) * 0.9);
      hm.rotation.set(-Math.PI / 2, 0, 0); hm.rotateZ(-S.head.h);
      const pulse = 1 + Math.sin(t * 7) * 0.08; hm.scale.setScalar(pulse);
      if (S.state === 'play' && S.speed > 1 && Math.random() < dt * 10) dusts.emit({ pos: new THREE.Vector3(hp.x, hp.y + 0.2, hp.z), vel: new THREE.Vector3((Math.random() - 0.5) * 1.2, 0.8, (Math.random() - 0.5) * 1.2), life: 0.7, s0: 0.35, s1: 0.9, drag: 2, alpha: 0.6 });
    }
    HEADV.set(S.head.x, T.y[T.n - 1] + 0.5, S.head.z);
    S.world.update(dt, t, camera.position, FOCUS, S.state === 'play' ? S.head : null);
    S.world.updateSheep(dt, t, loco.position, S.state === 'play' ? S.head : null);
  }
  puffs.update(dt); sparkles.update(dt); splashes.update(dt); dusts.update(dt);
  updateCamera(dt, t);
  placeSun(_v.copy(loco.position).addScaledVector(camState.fwd, 26));
  updateHUD();
}

function setHint(text, dur) { UI.hint.textContent = text; UI.hint.classList.add('on'); clearTimeout(setHint.t); setHint.t = setTimeout(() => UI.hint.classList.remove('on'), dur * 1000); }

function updateHUD() {
  if (!S.def) return;
  UI.steamFill.style.width = S.steam.toFixed(1) + '%';
  UI.steam.classList.toggle('low', S.steam < 25);
  // progress: projected along the guaranteed route
  const def = S.def; let bi = -1, bd = 1e9;
  def.routeHash.query(loco.position.x, loco.position.z, 40, o => { const d = (o.x - loco.position.x) ** 2 + (o.z - loco.position.z) ** 2; if (d < bd) { bd = d; bi = o.i; } });
  if (bi >= 0) S.routeProg = Math.max(S.routeProg * 0.98, bi / (def.route.length - 1));
  const prog = S.state === 'celebrate' || S.state === 'complete' ? 1 : clamp(S.routeProg, 0, 1);
  UI.progFill.style.width = (prog * 100).toFixed(1) + '%';
  UI.progTrain.style.left = (prog * 100).toFixed(1) + '%';
  UI.timer.textContent = fmtTime(S.time);
}

function loadBest() { try { return JSON.parse(localStorage.getItem('trainPainter.best') || '{}'); } catch (e) { return {}; } }
function saveBest(idx, stars, time) {
  try {
    const all = loadBest(), cur = all[idx];
    if (!cur || stars > cur.stars || (stars === cur.stars && time < cur.time)) { all[idx] = { stars, time }; localStorage.setItem('trainPainter.best', JSON.stringify(all)); return true; }
  } catch (e) { }
  return false;
}
function showPanel(win) {
  UI.panel.classList.remove('hidden');
  UI.ptitle.textContent = win ? 'Station reached!' : 'Out of steam!';
  let best = '';
  if (win) { const rec = saveBest(S.levelIdx, S.starsGot, S.time); best = rec ? '   ·   new record!' : ''; }
  UI.ptime.textContent = win ? '⏱ ' + fmtTime(S.time) + (S.crashes ? '   ·   bumps: ' + S.crashes : '') + best : 'Grab the coal crates to keep the fire going';
  UI.pnext.innerHTML = win ? 'Space &#9656; next station' : 'Space &#9656; try again';
  UI.pstars.forEach((im, i) => { im.classList.remove('got'); if (win && i < S.starsGot) setTimeout(() => { im.classList.add('got'); AudioSys.play('star', { vol: 0.5, rate: 1 + i * 0.12 }); }, 250 + i * 280); });
  UI.pstars.forEach(im => im.parentElement.style.display = win ? 'flex' : 'none');
  AudioSys.duckMusic(0.3, 0.6);
}

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ---------------------------------------------------------------------
//  Sky dome from the fal panorama
// ---------------------------------------------------------------------
function buildSky() {
  const tex = G.tex.sky; if (!tex) return;
  tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = THREE.RepeatWrapping;
  const geo = new THREE.SphereGeometry(1600, 64, 32);
  const uv = geo.attributes.uv, pos = geo.attributes.position;
  for (let i = 0; i < uv.count; i++) {
    const y = pos.getY(i) / 1600, el = Math.asin(clamp(y, -1, 1));
    uv.setXY(i, uv.getX(i) * 2, clamp(el / (Math.PI * 0.36), 0.0, 1.0) * 0.98 + 0.01);
  }
  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false, toneMapped: false });
  const sky = new THREE.Mesh(geo, mat); sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky); scene.userData.sky = sky;
  // fog colour = horizon colour of the generated sky
  try {
    const img = tex.image, c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const cx = c.getContext('2d'); cx.drawImage(img, 0, 0, 64, 64);
    const d = cx.getImageData(0, 56, 64, 6).data; let r = 0, g = 0, b = 0, k = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; k++; }
    FOG_COLOR.setRGB(r / k / 255, g / k / 255, b / k / 255, THREE.SRGBColorSpace);
    scene.fog.color.copy(FOG_COLOR); scene.background = FOG_COLOR.clone();
  } catch (e) { }
}

// ---------------------------------------------------------------------
//  Boot
// ---------------------------------------------------------------------
async function boot() {
  await loadAll(p => { UI.loadFill.style.width = (p * 100).toFixed(0) + '%'; });
  buildProtos(); buildSky(); setupTrain();
  S.levelIdx = clamp(DEBUG.level, 0, 50);
  startLevel(S.levelIdx, { intro: false });
  S.state = 'title'; S.stateT = 0;
  UI.loading.style.opacity = 0; setTimeout(() => UI.loading.classList.add('hidden'), 600);
  if (DEBUG.autostart) { UI.hud.classList.add('on'); UI.timer.classList.add('on'); startLevel(S.levelIdx, { intro: false }); AudioSys.init(); }
  else UI.title.classList.remove('hidden');
  window.__game = { S, CFG, CAM, camera, scene, renderer, startLevel, keys, AudioSys };
}
boot();
requestAnimationFrame(frame);
</script>
