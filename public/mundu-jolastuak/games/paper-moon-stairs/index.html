<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================================
//  small helpers
// =====================================================================================
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RNG = mulberry(20261012);
const rr = (a, b) => a + (b - a) * RNG();
const pick = arr => arr[Math.floor(RNG() * arr.length)];
const UP = new THREE.Vector3(0, 1, 0);
const Q = new URLSearchParams(location.search);
const AUTO = Q.has('auto');

// cheap smooth 3D value noise (for rock shapes)
function hash3(x, y, z) { let h = x * 374761393 + y * 668265263 + z * 2147483647; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  let r = 0;
  for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) for (let dz = 0; dz < 2; dz++) {
    const wgt = (dx ? u : 1 - u) * (dy ? v : 1 - v) * (dz ? w : 1 - w);
    r += wgt * hash3(xi + dx, yi + dy, zi + dz);
  }
  return r * 2 - 1;
}

// =====================================================================================
//  renderer / scene / camera
// =====================================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 2000);
window.EGMobileView(renderer,camera);


const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.6, 0.88);
composer.addPass(bloom);
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tPaper: { value: null }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uPaper: { value: 0.55 }, uVig: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse, tPaper; uniform vec2 uRes; uniform float uPaper, uVig; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float g = texture2D(tPaper, vUv * uRes / 640.0).r - 0.5;
      c *= 1.0 + g * 0.16 * uPaper;
      vec2 q = vUv - 0.5; q.x *= uRes.x / uRes.y * 0.75;
      float v = smoothstep(0.95, 0.25, length(q));
      c = mix(c * vec3(0.62, 0.66, 0.85), c, mix(1.0, v, 0.45 * uVig));
      gl_FragColor = vec4(c, 1.0);
    }`
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());

function fitCamera() {   // portrait screens get a wider lens so the girl and the stairs ahead stay in frame
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 48 + 26 * Math.min(1, (1 - camera.aspect) / 0.55) : 48;
  camera.updateProjectionMatrix();
}
fitCamera();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  fitCamera();
  gradePass.uniforms.uRes.value.set(innerWidth, innerHeight);
});

// =====================================================================================
//  palette (sRGB hex; THREE.Color converts to linear)
// =====================================================================================
const PAL = {
  fogLowDusk: new THREE.Color('#efc6bd'), fogHighDusk: new THREE.Color('#86aecb'),
  fogLowNight: new THREE.Color('#c7a9c6'), fogHighNight: new THREE.Color('#4f74a3'),
  skyAmb: new THREE.Color('#9fb3d6'), groundAmb: new THREE.Color('#27304d'),
  moon: new THREE.Color('#c9d6ff'), warm: new THREE.Color('#ffae5c'), rim: new THREE.Color('#bcd2ff'),
};

// =====================================================================================
//  PATH: the girl walks along a winding 1D path (s = distance), height is level data
// =====================================================================================
const HEADING_KEYS = [[-14, -0.36], [0, -0.40], [18, -0.55], [23.5, -0.10], [34.6, -0.04], [39, -0.52], [52, -0.66], [55, -0.10], [66.4, -0.06], [70, -0.48], [80, -0.40], [104, -0.22]];
function headingAt(s) {
  const K = HEADING_KEYS;
  if (s <= K[0][0]) return K[0][1];
  for (let i = 0; i < K.length - 1; i++) {
    const [s0, h0] = K[i], [s1, h1] = K[i + 1];
    if (s <= s1) return lerp(h0, h1, smooth((s - s0) / (s1 - s0)));
  }
  return K[K.length - 1][1];
}
const PS0 = -14, PS1 = 104, PDS = 0.05, PN = Math.round((PS1 - PS0) / PDS) + 1;
const PX = new Float32Array(PN), PZ = new Float32Array(PN), PH = new Float32Array(PN);
{
  let x = 0, z = 0;
  for (let i = 0; i < PN; i++) { const h = headingAt(PS0 + i * PDS); PX[i] = x; PZ[i] = z; PH[i] = h; x += Math.cos(h) * PDS; z += Math.sin(h) * PDS; }
  const i0 = Math.round(-PS0 / PDS), ox = PX[i0], oz = PZ[i0];
  for (let i = 0; i < PN; i++) { PX[i] -= ox; PZ[i] -= oz; }
}
const _F = { p: new THREE.Vector3(), t: new THREE.Vector3(), n: new THREE.Vector3() };
function frame(s, out = { p: new THREE.Vector3(), t: new THREE.Vector3(), n: new THREE.Vector3() }) {
  const f = clamp((s - PS0) / PDS, 0, PN - 1.001), i = Math.floor(f), a = f - i;
  const h = lerp(PH[i], PH[i + 1], a);
  out.p.set(lerp(PX[i], PX[i + 1], a), 0, lerp(PZ[i], PZ[i + 1], a));
  out.t.set(Math.cos(h), 0, Math.sin(h));
  out.n.set(-Math.sin(h), 0, Math.cos(h));   // outer side (camera side)
  out.h = h;
  return out;
}
function worldAt(s, n, y, out = new THREE.Vector3()) { const F = frame(s, _F); return out.copy(F.p).addScaledVector(F.n, n).setY(y); }

// =====================================================================================
//  LEVEL DATA
// =====================================================================================
const RISE = 0.24;
const SEG = [];                       // static walkable surfaces {a,b,h,kind}
const addFlat = (a, b, h, kind = 'ledge') => SEG.push({ a, b, h, kind });
function addStairs(a, n, len, h0) { const tr = len / n; for (let i = 0; i < n; i++) SEG.push({ a: a + i * tr, b: a + (i + 1) * tr, h: h0 + (i + 1) * RISE, kind: 'step' }); return h0 + n * RISE; }
addFlat(-6, 6, 0);
const H_A = addStairs(6, 33, 14, 0);          // 7.92
addFlat(20, 23.5, H_A);
const H_B = 10.2; addFlat(34.6, 39, H_B);
const H_C = addStairs(39, 31, 13, H_B);       // 17.64
addFlat(52, 55, H_C);
const H_D = 20.4; addFlat(66.4, 70, H_D);
const H_E = addStairs(70, 21, 9, H_D);        // 25.44
addFlat(79, 95, H_E, 'summit');
const S_MIN = -4.5, S_MAX = 93.5, S_END = 89.2;
const BRIDGES = [[23.5, 34.6], [55, 66.4]];
function bridgeWeight(s) { let w = 0; for (const [a, b] of BRIDGES) w = Math.max(w, smooth((s - a + 2.5) / 3) * smooth((b + 1.5 - s) / 3)); return w; }
function groundRef(s) { let best = -Infinity; for (const g of SEG) if (s >= g.a - 0.6 && s <= g.b + 0.6) best = Math.max(best, g.h); if (best > -Infinity) return best; // over a bridge: interpolate
  for (const [a, b] of BRIDGES) if (s > a && s < b) { const ha = staticTop(a - 0.1), hb = staticTop(b + 0.1); return lerp(ha, hb, (s - a) / (b - a)); } return 0; }
function minTop(a, b) { let m = Infinity; for (let s = a; s <= b; s += 0.2) { const h = staticTop(s, 0.05); m = Math.min(m, h > -Infinity ? h : groundRef(s)); } return m; }
function staticTop(s, r = 0.1) { let best = -Infinity; for (const g of SEG) if (g.b > s - r && g.a < s + r && g.h > best) best = g.h; return best; }

// lanterns: decor ones are touched, platform ones are stood on
const DECOR = [ // s, n, y offset above local ground (center of lantern), scale, floating?
  [3.6, -0.62, 0.42, 0.40, 0], [8.2, -0.66, 0.42, 0.40, 0], [10.9, -0.7, 1.55, 0.42, 1], [13.4, -0.66, 0.42, 0.40, 0], [15.6, -0.3, 2.45, 0.42, 1],
  [17.9, -0.66, 0.42, 0.40, 0], [19.4, -0.7, 1.5, 0.42, 1], [21.9, 0.2, 2.35, 0.44, 1],
  [27.3, 0, 2.6, 0.42, 1], [32.6, 0, 2.7, 0.42, 1],
  [36.6, -0.66, 0.42, 0.40, 0], [41.6, -0.7, 1.5, 0.42, 1], [44.0, -0.66, 0.42, 0.40, 0], [46.3, -0.3, 2.45, 0.42, 1], [48.7, -0.66, 0.42, 0.40, 0], [50.9, -0.7, 1.6, 0.42, 1],
  [53.6, 0.1, 2.4, 0.44, 1], [58.2, 0, 2.7, 0.42, 1], [63.4, 0, 2.7, 0.42, 1],
  [68.2, -0.66, 0.42, 0.40, 0], [72.3, -0.7, 1.55, 0.42, 1], [74.6, -0.66, 0.42, 0.40, 0], [76.8, -0.3, 2.4, 0.42, 1],
  [81.2, -0.9, 0.42, 0.42, 0], [84.0, -1.1, 1.7, 0.44, 1], [86.6, -1.2, 0.42, 0.42, 0],
];
const PLATFORMS = [ // s, top height, drift amplitude (m along s), bob amplitude
  [24.65, H_A - 0.15, 0, 0.10], [26.45, 8.2, 0, 0.12], [28.25, 8.62, 0, 0.12], [30.05, 9.05, 0, 0.12], [31.85, 9.48, 0, 0.12], [33.65, 9.86, 0, 0.10],
  [56.15, H_C - 0.12, 0.15, 0.12], [57.95, 18.0, 0.25, 0.14], [59.75, 18.45, 0.28, 0.14], [61.55, 18.9, 0.28, 0.14], [63.35, 19.35, 0.25, 0.14], [65.2, 19.82, 0.18, 0.12],
];

// =====================================================================================
//  LOADING
// =====================================================================================
const manager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(manager);
const gltfLoader = new GLTFLoader(manager);
const T = {};
function tex(name, url, { srgb = true, repeat = false } = {}) {
  T[name] = texLoader.load(url, t => { t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = 4; if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } t.needsUpdate = true; });
}
tex('skyDusk', 'assets/img/sky_dusk.jpg'); tex('skyNight', 'assets/img/sky_night.jpg');
tex('cloudA', 'assets/img/cloud_a.webp'); tex('cloudTower', 'assets/img/cloud_tower.webp'); tex('cloudBank', 'assets/img/cloud_bank.webp');
tex('moon', 'assets/img/moon.webp'); tex('sparkles', 'assets/img/sparkles.webp'); tex('flora', 'assets/img/flora_atlas.webp');
tex('tree', 'assets/img/tree.webp'); tex('rock', 'assets/img/rock_tex.jpg', { repeat: true }); tex('stone', 'assets/img/stone_tex.jpg', { repeat: true });
tex('paper', 'assets/img/paper.jpg', { srgb: false, repeat: true });
let floraMeta = null, girlGltf = null, lanternGltf = null, musicBuf = null;
fetch('assets/img/flora_atlas.json').then(r => r.json()).then(j => floraMeta = j);
fetch('assets/audio/music.mp3').then(r => r.arrayBuffer()).then(b => musicBuf = b).catch(() => {});
gltfLoader.load('assets/models/girl.glb', g => girlGltf = g);
gltfLoader.load('assets/models/lantern.glb', g => lanternGltf = g);
const loaded = new Promise(res => { manager.onLoad = res; });

// =====================================================================================
//  SHADERS
// =====================================================================================
const NL = 12;
const shared = {
  uTime: { value: 0 }, uNight: { value: 0 },
  uFogLow: { value: PAL.fogLowDusk.clone() }, uFogHigh: { value: PAL.fogHighDusk.clone() }, uFogDensity: { value: 0.012 },
  uSkyAmb: { value: PAL.skyAmb.clone() }, uGroundAmb: { value: PAL.groundAmb.clone() },
  uMoonDir: { value: new THREE.Vector3(0.3, 0.8, 0.5).normalize() }, uMoonCol: { value: PAL.moon.clone().multiplyScalar(0.55) },
  uRim: { value: PAL.rim.clone() },
  uLPos: { value: Array.from({ length: NL }, () => new THREE.Vector3(0, -999, 0)) },
  uLCol: { value: Array.from({ length: NL }, () => new THREE.Vector3()) },
};
const FOG_GLSL = `
  uniform vec3 uFogLow, uFogHigh; uniform float uFogDensity;
  vec3 applyFog(vec3 col, vec3 wp){
    vec3 d = wp - cameraPosition; float dist = length(d);
    float f = 1.0 - exp(-dist * uFogDensity);
    float el = clamp(d.y / max(dist, 1e-3) * 1.6 + 0.35, 0.0, 1.0);
    return mix(col, mix(uFogLow, uFogHigh, el), f);
  }`;
function envMaterial({ map, texScale = 0.35, tint = '#ffffff', moss = '#56735f', mossAmt = 0, rimAmt = 0.22, warmAmt = 1.0, texMix = 1.0, amb = 1.0 }) {
  return new THREE.ShaderMaterial({
    uniforms: { ...shared, map: { value: map }, uTexScale: { value: texScale }, uTint: { value: new THREE.Color(tint) }, uMoss: { value: new THREE.Color(moss) }, uMossAmt: { value: mossAmt }, uRimAmt: { value: rimAmt }, uWarmAmt: { value: warmAmt }, uTexMix: { value: texMix }, uAmb: { value: amb } },
    vertexShader: `
      attribute vec3 color; varying vec3 vWP; varying vec3 vWN; varying vec3 vCol;
      void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vWP = wp.xyz; vWN = normalize(mat3(modelMatrix) * normal); vCol = color; gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `
      #define NL ${NL}
      uniform sampler2D map; uniform float uTexScale, uMossAmt, uRimAmt, uWarmAmt, uTexMix, uTime, uAmb;
      uniform vec3 uTint, uMoss, uSkyAmb, uGroundAmb, uMoonDir, uMoonCol, uRim;
      uniform vec3 uLPos[NL]; uniform vec3 uLCol[NL];
      varying vec3 vWP; varying vec3 vWN; varying vec3 vCol;
      ${FOG_GLSL}
      vec3 tri(vec3 p, vec3 n){
        vec3 w = pow(abs(n), vec3(4.0)); w /= dot(w, vec3(1.0));
        return texture2D(map, p.zy * uTexScale).rgb * w.x + texture2D(map, p.xz * uTexScale).rgb * w.y + texture2D(map, p.xy * uTexScale).rgb * w.z;
      }
      void main(){
        vec3 N = normalize(vWN); vec3 V = normalize(cameraPosition - vWP);
        vec3 tx = tri(vWP, N);
        vec3 alb = mix(vec3(dot(tx, vec3(0.3333))), tx, 0.85) * uTint * vCol;
        alb = mix(uTint * vCol * 0.55, alb, uTexMix);
        // moss on upward faces, broken up by the painted texture
        float mossM = smoothstep(0.55, 0.92, N.y) * smoothstep(0.25, 0.55, dot(tx, vec3(0.45)) + 0.25) * uMossAmt;
        alb = mix(alb, uMoss * (0.8 + 0.5 * tx.g), mossM);
        float hemi = N.y * 0.5 + 0.5;
        vec3 amb = mix(uGroundAmb, uSkyAmb, hemi);
        float nd = max(dot(N, uMoonDir), 0.0);
        vec3 col = alb * (amb * uAmb + uMoonCol * nd);
        vec3 warm = vec3(0.0);
        for (int i = 0; i < NL; i++) {
          vec3 L = uLPos[i] - vWP; float d2 = dot(L, L); float d = sqrt(d2);
          float att = 1.0 / (1.0 + d2 * 0.22); att *= smoothstep(13.0, 3.0, d);
          float lam = max(dot(N, L / max(d, 1e-3)), 0.0) * 0.8 + 0.2;
          warm += uLCol[i] * att * lam;
        }
        col += alb * warm * 2.4 * uWarmAmt + warm * 0.035 * uWarmAmt;
        float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        col += uRim * rim * uRimAmt * (0.4 + 0.6 * hemi) * alb * 3.0;
        col = applyFog(col, vWP);
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}

// --- billboard sprite material (cylindrical) used by clouds / tree ---
function billboardMaterial(map, { alphaTest = 0, transparent = true, depthWrite = false, fogScale = 1, soft = true } = {}) {
  return new THREE.ShaderMaterial({

    if (END.fadeGirl < 1) { girl.position.addScaledVector(END.dir, dt * 1.2); girl.position.y += dt * 0.55; }
    girl.traverse(o => { if (o.isMesh) { if (!o.material.transparent) { o.material.transparent = true; o.material.needsUpdate = true; } o.material.opacity = 1 - END.fadeGirl; } });
    if (Math.random() < 0.6) sparks.emit(girl.position.clone().add(new THREE.Vector3(rr(-0.3, 0.3), rr(0.2, 1.5), rr(-0.3, 0.3))), new THREE.Vector3(rr(-0.4, 0.4), rr(0.2, 1.0), rr(-0.4, 0.4)), rr(1, 2), rr(0.15, 0.3), 8 + Math.floor(Math.random() * 8), 0.9, 0.95, 1, 1, 0.6, 0.8, -0.2);
    if (!END.done) {
      END.done = true; Audio.bell(587.33, 0, 0.18, 4); Audio.bell(880, 0.25, 0.14, 4); Audio.bell(1174.66, 0.5, 0.12, 4);
      setTimeout(() => { document.getElementById('endcount').textContent = `${world.collected} / ${world.total}`; document.getElementById('end').style.opacity = 1; world.mode2 = 'end'; }, 2600);
    }
  }
  moonGlow.material.uniforms.uA.value = damp(moonGlow.material.uniforms.uA.value, END.done ? 1.6 : 1.15, 0.8, dt);
}
function endingCamera(dt, t) {
  const reveal = END.done ? smooth(END.fadeGirl * 1.1) : 0;
  const mid = END.steps[Math.floor(END.steps.length * 0.6)].target;
  const g = girl.position.clone().lerp(mid, reveal);
  const side = END.side, dir = END.dir;
  // from behind and a little to the open side, looking up the star stairs toward the moon,
  // then pull back to show the whole staircase once she has walked into the light
  const p = g.clone().addScaledVector(side, lerp(2.6, 7, reveal)).addScaledVector(dir, -lerp(6.8, 19, reveal)); p.y = g.y + lerp(-0.4, -3.2, reveal);
  const l = g.clone().addScaledVector(dir, lerp(6, 14, reveal)); l.y = g.y + lerp(3.4, 8.5, reveal);
  const k = END.t < 2 ? 1.4 : 2.0;
  cam.pos.lerp(p, 1 - Math.exp(-dt * k)); cam.look.lerp(l, 1 - Math.exp(-dt * k * 1.3));
}

// =====================================================================================
//  per-frame visuals
// =====================================================================================
function faceDir(dir, dt) {
  const target = Math.atan2(dir.x, dir.z) + GIRL_YAW;
  let d = target - P.faceYaw; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
  P.faceYaw += d * (1 - Math.exp(-dt * 10));
  girl.rotation.y = P.faceYaw;
}
function updateGirl(dt) {
  if (world.mode === 'ending') return;
  const F = frame(P.s);
  P.yVis = P.grounded && !P.plat ? damp(P.yVis, P.y, 16, dt) : P.y;
  if (Math.abs(P.yVis - P.y) > 1) P.yVis = P.y;
  P.yCam = damp(P.yCam ?? P.y, Math.max(P.lastSafe.y - 1.2, P.grounded ? P.y : Math.max(P.y - 0.6, Math.min(P.yCam ?? P.y, P.y))), 3.0, dt);
  girl.position.copy(F.p).setY(P.yVis);
  faceDir(F.t.clone().multiplyScalar(P.face), dt);
  // animation state
  const spd = Math.abs(P.vs);
  if (world.mode === 'play') {
    if (!P.grounded) { if (girl.userData.cur !== 'jump') playAnim('jump', 0.15, 0.9, 0.62); }
    else if (spd > 0.25) { playAnim('walk', 0.22, clamp(spd / 1.35, 0.6, 1.6)); actions.walk.timeScale = clamp(spd / 1.35, 0.6, 1.6); P.idleT = 0; }
    else {
      P.idleT += dt; const cur = girl.userData.cur;
      if (cur === 'wave') { if (!actions.wave.isRunning() || actions.wave.time > actions.wave.getClip().duration - 0.15) playAnim('look', 0.4); }
      else playAnim('look', 0.3);
    }
  }
}
const lightList = [], _size = new THREE.Vector2();
function updateLights(t) {
  // collect lights from idle lanterns + flyers; pass nearest to shaders
  lightList.length = 0;
  const ref = world.mode === 'title' ? cam.look : girl.position;
  for (const L of world.lanterns) if (L.light > 0.01) lightList.push({ p: L.mesh.position, i: L.light * L.scale * 2.2, d: L.mesh.position.distanceToSquared(ref) });
  for (const f of world.flyers) lightList.push({ p: f.mesh.position, i: f.light * f.scale * 2.2, d: f.mesh.position.distanceToSquared(ref) });
  lightList.sort((a, b) => a.d - b.d);
  const warm = PAL.warm;
  for (let i = 0; i < NL; i++) {
    const L = lightList[i];
    if (L) { shared.uLPos.value[i].copy(L.p); shared.uLCol.value[i].set(warm.r * L.i, warm.g * L.i, warm.b * L.i); }
    else { shared.uLPos.value[i].set(0, -999, 0); shared.uLCol.value[i].set(0, 0, 0); }
  }
  world.girlLights.forEach((l, i) => { const L = lightList[i]; if (L) { l.position.copy(L.p); l.intensity = L.i * 3.2; } else l.intensity = 0; });
}
function updateAtmosphere(dt, t) {
  const prog = world.mode === 'title' ? 0 : clamp(P.s / S_END, 0, 1);
  const night = world.mode === 'ending' ? 1 : smooth((prog - 0.15) / 0.8) * 0.92;
  world.night = damp(world.night ?? 0, night, 0.6, dt);
  const n = world.night;
  shared.uNight.value = n;
  shared.uFogLow.value.copy(PAL.fogLowDusk).lerp(PAL.fogLowNight, n);
  shared.uFogHigh.value.copy(PAL.fogHighDusk).lerp(PAL.fogHighNight, n);
  shared.uSkyAmb.value.copy(PAL.skyAmb).multiplyScalar(lerp(1.0, 0.78, n));
  moon.material.opacity = lerp(0.25, 1, smooth(n * 1.3));
  moon.lookAt(camera.position); moonGlow.lookAt(camera.position);
  if (world.mode !== 'ending') moonGlow.material.uniforms.uA.value = lerp(0.15, 0.85, n);
  // sky twinkles fade in at night
  for (let i = 0; i < world.skyTwinkles; i++) starField.tint[i * 4 + 3] = clamp(n * 1.4 - 0.15, 0, 1) * 0.9;
  // grow newborn stars
  for (const st of world.stars) {
    const age = clock.elapsedTime - st.born;
    if (age < 1.2 && world.mode !== 'ending') { const k = age / 1.2; starField.size[st.idx] = st.size * (k < 0.4 ? smooth(k / 0.4) * 1.8 : lerp(1.8, 1, smooth((k - 0.4) / 0.6))); }
  }
  starField.dirty();
  // clouds drift
  for (const c of clouds) { const u = c.material.uniforms; u.uCenter.value.x = c.userData.base.x + Math.sin(t * 0.02 + u.uPhase.value) * 3 * c.userData.drift * 4; u.uTint.value.setRGB(lerp(0.93, 0.8, n), lerp(0.92, 0.8, n), lerp(0.94, 0.92, n)); }
  // motes follow the girl
  const mp = motes.geometry.attributes.position, base = motes.userData.base, ctr = girl.position;
  for (let i = 0; i < mp.count; i++) {
    let x = base[i * 3] + Math.sin(t * 0.21 + i) * 0.6, y = base[i * 3 + 1] + ((t * 0.18 + i * 0.37) % 16), z = base[i * 3 + 2] + Math.cos(t * 0.17 + i * 1.3) * 0.6;
    y = ((y + 4) % 16) - 4;
    mp.setXYZ(i, ctr.x + x, ctr.y + y, ctr.z + z);
  }
  mp.needsUpdate = true;
  const sc = renderer.getSize(_size).y * renderer.getPixelRatio() * camera.projectionMatrix.elements[5] * 0.5;
  sparks.mat.uniforms.uScale.value = sc; starField.mat.uniforms.uScale.value = sc; motes.material.uniforms.uScale.value = sc;
}

// =====================================================================================
//  INPUT
// =====================================================================================
const KEYS_L = ['ArrowLeft', 'KeyA', 'KeyQ'], KEYS_R = ['ArrowRight', 'KeyD'], KEYS_J = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'];
addEventListener('keydown', e => {
  if (KEYS_L.includes(e.code)) input.left = true;
  if (KEYS_R.includes(e.code)) input.right = true;
  if (KEYS_J.includes(e.code)) { if (!e.repeat) input.jumpBuf = JUMP_BUF; e.preventDefault(); }
  if (e.code === 'KeyM') Audio.toggleMute();
  if (e.code === 'KeyR' && (world.mode2 === 'end' || world.mode === 'play')) restart();
  if (world.mode === 'title' && world.ready && !e.repeat) startGame();
});
addEventListener('keyup', e => { if (KEYS_L.includes(e.code)) input.left = false; if (KEYS_R.includes(e.code)) input.right = false; });
const touches = new Map();
function touchState() { input.left = input.right = false; for (const x of touches.values()) { if (x < innerWidth * 0.33) input.left = true; else if (x > innerWidth * 0.67) input.right = true; } }
addEventListener('pointerdown', e => {
  if (world.mode === 'title' && world.ready) { startGame(); return; }
  if (world.mode2 === 'end') { restart(); return; }
  if (e.pointerType === 'mouse') return;
  touches.set(e.pointerId, e.clientX); touchState();
  if (e.clientX >= innerWidth * 0.33 && e.clientX <= innerWidth * 0.67) input.jumpBuf = JUMP_BUF;
});
addEventListener('pointerup', e => { touches.delete(e.pointerId); touchState(); });
addEventListener('pointercancel', e => { touches.delete(e.pointerId); touchState(); });

function startGame() {
  world.mode = 'play';
  document.getElementById('title').style.opacity = 0;
  document.getElementById('hud').style.opacity = 1;
  Audio.init();
}
function restart() { location.href = location.pathname + '?auto'; }

// =====================================================================================
//  MAIN
// =====================================================================================
const clock = new THREE.Clock();
world.mode = 'title';
async function main() {
  await loaded;
  for (let k = 0; k < 400 && (!floraMeta || !girlGltf || !lanternGltf || !musicBuf); k++) await new Promise(r => setTimeout(r, 30));
  gradePass.uniforms.tPaper.value = T.paper;
  sparks = new Sparks(1400); sparks.mat.uniforms.map.value = T.sparkles; scene.add(sparks.points);
  starField = new StarField(400); starField.mat.uniforms.map.value = T.sparkles; scene.add(starField.points);
  buildSky(); buildMoon(); buildClouds(); buildRocks(); buildStairs(); bakeGround([...rockParts, ...stairParts]); buildFlora(); buildTree();
  prepLantern(); buildLanterns(); buildMotes(); buildGirl();
  { const F0 = frame(P.s); P.faceYaw = Math.atan2(F0.t.x, F0.t.z); girl.rotation.y = P.faceYaw; girl.position.copy(F0.p).setY(P.y); mixer.update(0.01); }
  P.yCam = P.y;
  world.ready = true;
  document.getElementById('startline').textContent = 'press any key';
  if (AUTO) { startGame(); cameraTargets(P.s, P.y, cam.pos, cam.look); cam.init = true; }
  window.__game = { P, world, END, input, staticTop, groundRef, groundAt, HF: { HF, HF0, HFD, HFN }, clock, girl: () => girl, camera, renderer };
  renderer.setAnimationLoop(tick);
}
let acc = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const t = clock.elapsedTime;
  shared.uTime.value = t;
  for (const L of world.lanterns) L.update(dt, t);   // lanterns move first, then she rides along with hers
  if (world.mode === 'play') {
    if (P.plat && P.grounded && P.plat.solid) { P.s += P.plat.ds; P.y = P.plat.top; }
    // fixed-step physics for stable jumps
    acc += dt; while (acc >= 1 / 120) { physics(1 / 120); acc -= 1 / 120; }
    checkTouches();
    if (P.s >= S_END && P.grounded) startEnding();
  }
  updateFlyers(dt, t);
  if (world.mode === 'ending') updateEnding(dt, t);
  updateGirl(dt);
  mixer.update(dt);
  updateLights(t);
  updateCamera(dt, t);
  updateAtmosphere(dt, t);
  sparks.update(dt);
  composer.render();
}
main();
</script>
