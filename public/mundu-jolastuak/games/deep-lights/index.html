/* ------------------------------------------------------------------ the trench path */
const R = rng(1207);

{

{

const S_STOP = PATH_LEN - 74;              // where the submarine settles

uniform float uTime;

uniform vec4 uLamps[${NL}]; uniform vec4 uBig; uniform vec3 uLampCol;
uniform vec4 uPulse; uniform float uPulseAmt; uniform float uReveal;

function buildTube(s0, s1, { scale = 1, radial = 56, ds = 1.0, wob = 0.06, seed = 0, around = 4, along = 26 }) {

  let nl = 0;
  for (const l of lampCand) {
    if (l.big) { SU.uBig.value.set(l.pos.x, l.pos.y, l.pos.z, l.bigW); continue; }
    if (nl < NL) lampVecs[nl++].set(l.pos.x, l.pos.y, l.pos.z, (0.6 + 0.12 * Math.sin(T * 2 + (l.phase || 0))) * l.wake * (1 + l.flash * 1.2) * l.size);
  }
  while (nl < NL) lampVecs[nl++].set(0, 0, 0, 0);
  lampCand.sort((a, b) => a.pos.distanceToSquared(sub.position) - b.pos.distanceToSquared(sub.position));
  for (let i = 0; i < lampPool.length; i++) {
    const l = lampCand[i], P = lampPool[i];
    if (l) { P.position.copy(l.pos); P.intensity = l.big ? 400 * l.wake : 22 * l.wake * l.size; P.distance = l.big ? 120 : 26; }
    else P.intensity = 0;
  }

  /* ---- rocks: collisions */
  if (playing && G.hitCd <= 0) {
    for (const r of rocks) {
      if (Math.abs(r.s - G.s) > r.size + 3) continue;
      const dist = r.pos.distanceTo(sub.position);
      if (dist < r.size * 0.92 + 0.75) {
        G.hitCd = 1.1; G.energy -= 16; G.hurt = 1; G.shake = 0.6; G.combo = 0;
        tmp.subVectors(sub.position, r.pos).normalize();
        G.vx += tmp.dot(F.r) * 14; G.vy += tmp.dot(F.u) * 14;
        G.speed *= 0.45;
        burst(sub.position, 14, [0.6, 0.75, 1.0], 4, 0.7, 0.35);
        sfx('bump', { vol: 0.9 });
        break;
      }
    }
  }
  G.hurt = Math.max(0, G.hurt - dt * 1.8);
  G.shake = Math.max(0, G.shake - dt * 1.5);

  /* ---- zones & checkpoints */
  if (playing) {
    const z = zoneOf(G.s);
    if (z !== G.zone) {
      if (G.zone >= 0 || z > 0) banner(`${depthAt(sub.position.y)} M`, ZONES[z].name);
      else banner('', ZONES[0].name);
      G.zone = z;
      if (ZONES[z].s > G.checkpoint) G.checkpoint = Math.max(16, ZONES[z].s + 2);
    }
    if (G.s > S_CHAMBER + 10 && !G.chamberMsg) { G.chamberMsg = true; banner('THE GREAT LANTERN SLEEPS', 'SHINE ON IT'); }
  }
  if (G.cascadeT >= 0) {
    G.cascadeT += dt;
    SU.uReveal.value = smooth(0, 3.5, G.cascadeT) * 0.8;
    if (G.cascadeT > 5.5 && G.state === 'won' && $('overlay').classList.contains('hide')) {
      const mm = Math.floor(G.runT / 60), ss = Math.floor(G.runT % 60).toString().padStart(2, '0');
      showOverlay('THE TRENCH IS LIT', `${G.wokenByYou} OF ${TOTAL} JELLYFISH WOKEN BY YOUR LIGHT · ${mm}:${ss}<br>${depthAt(big.pos.y)} M BELOW THE SURFACE`, 'CLICK OR SPACE TO DIVE AGAIN');
    }
  }

  /* ---- fog & tint follow the depth */
  zoneLook(G.s);
  innerMat.uniforms.uTint.value.copy(zoneTint); outerMat.uniforms.uTint.value.copy(zoneTint).multiplyScalar(0.85);
  const fogDen = lerp(0.021, 0.026, smooth(PATH_LEN * 0.4, PATH_LEN * 0.9, G.s)) * (1 - SU.uReveal.value * 0.5) * lerp(1, 0.72, smooth(S_CHAMBER - 40, S_CHAMBER + 20, G.s));
  SU.uFogDen.value = fogDen; scene.fog.density = fogDen;
  SU.uDepthK.value = smooth(PATH_LEN * 0.3, PATH_LEN * 0.85, G.s) * (1 - SU.uReveal.value);
  SU.uFogCol.value.copy(zoneFog); scene.fog.color.copy(zoneFog); scene.background.copy(zoneFog);

  /* ---- camera: chase cam above and behind, looking down the shaft */
  const camBack = G.state === 'won' ? lerp(8.5, 26, smooth(0, 6, G.cascadeT)) : 8.5;
  frameAt(G.s - camBack, Fc); frameAt(G.s + 9, Fl);
  const crad = baseRadius(G.s - camBack);
  const camH = Math.min(3.9, crad * 0.45) + (G.state === 'won' ? smooth(0, 6, G.cascadeT) * 6 : 0);
  camPos.copy(Fc.p).addScaledVector(Fc.u, camH).addScaledVector(Fc.r, G.ox * 0.6).addScaledVector(Fc.u, G.oy * 0.6);
  camLook.copy(Fl.p).addScaledVector(Fl.r, G.ox * 0.5).addScaledVector(Fl.u, G.oy * 0.5 - 1.6);
  if (G.state === 'won') camLook.lerp(big.pos, smooth(0, 4, G.cascadeT) * 0.6);
  if (!camInit) { camera.position.copy(camPos); camInit = true; camera.userData.look = camLook.clone(); }
  camera.position.x = damp(camera.position.x, camPos.x, 5, dt);
  camera.position.y = damp(camera.position.y, camPos.y, 5, dt);
  camera.position.z = damp(camera.position.z, camPos.z, 5, dt);
  camera.userData.look.lerp(camLook, 1 - Math.exp(-6 * dt));
  if (G.shake > 0) camera.position.add(tmp.set(R() - 0.5, R() - 0.5, R() - 0.5).multiplyScalar(G.shake * 0.5));
  camera.up.copy(Fc.u);
  camera.lookAt(camera.userData.look);

  updateWindow(kelpWin, G.s - 26, G.s + 150);
  updateWindow(rockWin, G.s - 30, G.s + 170);

  /* ---- particles */
  halos.begin(); bubbles.begin(); sparks.begin(); ringsB.begin(); snowB.begin();
  for (const j of jellies) {
    const ds = j.s - G.s;
    if (ds < -30 || ds > 175) continue;
    const w = clamp(j.wake, 0, 1);
    const cr = lerp(COL_BLUE[0], COL_WAKE[0], w), cg = lerp(COL_BLUE[1], COL_WAKE[1], w), cb = lerp(COL_BLUE[2], COL_WAKE[2], w);
    tmp.copy(j.pos).addScaledVector(j.up, 0.25 * j.size);
    const nearCam = smooth(3, 14, tmp.distanceTo(cp));
    const a = (lerp(0.2 + j.stir * 0.3 + j.charge * 0.35, 0.26, w) + j.flash * 0.45) * nearCam;
    halos.push(tmp.x, tmp.y, tmp.z, j.size * (3.4 + w * 1.2 + j.flash * 2.5), cr, cg, cb, a);
  }
  if (S_BIG - G.s < 175) {
    const w = big.wake;
    halos.push(big.pos.x, big.pos.y, big.pos.z, big.size * (3.6 + w * 3), lerp(0.35, 0.9, w), lerp(0.4, 0.95, w), 1.0, 0.35 + big.charge * 0.4 + w * 0.8);
  }
  // the submarine's own glow (the white disc of light in the video)
  tmp.copy(sub.position).addScaledVector(fwd, 3.2);
  halos.push(tmp.x, tmp.y, tmp.z, 9.0, 0.8, 0.92, 1.0, 0.07 * SU.uSubPow.value);
  tmp.copy(sub.position).addScaledVector(fwd, subNoseZ * 0.95);
  halos.push(tmp.x, tmp.y, tmp.z, 1.2, 0.9, 0.97, 1.0, 0.45 * SU.uSubPow.value);
  // antenna beacon
  tmp.copy(sub.position).addScaledVector(upv, 0.62).addScaledVector(fwd, 0.15);
  halos.push(tmp.x, tmp.y, tmp.z, 0.7, 1.0, 0.25, 0.2, (0.5 + 0.5 * Math.sin(T * 4.0)) * 0.9);

  // bubbles from the propeller
  if (G.state !== 'dead' && R() < dt * (G.speed * 0.9 + 2)) {
    tmp.copy(sub.position).addScaledVector(fwd, -subNoseZ - 0.1).addScaledVector(side, (R() - 0.5) * 0.3).addScaledVector(upv, (R() - 0.5) * 0.3);
    fx.bubbles.push({ p: tmp.clone(), v: fwd.clone().multiplyScalar(-1.5).addScaledVector(upv, 0.8 + R()).addScaledVector(side, (R() - 0.5)), t: 0, life: 2.2 + R() * 1.5, size: 0.12 + R() * 0.2, ph: R() * 6 });
  }
  // ambient bubble columns from the trench floor
  if (R() < dt * 2.0) {
    const sb = G.s + 10 + R() * 40;
    frameAt(sb, Fl);
    const a = -Math.PI / 2 + (R() - 0.5) * 2.4, rr = baseRadius(sb) * 0.85;
    tmp.copy(Fl.p).addScaledVector(Fl.r, Math.cos(a) * rr).addScaledVector(Fl.u, Math.sin(a) * rr);
    for (let i = 0; i < 4; i++) fx.bubbles.push({ p: tmp.clone().addScaledVector(Fl.u, i * 0.5), v: Fl.u.clone().multiplyScalar(1.4 + R()), t: -i * 0.25, life: 5, size: 0.08 + R() * 0.15, ph: R() * 6 });
  }
  for (let i = fx.bubbles.length - 1; i >= 0; i--) {
    const b = fx.bubbles[i]; b.t += dt;
    if (b.t > b.life) { fx.bubbles.splice(i, 1); continue; }
    if (b.t < 0) continue;
    b.v.multiplyScalar(Math.exp(-dt * 0.6)).addScaledVector(camera.up, dt * 0.9);
    b.p.addScaledVector(b.v, dt);
    const wob = Math.sin(b.t * 6 + b.ph) * 0.05;
    const a = smooth(0, 0.3, b.t) * (1 - smooth(b.life * 0.7, b.life, b.t));
    bubbles.push(b.p.x + wob, b.p.y, b.p.z, b.size * 1.8, 0.75, 0.9, 1.0, a * 0.45);
  }
  for (let i = fx.sparks.length - 1; i >= 0; i--) {
    const p = fx.sparks[i]; p.t += dt;
    if (p.t > p.life) { fx.sparks.splice(i, 1); continue; }
    p.v.multiplyScalar(Math.exp(-dt * 2.6)); p.p.addScaledVector(p.v, dt);
    const k = 1 - p.t / p.life;
    sparks.push(p.p.x, p.p.y, p.p.z, p.size * (0.6 + k), p.col[0], p.col[1], p.col[2], k * 1.2, p.rot + p.t * 2);
  }
  for (let i = fx.rings.length - 1; i >= 0; i--) {
    const r = fx.rings[i]; r.t += dt;
    if (r.t > r.life) { fx.rings.splice(i, 1); continue; }
    const k = r.t / r.life, e = 1 - Math.pow(1 - k, 3);
    ringsB.push(r.p.x, r.p.y, r.p.z, lerp(r.size0, r.size1, e), r.col[0], r.col[1], r.col[2], (1 - k) * r.a);
  }
  // marine snow drifting around the camera
  const box = 60, half = box / 2;
  for (let i = 0; i < SNOW; i++) {
    const o = i * 4;
    let x = snow[o] + Math.sin(T * 0.3 + i) * 0.004, y = snow[o + 1] - dt * 0.25, z = snow[o + 2];
    snow[o + 1] = y;
    x = ((x - cp.x + half) % box + box) % box - half + cp.x;
    y = ((y - cp.y + half) % box + box) % box - half + cp.y;
    z = ((z - cp.z + half) % box + box) % box - half + cp.z;
    snow[o] = x; snow[o + 1] = y; snow[o + 2] = z;
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(T * 0.7 + i * 1.7));
    snowB.push(x, y, z, 0.12 + snow[o + 3] * 0.16, 0.6, 0.85, 1.0, 0.3 * tw);
  }
  halos.end(); bubbles.end(); sparks.end(); ringsB.end(); snowB.end();

  /* ---- post */
  G.flash = Math.max(0, G.flash - dt * 1.2);
  grade.uniforms.uFlash.value = G.flash * 0.24;
  grade.uniforms.uHurt.value = G.hurt;
  G.dark = G.state === 'dead' ? smooth(0.5, 2.5, G.endT) * 0.55 : damp(G.dark, 0, 3, dt);
  grade.uniforms.uDark.value = G.dark;

  /* ---- HUD */
  hudT -= dt;
  if (hudT <= 0 && (playing || G.state === 'won')) {
    hudT = 0.1;
    const dep = depthAt(sub.position.y);
    $('depth').firstChild.nodeValue = dep + ' m';
    $('lc').textContent = G.lit;
    $('ebar').style.transform = `scaleX(${clamp(e01, 0, 1).toFixed(3)})`;
    $('energy').classList.toggle('low', e01 < 0.25);
    $('pulse').classList.toggle('cd', G.pulseCd > 0 || G.energy < 12);
  }
}
function winSequence() {
  big.awake = true; G.state = 'won'; G.cascadeT = 0; G.flash = 1.4;
  G.wokenByYou = G.lit;
  burst(big.pos, 120, COL_WAKE, 16, 2.2, 1.4);
  ring(big.pos, 8, 90, 2.2, COL_WAKE, 1);
  sfx('wake', { vol: 1, rate: 0.5 }); sfx('pulse', { vol: 0.8, rate: 0.7 });
  setTimeout(() => sfx('wake', { vol: 0.7, rate: 0.75 }), 350);
  setTimeout(() => sfx('wake', { vol: 0.6, rate: 1.0 }), 700);
  banner('', '');
}

renderer.info.autoReset = false;
function render() {
  renderer.info.reset();
  composer.render();
}
let fpsAcc = 0, fpsN = 0;
const MAXDT = params.has('fast') ? 0.25 : 0.05;
function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta();
  fpsAcc += raw; fpsN++; if (fpsAcc > 1) { window.__fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  let dt = Math.min(raw, MAXDT);
  if (G.paused) dt = 0;
  if (dt > 0) update(dt);
  render();
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  grade.uniforms.uAspect.value = innerWidth / innerHeight;
});

/* ------------------------------------------------------------------ boot */
$('ovGo').textContent = 'CLICK OR PRESS SPACE TO DIVE';
if (JUMP > 0) { G.s = JUMP; }
if (AUTOPLAY) { resetRun(JUMP > 0 ? JUMP : 16); if (JUMP > 0) { G.checkpoint = JUMP; } startPlay(); }
// warm up a few frames so the first visible frame is settled
for (let i = 0; i < 3; i++) update(1 / 60);
loop();
window.__ready = true;
</script>
<script src="../brand/gamepad.js"></script>
</body>
