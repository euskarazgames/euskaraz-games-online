services:
  - type: web
    name: herri-pilota-online-free
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: herri-pilota-render-free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_ROOMS
        value: "120"
