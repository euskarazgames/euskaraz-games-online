{},cam={x:0,y:0},stones:[{x:720,y:350,on:0},{x:1250,y:1060,on:0},{x:1770,y:460,on:0}],trees:[],enemies:[];for(let i=0;i<120;i++)trees.push({x:80+Math.random()*2040,y:80+Math.random()*1340,r:18+Math.random()*20});for(let i=0;i<9;i++)enemies.push({x:600+Math.random()*1350,y:180+Math.random()*1100,hp:2,t:Math.random()*9});let joy={x:0,y:0},last=performance.now(),done=0;onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;function bindPad(){let id=null,el=pad;function mv(e){let q=[...e.changedTouches].find(t=>t.identifier===id);if(!q)return;let r=el.getBoundingClientRect(),x=(q.clientX-r.left-r.width/2)/(r.width/2),y=(q.clientY-r.top-r.height/2)/(r.height/2),m=Math.hypot(x,y)||1;joy.x=Math.max(-1,Math.min(1,x/m*Math.min(1,m)));joy.y=Math.max(-1,Math.min(1,y/m*Math.min(1,m)))}el.ontouchstart=e=>{id=e.changedTouches[0].identifier;mv(e)};el.ontouchmove=mv;el.ontouchend=()=>{id=null;joy.x=joy.y=0}}bindPad();dash.onpointerdown=()=>p.dash=.22;hit.onpointerdown=()=>p.atk=.18;function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,m=Math.hypot(dx,dy);if(m){dx/=m;dy/=m;p.ang=Math.atan2(dy,dx)}if(keys[' ']){p.dash=.22;keys[' ']=0}if(keys.e){p.atk=.18;keys.e=0}p.dash=Math.max(0,p.dash-dt);p.atk=Math.max(0,p.atk-dt);let sp=p.dash?520:220;p.x=Math.max(35,Math.min(world.w-35,p.x+dx*sp*dt));p.y=Math.max(35,Math.min(world.h-35,p.y+dy*sp*dt));for(const s of stones)if(!s.on&&dist(p,s)<48){s.on=1;done++;msg.textContent=done<3?`Harri-zantzua piztu da. ${3-done} falta dira.`:'Hiru zantzuak esnatu dira. Basajaunen bidea ireki da.'}for(const e of enemies){if(e.hp<=0)continue;e.t+=dt;let d=dist(p,e);if(d<260){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*70*dt;e.y+=Math.sin(a)*70*dt}if(p.atk&&d<62){e.hp=0;msg.textContent='Itzala desegin da.'}}cam.x+=(p.x-W/2-cam.x)*(1-Math.exp(-dt*7));cam.y+=(p.y-H/2-cam.y)*(1-Math.exp(-dt*7));cam.x=Math.max(0,Math.min(world.w-W,cam.x));cam.y=Math.max(0,Math.min(world.h-H,cam.y))}function draw(){X.fillStyle='#10251a';X.fillRect(0,0,W,H);X.save();X.translate(-cam.x,-cam.y);X.fillStyle='#183a27';X.fillRect(0,0,world.w,world.h);for(const t of trees){X.fillStyle='#0b2015';X.beginPath();X.arc(t.x,t.y,t.r,0,7);X.fill();X.fillStyle='#244b31';X.beginPath();X.arc(t.x-5,t.y-8,t.r*.65,0,7);X.fill()}for(const s of stones){X.fillStyle=s.on?'#e6d78b':'#718076';X.fillRect(s.x-14,s.y-24,28,48);if(s.on){X.strokeStyle='#fff2a4';X.beginPath();X.arc(s.x,s.y,35,0,7);X.stroke()}}for(const e of enemies)if(e.hp>0){X.fillStyle='#251d2d';X.beginPath();X.arc(e.x,e.y,19,0,7);X.fill();X.fillStyle='#d5b9ff';X.fillRect(e.x-7,e.y-4,4,3);X.fillRect(e.x+3,e.y-4,4,3)}X.save();X.translate(p.x,p.y);X.rotate(p.ang);X.fillStyle=p.dash?'#f3e3a0':'#b5232d';X.beginPath();X.arc(0,0,p.r,0,7);X.fill();X.fillStyle='#eee';X.fillRect(5,-4,22,8);if(p.atk){X.strokeStyle='#fff';X.lineWidth=5;X.beginPath();X.arc(0,0,42,-.7,.7);X.stroke()}X.restore();X.restore()}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);setTimeout(()=>msg.style.opacity=.72,5500)</script></body></html>
