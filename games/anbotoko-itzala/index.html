;X.fillStyle=p.dash?'#f1dfa0':'#b32331';X.beginPath();X.arc(0,0,p.r,0,7);X.fill();X.fillStyle='#eee';X.fillRect(4,-4,23,8);if(p.atk){X.strokeStyle='#fff';X.lineWidth=5;X.beginPath();X.arc(0,0,45,-.72,.72);X.stroke()}X.restore();X.restore();if(boss&&boss.hp>0){X.fillStyle='#0008';X.fillRect(W*.2,16,W*.6,7);X.fillStyle='#e2c976';X.fillRect(W*.2,16,W*.6*Math.max(0,boss.hp/boss.max),7)}}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}setTimeout(()=>{cin.style.opacity=0;setTimeout(()=>cin.remove(),900);say('Aurkitu hiru harri-zantzuak eta esnatu basoa.')},2600);requestAnimationFrame(loop)</script></body></html>
