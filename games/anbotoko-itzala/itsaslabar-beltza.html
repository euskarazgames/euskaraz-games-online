,y:500,on:0}],foes=[],rocks=[],spray=[];let n=0,joy={x:0,y:0};for(let i=0;i<55;i++)rocks.push({x:350+Math.random()*2150,y:100+Math.random()*1300,r:12+Math.random()*28});for(let i=0;i<10;i++)foes.push({x:650+Math.random()*1700,y:180+Math.random()*1120,hp:2,cd:0});for(let i=0;i<80;i++)spray.push({x:Math.random()*2600,y:Math.random()*1500,s:.5+Math.random()*1.8});onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;(function(){let id=null,r=pad;function mv(e){let q=[...e.changedTouches].find(x=>x.identifier===id);if(!q)return;let b=r.getBoundingClientRect(),x=(q.clientX-b.left-b.width/2)/(b.width/2),y=(q.clientY-b.top-b.height/2)/(b.height/2),m=Math.hypot(x,y)||1;joy.x=x/m*Math.min(1,m);joy.y=y/m*Math.min(1,m)}r.ontouchstart=e=>{id=e.changedTouches[0].identifier;mv(e)};r.ontouchmove=mv;r.ontouchend=()=>{id=null;joy.x=joy.y=0}})();dash.onpointerdown=()=>p.dash=.22;hit.onpointerdown=()=>p.atk=.18;const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function say(s){msg.textContent=s}function hurt(){if(p.inv)return;p.inv=1;p.hp--;life.textContent='BIZIA '+('♥'.repeat(p.hp))+('♡'.repeat(3-p.hp));if(!p.hp){p.hp=3;p.x=210;p.y=760;life.textContent='BIZIA ♥♥♥';say('Itsasoak atzera bota zaitu.')}}function update(dt){t+=dt;p.inv=Math.max(0,p.inv-dt);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,m=Math.hypot(x,y);if(m){x/=m;y/=m;p.a=Math.atan2(y,x)}if(keys[' '])p.dash=.22,keys[' ']=0;if(keys.e)p.atk=.18,keys.e=0;p.dash=Math.max(0,p.dash-dt);p.atk=Math.max(0,p.atk-dt);let sp=p.dash?530:230;p.x=Math.max(35,Math.min(world.w-35,p.x+x*sp*dt));p.y=Math.max(80,Math.min(world.h-50,p.y+y*sp*dt));for(const f of fires)if(!f.on&&d(p,f)<50){f.on=1;n++;say(n<3?`Sua piztuta. ${3-n} falta dira.`:'Hiru suak piztuta. Itsasoko atea agertu da.');if(n===3)localStorage.setItem('anbotoko-save','itsaslabar-beltza')}for(const e of foes){if(e.hp<=0)continue;e.cd=Math.max(0,e.cd-dt);let z=d(p,e);if(z<33
